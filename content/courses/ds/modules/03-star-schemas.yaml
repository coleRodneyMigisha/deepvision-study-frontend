id: star-schemas
title: Analytical Star Schemas & DuckDB
subtitle: Organising data into tables that make questions fast and answers correct (Lab 4)
recap: |
  Some databases are built to save one record at a time (OLTP, like a shop's till); others are built to answer
  big questions over millions of rows (OLAP, like DuckDB). For questions, we organise data as a star schema:
  one central fact table full of numbers (prices, rainfall) with links to smaller dimension tables that
  describe them (which market, which commodity, which date). First decide the grain: exactly what one row of
  the fact table means. Mixing grains makes joins repeat rows, so totals get counted twice without any error.
traps:
  - "Repeating descriptive text (like category names) in every row of the fact table. Put it once in a dimension
    table instead."
  - "Mixing daily rows and monthly totals in the same fact table. Every total becomes wrong."
  - "Joining a fact to a dimension that has duplicate rows. Each fact row gets repeated, silently multiplying sums
    (a fan trap)."
lesson:
  checkpointStep: 3
  steps:
    - "Transaction databases (OLTP) like PostgreSQL or SQLite are built for saving and changing one row at a time,
      like a shop recording each sale. Analytical engines (OLAP) like DuckDB are built for reading millions of rows
      but only a few columns, like working out the average price per region."
    - "In dimensional modelling (Kimball's star schema), we put a central fact table in the middle, surrounded by
      dimension tables, like a star. Each fact row holds numbers measured at a clearly stated level of detail: the
      grain."
    - "In our market warehouse, fact_market_prices has a grain of one row per (date, market, commodity). Each row
      stores price_ugx and rainfall_mm, plus keys that point to dim_date, dim_market and dim_commodity."
    - "Checkpoint: what's the difference between a fact table and a dimension table, and why must you decide the
      grain of a fact table before writing any SQL?"
    - "Dimensions store the descriptions you filter and group by (region, district, commodity category, calendar
      quarter). Facts store the numbers you add up, average or count."
    - "If you mix grains in a fact table (say daily market prices next to monthly regional totals), joins repeat rows
      and totals get counted twice, or averages come out wrong. Stating the grain prevents these fan traps."
checkpoint:
  question: Contrast Fact tables and Dimension tables in a Star Schema. Why is declaring the exact 'grain' of a
    fact table critical before designing joins and aggregations?
  hint: "What goes in facts (numbers you measure, plus keys) and what goes in dimensions (descriptions, each with its own
    ID key)? What happens to a SUM or AVG if some rows mean \"one day\" and others mean \"one month\"?"
  keywords:
    - fact
    - dimension
    - measurement
    - numeric
    - descriptive
    - context
    - filter
    - group by
    - grain
    - one row
    - surrogate key
    - join
    - double count
    - aggregation
  idealAnswer: "Fact tables store numeric measurements (such as price_ugx and rainfall_mm) plus foreign keys (links to
    the dimensions), one row per individual event, so they're narrow and very long. Dimension tables (dim_market,
    dim_commodity, dim_date) store descriptive context, each row with its own surrogate key (an ID number), used for
    filtering (WHERE) and as group by labels. Declaring the grain, exactly what one fact row means (one row = one
    commodity in one market on one day), is critical because mixing grains makes joins repeat rows, silently
    double counting sums and skewing averages in every aggregation."
terms:
  - term: OLTP vs OLAP
    definition: OLTP databases save and change single records quickly (a till); OLAP engines answer big questions over
      many rows (a report).
  - term: Star schema
    definition: One central fact table linked to several dimension tables around it, like the points of a star.
  - term: Grain
    definition: Exactly what one row of a fact table means, e.g. one market × one commodity × one day.
  - term: Fact table
    definition: The central table of numbers you measure (prices, rainfall), plus keys linking to the dimensions.
  - term: Dimension table
    definition: A lookup table of descriptions (who, what, where, when), each row with its own ID key.
  - term: Foreign key
    definition: A column in one table that points to a row in another, e.g. market_key in the fact table points to
      dim_market.
  - term: Surrogate key
    definition: A meaningless ID number (or hash) the warehouse gives each dimension row, instead of joining on names.
  - term: Fan trap
    definition: A join that matches one fact row to several dimension rows, repeating it and inflating totals.
  - term: Vectorised execution
    definition: Processing a column in batches of about 1,000–2,000 values at a time instead of one row at a time.
      Much faster.
quiz:
  - question: Our star schema covers 5 markets, 4 commodities and 365 days, with a price every day. How many rows are in
      fact_market_prices?
    options:
      - 1,825
      - 7,300
      - 1,460
      - "374"
    answer: 1
    explanation: One row per market × commodity × day = 5 × 4 × 365 = 7,300 rows.
  - question: Which table should store "commodity_category = Cereals"?
    options:
      - fact_market_prices
      - dim_commodity
      - dim_market
      - dim_date
    answer: 1
    explanation: It describes the commodity, so it goes once in dim_commodity, not repeated in every fact row.
  - question: Which of these belongs in a fact table?
    options:
      - market_district
      - commodity_category
      - price_ugx
      - month_name
    answer: 2
    explanation: Facts hold the numbers you measure. The others describe markets, commodities or dates.
  - question: What is the grain of fact_market_prices?
    options:
      - One row per market
      - One row per commodity per month
      - One row per (day, market, commodity)
      - One row per price change
    answer: 2
    explanation: Each row is one observation of one commodity, in one market, on one day.
  - question: Why use an ID number (surrogate key) instead of the market's name to link tables?
    options:
      - Names are illegal in SQL
      - "Faster joins, stable when names change, and allows an Unknown member"
      - DuckDB requires it
      - It compresses the CSV
    answer: 1
    explanation: Numbers join faster than text, a market can be renamed without touching millions of fact rows, and
      key 0 can mean "Unknown".
  - question: Joining the facts to a dimension changed the row count from 7,300 to 9,100. What does that mean?
    options:
      - Normal behaviour
      - A fan trap, from duplicate or more detailed dimension rows
      - The fact table was compressed
      - A missing index
    answer: 1
    explanation: Joining facts to a dimension should never add rows. Extra rows mean some fact rows were repeated.
  - question: DuckDB is best described as…
    options:
      - A distributed OLTP database
      - An analytics (OLAP) engine that runs inside your program and stores data by column
      - A key-value store
      - A CSV editor
    answer: 1
    explanation: It needs no separate server, and it reads data column by column in fast batches.
  - question: Where should "is_weekend" live?
    options:
      - fact_market_prices
      - dim_date
      - dim_market
      - dim_commodity
    answer: 1
    explanation: It describes the date, so it belongs in the date dimension.
fact:
  title: "Why DuckDB is called \"SQLite for analytics\""
  body: DuckDB runs inside your Python program with no server to set up, yet its fast column-by-column engine can query
    Parquet files on disk quicker than many big computer clusters, for datasets under about 50 GB.
lab:
  title: Star Schema Grain & Fan-Trap Simulator
  variations:
    - title: Star Schema Fact Table Cardinality
      question: Our Uganda market Star Schema tracks <b>8 markets</b>, <b>6 commodities</b>, across <b>90 days</b>
        with 100% daily coverage. At the grain of `(date, market, commodity)`, how many rows are in
        `fact_market_prices`?
      answer: 4320
      tolerance: 0
      hint: Multiply 8 markets × 6 commodities × 90 days.
      explanation: "|Fact| = 8 × 6 × 90 = 4,320 rows."
    - title: Denormalised CSV vs Star Schema Storage
      question: Storing descriptive strings directly in a <b>100,000-row</b> flat table uses <b>120 bytes/row</b>.
        Normalising into a Star Schema shrinks each fact row to <b>24 bytes</b> (with negligible dimension
        table size). How many <b>MB</b> (1 MB = 10⁶ bytes) are saved?
      answer: 9.6
      tolerance: 0.05
      hint: Compute (120 − 24) bytes × 100,000 rows, then divide by 1,000,000.
      explanation: Saved per row = 120 − 24 = 96 bytes. Total saved = 96 × 100,000 = 9,600,000 bytes = 9.6 MB.
    - title: Grain Mismatch Fan-Trap Multiplier
      question: A market price row for 'Owino · Beans · 2025-05-10' (`price = 4,000 UGX`) is accidentally joined to
        an un-deduplicated `dim_market` table where 'Owino' appears <b>3 times</b> (for 3 sub-parishes). What
        inflated `SUM(price_ugx)` is produced for that single observation?
      answer: 12000
      tolerance: 0
      hint: A 1-to-3 dimension duplicate multiplies the fact row 3 times before SUM() runs.
      explanation: The join fans out 1 fact row into 3 rows of 4,000 UGX → SUM = 3 × 4,000 = 12,000 UGX (3× fan-trap
        inflation).
notes:
  - heading: OLTP vs OLAP
    body: |
      **The idea:** a shop's till records one sale at a time, fast. The owner's end-of-year report reads every sale ever made. Those are two very different jobs, and databases are built for one or the other.

      | | OLTP (transactions) | OLAP (analytics) |
      |---|---|---|
      | Typical job | save or change one order, look up one customer | average price by region over 3 years |
      | Rows touched | a few | millions |
      | Columns touched | the whole row | just a few |
      | Stored | row by row | column by column |
      | Examples | PostgreSQL, SQLite, MySQL | DuckDB, BigQuery, Snowflake |

      DuckDB is "SQLite for analytics": it runs inside your Python program with no server, but stores data by column and processes it in fast batches (vectorised execution). On a laptop it can scan Parquet files faster than many computer clusters, for data under about 50 GB.
  - heading: Facts, dimensions and the grain
    body: |
      **The idea:** keep the numbers in one big table, and the descriptions in small lookup tables, linked by ID numbers. Drawn out, it looks like a star.

      - The **fact table** (in the middle) stores *measurements*: numbers you add up, average or count (`price_ugx`, `rainfall_mm`, `litres`), plus **foreign keys**, columns that point to rows in the dimension tables. It has few columns and very many rows.
      - The **dimension tables** (the points of the star) store *descriptions* used to filter and group: `dim_market` (market, district, region), `dim_commodity` (name, category, unit), `dim_date` (day, month, quarter, year, is_weekend). They have many columns and few rows.

      **Before writing any SQL, state the grain:** exactly what one fact row means. Here: *one commodity, in one market, on one day*. Every number in the fact table must make sense at that level. It also tells you how big the table can get:

      $$|\text{fact rows}| \le |\text{dates}| \times |\text{markets}| \times |\text{commodities}|$$

      So 365 days × 5 markets × 4 commodities = at most 7,300 rows.
  - heading: Surrogate keys and why not join on strings
    body: |
      **The idea:** link tables with ID numbers, not names, the same way a school uses student numbers instead of names (two students can share a name, and names can change).

      Each dimension row gets a **surrogate key**, a meaningless ID number like `market_key = 7`, and facts join on that rather than on `market_name = 'Owino'`.

      Why:

      - Numbers are smaller and faster to join than text.
      - Names change ("Owino" → "St. Balikuddembe Market"). With an ID, you update one dimension row, not millions of fact rows.
      - You can add rows the source data doesn't have, like an **Unknown** member (`key = 0`) for facts whose market is missing, so no fact row has an empty (NULL) key.
      - You can keep history (called SCD Type 2): one market can have several dimension rows, each valid for a different period.
  - heading: The fan trap
    body: |
      **The idea:** if a market appears three times in the market table, every price for that market gets counted three times when you join them, and nothing warns you.

      A **fan trap** happens when a join matches one fact row to *several* dimension rows. The fact row is repeated once per match, so `SUM(price_ugx)` gets multiplied, with no error message.

      **Tiny example:** a 4,000 UGX price for Owino joined to a market table with three Owino rows gives three copies: SUM = 3 × 4,000 = **12,000 UGX**.

      Common causes:

      - the dimension has duplicate keys (the same `market_key` twice, e.g. loaded twice);
      - you join to a table with more detail (e.g. daily facts joined to a table with one row per market *per vendor*);
      - the fact table mixes grains (daily rows next to monthly totals).

      Defences: make dimension keys **unique**, **state the grain** and stick to it, and **compare row counts** before and after every join. Joining a dimension must never increase the number of fact rows.
examples:
  - title: Sizing a warehouse from its grain
    problem: The warehouse covers 12 markets and 8 commodities for 2 full years (730 days), with a price for every
      combination every day. How many fact rows are there, and how many dimension rows in total?
    steps:
      - The grain is one row per (day, market, commodity), so facts = 730 × 12 × 8 = **70,080 rows**.
      - "Dimensions: dim_date 730 + dim_market 12 + dim_commodity 8 = **750 rows**."
      - "Ratio ≈ 93 : 1. Facts dominate, which is why fact tables keep only keys and numbers (few columns)."
    answer: 70,080 fact rows and 750 dimension rows.
    takeaway: The grain multiplies the sizes together; the dimensions just add up.
  - title: Spotting a fan trap
    problem: The total price (SUM(price_ugx)) for Owino on 2025-03-01 should be 4,000 UGX, but the report shows 12,000.
      The market table dim_market has three rows with market_key = 3. Explain what went wrong and fix it.
    steps:
      - "The fact row joins to all three dim_market rows with key 3, so it appears three times: 3 × 4,000 =
        12,000."
      - "Find it: `SELECT market_key, COUNT(*) FROM dim_market GROUP BY 1 HAVING COUNT(*) > 1`."
      - Fix the load so dim_market has one row per key (deduplicate, add a UNIQUE/PRIMARY KEY constraint).
      - "Guard it: assert the fact row count is the same before and after joining each dimension."
    answer: Duplicate dimension keys fanned the row out 3×; enforce unique keys.
    takeaway: A join to a dimension must never change the number of fact rows.
questions:
  - question: Define the grain of a fact table and explain what goes wrong if you mix grains.
    kind: short
    marks: 5
    keywords:
      - grain
      - one row
      - represents
      - measures
      - mix
      - daily
      - monthly
      - double count
      - fan out
    idealAnswer: The grain is the exact definition of what one fact row represents, e.g. one commodity in one market
      on one day. Every measurement in the table must make sense at that level. Mixing grains, say daily prices next
      to monthly totals, means totals add rows that don't belong together and joins repeat rows (fan out), so sums are
      counted twice and averages are skewed.
  - question: Explain why dimension tables use surrogate keys and how an Unknown member avoids NULL foreign keys.
    kind: short
    marks: 5
    keywords:
      - surrogate key
      - integer
      - join
      - stable
      - rename
      - history
      - unknown member
      - key 0
      - coalesce
      - "null"
      - referential integrity
    idealAnswer: "Surrogate keys are ID numbers the warehouse creates itself. They're smaller and faster to join than
      names, they don't change when a market is renamed, and they allow history to be kept (SCD Type 2). An Unknown
      member, a dimension row with key 0, gives facts with a missing or unmatched value a real row to point to
      (COALESCE(key, 0)) instead of an empty NULL. So no fact row is lost and every key points somewhere valid
      (referential integrity)."
  - question: Design a star schema for the market-price data. List the fact table (grain, measures, keys) and
      three dimensions with attributes, then write a DuckDB query for the average price per region and
      commodity category in 2025, and say how you'd check it isn't affected by a fan trap.
    kind: long
    marks: 12
    keywords:
      - fact_market_prices
      - grain
      - price_ugx
      - rainfall_mm
      - date_key
      - market_key
      - commodity_key
      - dim_date
      - dim_market
      - dim_commodity
      - region
      - category
      - join
      - group by
      - row count
      - unique
    idealAnswer: "fact_market_prices: grain one row per (date, market, commodity); measures price_ugx,
      rainfall_mm; foreign keys date_key, market_key, commodity_key. dim_date (date_key, date, month, quarter,
      year, is_weekend); dim_market (market_key, market_name, district, region); dim_commodity (commodity_key,
      name, category, unit). Query: SELECT m.region, c.category, AVG(f.price_ugx) FROM fact_market_prices f
      JOIN dim_market m USING (market_key) JOIN dim_commodity c USING (commodity_key) JOIN dim_date d USING
      (date_key) WHERE d.year = 2025 GROUP BY 1, 2. Fan-trap check: each dimension key must be unique (GROUP
      BY key HAVING COUNT(*) > 1 returns nothing) and COUNT(*) of the joined facts for 2025 equals COUNT(*) of
      the fact table for 2025."
coding:
  - id: build-star
    title: Build the star schema in DuckDB
    language: sql
    level: core
    files:
      - market_clean.csv
    setup: |
      CREATE TABLE staging AS SELECT * FROM read_csv_auto('market_clean.csv');
    compare: none
    prompt: |
      A table `staging` holds cleaned observations (date, market, district, region, commodity, category,
      price_ugx, rainfall_mm). Build:

      - `dim_market(market_key, market, district, region)` — one row per market;
      - `dim_commodity(commodity_key, commodity, category)` — one row per commodity;
      - `fact_market_prices(date, market_key, commodity_key, price_ugx, rainfall_mm)` — grain: one row per
        (date, market, commodity).

      Use integer surrogate keys (e.g. `ROW_NUMBER() OVER (ORDER BY market)`). Finish with a query that
      shows a few fact rows.
    starter: |
      -- dim_market
      CREATE TABLE dim_market AS
      SELECT ...;

      -- dim_commodity

      -- fact_market_prices

      SELECT * FROM fact_market_prices LIMIT 5;
    solution: |
      CREATE TABLE dim_market AS
      SELECT ROW_NUMBER() OVER (ORDER BY market) AS market_key, market, district, region
      FROM (SELECT DISTINCT market, district, region FROM staging);

      CREATE TABLE dim_commodity AS
      SELECT ROW_NUMBER() OVER (ORDER BY commodity) AS commodity_key, commodity, category
      FROM (SELECT DISTINCT commodity, category FROM staging);

      CREATE TABLE fact_market_prices AS
      SELECT s.date, m.market_key, c.commodity_key, s.price_ugx, s.rainfall_mm
      FROM staging s
      JOIN dim_market m USING (market)
      JOIN dim_commodity c USING (commodity);

      SELECT * FROM fact_market_prices LIMIT 5;
    tests:
      - name: Dimensions have one row per member with unique keys
        code: |
          m = con.execute("SELECT COUNT(*), COUNT(DISTINCT market_key), COUNT(DISTINCT market) FROM dim_market").fetchone()
          c = con.execute("SELECT COUNT(*), COUNT(DISTINCT commodity_key) FROM dim_commodity").fetchone()
          assert m == (5, 5, 5), f"dim_market should have 5 unique markets, got {m}"
          assert c == (4, 4), f"dim_commodity should have 4 unique commodities, got {c}"
      - name: The fact table keeps the grain (no fan-out, no loss)
        code: |
          n = con.execute("SELECT COUNT(*) FROM fact_market_prices").fetchone()[0]
          s = con.execute("SELECT COUNT(*) FROM staging").fetchone()[0]
          assert n == s, f"fact rows ({n}) should equal staging rows ({s})"
          d = con.execute("SELECT COUNT(*) FROM (SELECT date, market_key, commodity_key FROM fact_market_prices GROUP BY ALL HAVING COUNT(*) > 1)").fetchone()[0]
          assert d == 0, "duplicate (date, market_key, commodity_key) rows found"
      - name: No NULL foreign keys and measures survive the joins
        code: |
          nulls = con.execute("SELECT COUNT(*) FROM fact_market_prices WHERE market_key IS NULL OR commodity_key IS NULL").fetchone()[0]
          assert nulls == 0
          a = con.execute("SELECT ROUND(SUM(price_ugx)) FROM fact_market_prices").fetchone()[0]
          b = con.execute("SELECT ROUND(SUM(price_ugx)) FROM staging").fetchone()[0]
          assert a == b, "total price changed — check your joins"
    hints:
      - "`SELECT DISTINCT market, district, region FROM staging` gives one row per market."
      - Join staging to each dimension on the natural key to look up the surrogate key.
  - id: region-category
    title: Average price by region and category
    language: sql
    level: core
    files:
      - market_clean.csv
    compare: ordered
    setup: |
      CREATE TABLE staging AS SELECT * FROM read_csv_auto('market_clean.csv');
      CREATE TABLE dim_market AS SELECT ROW_NUMBER() OVER (ORDER BY market) AS market_key, market, district, region FROM (SELECT DISTINCT market, district, region FROM staging);
      CREATE TABLE dim_commodity AS SELECT ROW_NUMBER() OVER (ORDER BY commodity) AS commodity_key, commodity, category FROM (SELECT DISTINCT commodity, category FROM staging);
      CREATE TABLE fact_market_prices AS SELECT s.date, m.market_key, c.commodity_key, s.price_ugx, s.rainfall_mm FROM staging s JOIN dim_market m USING (market) JOIN dim_commodity c USING (commodity);
      DROP TABLE staging;
    prompt: |
      Using only the star schema (`fact_market_prices`, `dim_market`, `dim_commodity`), return
      `region`, `category` and `avg_price` (rounded to 0 dp) for every region–category pair,
      ordered by `region`, then `category`.
    starter: |
      SELECT ...
      FROM fact_market_prices f
    solution: |
      SELECT m.region, c.category, ROUND(AVG(f.price_ugx), 0) AS avg_price
      FROM fact_market_prices f
      JOIN dim_market m USING (market_key)
      JOIN dim_commodity c USING (commodity_key)
      GROUP BY m.region, c.category
      ORDER BY m.region, c.category;
    hints:
      - Join the fact table to both dimensions on their surrogate keys.
      - GROUP BY the two descriptive attributes and ROUND(AVG(...), 0).
