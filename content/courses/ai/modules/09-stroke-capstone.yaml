coding:
  - id: threshold-under-capacity
    title: Choose the threshold the clinic can handle
    language: python
    level: exam
    prompt: |
      `scores` are validation-set predicted probabilities and `y` the true outcomes (1 = stroke).
      The chronic-care clinic can take at most `capacity` referrals **per 1,000 patients**.

      Write `choose_threshold(y, scores, capacity)` returning the **lowest** threshold from
      `np.round(np.arange(0.05, 0.96, 0.01), 2)` whose referral rate (share of scores ≥ threshold) × 1,000
      is ≤ `capacity` — that maximises recall within capacity. Also write `recall_at(y, scores, t)`.
    setup: |
      import numpy as np
      rng = np.random.default_rng(7)
      y = (rng.random(4000) < 0.05).astype(int)
      logit = np.where(y == 1, rng.normal(0.616, 1.6, 4000), rng.normal(-2.92, 1.6, 4000))
      scores = 1 / (1 + np.exp(-logit))
    starter: |
      import numpy as np

      def recall_at(y, scores, t):
          ...

      def choose_threshold(y, scores, capacity):
          return 0.5
    solution: |
      import numpy as np

      def recall_at(y, scores, t):
          y, flagged = np.asarray(y), np.asarray(scores) >= t
          return float(flagged[y == 1].mean())

      def choose_threshold(y, scores, capacity):
          scores = np.asarray(scores)
          for t in np.round(np.arange(0.05, 0.96, 0.01), 2):
              if (scores >= t).mean() * 1000 <= capacity:
                  return float(t)
          return None

      t = choose_threshold(y, scores, 200)
      print("threshold", t, "recall", round(recall_at(y, scores, t), 3), "vs 0.5:", round(recall_at(y, scores, 0.5), 3))
    tests:
      - name: recall_at is correct
        code: |
          assert recall_at([1, 1, 0, 1], [0.9, 0.3, 0.8, 0.6], 0.5) == 2 / 3
      - name: Referrals stay within capacity
        code: |
          t = choose_threshold(y, scores, 200)
          assert t is not None and (scores >= t).mean() * 1000 <= 200
      - name: It is the lowest such threshold
        code: |
          t = choose_threshold(y, scores, 200)
          assert (scores >= round(t - 0.01, 2)).mean() * 1000 > 200, "a lower threshold would still fit — pick the lowest"
      - name: Recall beats the default 0.5 threshold by a wide margin
        code: |
          t = choose_threshold(y, scores, 200)
          assert recall_at(y, scores, t) - recall_at(y, scores, 0.5) > 0.15
  - id: explain-a-prediction
    title: SHAP for a logistic model, by hand
    language: python
    level: core
    prompt: |
      For a logistic model, the SHAP value of each feature (in log-odds) is exactly
      `coef × (x − mean_of_training_feature)`, and **base value + Σ SHAP = the patient's log-odds**.

      Write `explain(x)` for the model below returning `(base_logodds, contributions)` where
      `contributions` is a dict feature → SHAP value, and `probability(base, contributions)` → the predicted
      probability. Check that it matches `predict_proba` from the formula.
    setup: |
      import numpy as np
      FEATURES = ["age", "avg_glucose_level", "bmi", "hypertension", "heart_disease"]
      COEF = {"age": 0.055, "avg_glucose_level": 0.012, "bmi": 0.035, "hypertension": 0.85, "heart_disease": 0.65}
      INTERCEPT = -6.9
      MEANS = {"age": 50.0, "avg_glucose_level": 106.0, "bmi": 28.0, "hypertension": 0.1, "heart_disease": 0.05}

      def predict_logodds(x):
          return INTERCEPT + sum(COEF[f] * x[f] for f in FEATURES)

      patient = {"age": 68, "avg_glucose_level": 220, "bmi": 31.5, "hypertension": 1, "heart_disease": 0}
    starter: |
      import math

      def explain(x):
          ...

      def probability(base, contributions):
          ...
    solution: |
      import math

      def explain(x):
          base = INTERCEPT + sum(COEF[f] * MEANS[f] for f in FEATURES)   # model output for the "average" patient
          contributions = {f: COEF[f] * (x[f] - MEANS[f]) for f in FEATURES}
          return base, contributions

      def probability(base, contributions):
          return 1 / (1 + math.exp(-(base + sum(contributions.values()))))

      base, c = explain(patient)
      for f, v in sorted(c.items(), key=lambda kv: -abs(kv[1])):
          print(f"{f:>18}: {v:+.2f}")
      print("risk", round(probability(base, c), 3))
    tests:
      - name: Contributions add up to the model's output (additivity)
        code: |
          base, c = explain(patient)
          assert abs(base + sum(c.values()) - predict_logodds(patient)) < 1e-9
      - name: The base value is the output for the average patient
        code: |
          base, c = explain(MEANS)
          assert all(abs(v) < 1e-12 for v in c.values()) and abs(base - predict_logodds(MEANS)) < 1e-9
      - name: Glucose is this patient's biggest driver
        code: |
          base, c = explain(patient)
          assert max(c, key=lambda f: abs(c[f])) == "avg_glucose_level"
      - name: probability() matches the logistic model
        code: |
          import math
          base, c = explain(patient)
          assert abs(probability(base, c) - 1 / (1 + math.exp(-predict_logodds(patient)))) < 1e-12
