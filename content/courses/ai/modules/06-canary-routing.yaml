id: canary-routing
title: Serving Architectures, Load Balancing & Canary Traffic Routing
subtitle: Updating a live model without switching the service off, and undoing a bad update in seconds
recap: |
  To update a model without the service going offline, put a load balancer in front of several copies (replicas)
  of the service, so it only sends requests to healthy ones. Blue/Green switches all traffic from the old version
  (v1) to a checked new version (v2) in one go. A canary release sends just a small slice of traffic (say 5%) to
  v2, watches its error rate, its slowest response times (p99 latency) and whether its predictions look strange,
  and automatically switches back if it breaks the agreed limits (the error budget). That way, a bad model only
  affects a few users (a small blast radius).
traps:
  - "Thinking Blue/Green limits the damage of a bad release. It moves 100% of users at once."
  - "Starting a canary without automatic rollback limits. Someone has to notice and react, which takes minutes."
  - "Watching only HTTP errors. A model can answer perfectly normally and still give clinically wrong predictions."
lesson:
  checkpointStep: 3
  steps:
    - "In a hospital, you can't switch the AI prediction service off for 15 minutes every time a new model is ready.
      Updates must happen with zero downtime."
    - "A load balancer and reverse proxy (such as Nginx, Traefik or AWS ALB) is the single public front door. It
      shares incoming requests between several healthy copies (replicas) of the service."
    - "In a Blue/Green deployment there are two identical live environments. Blue runs v1; we put v2 on Green, check
      it's healthy, then switch all the traffic from Blue to Green in an instant."
    - "Checkpoint: how does a canary deployment reduce risk compared with Blue/Green, and which measurements should
      trigger an automatic instant rollback?"
    - "In canary routing, a small share (e.g. 5%) of real traffic goes to v2 while 95% stays on v1. We watch the error
      rate, the p99 latency (how slow the slowest 1% of requests are) and any strange predictions."
    - "If the canary breaks an error-budget limit (e.g. more than 1.5% server errors, or p99 latency above 300 ms), the
      router immediately sends the canary's traffic back to v1, so patients aren't affected."
checkpoint:
  question: Compare Blue/Green and Canary deployment strategies for machine learning models. How do you
    configure health checks and error budgets to automate rollbacks?
  hint: "How much traffic does each strategy send to the new version at first? How many users does a bug reach (the
    blast radius)? Then: how does a service tell the load balancer it's ready, and what limits should trigger an
    automatic switch back?"
  keywords:
    - canary
    - blue green
    - traffic
    - rollback
    - error budget
    - health check
    - readiness probe
    - blast radius
    - latency
  idealAnswer: "Blue/Green deployment keeps two identical full environments. Once Green (with v2) has been checked, the
    router flips 100% of the traffic to it in one go. It's quick, but if there's a subtle bug or a problem with
    unusual inputs, every user is affected immediately. A canary deployment instead sends a small first share (e.g.
    5–10%) of live traffic to the new model (v2) while the rest stays on the stable v1, which greatly shrinks the
    blast radius (how many users a bug can reach). Health checks use a readiness probe (is the model loaded in
    memory and ready for requests?) and a liveness probe (is the web server still responding?). Automatic rollback
    watches an error budget: if the canary's server-error (HTTP 5xx) rate goes above 1%, or its p99 latency goes
    above 250 ms over a 2-minute window, the router moves all traffic back to v1 automatically."
terms:
  - term: Zero-downtime deployment
    definition: Releasing a new version without the service ever going offline.
  - term: Load balancer / reverse proxy
    definition: The front door that receives every request and passes it to one of several healthy copies of the
      service.
  - term: Replica
    definition: One running copy of the service. Several replicas share the load and cover for each other.
  - term: Blue/Green deployment
    definition: Two identical environments; all traffic is switched from the old one to the new one at once.
  - term: Canary deployment
    definition: Sending a small share of real traffic to the new version first, and increasing it only if it behaves
      well.
  - term: Blast radius
    definition: How many users are affected if a release goes wrong.
  - term: Readiness vs liveness probe
    definition: Readiness asks "is it ready for traffic (model loaded)?"; liveness asks "is it still alive, or should
      it be restarted?".
  - term: Error budget
    definition: The agreed limits (e.g. at most 1.5% errors, p99 under 300 ms). Breaking them triggers an automatic
      rollback.
  - term: Shadow deployment
    definition: The new version gets a copy of real traffic, but its answers are thrown away. Zero risk to users.
quiz:
  - question: An ingress router directs 10% of traffic to a new model v2. Within 5 minutes, v2 has an error rate
      of 8% while v1 has 0.05%. What should happen?
    options:
      - Route 100% traffic to v2 to see if it fixes itself
      - Trigger an automated rollback, dropping v2 traffic to 0% and alerting on-call engineers
      - Restart the entire cluster
      - Ignore the error since it is under 10% total traffic
    answer: 1
    explanation: An error budget breach (8% error rate) on a canary deployment must immediately trigger an
      automated rollback to protect production stability.
  - question: What is the primary difference between a Liveness Probe and a Readiness Probe in container orchestration?
    options:
      - Liveness checks if the container is running; Readiness checks if the application is ready to accept
        incoming user requests
      - Liveness is for databases only
      - Readiness checks disk space
      - There is no difference
    answer: 0
    explanation: A liveness probe restarts a deadlocked container; a readiness probe holds traffic until heavy
      assets (like 1GB ML models) have fully loaded into RAM.
  - question: What is the blast radius of a Blue/Green switch?
    options:
      - The canary percentage
      - 100% of users
      - Zero
      - One replica
    answer: 1
    explanation: Blue/Green moves all the traffic to the new version at once, so a bug reaches everyone.
  - question: In a canary release, what share of traffic usually goes to v2 first?
    options:
      - 100%
      - 50%
      - A small slice like 5%
      - 0%
    answer: 2
    explanation: A small slice (like 5%), so a bad version only affects a few users.
  - question: Which signal should NOT be the only canary health check?
    options:
      - HTTP 5xx rate
      - p99 latency
      - Prediction distribution
      - Process is "running"
    answer: 3
    explanation: Knowing the process is running proves little. It can still give wrong or slow answers.
  - question: What does a shadow deployment do with v2's responses?
    options:
      - Returns them to users
      - Discards them (compares offline)
      - Averages them with v1
      - Caches them
    answer: 1
    explanation: They are thrown away (only compared and logged), so users are never affected.
  - question: 10% of 200 QPS to a canary with a 3% error rate for 10 minutes. Errors?
    options:
      - "60"
      - "360"
      - "600"
      - 3,600
    answer: 1
    explanation: 10% of 200 is 20 requests per second. 20 × 600 seconds × 0.03 = 360 errors.
  - question: What is a readiness probe for?
    options:
      - Rolling back
      - Telling the load balancer an instance can receive traffic
      - Measuring drift
      - Scaling to zero
    answer: 1
    explanation: It tells the load balancer when a copy is ready (model loaded), so requests only go to ready copies.
fact:
  title: Shadow Deployments (Dark Traffic)
  body: "In ultra-high stakes domains like medical diagnosis or autonomous driving, companies use Shadow
    Deployments: real production requests are asynchronously mirrored to the new model in the background,
    testing predictions against ground truth without exposing end users to any risk."
lab:
  title: Canary Release & Traffic Splitting Simulator
  variations:
    - title: Canary Deployment Initial Traffic Allocation
      question: A hospital network processes <b>8,000 diagnostic queries</b> per day. During the first phase of a
        canary release, <b>5%</b> of traffic is shifted to Model v2. Exactly how many patient requests are
        routed to the canary model on day one?
      answer: 400
      tolerance: 0
      hint: Multiply 8,000 by 0.05.
      explanation: 8,000 × 0.05 = 400 requests. This limited sample validates production metrics while bounding
        potential failure exposure to just 5% of users.
    - title: Error Budget Depletion Rate Gate
      question: During canary testing, <b>36 out of 20,000 requests</b> return HTTP 500 server errors. What is the
        observed error rate in <b>percent</b>?
      answer: 0.18
      tolerance: 0.01
      hint: Compute (36 / 20,000) × 100%.
      explanation: (36 / 20,000) × 100% = 0.18%. If the SLA error budget is 0.10% (99.9% availability), this 0.18%
        burn triggers an automatic deployment abort.
    - title: Blue-Green Instant DNS Rollback
      question: When a canary fault is detected, a Blue-Green router flips 100% of traffic back to the healthy Blue
        environment in <b>0.45 seconds</b>. If a full redeployment would have taken <b>180 seconds</b>, how
        many seconds of critical patient service disruption are prevented?
      answer: 179.55
      tolerance: 0.5
      hint: Subtract 0.45 from 180.
      explanation: 180 − 0.45 = 179.55 seconds of downtime avoided by having an idle, pre-warmed Blue deployment
        standing by.
notes:
  - heading: Zero-downtime as a requirement
    body: |
      **The idea:** a hospital can't close the emergency room to repaint it. Changes have to happen while it stays open.

      A hospital triage service can't go offline for 15 minutes every time a new model is released. Releases must be **zero-downtime**, and a bad model must be undone in seconds, not after someone reports a problem.

      The building block is a **load balancer / reverse proxy** (Nginx, Traefik, an AWS ALB) in front of several **replicas** (running copies) of the service. It sends each request to a healthy replica, and can split traffic between versions. Each replica reports whether it's ready through a **readiness probe** (a `/health` address the load balancer checks), so traffic only goes to copies that have finished loading the model.
  - heading: Blue/Green deployment
    body: |
      **The idea:** set up a complete second stage behind the curtain, check it, then swap the whole audience over to it at once.

      Run two identical environments. **Blue** serves all traffic with v1. Put v2 on **Green**, run health checks and quick tests against it, then switch the router so 100% of traffic goes to Green. Keep Blue running, so you can switch back instantly.

      - ✓ Simple and instant; rolling back is just switching back.
      - ✗ Every user meets v2 at the same moment, so the **blast radius** of a bug is 100%. Problems that only show up with real traffic (rare inputs, heavy load) hit everyone before you notice.
      - ✗ You need double the machines during the switch.
  - heading: Canary releases
    body: |
      **The idea:** miners used to carry a canary into the mine. If the air was bad, the bird reacted first, and the miners got out. A canary release lets a few users test the new version first.

      Send a **small slice** of real traffic to v2 first, say **5%**, while 95% stays on v1. Watch it closely. If it's healthy, increase step by step (5 → 25 → 50 → 100%). If not, send its traffic back to 0%.

      What to watch, compared with v1 over the same period:

      - **Error rate:** server errors (HTTP 5xx) and timeouts.
      - **Latency**, especially **p99**: how slow the slowest 1% of requests are.
      - **Prediction behaviour:** the spread of predicted risk, and the share of high-risk flags. A model can look perfectly "healthy" by web standards and still be clinically wrong.

      These limits make up the **error budget**, e.g. roll back automatically if the canary's server-error rate goes above 1.5% or its p99 goes above 300 ms. **Automating this is the whole point:** a person might take minutes to react; a router takes seconds.

      **Tiny example:** 10% of 200 requests per second is 20 per second. At a 3% error rate for 10 minutes (600 s), that's 20 × 600 × 0.03 = **360 failed requests**. With automatic rollback after the first minute, it would be about 36.
  - heading: Shadow, A/B and choosing a strategy
    body: |
      **The idea:** before letting a new doctor treat patients, have them shadow an experienced one and compare their decisions, without the patients being affected.

      Two more patterns worth knowing:

      - **Shadow (mirrored) deployment:** v2 receives a *copy* of the live traffic, but its answers are thrown away. Zero risk to users, and a good way to compare its predictions with v1's before anyone relies on them.
      - **A/B testing:** split the traffic to measure which version leads to better *results* (not just fewer errors). It usually runs longer and uses statistical tests.

      For hospital models, a sensible path is: **shadow → canary with automatic rollback → full rollout**, keeping the old version running and ready until the new one has a track record.
examples:
  - title: Errors during a canary
    problem: A gateway sends 5% of 240 QPS to v2. Over 15 minutes v2 has a 2.5% error rate. How many failed
      requests, and what would a 1.5% error budget do?
    steps:
      - Canary traffic = 240 × 0.05 = **12 QPS**.
      - Requests in 15 min = 12 × 900 = **10,800**; errors = 10,800 × 0.025 = **270**.
      - 2.5% > 1.5% budget → the router automatically sets v2's share to 0% (rollback).
      - "With Blue/Green, all 240 QPS would have hit v2: 240 × 900 × 0.025 = 5,400 errors."
    answer: 270 errors, then automatic rollback.
    takeaway: Canary turns a 5,400-error incident into a 270-error one — and stops it automatically.
  - title: Is the canary actually worse?
    problem: Over one hour v1 had 18 errors in 100,000 requests (0.018%) and the canary 4 errors in 5,000 (0.08%).
      Both are under a 1.5% budget. Should the rollout continue?
    steps:
      - Both are far below the absolute 1.5% budget, so an automatic gate would pass.
      - But the canary's rate is ~4× v1's — a relative regression worth investigating.
      - With only 4 errors, the difference could be noise; extend the canary period at 5% to collect more data
        before increasing.
    answer: Pause at the current percentage and gather more evidence.
    takeaway: Compare against the baseline, not only against a fixed threshold.
questions:
  - question: Compare Blue/Green and Canary deployments in terms of risk and rollback.
    kind: short
    marks: 6
    keywords:
      - blue
      - green
      - switch
      - 100%
      - blast radius
      - instant rollback
      - canary
      - small fraction
      - gradual
      - monitor
      - automatic rollback
      - capacity
    idealAnswer: "Blue/Green runs v1 (Blue) and v2 (Green) side by side and switches 100% of traffic at once:
      rollback is instant by switching back, but a bug affects every user (100% blast radius) and it needs
      double capacity. Canary sends a small fraction (e.g. 5%) to v2, monitors it against v1 and increases
      gradually; a bad release affects only the canary slice and is rolled back automatically by setting its
      weight to 0%."
  - question: Which metrics would trigger an automatic rollback of a canary stroke-risk model, and why are HTTP
      metrics alone not enough?
    kind: short
    marks: 5
    keywords:
      - error rate
      - 5xx
      - p99 latency
      - error budget
      - threshold
      - prediction distribution
      - high-risk rate
      - silent
      - clinically wrong
      - baseline
    idealAnswer: "Roll back when the canary breaches the error budget relative to v1: 5xx/timeout rate above e.g.
      1.5%, p99 latency above e.g. 300 ms, or prediction anomalies — a shifted risk distribution or a sudden
      change in the share of high-risk flags. HTTP metrics alone aren't enough because a model can return HTTP
      200 with valid JSON while being clinically wrong, so prediction behaviour must be monitored too."
  - question: Plan the rollout of stroke model v2 at the referral hospital from first deployment to 100% traffic.
      Include the infrastructure, the stages and percentages, the gates at each stage, the rollback mechanism,
      and how you would compare v1 and v2 predictions safely before exposing patients.
    kind: long
    marks: 12
    keywords:
      - load balancer
      - replicas
      - readiness probe
      - shadow
      - mirror
      - canary
      - 5%
      - 25%
      - 50%
      - 100%
      - error budget
      - p99
      - prediction distribution
      - automatic rollback
      - weight 0
      - baseline
      - keep v1 warm
    idealAnswer: "Infrastructure: v1 and v2 replicas behind a load balancer with weighted routing; readiness
      probes on /health so v2 only receives traffic once the model is loaded. Stage 0 — shadow: mirror live
      traffic to v2, discard its responses and compare its predictions and latency with v1 offline (agreement
      rate, risk distribution, high-risk share). Stage 1 — canary 5% for a fixed window; gates: 5xx and
      timeout rate within budget (e.g. < 1.5% and not worse than v1), p99 < 300 ms, prediction distribution
      consistent with shadow results. If any gate fails, the router automatically sets v2's weight to 0% and
      alerts. Stages 2–4 — 25%, 50%, 100% with the same gates and longer windows. Keep v1 deployed and warm
      until v2 has run cleanly at 100% for an agreed period, so rollback remains instant."
coding:
  - id: canary-gate
    title: An automated canary gate
    language: python
    level: core
    prompt: |
      Write `canary_decision(baseline, canary, budget)` returning `"rollback"`, `"hold"` or `"promote"`.
      `baseline` and `canary` are dicts with `requests`, `errors`, `p99_ms` and `high_risk_rate`
      (share of predictions flagged high-risk). `budget` has `max_error_rate`, `max_p99_ms` and
      `max_risk_shift` (allowed absolute change in high-risk rate vs baseline).

      - **rollback** if the canary breaches *any* budget.
      - **hold** if it's within budget but has fewer than 1,000 requests (not enough evidence yet).
      - **promote** otherwise.
    setup: |
      BUDGET = {"max_error_rate": 0.015, "max_p99_ms": 300, "max_risk_shift": 0.05}
      V1 = {"requests": 100_000, "errors": 120, "p99_ms": 180, "high_risk_rate": 0.19}
    starter: |
      def canary_decision(baseline, canary, budget):
          return "promote"
    solution: |
      def canary_decision(baseline, canary, budget):
          err = canary["errors"] / max(1, canary["requests"])
          shift = abs(canary["high_risk_rate"] - baseline["high_risk_rate"])
          if err > budget["max_error_rate"] or canary["p99_ms"] > budget["max_p99_ms"] or shift > budget["max_risk_shift"]:
              return "rollback"
          if canary["requests"] < 1000:
              return "hold"
          return "promote"
    tests:
      - name: Too many errors → rollback
        code: |
          assert canary_decision(V1, {"requests": 5000, "errors": 120, "p99_ms": 190, "high_risk_rate": 0.2}, BUDGET) == "rollback"
      - name: Slow p99 → rollback
        code: |
          assert canary_decision(V1, {"requests": 5000, "errors": 5, "p99_ms": 420, "high_risk_rate": 0.2}, BUDGET) == "rollback"
      - name: Healthy HTTP but shifted predictions → rollback
        code: |
          assert canary_decision(V1, {"requests": 5000, "errors": 5, "p99_ms": 190, "high_risk_rate": 0.31}, BUDGET) == "rollback", "a model can return 200s and still be clinically wrong"
      - name: Healthy but too little traffic → hold
        code: |
          assert canary_decision(V1, {"requests": 400, "errors": 0, "p99_ms": 170, "high_risk_rate": 0.2}, BUDGET) == "hold"
      - name: Healthy with enough evidence → promote
        code: |
          assert canary_decision(V1, {"requests": 6000, "errors": 6, "p99_ms": 175, "high_risk_rate": 0.2}, BUDGET) == "promote"
