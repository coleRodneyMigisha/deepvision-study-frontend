# Course pack — see content/README.md for the schema.
id: cv
code: CSC3104
title: Computer Vision & Deep Learning
shortTitle: Computer Vision
tagline: "Pixels to production: CNNs, detection, segmentation, transformers and responsible deployment."
accent: "#E8590C"
persona: You are an expert Computer Vision & Deep Learning professor (CSC3104) who examines students in 1-on-1
  oral exams and lab defences.
formulas:
  - name: Conv output size
    expr: O = ⌊(W − K + 2P) / S⌋ + 1
  - name: Conv parameters
    expr: (K · K · C_in + 1) · C_out
  - name: Normalisation
    expr: x′ = (x / 255 − μ) / σ
  - name: Cross-entropy
    expr: L = − Σ y_c · log p_c
  - name: Precision / Recall
    expr: P = TP/(TP+FP),  R = TP/(TP+FN)
  - name: F1
    expr: F1 = 2PR / (P + R)
  - name: IoU
    expr: "|A ∩ B| / |A ∪ B|"
  - name: Dice
    expr: 2|A ∩ B| / (|A| + |B|) = 2·IoU / (1 + IoU)
  - name: Focal loss
    expr: FL = −α (1 − p_t)^γ · log p_t
  - name: ViT tokens
    expr: N = (H/P) · (W/P)  (+1 for [CLS])
  - name: Self-attention
    expr: softmax(Q Kᵀ / √d_k) · V
  - name: Model size
    expr: params × bytes/param (FP32 = 4, FP16 = 2, INT8 = 1)
  - name: Quantisation
    expr: q = round(x / s) + z,  s = (max − min) / 255
exam:
  durationMinutes: 10
  written:
    - prompt: Let's start simple. Explain the difference between image classification, object detection and semantic
        segmentation.
      module: images-as-data
      keywords:
        - classification
        - single label
        - detection
        - bounding box
        - where
        - segmentation
        - pixel
        - every pixel
        - instance
      idealAnswer: Classification gives one label for the whole image, with no location. Detection outputs a class,
        confidence and bounding box for each object — what and where. Semantic segmentation classifies every
        pixel, giving exact shapes but not separating instances of the same class. Cost and annotation effort
        increase from classification to segmentation.
    - prompt: Why do convolutional networks outperform fully connected networks on images? Name the two key
        inductive biases.
      module: cnns
      keywords:
        - local connectivity
        - locality
        - parameter sharing
        - weight sharing
        - translation equivariance
        - fewer parameters
        - overfitting
      idealAnswer: CNNs exploit local connectivity — each neuron sees a small receptive field — and parameter
        sharing — the same kernel slides across the image. This cuts parameters massively and gives
        translation equivariance, so a feature is detected anywhere. A fully connected net flattens the image,
        ignores spatial structure, needs millions of weights and overfits.
    - prompt: Your training accuracy is 99% but validation accuracy is 72%. What's happening, and what would you do?
      module: training-evaluation
      keywords:
        - overfitting
        - variance
        - augmentation
        - regularisation
        - dropout
        - weight decay
        - early stopping
        - more data
        - leakage
      idealAnswer: That gap means overfitting — high variance; the model memorises training data instead of
        generalising. I'd add data augmentation, regularisation like weight decay or dropout, use early
        stopping on validation loss, simplify the model or use transfer learning. I'd also check the split for
        leakage or distribution differences between train and validation.
    - prompt: You have 500 medical X-ray images. How would you apply transfer learning from an ImageNet-pretrained
        ResNet-50? Explain your freezing strategy and learning rates.
      module: transfer-learning
      keywords:
        - freeze
        - backbone
        - new head
        - classifier
        - small learning rate
        - fine-tune
        - catastrophic forgetting
        - overfitting
        - domain shift
        - augmentation
      idealAnswer: With 500 images, training all 25M parameters would overfit. I'd replace the final layer with a
        new head for my classes, freeze the backbone and train the head first. Because X-rays differ from
        ImageNet photos, I'd then unfreeze the top blocks and fine-tune with a small learning rate, around
        1e-5 to 1e-4, smaller for earlier layers, to avoid catastrophic forgetting — plus augmentation and
        careful validation.
    - prompt: How does Non-Maximum Suppression eliminate redundant bounding boxes? What metric does it rely on?
      module: object-detection
      keywords:
        - iou
        - intersection over union
        - confidence
        - sort
        - highest
        - suppress
        - threshold
        - greedy
        - duplicate
      idealAnswer: NMS relies on confidence scores and IoU. Sort boxes by confidence, keep the top box, compute IoU
        between it and each remaining box of the same class, and remove those above a threshold such as 0.5.
        Repeat with the next highest box. The threshold trades off duplicates against wrongly suppressing
        nearby objects in crowded scenes.
    - prompt: In segmentation, what is the difference between IoU and Dice, and why are skip connections used in
        U-Net?
      module: segmentation
      keywords:
        - iou
        - dice
        - intersection
        - union
        - overlap
        - skip
        - encoder
        - decoder
        - resolution
        - boundary
        - concatenate
      idealAnswer: IoU is intersection over union; Dice is twice the intersection over the sum of both mask sizes,
        so Dice = 2·IoU/(1+IoU) and is always higher. Both measure mask overlap. U-Net's skip connections
        concatenate high-resolution encoder features into the decoder, recovering spatial detail lost by
        pooling, which gives sharp boundaries.
    - prompt: Why do Vision Transformers need far larger pretraining datasets than CNNs to be competitive?
      module: vits-multimodal
      keywords:
        - inductive bias
        - locality
        - translation equivariance
        - global attention
        - patches
        - learn spatial
        - data
      idealAnswer: CNNs build in locality and translation equivariance. A ViT treats the image as a sequence of
        patch tokens with global self-attention and almost no built-in spatial assumptions, so it has to learn
        that neighbouring patches are related from data. With small data it underperforms; with large-scale
        pretraining its flexibility and global context let it match or beat CNNs.
    - prompt: In multi-object tracking, why is a Kalman filter paired with the Hungarian algorithm in SORT? What
        limitation led to DeepSORT?
      module: video-tracking
      keywords:
        - kalman
        - predict
        - velocity
        - hungarian
        - assignment
        - matching
        - iou
        - deepsort
        - re-id
        - appearance
        - occlusion
        - id switch
      idealAnswer: The Kalman filter predicts each track's next position from a constant-velocity motion model. The
        Hungarian algorithm then finds the optimal one-to-one assignment between predictions and new
        detections using IoU cost. SORT relies only on motion and overlap, so occlusions and crossings cause
        ID switches. DeepSORT adds appearance embeddings from a re-ID network to the matching.
    - prompt: Your model must run on a phone. How would you make it deployable, and what would you report about its
        limitations?
      module: deployment-responsible
      keywords:
        - quantisation
        - quantization
        - int8
        - pruning
        - distillation
        - onnx
        - tflite
        - core ml
        - latency
        - benchmark
        - subgroup
        - bias
        - model card
      idealAnswer: "I'd shrink the model with INT8 quantisation, pruning or knowledge distillation into a mobile
        backbone, export via ONNX or directly to TFLite or Core ML, and benchmark latency, memory and accuracy
        on the actual device. For limitations I'd write a model card: intended use, training data, and
        accuracy broken down by subgroup and condition — lighting, skin tone, camera — plus known failure
        modes."
