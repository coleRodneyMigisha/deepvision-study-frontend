id: deployment-responsible
title: Deployment & Responsible Vision
subtitle: Getting a model running on real devices, and making sure it's fair and safe
recap: |
  A model is only useful once it runs where people need it (a phone, a roadside camera, a hospital server) fast
  enough, in little enough memory, and without draining the battery. To shrink it, store its numbers with fewer
  bits (quantisation: 32-bit → 8-bit makes it 4× smaller), remove weights that barely matter (pruning), and
  export it to a fast runtime like ONNX, TensorRT or TFLite. Always test speed on the real device. To use it
  responsibly, check what it's looking at (Grad-CAM heatmaps), measure accuracy separately for every group of
  people, write down its limits (a model card), and test that small tricks can't fool it.
traps:
  - "Measuring speed on your laptop instead of on the device the model will actually run on."
  - "Reporting one overall accuracy and hiding that the model fails much more often for some groups of people."
  - "Mixing up latency (how long one prediction takes) with throughput (how many predictions per second)."
lesson:
  checkpointStep: 3
  steps:
    - "A model sitting in a notebook helps no one. Deployment means running it on real hardware (phones, cameras,
      cloud servers) within limits on speed (latency), memory and power."
    - "Make models smaller and faster. Quantisation stores each weight as an 8-bit whole number instead of a 32-bit
      decimal number: four times less memory. Pruning removes weights that barely matter."
    - "Export to a fast inference runtime: ONNX is the common file format, TensorRT runs on NVIDIA graphics cards,
      OpenVINO on Intel chips, TFLite or Core ML on phones. Then measure speed and accuracy on the actual device."
    - "Checkpoint: how does Grad-CAM show which parts of a picture a CNN used? And how do you check a vision model for
      bias?"
    - "Grad-CAM asks: if this part of the last feature maps changed, how much would the \"cat\" score change? It turns
      that into one importance weight per channel, adds up the weighted maps, and keeps only the positive parts. The
      result is a heatmap of what mattered."
    - "Responsible vision means measuring who the model fails. The Gender Shades study found commercial gender
      classifiers were wrong up to 35% of the time for darker-skinned women, but under 1% for lighter-skinned men."
    - "So report results separately for each group (disaggregated metrics), write down the limits in a model card, and
      test robustness: tiny, invisible changes or a few stickers can flip a prediction."
checkpoint:
  question: How does Grad-CAM produce an interpretable visual explanation of a CNN prediction? And how do you
    audit a vision model for demographic bias?
  hint: "Grad-CAM: use gradients (how much the class score would change) to weight each feature map, add them up, keep
    the positive part. Bias: don't trust one overall number. What should you measure for each group of people?"
  keywords:
    - grad-cam
    - gradient
    - feature map
    - last conv
    - channel
    - weight
    - global average
    - relu
    - heatmap
    - bias
    - subgroup
    - disaggregated
    - demographic
    - audit
    - dataset
  idealAnswer: "Grad-CAM computes the gradient of the chosen class's score with respect to the last convolutional
    layer's feature maps, i.e. how much the score would change if each part changed. It averages each gradient map
    (global average pooling) into one importance weight per channel, adds up the feature maps weighted by these,
    and applies ReLU to keep only the positive evidence. Enlarged to the picture's size, this heatmap shows the
    regions that pushed the prediction towards that class. To audit for bias, measure accuracy, false-positive and
    false-negative rates separately for each demographic subgroup (disaggregated metrics), check how well each group
    is represented in the training dataset, and document the gaps: a high overall accuracy can hide big failures
    for some groups."
terms:
  - term: Deployment
    definition: Getting a trained model running for real users on real hardware.
  - term: Latency vs throughput
    definition: Latency is the time for one prediction; throughput is predictions per second. Batching improves
      throughput but makes each request wait longer.
  - term: Quantisation
    definition: Storing weights (and often intermediate values) with fewer bits, e.g. 32-bit decimals → 8-bit whole
      numbers (INT8). About 4× smaller and faster on supporting chips.
  - term: Pruning
    definition: Removing weights or whole channels that contribute little.
  - term: Knowledge distillation
    definition: Training a small "student" model to copy a big "teacher" model's outputs.
  - term: ONNX
    definition: An open file format for models that many fast runtimes can load, whatever framework trained the model.
  - term: Grad-CAM
    definition: A heatmap showing which parts of a picture most increased the model's score for a class.
  - term: Disaggregated metrics
    definition: Accuracy and error rates reported separately for each group (e.g. skin tone, age, region), not just
      overall.
  - term: Model card
    definition: A short document describing what the model is for, what data it learned from, how well it works for
      each group, and its known limits.
  - term: Adversarial example
    definition: An input changed slightly on purpose (often invisibly to people) to make the model get it wrong.
quiz:
  - question: A model with 25 million parameters takes about 100 MB as 32-bit numbers (FP32). How big is it after INT8
      quantisation?
    options:
      - 50 MB
      - 25 MB
      - 12.5 MB
      - 100 MB
    answer: 1
    explanation: "FP32 uses 4 bytes per number, INT8 uses 1. So 25 million × 1 byte ≈ 25 MB."
  - question: A Grad-CAM heatmap for "husky" highlights the snow, not the dog. What does that suggest?
    options:
      - The model is perfect
      - A misleading pattern in the training data (spurious correlation)
      - Quantisation broke it
      - Grad-CAM is wrong by definition
    answer: 1
    explanation: The training photos of huskies mostly had snow, so the model learned "snow = husky". It's right for
      the wrong reason. Fix the data.
  - question: Grouping more requests together into one batch usually…
    options:
      - Improves throughput but makes each request wait longer (more latency)
      - Improves both
      - Worsens both
      - Has no effect
    answer: 0
    explanation: Doing many at once is efficient, so more get done per second, but each one waits for the batch.
  - question: Which runtime is built for NVIDIA graphics cards (GPUs)?
    options:
      - TFLite
      - Core ML
      - TensorRT
      - OpenVINO
    answer: 2
    explanation: TensorRT is NVIDIA's. TFLite and Core ML are for phones; OpenVINO is for Intel chips.
  - question: In Grad-CAM, what are the channel weights α_k?
    options:
      - Random numbers
      - The averaged gradients of the class score for each feature map
      - The final layer's biases
      - Pixel brightness
    answer: 1
    explanation: Each one says how important that channel is for the chosen class.
  - question: Why does Grad-CAM apply ReLU (keep only positive values)?
    options:
      - To speed it up
      - To keep only regions that increase the class score
      - To normalise colours
      - To remove the background
    answer: 1
    explanation: We want to see what supports the prediction; negative evidence is dropped.
  - question: What does a model card document?
    options:
      - Only the architecture
      - "Intended use, data, per-group performance and limitations"
      - The training code
      - The API key
    answer: 1
    explanation: It tells users and auditors what the model is for, how well it works for whom, and where not to
      use it.
  - question: Knowledge distillation trains…
    options:
      - A bigger teacher from a student
      - A small student to copy a large teacher
      - Two identical models
      - A model without data
    answer: 1
    explanation: The small student learns from the big teacher's outputs, so it ends up nearly as good but much
      faster.
fact:
  title: Stickers that fool stop signs
  body: In 2018, researchers stuck a few black-and-white stickers on a real stop sign. A road-sign classifier then
    read it as "Speed Limit 45" in most test photos, from different distances and angles. Testing against tricks like
    this is now part of safety testing for car cameras.
lab:
  title: Quantisation & model size
  variations:
    - title: FP32 Weight Memory Footprint
      question: A vision model has <b>25 million</b> parameters. How many <b>MB</b> (1 MB = 10⁶ bytes) do its
        weights occupy in <b>FP32</b>?
      answer: 100
      tolerance: 0.5
      hint: FP32 uses 4 bytes per parameter.
      explanation: 25,000,000 × 4 bytes = 100,000,000 bytes = 100 MB.
    - title: Affine INT8 Quantisation
      question: To store weights as whole numbers from 0 to 255 (INT8), we map the weights' range onto that scale. The
        weights range from <b>min = −1.0</b> to <b>max = 1.55</b>. Using step size <code>s = (max − min)/255</code>
        and zero-point <code>z = round(−min/s)</code> (the integer that stands for 0.0), which integer <code>q</code>
        stores the weight <b>x = 0.50</b>?
      answer: 150
      tolerance: 1
      hint: Compute s = 2.55 / 255 = 0.01, z = round(1.0 / 0.01) = 100, then q = round(0.50 / 0.01) + 100.
      explanation: s = (1.55 − (−1.0)) / 255 = 0.01. z = round(1.0 / 0.01) = 100. q = round(0.50 / 0.01) + 100 = 50
        + 100 = 150.
    - title: Disaggregated Subgroup Error Gap
      question: A classifier achieves <b>99.2%</b> accuracy on Subgroup A (err = 0.8%) and <b>65.3%</b> accuracy on
        Subgroup B. What is the error-rate gap (in percentage points) between Subgroup B and Subgroup A?
      answer: 33.9
      tolerance: 0.1
      hint: Error rate on B = 100 − 65.3 = 34.7%. Subtract 0.8%.
      explanation: Error(B) = 34.7%, Error(A) = 0.8% → Gap = 34.7 − 0.8 = 33.9 percentage points (the Gender Shades gap).
notes:
  - heading: What a model needs to run in the real world
    body: |
      **The idea:** a model that only works on your powerful laptop is like a recipe that needs a restaurant kitchen. Deployment means making it work in a small kitchen: a phone, a roadside camera, a hospital server.

      Every device has limits:

      - **Latency:** how long one prediction takes. A car's safety system may need under 30 milliseconds.
      - **Throughput:** how many predictions per second. A video at 30 frames per second needs at least 30.
      - **Memory:** space for the model's weights and its working numbers.
      - **Power and cost:** battery life, electricity, cloud bills.

      Latency and throughput are different things. **Batching** (processing several inputs together) raises throughput but makes each request wait longer. Always measure **on the real device**, with realistic inputs, after a warm-up run, and report the typical time (p50, the median) and the slow cases (p99, slower than 99% of requests).
  - heading: Making models smaller and faster
    body: |
      **The idea:** fewer and smaller numbers mean less memory and less work.

      - **Quantisation:** store weights as 8-bit whole numbers (INT8) instead of 32-bit decimal numbers (FP32). That's 4× smaller, and faster on chips with integer acceleration. Post-training quantisation only needs a small set of example inputs to calibrate; quantisation-aware training (practising with the rounding during training) keeps more accuracy.
      - **Pruning:** remove weights or whole channels that hardly affect the output. Removing whole channels (structured pruning) gives real speed-ups.
      - **Knowledge distillation:** train a small "student" model to copy a big "teacher" model's answers.
      - **Efficient designs:** models built to be small from the start, like MobileNet, EfficientNet and small YOLO versions.

      **How quantisation maps numbers (tiny example):** weights range from −1.0 to 1.55. Spread that range over the 256 integers 0–255: step size s = 2.55 / 255 = 0.01. The integer standing for 0.0 is z = round(1.0 / 0.01) = 100. So the weight 0.50 is stored as round(0.50 / 0.01) + 100 = **150**.

      Then **export** to a fast runtime: **ONNX** as the common file format; **TensorRT** for NVIDIA GPUs; **OpenVINO** for Intel processors; **TFLite** or **Core ML** for phones. Check the accuracy again after every step.
  - heading: Seeing what the model looked at (Grad-CAM)
    body: |
      **The idea:** ask the model "which parts of this picture made you say *cat*?" and draw the answer as a heatmap.

      **Grad-CAM** works like this:

      1. Run the picture through the CNN and pick the score for the class you care about, y_c.
      2. Compute the **gradient** of that score with respect to the **last convolutional layer's feature maps** A^k: how much would the score change if each spot in each map changed?
      3. **Average** each gradient map into one number α_k per channel: how important that channel is for the class.
      4. Heatmap = **ReLU(Σ_k α_k A^k)**: add up the feature maps weighted by importance, and keep only the positive parts. Enlarge it to the picture's size and lay it on top.

      ReLU keeps only the regions that *increase* the score. Grad-CAM is how you catch **shortcut learning**, where a model gets the right answer for the wrong reason: a pneumonia model that actually looks at the hospital's text label in the corner of the X-ray, or a "husky" detector that's really a snow detector.
  - heading: "Responsible vision: fairness, documentation, robustness"
    body: |
      **The idea:** one big accuracy number can hide the people the model fails.

      The **Gender Shades** study tested commercial gender classifiers and found error rates of up to **34.7% for darker-skinned women** but only **0.8% for lighter-skinned men**. The overall accuracy looked fine.

      Good practice:

      - **Measure each group separately (disaggregated evaluation):** report results per skin tone, age, region, camera type. Fix gaps with better, more representative data.
      - **Write a model card:** what the model is for, what it must not be used for, what data it learned from, how well it works for each group, its limits and ethical concerns.
      - **Test robustness:** tiny, carefully designed changes (adversarial examples) or a few stickers can flip a prediction. Also test with noise, blur, bad lighting and pictures unlike the training data.
      - **Protect privacy:** faces and number plates are personal data. Keep as little as possible, blur where you can, and follow data-protection law (e.g. Uganda's Data Protection and Privacy Act 2019).
examples:
  - title: Will the model fit on the phone?
    problem: A detector with 25 million parameters must fit in 40 MB on a phone. Does it fit as FP32 (4 bytes each)?
      FP16 (2 bytes)? INT8 (1 byte)?
    steps:
      - "FP32: 25 million × 4 bytes = **100 MB**, too big."
      - "FP16: 25 million × 2 bytes = **50 MB**, still too big."
      - "INT8: 25 million × 1 byte = **25 MB**: it fits, with room left for the app."
      - Then check the accuracy (mAP) and the speed again, on the phone itself.
    answer: Only INT8 (25 MB) fits.
    takeaway: Quantisation is often what makes running a model on a phone possible at all.
  - title: The average that hides a failure
    problem: "A face-verification model is 96% accurate on 10,000 test photos: 8,000 from group A (98% accurate) and
      2,000 from group B. How accurate is it for group B, and what should you report?"
    steps:
      - "Correct overall = 0.96 × 10,000 = 9,600. Group A correct = 0.98 × 8,000 = 7,840."
      - "Group B correct = 9,600 − 7,840 = 1,760, so accuracy = 1,760 / 2,000 = **88%**."
      - "Group B's error rate (12%) is 6× group A's (2%), hidden behind the 96% headline."
      - Report results per group in the model card, and fix the gap (e.g. more representative data) before using it.
    answer: 88% for group B.
    takeaway: Always break results down by group. The average hides the people the model fails.
questions:
  - question: How does Grad-CAM produce a heatmap, and how can it reveal shortcut learning?
    kind: short
    marks: 6
    keywords:
      - gradient
      - class score
      - last convolutional
      - feature maps
      - global average pooling
      - weights
      - weighted sum
      - relu
      - heatmap
      - shortcut
      - spurious
      - background
    idealAnswer: "Grad-CAM takes the gradient of the class score with respect to the last convolutional layer's
      feature maps, averages each gradient map (global average pooling) into one weight per channel, takes the
      weighted sum of the feature maps, applies ReLU to keep the positive parts, and enlarges the result into a
      picture-sized heatmap of the regions that increased the score. If the heatmap highlights irrelevant clues,
      such as a hospital's text label or the snow behind a husky (a spurious pattern in the background), the model
      has learned a shortcut instead of the real features."
  - question: How would you audit a vision model for bias? Refer to Gender Shades.
    kind: short
    marks: 5
    keywords:
      - disaggregated
      - subgroup
      - skin tone
      - gender
      - error rate
      - gender shades
      - 34.7%
      - 0.8%
      - model card
      - representative data
      - limitations
    idealAnswer: "Measure the results separately for each relevant subgroup (skin tone, gender, age, region, device)
      instead of one overall number: disaggregated evaluation. Gender Shades showed commercial classifiers with error
      rates up to 34.7% for darker-skinned women versus 0.8% for lighter-skinned men. Document the per-group results
      and limitations in a model card, find the causes (often training data that doesn't represent everyone),
      collect more representative data, and test again before and after deployment."
  - question: You must deploy a skin-lesion classifier as an offline app on mid-range Android phones used by community
      health workers in rural Uganda. Describe how you'd make it fit and run fast, how you'd check it's accurate and
      fair, how you'd explain its outputs, and what you'd document.
    kind: long
    marks: 15
    keywords:
      - efficient architecture
      - mobilenet
      - distillation
      - int8
      - quantisation
      - tflite
      - on-device benchmark
      - latency
      - memory
      - battery
      - re-validate
      - sensitivity
      - skin tone
      - disaggregated
      - grad-cam
      - model card
      - intended use
      - limitations
      - referral
      - privacy
      - robustness
      - lighting
    idealAnswer: "Fit and speed: start from an efficient architecture (MobileNet or EfficientNet-Lite), possibly
      distilled from a bigger teacher model; quantise to INT8 using some calibration photos and export to TFLite;
      run an on-device benchmark of latency, memory and battery use on the actual phones, after a warm-up, reporting
      p50 and p99. Accuracy: re-validate after every optimisation on test photos from the real setting, focusing on
      sensitivity (recall) for dangerous lesions and on robustness to different phone cameras, lighting and blur.
      Fairness: report disaggregated results by skin tone (most public skin-disease datasets are mostly light skin,
      so collect local data), age and sex, and fix gaps before release. Explanations: show Grad-CAM heatmaps and a
      calibrated risk level with clear referral advice, presenting the app as support for the health worker's
      decision, not a diagnosis. Documentation: a model card covering intended users and use, uses to avoid,
      training data, per-group performance and known limitations; plus privacy measures (processing on the phone,
      consent, keeping as little data as possible, following Uganda's Data Protection and Privacy Act)."
coding:
  - id: grad-cam
    title: Grad-CAM from activations and gradients
    language: python
    level: core
    setup: |
      import numpy as np
      rng = np.random.default_rng(5)
      A = rng.random((4, 7, 7))           # last conv layer: 4 channels of 7×7 feature maps
      A[2, 1:3, 4:6] += 3.0               # channel 2 fires on the object (top right)
      G = np.zeros((4, 7, 7)); G[2] = 0.8; G[0] = -0.5; G[1] = 0.05   # d(class score)/dA
    prompt: |
      Write `grad_cam(A, G)` for activations `A` and gradients `G` of shape `C × H × W`:

      1. `alpha_k` = mean of `G[k]` over the spatial dimensions (global average pooling);
      2. heatmap = `ReLU(Σ_k alpha_k · A[k])`;
      3. normalise to [0, 1] by dividing by the maximum (if it's > 0).

      Return the `H × W` heatmap and say in a comment why the ReLU is there.
    starter: |
      import numpy as np

      def grad_cam(A, G):
          return A.mean(axis=0)
    solution: |
      import numpy as np

      def grad_cam(A, G):
          alpha = G.mean(axis=(1, 2))                       # importance of each channel for the class
          cam = np.maximum((alpha[:, None, None] * A).sum(axis=0), 0)   # ReLU: keep evidence FOR the class
          return cam / cam.max() if cam.max() > 0 else cam
    tests:
      - name: Heatmap shape and range
        code: |
          h = grad_cam(A, G)
          assert h.shape == (7, 7) and h.min() >= 0 and abs(h.max() - 1) < 1e-9
      - name: The hottest region is where channel 2 fires
        code: |
          h = grad_cam(A, G)
          r, c = np.unravel_index(np.argmax(h), h.shape)
          assert 1 <= r <= 2 and 4 <= c <= 5, f"peak at {(r, c)}"
      - name: Negative evidence is removed by the ReLU
        code: |
          h = grad_cam(np.ones((1, 3, 3)), -np.ones((1, 3, 3)))
          assert (h == 0).all()
  - id: disaggregated-evaluation
    title: Disaggregated evaluation
    language: python
    level: core
    setup: |
      import numpy as np
      import pandas as pd
      rng = np.random.default_rng(11)
      n = 2000
      group = rng.choice(["lighter", "darker"], n, p=[0.8, 0.2])
      y = rng.integers(0, 2, n)
      wrong = np.where(group == "lighter", rng.random(n) < 0.02, rng.random(n) < 0.15)
      results = pd.DataFrame({"group": group, "y_true": y, "y_pred": np.where(wrong, 1 - y, y)})
    prompt: |
      `results` has one row per test image with `group`, `y_true`, `y_pred`. Write `by_group(results)`
      returning a DataFrame indexed by group with columns `n`, `accuracy` and `error_rate`, and
      `worst_gap(results)` → the largest error rate divided by the smallest. What does the overall accuracy hide?
    starter: |
      def by_group(results):
          acc = (results.y_true == results.y_pred).mean()
          print("overall accuracy", acc)

      def worst_gap(results):
          ...
    solution: |
      def by_group(results):
          correct = results.y_true == results.y_pred
          out = results.assign(correct=correct).groupby("group").agg(n=("correct", "size"), accuracy=("correct", "mean"))
          out["error_rate"] = 1 - out["accuracy"]
          return out

      def worst_gap(results):
          e = by_group(results)["error_rate"]
          return float(e.max() / e.min())

      print("overall", (results.y_true == results.y_pred).mean())
      print(by_group(results))
      print("gap ×", round(worst_gap(results), 1))
    tests:
      - name: One row per group with n, accuracy and error_rate
        code: |
          g = by_group(results)
          assert set(g.index) == {"lighter", "darker"} and {"n", "accuracy", "error_rate"} <= set(g.columns)
          assert int(g["n"].sum()) == len(results)
      - name: Per-group numbers are correct
        code: |
          g = by_group(results)
          d = results[results.group == "darker"]
          assert abs(g.loc["darker", "accuracy"] - (d.y_true == d.y_pred).mean()) < 1e-12
      - name: The gap is large even though overall accuracy looks fine
        code: |
          overall = (results.y_true == results.y_pred).mean()
          assert overall > 0.94 and worst_gap(results) > 4
