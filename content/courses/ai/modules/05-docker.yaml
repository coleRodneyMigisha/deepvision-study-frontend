id: docker
title: Containerization, Multi-Stage Docker & Security Hardening
subtitle: Packaging an app with everything it needs, keeping the package small, and making it hard to attack
recap: |
  Docker packs your code, the Python version and every library into a sealed, layered package (an image), so an
  app that "works on my laptop" works the same everywhere. A multi-stage build uses a big "builder" stage with
  compilers to prepare the libraries, then copies only the finished results into a small, clean base image. That
  cuts the size by about 80% and leaves no compilers for an attacker to use. Run the app as a normal (non-root)
  user, and use .dockerignore to keep secrets and data out of the image.
traps:
  - "Shipping gcc and other build tools in the final image. They make it huge and give attackers tools."
  - "Running the container as root (the all-powerful admin user)."
  - "Copying your code before installing the requirements. Then every code change re-installs every library."
lesson:
  checkpointStep: 3
  steps:
    - "A web API that works on your laptop often fails on a cloud server because of a different Python version,
      missing system libraries, or different operating-system packages. Docker solves this."
    - "A Docker image is a sealed, runnable package containing your code, the Python runtime, system tools and
      libraries, built up in layers that never change once built."
    - "A careless Dockerfile starts from a 1 GB Ubuntu image and installs compilers (gcc, g++) that stay in the final
      container. That makes it slow to deploy and gives attackers more to work with (a bigger attack surface)."
    - "Checkpoint: why are multi-stage Docker builds so useful for Python ML APIs, and why should containers never run
      as root in production?"
    - "A multi-stage build uses a heavy first stage, with compilers, to build the Python packages, then copies only
      the finished packages into a clean, minimal python:3.11-slim image, cutting the size by about 80%."
    - "Running as a normal user (USER appuser), not root, means that if an attacker exploits a bug or a malicious
      pickle file, they can't change system files or reach the host computer's drives as easily."
checkpoint:
  question: Explain the architecture of a multi-stage Docker build for a Python ML serving image, and detail two
    security best practices for production container deployment.
  hint: "Describe the two stages: a 'builder' stage with compilers, and a final small 'runner' stage. What gets copied
    across, and what's left behind? For security, think about which user the app runs as, and what .dockerignore
    keeps out."
  keywords:
    - multi-stage
    - docker
    - builder
    - slim
    - root
    - user
    - security
    - attack surface
    - layer
    - caching
  idealAnswer: "A multi-stage Docker build separates building from running. The first, builder stage (FROM python:3.11
    AS builder) installs compilers and build tools (gcc, g++, libpq-dev) to compile the heavy Python libraries into
    ready-to-install packages (wheels). The final stage (FROM python:3.11-slim) copies in only those wheels and the
    app code, leaving the compilers, header files and build leftovers behind. That shrinks the image from about
    1.2 GB to about 160 MB, so containers start and scale faster, and there's a smaller attack surface. Copying
    requirements before the code also keeps each layer's caching effective. Two key security practices: (1) run as
    a dedicated non-root user (RUN useradd -m appuser, then USER appuser), so an attacker who exploits a bug can't
    easily gain control of the host; and (2) use a strict .dockerignore file to keep virtual environments, test
    data, git history and secrets out of the image."
terms:
  - term: Docker image vs container
    definition: An image is the sealed package; a container is a running copy of it.
  - term: Dockerfile
    definition: The recipe file listing the steps (FROM, COPY, RUN, …) to build an image.
  - term: Image layer
    definition: The read-only result of one Dockerfile step. Docker reuses (caches) unchanged layers to rebuild fast.
  - term: Base image
    definition: The starting image you build on, e.g. python:3.11-slim, which provides a minimal operating system and
      Python.
  - term: Multi-stage build
    definition: A Dockerfile with several FROM stages, copying only the needed results from one stage into the next.
  - term: Attack surface
    definition: Everything an attacker could try to use. Fewer tools and packages in the image means a smaller attack
      surface.
  - term: Root vs non-root user
    definition: Root is the all-powerful admin account. Running your app as an ordinary user limits the damage if it's
      hacked.
  - term: .dockerignore
    definition: A file listing what to leave out of the image (e.g. .git, .env secrets, datasets, notebooks).
quiz:
  - question: Why place 'COPY requirements.txt .' and 'RUN pip install' before 'COPY . .' in a Dockerfile?
    options:
      - To enable Docker layer caching so pip install isn't re-run every time application code changes
      - To make Python run faster
      - Docker syntax requires dependencies first
      - To encrypt requirements.txt
    answer: 0
    explanation: Docker caches image layers from top to bottom. If requirements.txt has not changed, Docker reuses
      the cached pip layer, making subsequent code-only builds complete in seconds.
  - question: Which base image provides the best balance of minimal size and compatibility for
      PyTorch/Scikit-Learn microservices?
    options:
      - ubuntu:22.04 (850MB)
      - python:3.11-slim (140MB)
      - alpine:latest (5MB, musl libc)
      - python:3.11-full (1.2GB)
    answer: 1
    explanation: python:3.11-slim uses standard glibc (compatible with all C-extensions and pre-compiled wheels)
      while removing unnecessary system packages.
  - question: What does a multi-stage build mainly remove from the final image?
    options:
      - The model
      - Compilers and build tools
      - Python
      - The app code
    answer: 1
    explanation: Only the finished packages are copied into the final stage; the compilers stay behind in the builder.
  - question: Why copy requirements.txt before the application code?
    options:
      - Docker requires it
      - So the dependency layer stays cached when only code changes
      - It makes the image smaller
      - For security
    answer: 1
    explanation: A change rebuilds that layer and everything after it. Libraries change rarely, so installing them first means code edits only rebuild the last step.
  - question: Why can python:3.11-alpine make ML image builds slower?
    options:
      - It's bigger
      - "It uses musl, so many scientific wheels compile from source"
      - It has no pip
      - It can't run Python 3.11
    answer: 1
    explanation: Ready-made packages are built for the glibc library, but Alpine uses musl, so they often have to be compiled from scratch.
  - question: What does USER appuser protect against?
    options:
      - Slow startup
      - An exploit gaining root inside the container
      - Large images
      - Network latency
    answer: 1
    explanation: If the app is hacked, the attacker only gets an ordinary user's limited powers, not root's (the "least privilege" rule).
  - question: What belongs in .dockerignore?
    options:
      - requirements.txt
      - ".git, .env and local datasets"
      - The Dockerfile
      - The app code
    answer: 1
    explanation: "Things like .git, .env secrets and datasets: it keeps the build small and secrets out of the image."
  - question: Where should the GEMINI_API_KEY go?
    options:
      - Hard-coded in the Dockerfile
      - Copied in a .env file
      - Injected as an environment variable at runtime
      - In the image label
    answer: 2
    explanation: In an environment variable set when the container starts. Images get copied and shared, so secrets must never be built into them.
fact:
  title: Why Alpine Linux Can Slow Python Builds
  body: Alpine Linux uses musl libc instead of glibc. Because most scientific Python packages (NumPy, SciPy,
    pandas) publish pre-compiled wheels for glibc (manylinux), Alpine forces slow compilation from source
    during build, often taking 20+ minutes and creating larger final images than python-slim.
lab:
  title: Docker Multi-Stage Build & Image Layer Optimizer
  variations:
    - title: AWS EC2 On-Demand vs Spot Cost Delta
      question: An <code>m5.xlarge</code> instance costs <b>$0.192 per hour</b> On-Demand. For fault-tolerant batch
        stroke retraining, AWS Spot instances offer a <b>72% discount</b>. What is the Spot price per hour in
        dollars? (3 decimals)
      answer: 0.054
      tolerance: 0.003
      hint: Multiply $0.192 by (1 − 0.72) = 0.28.
      explanation: $0.192 × 0.28 = $0.05376 ≈ $0.054/hr. Over a 720-hour month, this saves ~$100 per instance.
    - title: Auto-Scaling Target Group Sizing
      question: Peak clinical triage volume reaches <b>1,800 requests/minute</b>. If one container replica reliably
        serves <b>150 requests/minute</b> at < 50ms latency, what is the minimum number of instances required
        in the Auto-Scaling Group?
      answer: 12
      tolerance: 0
      hint: Divide 1,800 by 150.
      explanation: 1,800 / 150 = 12 instances required to handle peak surge without request buffering or SLA breach.
    - title: Monthly Serverless Cost vs Reserved VM
      question: A small clinic makes <b>50,000 API calls/month</b>. AWS Lambda charges $0.20/1M calls + compute,
        totaling <b>$0.15/month</b>, while a reserved VM costs <b>$15.00/month</b>. How many <b>dollars</b>
        does the clinic save per month by adopting serverless?
      answer: 14.85
      tolerance: 0.1
      hint: Subtract $0.15 from $15.00.
      explanation: $15.00 − $0.15 = $14.85 saved per month (a 99% cost reduction for intermittent rural clinic workloads).
notes:
  - heading: '"Works on my machine"'
    body: |
      **The idea:** instead of sending someone a recipe and hoping their kitchen has the same ingredients, send them the finished meal in a sealed box.

      An API that runs on your laptop can fail on a server because of a different Python version, a missing system library (XGBoost needs `libgomp`), different package versions, or settings you forgot you had.

      A **Docker image** packs *everything* the app needs (system libraries, the Python runtime, exact package versions, your code and your model) into one sealed package that never changes once built. A **container** is a running copy of that image. The same image runs identically on your laptop, in automated testing and on the live server.
  - heading: Layers and caching
    body: |
      **The idea:** Docker builds an image like a stack of plates, one per instruction. If you change a plate, every plate above it has to be rebuilt, so put the ones that rarely change at the bottom.

      Each Dockerfile instruction creates a **layer**. Docker remembers (caches) layers and reuses them if the instruction and its inputs haven't changed. A change rebuilds **that layer and every layer after it**, so order matters:

      ```dockerfile
      FROM python:3.11-slim
      WORKDIR /app
      COPY requirements.txt .                     # changes rarely
      RUN pip install --no-cache-dir -r requirements.txt
      COPY app/ app/                              # changes often
      ```

      With this order, editing your code only rebuilds the last layer (seconds). If you `COPY . .` before `pip install`, every code change re-installs all the libraries (minutes).

      A `.dockerignore` file keeps `.git`, `.env` (secrets), notebooks and datasets out of the build. Smaller, faster, and no leaked passwords.
  - heading: Multi-stage builds
    body: |
      **The idea:** build the furniture in the workshop, then deliver only the finished furniture, not the saws and drills.

      Some Python packages need **compilers** (gcc, g++, header files) to install. Those tools take hundreds of MB, and once the app is built they're just extra things an attacker could use.

      A **multi-stage build** uses a heavy *builder* stage to compile everything, then copies only the finished results into a clean, minimal stage:

      ```dockerfile
      FROM python:3.11 AS builder                          # stage 1: the workshop
      COPY requirements.txt .
      RUN pip wheel --wheel-dir /wheels -r requirements.txt

      FROM python:3.11-slim                                # stage 2: the delivery
      COPY --from=builder /wheels /wheels
      RUN pip install --no-cache-dir /wheels/* && rm -rf /wheels
      COPY app/ app/
      ```

      Typical result: an image of about 1.2 GB shrinks to about 150–200 MB. It's faster to upload, download and start, and has no compilers for an attacker to use.

      **Choosing the base image matters too.** `python:3.11-slim` (Debian, with the standard glibc library) is the safe default. **Alpine** is tiny but uses a different library (musl), so ready-made NumPy and XGBoost packages often don't fit and must be compiled from scratch: slow builds and subtle bugs.
  - heading: Run as non-root, and other hardening
    body: |
      **The idea:** don't give the app the master key to the building. If someone breaks in through it, they should only reach one room.

      By default, the program inside a container runs as **root**, the all-powerful admin user. If an attacker exploits a bug in your code, in a library, or through a **malicious pickle** file, they get root inside the container. That makes it much easier to break out to the host computer or tamper with connected storage.

      ```dockerfile
      RUN useradd --create-home appuser        # create an ordinary user
      USER appuser                             # run everything after this as that user
      CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
      ```

      Other hardening worth naming in an exam:

      - fix (pin) the base image version, or its exact digest;
      - scan images for known security holes (CVEs) with tools like Trivy or Docker Scout;
      - keep secrets out of the image; pass them in as environment variables when the container starts;
      - add a `HEALTHCHECK` so the platform can tell when the app stops responding;
      - keep the image minimal.
examples:
  - title: How much did the multi-stage build save?
    problem: A single-stage ubuntu-based image is 1,315 MB (850 MB base, 420 MB build tools, 45 MB app). Rebuilt
      multi-stage on python:3.11-slim (140 MB) it's 185 MB. What's the reduction?
    steps:
      - Reduction = (1,315 − 185) / 1,315 = 1,130 / 1,315 ≈ **85.9%**.
      - "Where it came from: a 710 MB smaller base and 420 MB of compilers left behind in the builder stage."
    answer: About 86% smaller.
    takeaway: Base image and leftover build tools are where the size hides.
  - title: Why does every build take 2 minutes?
    problem: "A Dockerfile has: FROM python:3.11-slim → COPY . . → RUN pip install -r requirements.txt → CMD ….
      Each one-line code change triggers a full reinstall. Why, and how do you fix it?"
    steps:
      - COPY . . includes the code, so any code change invalidates that layer and every layer after it —
        including pip install.
      - "Fix: COPY requirements.txt first, RUN pip install, then COPY the code."
      - "Now a code change only rebuilds the final COPY layer: seconds instead of minutes."
    answer: Layer order — copy and install dependencies before copying code.
    takeaway: Put what changes least at the top of the Dockerfile.
questions:
  - question: Explain how Docker layer caching works and how Dockerfile order affects build time.
    kind: short
    marks: 5
    keywords:
      - layer
      - instruction
      - cache
      - invalidated
      - subsequent
      - requirements
      - pip install
      - copy code
      - order
      - seconds
      - minutes
    idealAnswer: Each instruction creates a layer that Docker caches; if an instruction and its inputs are
      unchanged the cached layer is reused, but a change invalidates that layer and every layer after it.
      Copying requirements.txt and running pip install before copying the code keeps the expensive dependency
      layer cached, so code edits rebuild only the last layers in seconds rather than reinstalling everything.
  - question: Why should production containers never run as root?
    kind: short
    marks: 4
    keywords:
      - root
      - privilege
      - exploit
      - vulnerability
      - malicious pickle
      - escape
      - host
      - volumes
      - least privilege
      - user
    idealAnswer: If the app is compromised — through a code vulnerability, a dependency or a malicious pickle —
      the attacker gets the process's privileges. As root they can modify system files, tamper with mounted
      volumes and more easily escape to the host. Running as an unprivileged user (USER appuser) applies least
      privilege and limits the damage.
  - question: Write a production Dockerfile for the stroke-risk FastAPI service and explain each decision (base
      image, stages, caching, security, configuration, health).
    kind: long
    marks: 12
    keywords:
      - multi-stage
      - builder
      - wheels
      - python:3.11-slim
      - requirements
      - cache
      - copy app
      - model
      - useradd
      - user appuser
      - env
      - secrets
      - healthcheck
      - expose
      - uvicorn
      - dockerignore
    idealAnswer: "Stage 1 FROM python:3.11 AS builder: COPY requirements.txt; RUN pip wheel -r requirements.txt
      into /wheels (compilers live only here). Stage 2 FROM python:3.11-slim (small, glibc-compatible): COPY
      --from=builder /wheels, pip install --no-cache-dir and remove the wheels; then COPY app/ and models/
      last so code changes don't invalidate the dependency layer. RUN useradd appuser and USER appuser for
      least privilege. Configuration such as GEMINI_API_KEY and model paths come from environment variables at
      runtime, never baked in; .dockerignore excludes .git, .env and data. EXPOSE 8000, add HEALTHCHECK
      calling /health, and CMD uvicorn app.main:app --host 0.0.0.0 --port 8000. Result: a ~150–200 MB
      reproducible image with no build tools, fast rebuilds and a minimal attack surface."
coding:
  - id: production-dockerfile
    title: A production Dockerfile
    language: review
    level: exam
    prompt: |
      Write the Dockerfile for the stroke FastAPI service (`app/`, `models/`, `requirements.txt`).
      Requirements: multi-stage build with no compilers in the final image, a slim base, dependency layer
      caching, a non-root user, no secrets baked in, a health check, and Uvicorn on port 8000.
      Also list what goes in `.dockerignore` as a comment.
    starter: |
      FROM ubuntu:22.04
      RUN apt-get update && apt-get install -y python3 python3-pip gcc g++
      COPY . /app
      WORKDIR /app
      RUN pip3 install -r requirements.txt
      CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0"]
    solution: |
      # .dockerignore: .git  .env  *.ipynb  data/  __pycache__/  tests/
      FROM python:3.11 AS builder
      WORKDIR /build
      COPY requirements.txt .
      RUN pip wheel --no-cache-dir --wheel-dir /wheels -r requirements.txt   # compilers live only here

      FROM python:3.11-slim
      ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
      WORKDIR /app
      COPY --from=builder /wheels /wheels
      RUN pip install --no-cache-dir /wheels/* && rm -rf /wheels \
          && useradd --create-home appuser
      COPY app/ app/            # code last → code edits don't invalidate the dependency layer
      COPY models/ models/
      USER appuser              # least privilege: an exploit doesn't get root
      EXPOSE 8000
      HEALTHCHECK CMD python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      # Secrets (e.g. API keys) are injected as environment variables at runtime, never COPY'd in.
      CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    rubric:
      - Uses a multi-stage build so compilers and build tools are not in the final image
      - Uses a slim base image for the runtime stage
      - Copies requirements and installs dependencies before copying application code (layer caching)
      - Runs as a non-root user
      - Keeps secrets out of the image and lists sensible .dockerignore entries
      - Adds a health check and starts Uvicorn on 0.0.0.0:8000
