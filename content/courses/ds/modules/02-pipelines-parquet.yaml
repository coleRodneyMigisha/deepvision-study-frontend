id: pipelines-parquet
title: "Pipelines: ETL vs ELT, Parquet & Idempotency"
subtitle: Building data processes you can safely run again and again, and storing data efficiently (Lab 3)
recap: |
  A pipeline is a chain of small steps (profile → validate → clean → store) that a computer can re-run on its
  own. ETL cleans the data before storing it; ELT stores the raw data first and cleans it inside the database.
  Parquet is a file format that stores data column by column, with proper types and compression, so a query
  only reads the columns it needs. A pipeline is idempotent if running it twice gives exactly the same result
  as running it once. To get that, write to a temporary file and swap it in all at once (os.replace), and
  replace rows by their key (upsert) instead of blindly adding (appending) them.
traps:
  - "Using append mode. Every retry or re-run adds the same rows again, creating duplicates."
  - "Writing straight to the final file. If the program crashes halfway, the file is left half-written and broken."
  - "Thinking compression is Parquet's only advantage. Reading only the needed columns (column pruning) usually
    saves even more."
lesson:
  checkpointStep: 3
  steps:
    - "A notebook that only works if you run its cells in a secret order is not a pipeline. In Lab 3 we split our
      code into separate steps: profile → validate → clean → store, run in order by run_pipeline.py."
    - "In classic ETL (Extract, Transform, Load), data is cleaned on a separate machine before it's stored. In modern
      ELT (Extract, Load, Transform), the raw data is stored first and cleaned inside the database, using SQL or
      DuckDB."
    - "Where should cleaned data live? CSV is plain text stored row by row, with no types, and slow to read. Apache
      Parquet stores each column together, with its type recorded, and compresses it."
    - "Checkpoint: what does it mean for a pipeline to be idempotent, and how do you stop re-runs from creating
      duplicate rows or half-written files?"
    - "An idempotent pipeline leaves storage in exactly the same state whether it runs once or ten times on the same
      input: f(f(x)) = f(x). Plain append breaks this, because every retry adds the rows again."
    - "To make file writes safe to repeat, write to a temporary file and then call os.replace(tmp, target), which
      swaps it in all at once. In databases, replace rows by their key (an upsert, INSERT OR REPLACE) or overwrite
      the whole day's data (partition overwrite)."
checkpoint:
  question: Define idempotency in data pipelines. Why does a naive append mode break idempotency on retries, and
    how do you engineer both file outputs and database loads to be idempotent?
  hint: "In maths, f(f(x)) = f(x): doing it twice is the same as doing it once. Now imagine a job fails at 99% and the
    scheduler (Airflow) runs it again. What happens to rows that were already added? Think about temporary files
    and replacing rows by their key."
  keywords:
    - idempotent
    - idempotency
    - same
    - repeat
    - retry
    - duplicate
    - append
    - atomic
    - temp
    - replace
    - upsert
    - primary key
    - partition
    - overwrite
  idealAnswer: "A pipeline is idempotent if running it several times on the same input leaves storage in exactly the
    same state as running it once. Naive append breaks this, because every retry or re-run inserts the rows again,
    creating duplicates that inflate counts and totals. For files, write to a temporary file and swap it into place
    in one atomic step (os.replace), or overwrite that date's whole partition. For database tables, set a primary
    key on the columns that identify each row and use INSERT OR REPLACE (an upsert), or DELETE WHERE date = ... and
    then insert, inside a single transaction so it all happens or none of it does."
terms:
  - term: Pipeline
    definition: A chain of small, separate steps that process data automatically, each reading inputs and writing
      outputs.
  - term: ETL vs ELT
    definition: Extract-Transform-Load cleans data before storing it; Extract-Load-Transform stores raw data first and
      cleans it inside the database.
  - term: Idempotency
    definition: Running a job many times has exactly the same effect as running it once.
  - term: Columnar storage (Parquet)
    definition: Storing data column by column instead of row by row, so a query can read just the columns it needs and
      each column compresses well.
  - term: Compression
    definition: Storing data in fewer bytes, e.g. writing "Owino × 50,000" instead of the word 50,000 times.
  - term: Row group and predicate pushdown
    definition: Parquet splits data into blocks and records each column's smallest and largest value per block, so a
      filter can skip blocks that can't match without reading them.
  - term: Atomic write
    definition: Writing to a temporary file, then swapping it in with os.replace(), so nobody ever sees a half-written
      file.
  - term: Upsert
    definition: Insert a row, or replace it if a row with the same key already exists (INSERT OR REPLACE / ON CONFLICT
      UPDATE).
quiz:
  - question: A table has 12 columns (8 bytes each per row) and 1,000,000 rows. A query uses only 2 columns. Roughly how
      much less data does column-by-column storage read than a row-by-row CSV?
    options:
      - 2× less
      - 6× less
      - 12× less
      - Same amount
    answer: 1
    explanation: "It only reads the 2 columns it needs out of 12: 12 / 2 = 6× less, before even counting compression."
  - question: Why write to "market_prices.parquet.tmp" and then call os.replace(), instead of writing straight to
      "market_prices.parquet"?
    options:
      - It compresses better
      - It prevents a broken, half-written file if the program crashes mid-write
      - It skips schema validation
      - Parquet requires .tmp extensions
    answer: 1
    explanation: os.replace() swaps the file in one step, so readers see either the complete old file or the complete
      new one, never half a file.
  - question: In ELT, where does the cleaning (transforming) usually happen?
    options:
      - On the data source
      - On a separate Python machine
      - Inside the database/engine, after loading
      - In the browser
    answer: 2
    explanation: ELT loads the raw data first, then transforms it inside the engine, e.g. with SQL in DuckDB.
  - question: Which Parquet feature lets a date filter skip whole blocks of data?
    options:
      - Dictionary encoding
      - Per-block min/max values (predicate pushdown)
      - Snappy compression
      - Column names
    answer: 1
    explanation: Each block records each column's smallest and largest value, so blocks that can't match the filter are
      skipped.
  - question: Why is os.replace(tmp, target) used when writing output files?
    options:
      - It compresses the file
      - "It is an atomic rename, so readers never see a half-written file"
      - It validates the schema
      - It deletes the raw file
    answer: 1
    explanation: "Atomic means all at once: the target is always either the old or the new complete file."
  - question: f(f(x)) = f(x) is the definition of…
    options:
      - Determinism
      - Idempotency
      - Immutability
      - Atomicity
    answer: 1
    explanation: Doing an idempotent operation again changes nothing.
  - question: A CSV column contains "0012". What can go wrong that Parquet avoids?
    options:
      - Nothing
      - The reader may guess it's the number 12
      - Parquet can't store text
      - CSV can't store numbers
    answer: 1
    explanation: A CSV doesn't record column types, so readers guess. Parquet stores the declared type, so "0012" stays
      text.
  - question: What's the main benefit of splitting a pipeline into separate steps?
    options:
      - Fewer files
      - "Each stage can be tested, rerun and retried on its own"
      - It removes the need for logging
      - It makes Python faster
    answer: 1
    explanation: Small steps with clear inputs and outputs can be tested and re-run one at a time.
fact:
  title: Why Parquet + DuckDB can beat CSV by 20–100×
  body: Parquet stores all values of a column together, so a column with "Owino" repeated 50,000 times shrinks to a
    tiny list of codes plus counts. Files get 80%+ smaller, and the computer can process many values at once.
lab:
  title: Parquet Columnar I/O & Idempotency Simulator
  variations:
    - title: Columnar Pruning + Compression I/O Savings
      question: A dataset has <b>10 columns</b> of equal byte width and occupies <b>240 MB</b> as an uncompressed
        CSV. Stored in Parquet with <b>3×</b> Snappy compression, how many <b>MB</b> does DuckDB read to scan
        just <b>2 columns</b>?
      answer: 16
      tolerance: 0.1
      hint: "Column pruning reads 2/10 of the table, and Snappy shrinks that by 3×: 240 × (2/10) / 3."
      explanation: 2 of 10 columns = 48 MB uncompressed → divided by 3× compression = 16 MB scanned (a 15× reduction
        from 240 MB!).
    - title: Non-Idempotent Retry Row Inflation
      question: A daily batch contains <b>1,500</b> unique records, with <b>200</b> records overlapping the previous
        day's load. The database already holds <b>10,000</b> rows. If a broken `append` job runs <b>3
        times</b> (initial + 2 retries), how many excess rows are in the table compared to a single idempotent
        `upsert`?
      answer: 3200
      tolerance: 0
      hint: Idempotent upsert adds only the 1,300 truly new rows (total 11,300). Naive append adds 1,500 × 3 = 4,500
        rows (total 14,500).
      explanation: "Idempotent upsert: 10,000 + (1,500 − 200) = 11,300 rows. 3× naive appends: 10,000 + 3 × 1,500 =
        14,500 rows. Excess corrupt rows = 14,500 − 11,300 = 3,200."
    - title: Parquet Row-Group Predicate Pushdown
      question: A Parquet file has <b>800,000</b> rows split evenly into <b>8 row groups</b> sorted by `date`. A
        query filters `WHERE date = '2025-11-15'`, which falls inside a single row group. Using min/max
        statistics, how many thousand rows does DuckDB <b>skip</b> without reading?
      answer: 700
      tolerance: 0
      hint: Each row group has 100,000 rows. 7 of the 8 row groups are skipped completely.
      explanation: Each row group holds 800,000 / 8 = 100,000 rows. Min/max pushdown skips 7 row groups = 700,000
        rows (700 thousand).
notes:
  - heading: From notebook to pipeline
    body: |
      **The idea:** a notebook is like cooking from memory; a pipeline is a written recipe that anyone (or any computer) can follow the same way every time.

      Notebooks are great for exploring and bad for running every day: cells can run out of order, results hide in memory, and "it worked yesterday" proves nothing. A **pipeline** is the same code split into small, named steps, each with clear inputs and outputs:

      `profile.py → validate.py → clean.py → store.py`, run in order by `run_pipeline.py`.

      Each step reads files, does one job, writes files, and logs what it did (rows in and out, how long it took). That gives you three things a notebook can't: you can **rerun one step** without the others, you can **test each step**, and a scheduler like Airflow can **retry just the step that failed**.
  - heading: ETL vs ELT
    body: |
      **The idea:** do you wash vegetables before putting them in the fridge (ETL), or put them in the fridge and wash them when you cook (ELT)?

      | | ETL | ELT |
      |---|---|---|
      | Order | Extract → Transform → Load | Extract → Load → Transform |
      | Where cleaning happens | in Python on a separate machine | inside the database (SQL, DuckDB) |
      | Raw data kept? | often not | yes, the raw data lands first |
      | Good when | data is small and cleaning needs complex Python | the database is powerful and you may want to redo the cleaning later |

      Modern data work leans towards **ELT**, because storage is cheap and engines like DuckDB, BigQuery or Snowflake are fast: store the raw data once, then build cleaned tables with SQL that you can change and rerun any time. Our course pipeline mixes both: Python for cleaning, then DuckDB for modelling and queries.
  - heading: Why Parquet beats CSV
    body: |
      **The idea:** imagine a phone book you could only read line by line, versus one where all the surnames are in one list and all the numbers in another. To count surnames, you'd only open the surname list.

      A **CSV** is plain text stored **row by row**. Every query has to read every byte of every column, and the computer *guesses* the types each time (`"0012"` becomes 12; dates become plain text).

      **Parquet** is a **column-by-column** file format:

      - **Column pruning:** each column's values are stored together, so `SELECT AVG(price_ugx)` reads only that one column. Reading 2 of 10 columns reads about 20% of the data.
      - **Compression that works:** a column of market names repeats the same few words, so it can be stored as small codes plus counts (dictionary and run-length encoding).
      - **Types are stored:** whole numbers stay whole numbers, dates stay dates.
      - **Block summaries:** each block records each column's smallest and largest value, so a filter like `date >= '2025-03-01'` can skip whole blocks without reading them (*predicate pushdown*).

      A handy estimate: **bytes read ≈ CSV size × (columns read ÷ total columns) ÷ compression ratio.**
  - heading: Idempotency, atomic writes and upserts
    body: |
      **The idea:** pressing a lift button twice doesn't call two lifts. A good pipeline step works the same way: running it again changes nothing.

      A step is **idempotent** if running it once or ten times on the same input gives the same result: f(f(x)) = f(x). This matters because schedulers **will** retry failed jobs and re-run old dates (backfills).

      The classic mistake is **append** (always adding rows). Each retry adds the batch again. A table with 10,000 rows and a 1,500-row batch ends up with 14,500 rows after three runs, instead of 11,500.

      Two standard fixes:

      - **For files:** write to a temporary file, then swap it in all at once (atomically) with `os.replace("out.parquet.tmp", "out.parquet")`. Readers see either the complete old file or the complete new one, never half a file. Or overwrite that date's whole folder (partition).
      - **For database tables:** set a **primary key** on the columns that identify a row, and **upsert**: insert, or replace if the key already exists (`INSERT OR REPLACE`, `ON CONFLICT DO UPDATE`). Or `DELETE WHERE date = :d` then `INSERT`, inside one **transaction**, so either everything happens or nothing does.
examples:
  - title: How much does DuckDB scan?
    problem: A market table with 10 columns is 300 MB as a CSV. Stored as Parquet, it compresses 4×. How much data does a
      query that uses only 3 of the columns need to read?
    steps:
      - "Column pruning: 3 of 10 columns → 300 × 3/10 = **90 MB** of the uncompressed data."
      - "Compression: 90 ÷ 4 = **22.5 MB**."
      - "Compared with CSV: 300 ÷ 22.5 ≈ **13× less I/O**."
    answer: About 22.5 MB.
    takeaway: Pruning and compression multiply — that's why columnar formats are so fast for analytics.
  - title: Counting the damage of append
    problem: A table has 8,000 rows. A batch of 1,200 rows is loaded (300 of them are updates to rows that already exist).
      The job fails at the very end, and Airflow retries it twice. How many rows end up in the table with append, and
      how many with an upsert (replace by key)?
    steps:
      - "Append runs 3 times: 8,000 + 3 × 1,200 = **11,600 rows**."
      - "Upsert: 300 keys are updated in place; 900 are new → 8,000 + 900 = **8,900 rows**, whatever the
        number of runs."
      - "Corrupt extra rows with append: 11,600 − 8,900 = **2,700**."
    answer: Append gives 11,600 rows; upsert gives 8,900.
    takeaway: Idempotent loads make retries safe; append makes every retry a data-quality incident.
questions:
  - question: Compare ETL and ELT and say which you would choose for the Uganda market-price project, with a reason.
    kind: short
    marks: 5
    keywords:
      - extract
      - transform
      - load
      - order
      - staging
      - warehouse
      - raw
      - sql
      - duckdb
      - re-transform
    idealAnswer: "ETL transforms data on a staging system before loading the result; ELT loads raw data first and
      transforms it inside the warehouse. For the market-price project ELT (or a hybrid) fits: storage is
      cheap, DuckDB can transform millions of rows quickly with SQL, and keeping raw data in the warehouse
      lets us rebuild cleaned tables when rules change."
  - question: Explain three reasons Parquet is preferred over CSV for analytical storage.
    kind: short
    marks: 6
    keywords:
      - columnar
      - column pruning
      - compression
      - dictionary
      - schema
      - types
      - row group
      - predicate pushdown
    idealAnswer: Parquet is columnar, so queries read only the columns they need (column pruning). Columns
      compress well with dictionary and run-length encoding because values repeat. It stores an explicit typed
      schema, avoiding CSV's type guessing. Row-group min/max statistics allow predicate pushdown, skipping
      blocks that can't match a filter.
  - question: An Airflow task loads a daily batch into fact_market_prices using pandas to_sql(if_exists='append').
      It failed twice last week and was retried. Explain what happened to the data, how you would detect it,
      and how you would redesign the load to be idempotent for both the Parquet files and the database table.
    kind: long
    marks: 12
    keywords:
      - append
      - duplicate
      - retry
      - row counts
      - unique key
      - group by having
      - idempotent
      - temp file
      - os.replace
      - partition
      - primary key
      - upsert
      - transaction
    idealAnswer: "Each retry re-appended the whole batch, so those days now have duplicate rows that inflate sums
      and counts. Detect it by comparing row counts per load date with the source and by querying duplicates
      on the business key (GROUP BY date, market, commodity HAVING COUNT(*) > 1). Redesign: for files, write
      each day's output to a temp file and os.replace it atomically, or overwrite that date's partition. For
      the table, add a primary key on (date, market, commodity) and upsert (INSERT OR REPLACE / ON CONFLICT DO
      UPDATE), or delete-then-insert that date inside one transaction. Then a retry or backfill produces the
      same final state, and a uniqueness check can run after each load."
coding:
  - id: idempotent-upsert
    title: An idempotent upsert
    language: python
    level: core
    prompt: |
      Write `upsert(table, batch, key)` for two pandas DataFrames:

      - rows of `batch` whose `key` already exists in `table` **replace** those rows;
      - rows with new keys are **added**;
      - the result has **no duplicate keys**, and inputs are not modified.

      Then prove it's idempotent: `upsert(upsert(t, b, k), b, k)` must equal `upsert(t, b, k)`.
      (`key` is a list of column names.)
    setup: |
      import pandas as pd
      table = pd.DataFrame({"date": ["d1", "d1", "d2"], "market": ["Owino", "Gulu", "Owino"], "price": [3800, 4100, 3900]})
      batch = pd.DataFrame({"date": ["d2", "d3"], "market": ["Owino", "Owino"], "price": [3950, 4000]})
      KEY = ["date", "market"]
    starter: |
      import pandas as pd

      def upsert(table, batch, key):
          # Naive append — NOT idempotent. Fix me.
          return pd.concat([table, batch], ignore_index=True)

      once = upsert(table, batch, KEY)
      twice = upsert(once, batch, KEY)
      print(len(once), len(twice))
    solution: |
      import pandas as pd

      def upsert(table, batch, key):
          keep = ~table.set_index(key).index.isin(batch.set_index(key).index)
          out = pd.concat([table[keep], batch], ignore_index=True)
          return out.sort_values(key).reset_index(drop=True)

      once = upsert(table, batch, KEY)
      twice = upsert(once, batch, KEY)
      print(len(once), len(twice))
    tests:
      - name: New keys are added and existing keys replaced
        code: |
          r = upsert(table, batch, KEY)
          assert len(r) == 4, f"expected 4 rows (3 existing + 1 new), got {len(r)}"
          v = r[(r.date == "d2") & (r.market == "Owino")]["price"].tolist()
          assert v == [3950], f"(d2, Owino) should be updated to 3950, got {v}"
      - name: No duplicate keys
        code: |
          r = upsert(table, batch, KEY)
          assert not r.duplicated(subset=KEY).any()
      - name: Running it twice gives the same table (idempotent)
        code: |
          once = upsert(table, batch, KEY)
          twice = upsert(once, batch, KEY)
          assert same_rows(once, twice), "a retry must not change the result"
      - name: Inputs are not modified
        code: |
          t0, b0 = table.copy(), batch.copy()
          upsert(table, batch, KEY)
          assert table.equals(t0) and batch.equals(b0)
    hints:
      - Keep only the table rows whose key is NOT in the batch, then append the whole batch.
      - "`table.set_index(key).index.isin(batch.set_index(key).index)` tells you which keys collide."
  - id: atomic-write
    title: Atomic, idempotent file output
    language: review
    level: core
    prompt: |
      Write `write_partition(df, out_dir, date)` that saves one day's cleaned prices to
      `out_dir/date=<date>/prices.parquet` so that:

      - readers can never see a half-written file, even if the process crashes mid-write;
      - re-running for the same date **overwrites** that day's data instead of duplicating it;
      - a failure doesn't leave temporary files behind.

      Explain your choices in comments. (This is reviewed by the AI against a rubric.)
    starter: |
      import os
      import pandas as pd

      def write_partition(df: pd.DataFrame, out_dir: str, date: str) -> str:
          ...
    solution: |
      import os
      import tempfile
      import pandas as pd

      def write_partition(df: pd.DataFrame, out_dir: str, date: str) -> str:
          part = os.path.join(out_dir, f"date={date}")
          os.makedirs(part, exist_ok=True)
          target = os.path.join(part, "prices.parquet")
          # Write to a temp file in the SAME directory (same filesystem) so os.replace is atomic.
          fd, tmp = tempfile.mkstemp(dir=part, suffix=".tmp")
          os.close(fd)
          try:
              df.to_parquet(tmp, index=False)
              os.replace(tmp, target)  # atomic: readers see the old file or the new one, never half
          except BaseException:
              if os.path.exists(tmp):
                  os.remove(tmp)
              raise
          return target  # same path every run → re-running overwrites the partition (idempotent)
    rubric:
      - Writes to a temporary file first, in the same directory/filesystem as the target
      - Uses os.replace (or an equivalent atomic rename) to publish the file
      - Writes to a deterministic per-date partition path so re-runs overwrite rather than append
      - Cleans up the temporary file if writing fails
      - Creates the partition directory if needed
