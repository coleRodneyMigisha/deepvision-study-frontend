      - portable
    idealAnswer: ONNX is an open, framework-neutral format describing a model's computation graph; models from
      scikit-learn, XGBoost or PyTorch can be exported to it. ONNX Runtime executes the graph with optimised
      C++ kernels, fusing operations, pre-planning memory and using hardware-specific instructions, so no
      Python runs in the inference loop — lowering latency — and the model becomes portable across languages.
  - question: The stroke API must answer in under 15 ms on a CPU-only server, but the current FP32 Python model
      takes 40 ms. Describe a step-by-step optimisation plan, how you would measure each step, and the
      acceptance criteria before deployment.
    kind: long
    marks: 12
    keywords:
      - profile
      - baseline
      - p50
      - p99
      - onnx
      - export
      - onnx runtime
      - int8
      - quantize_dynamic
      - pruning
      - batch
      - warm-up
      - roc-auc
      - recall
      - threshold
      - calibration
      - compare
      - rollback
    idealAnswer: "1) Baseline: measure p50/p99 latency on the target CPU with realistic single requests after
      warm-up, and record ROC-AUC, recall at the clinical threshold and calibration. 2) Export the model to
      ONNX and run it with ONNX Runtime; verify outputs match the original within tolerance and re-measure
      latency. 3) Apply post-training INT8 quantisation (quantize_dynamic, or static with calibration data)
      and re-measure size and latency. 4) If still too slow, prune low-importance weights or trees and tune
      runtime threads. 5) Accept only if p99 < 15 ms on the target hardware and the metrics are within an
      agreed tolerance of FP32 (e.g. ROC-AUC drop < 0.5% and no recall loss at the triage threshold). Deploy
      via canary and keep the FP32 model as a rollback."
coding:
  - id: int8-quantise
    title: Affine INT8 quantisation in NumPy
    language: python
    level: core
    prompt: |
      Implement asymmetric (affine) quantisation of a float tensor to unsigned 8-bit integers:

      - `quantise(x)` → `(q, scale, zero_point)` where `scale = (max − min) / 255`,
        `zero_point = round(−min / scale)`, `q = clip(round(x / scale) + zero_point, 0, 255)` as `uint8`.
      - `dequantise(q, scale, zero_point)` → `(q − zero_point) · scale` as float32.

      Then report the size reduction and the worst absolute error on `W`.
    setup: |
      import numpy as np
      rng = np.random.default_rng(0)
      W = rng.normal(0, 0.4, size=(256, 256)).astype(np.float32)
    starter: |
      import numpy as np

      def quantise(x):
          ...

      def dequantise(q, scale, zero_point):
          ...
    solution: |
      import numpy as np

      def quantise(x):
          lo, hi = float(x.min()), float(x.max())
          scale = (hi - lo) / 255
          zero_point = int(round(-lo / scale))
          q = np.clip(np.round(x / scale) + zero_point, 0, 255).astype(np.uint8)
          return q, scale, zero_point

      def dequantise(q, scale, zero_point):
          return ((q.astype(np.float32) - zero_point) * scale).astype(np.float32)

      q, s, z = quantise(W)
      print("bytes:", W.nbytes, "→", q.nbytes, f"({W.nbytes // q.nbytes}× smaller)")
      print("max error:", float(np.abs(dequantise(q, s, z) - W).max()), "≤ scale/2 =", s / 2)
    tests:
      - name: Output is uint8 and 4× smaller than float32
        code: |
          import numpy as np
          q, s, z = quantise(W)
          assert q.dtype == np.uint8 and q.shape == W.shape
          assert W.nbytes == 4 * q.nbytes
      - name: Scale and zero-point follow the affine formula
        code: |
          q, s, z = quantise(W)
          assert abs(s - (float(W.max()) - float(W.min())) / 255) < 1e-9
          assert z == round(-float(W.min()) / s)
      - name: Round-trip error is at most half a step
        code: |
          import numpy as np
          q, s, z = quantise(W)
          err = np.abs(dequantise(q, s, z) - W).max()
          assert err <= s / 2 + 1e-6, f"max error {err} exceeds scale/2 = {s / 2}"
      - name: The range endpoints survive the round trip
        code: |
          import numpy as np
          x = np.array([-1.0, 0.0, 1.0], dtype=np.float32)
          q, s, z = quantise(x)
          back = dequantise(q, s, z)
          assert np.abs(back - x).max() <= s / 2 + 1e-6, f"endpoints came back as {back.tolist()}"
          assert 0 <= int(q.min()) <= 1 and int(q.max()) == 255, "min/max should land at (or next to) the ends of 0–255"
