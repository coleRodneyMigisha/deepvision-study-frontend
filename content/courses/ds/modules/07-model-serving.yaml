coding:
  - id: shared-features
    title: One make_features() for training and serving
    language: python
    level: core
    prompt: |
      Write the shared feature module that both `train.py` and the API import:

      - `FEATURE_COLUMNS = ["rainfall_mm", "is_rainy", "month", "is_beans", "is_maize", "is_matooke"]`
      - `make_features(df)` → a DataFrame with **exactly** those columns, in that order:
        - `is_rainy` = 1 if `rainfall_mm > 5.0` else 0 (strictly greater)
        - `month` = month number of `date`
        - `is_beans`, `is_maize`, `is_matooke` = one-hot of `commodity` (0/1)

      It must work on a **single-row** request too — that's where naive `pd.get_dummies` breaks, because
      a one-row frame only produces one dummy column.
    starter: |
      import pandas as pd

      FEATURE_COLUMNS = ["rainfall_mm", "is_rainy", "month", "is_beans", "is_maize", "is_matooke"]

      def make_features(df):
          out = pd.get_dummies(df, columns=["commodity"])   # breaks for single rows!
          return out

      req = pd.DataFrame([{"date": "2025-03-04", "commodity": "Beans", "rainfall_mm": 8.2}])
      print(make_features(req))
    solution: |
      import pandas as pd

      FEATURE_COLUMNS = ["rainfall_mm", "is_rainy", "month", "is_beans", "is_maize", "is_matooke"]
      COMMODITIES = ["Beans", "Maize", "Matooke"]

      def make_features(df):
          out = pd.DataFrame(index=df.index)
          out["rainfall_mm"] = df["rainfall_mm"].astype(float)
          out["is_rainy"] = (out["rainfall_mm"] > 5.0).astype(int)
          out["month"] = pd.to_datetime(df["date"]).dt.month
          for c in COMMODITIES:
              out[f"is_{c.lower()}"] = (df["commodity"] == c).astype(int)
          return out[FEATURE_COLUMNS]

      req = pd.DataFrame([{"date": "2025-03-04", "commodity": "Beans", "rainfall_mm": 8.2}])
      print(make_features(req))
    tests:
      - name: Exact columns in the agreed order
        code: |
          import pandas as pd
          f = make_features(pd.DataFrame([{"date": "2025-03-04", "commodity": "Maize", "rainfall_mm": 1.0}]))
          assert list(f.columns) == FEATURE_COLUMNS, f"got {list(f.columns)}"
      - name: is_rainy uses rainfall > 5.0 (strict)
        code: |
          import pandas as pd
          df = pd.DataFrame({"date": ["2025-03-01"] * 3, "commodity": ["Beans"] * 3, "rainfall_mm": [5.0, 5.1, 8.2]})
          assert make_features(df)["is_rainy"].tolist() == [0, 1, 1]
      - name: One-hot works for a single-row request
        code: |
          import pandas as pd
          f = make_features(pd.DataFrame([{"date": "2025-07-15", "commodity": "Matooke", "rainfall_mm": 0}]))
          assert f[["is_beans", "is_maize", "is_matooke"]].iloc[0].tolist() == [0, 0, 1]
          assert int(f["month"].iloc[0]) == 7
      - name: Batch and row-by-row give identical features (no skew)
        code: |
          import pandas as pd
          df = pd.DataFrame({"date": ["2025-03-01", "2025-04-02"], "commodity": ["Beans", "Maize"], "rainfall_mm": [9.0, 2.0]})
          batch = make_features(df).reset_index(drop=True)
          rows = pd.concat([make_features(df.iloc[[i]]) for i in range(2)]).reset_index(drop=True)
          assert batch.equals(rows)
    hints:
      - "Build each one-hot column explicitly: `(df['commodity'] == 'Beans').astype(int)`."
      - Finish with `out[FEATURE_COLUMNS]` to fix the order.
  - id: price-request-schema
    title: Validate requests with Pydantic
    language: python
    level: core
    prompt: |
      Define a Pydantic model `PriceRequest` for the `/predict` endpoint:

      - `market`: one of `"Owino"`, `"Nakasero"`, `"Kalerwe"`, `"Gulu"`
      - `commodity`: one of `"Beans"`, `"Maize"`, `"Matooke"`
      - `rainfall_mm`: float between 0 and 500 inclusive
      - `date`: a `datetime.date`

      FastAPI turns any `ValidationError` into an HTTP 422 automatically — the tests construct the model
      directly the same way FastAPI does.
    starter: |
      import datetime
      from typing import Literal
      from pydantic import BaseModel, Field

      class PriceRequest(BaseModel):
          market: str
          commodity: str
          rainfall_mm: float
          date: str
    solution: |
      import datetime
      from typing import Literal
      from pydantic import BaseModel, Field

      class PriceRequest(BaseModel):
          market: Literal["Owino", "Nakasero", "Kalerwe", "Gulu"]
          commodity: Literal["Beans", "Maize", "Matooke"]
          rainfall_mm: float = Field(ge=0, le=500)
          date: datetime.date
    tests:
      - name: A valid request parses (and the date becomes a date)
        code: |
          import datetime
          r = PriceRequest(market="Owino", commodity="Beans", rainfall_mm=8.2, date="2025-03-04")
          assert r.date == datetime.date(2025, 3, 4)
      - name: Negative rainfall is rejected
        code: |
          from pydantic import ValidationError
          try:
              PriceRequest(market="Owino", commodity="Beans", rainfall_mm=-1, date="2025-03-04")
              raise AssertionError("rainfall_mm = -1 should be rejected")
          except ValidationError:
              pass
      - name: Unknown market or commodity is rejected
        code: |
          from pydantic import ValidationError
          for bad in [{"market": "Lira"}, {"commodity": "Cassava"}]:
              try:
                  PriceRequest(**({"market": "Owino", "commodity": "Beans", "rainfall_mm": 3, "date": "2025-03-04"} | bad))
                  raise AssertionError(f"{bad} should be rejected")
              except ValidationError:
                  pass
      - name: Missing fields and bad dates are rejected
        code: |
          from pydantic import ValidationError
          for payload in [{"market": "Owino", "commodity": "Beans", "date": "2025-03-04"},
                          {"market": "Owino", "commodity": "Beans", "rainfall_mm": 3, "date": "not-a-date"}]:
              try:
                  PriceRequest(**payload)
                  raise AssertionError(f"{payload} should be rejected")
              except ValidationError:
                  pass
    hints:
      - "`Literal[...]` restricts a field to exact values; `Field(ge=0, le=500)` bounds a number."
