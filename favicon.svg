<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8601"/>
      <stop offset="100%" stop-color="#a2512d"/>
    </linearGradient>
    <linearGradient id="laptop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43352b"/>
      <stop offset="100%" stop-color="#1b100a"/>
    </linearGradient>
  </defs>

  <!-- Warm background rounded tile -->
  <rect width="64" height="64" rx="18" fill="#fbf2e6" stroke="#e2d5c4" stroke-width="2"/>

  <!-- Lamp Glow & Shade -->
  <path d="M14 20 L22 25 L18 27 Z" fill="#ffb454" opacity="0.9"/>
  <!-- Lamp Stem -->
  <path d="M12 38 L12 28 Q12 22 17 22 L20 22" fill="none" stroke="#a2512d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lamp Base -->
  <ellipse cx="12" cy="38" rx="4" ry="1.5" fill="#a2512d"/>

  <!-- Desktop Monitor / Open Laptop -->
  <rect x="25" y="21" width="16" height="12" rx="2" fill="url(#laptop)"/>
  <rect x="27" y="23" width="12" height="8" rx="1" fill="#ff8601"/>
  <line x1="29" y1="26" x2="33" y2="26" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
  <line x1="29" y1="28" x2="36" y2="28" stroke="#fdeee9" stroke-width="1" stroke-linecap="round"/>
  <!-- Laptop Keyboard Base -->
  <polygon points="23,37 43,37 41,33 25,33" fill="#746759"/>

  <!-- Stack of Books -->
  <rect x="45" y="32" width="11" height="3" rx="1" fill="#007d54"/>
  <rect x="46" y="29" width="10" height="3" rx="1" fill="#c13018"/>
  <rect x="47" y="26" width="8" height="3" rx="1" fill="#ff8601"/>

  <!-- Mug with pen -->
  <rect x="42" y="30" width="3" height="4.5" rx="1" fill="#f4e6d5" stroke="#a2512d" stroke-width="0.8"/>

  <!-- Desk Tabletop (Perspective Slab) -->
  <rect x="6" y="37" width="52" height="5" rx="2" fill="url(#brandGrad)" stroke="#a2512d" stroke-width="1"/>

  <!-- Desk Drawer Front -->
  <rect x="36" y="42" width="20" height="7" rx="1.5" fill="#f4e6d5" stroke="#e2d5c4" stroke-width="1"/>
  <circle cx="46" cy="45.5" r="1.2" fill="#1b100a"/>

  <!-- Desk Legs -->
  <rect x="9" y="42" width="3" height="15" rx="1.2" fill="#a2512d"/>
  <rect x="15" y="42" width="2.5" height="14" rx="1" fill="#ff8601" opacity="0.6"/>
  <rect x="52" y="49" width="3" height="8" rx="1.2" fill="#a2512d"/>
</svg>
