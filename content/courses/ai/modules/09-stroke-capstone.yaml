id: stroke-capstone
title: "Capstone: Regional Referral Hospital Stroke Risk Pipeline & Explainable AI (XAI)"
subtitle: Putting it all together, choosing the right cut-off for a hospital, and explaining each prediction to doctors
recap: |
  The capstone brings every module together for the Regional Referral Hospital. Only about 5% of patients have
  strokes, so the usual cut-off of 0.5 (flag the patient if the predicted risk is above 50%) misses most of them.
  Lower the cut-off (the threshold), e.g. to 0.22, to catch as many stroke patients as possible (high recall)
  while the clinic can still see everyone flagged. Doctors need reasons, not just a number. SHAP shows how much
  each of the patient's details added to their risk, starting from the hospital's average, which turns a score
  into something a doctor can act on.
traps:
  - "Keeping the 0.5 threshold when only 5% of cases are positive. Most stroke patients score below 0.5."
  - "Giving a doctor a risk score with no explanation. In practice, unexplained scores tend to be ignored."
  - "Reading SHAP values as causes. They explain what the model did, not what causes a stroke."
lesson:
  checkpointStep: 3
  steps:
    - "Now we combine all eight earlier modules into the capstone project: deploying the stroke (cerebrovascular
      accident) risk predictor for a busy Regional Referral Hospital in Uganda."
    - "Under the Ministry of Health service integration guidelines of June 2025, high-risk patients found at hospital
      triage are automatically enrolled in the chronic care clinic."
    - "Because only about 5% of patients have strokes, the default cut-off of 0.5 is a disaster: most stroke patients
      get a predicted risk below 50%. Lowering the decision threshold to 0.22 catches far more of them (higher
      recall) while keeping the clinic's workload manageable."
    - "Checkpoint: why is an unexplained (\"black-box\") prediction unacceptable to a referral doctor, and how do SHAP
      values give a mathematically grounded explanation for each patient?"
    - "Doctors won't trust or act on an unexplained number. Explainable AI (XAI) with SHAP (SHapley Additive
      exPlanations) works out exactly how much each of the patient's details added to, or took away from, their risk
      score."
    - "The doctor sees at a glance: \"Average hospital risk is 5%. This patient's predicted risk is 42% (+18 because
      they're 68, +12 for high blood pressure, +7 for glucose of 220 mg/dL).\" Explanations turn predictions into
      clinical action."
checkpoint:
  question: Why must clinical classification thresholds be calibrated away from the default 0.5, and how does
    SHAP (Shapley Additive exPlanations) establish clinical trust for attending doctors?
  hint: "0.5 assumes both mistakes cost the same. Do they? Compare missing a stroke with ordering one extra check-up.
    Then: how could you show a doctor which of this patient's details pushed the risk up, and by how much (SHAP,
    from game theory)?"
  keywords:
    - threshold
    - calibration
    - recall
    - shap
    - shapley
    - explainability
    - xai
    - clinical trust
    - feature attribution
    - asymmetric cost
  idealAnswer: "The default 0.5 probability threshold assumes symmetric misclassification costs (a False
    Positive equals a False Negative). In clinical triage, a False Negative (missing a high-risk stroke
    patient who then suffers permanent disability or death) is catastrophic, whereas a False Positive (an
    extra diagnostic evaluation or chronic clinic check) is low-cost. We calibrate the decision threshold down
    (e.g. to 0.20–0.25) to achieve 85%+ Recall. SHAP values, rooted in cooperative game theory, establish
    clinical trust by decomposing the final prediction into exact, additive feature attributions:
    $\\text{Prediction} = \\text{Base Risk} + \\sum \\phi_i$. Rather than seeing an untrusted black-box
    probability, the doctor sees precisely which risk factors (e.g., Age +16%, Hypertension +14%, Glucose +8%)
    drove the prediction, validating clinical plausibility and guiding immediate therapeutic intervention."
terms:
  - term: Decision threshold
    definition: The cut-off that turns a predicted probability into a yes/no decision, e.g. refer if risk ≥ 0.22.
  - term: Threshold calibration
    definition: Moving the threshold away from 0.5 to match the real costs of each kind of mistake and the clinic's
      capacity.
  - term: Asymmetric cost
    definition: When one mistake is much worse than the other, e.g. missing a stroke vs an unnecessary check-up.
  - term: Explainable AI (XAI)
    definition: Methods that make a model's predictions understandable to people.
  - term: SHAP (SHapley Additive exPlanations)
    definition: A method from game theory that shares out a prediction fairly among the features, giving each one's
      contribution.
  - term: Base value
    definition: The model's average prediction across patients (about the hospital's base rate). SHAP contributions
      start from here.
  - term: Local vs global explanation
    definition: Local explains one patient's prediction; global (e.g. average size of each feature's SHAP value)
      shows which features matter most overall.
  - term: Chronic care clinic integration
    definition: The Uganda Ministry of Health (June 2025) protocol that refers high-risk patients found at triage into
      long-term care.
quiz:
  - question: A hospital model outputs stroke probability = 0.28. If the threshold is 0.5, the patient is flagged
      negative; if threshold is 0.20, flagged positive. Why choose 0.20?
    options:
      - 0.20 lowers false negatives, ensuring critical stroke-risk patients receive urgent preventative care
      - 0.20 uses less computer memory
      - 0.20 is required by Python
      - 0.20 guarantees 100% precision
    answer: 0
    explanation: A lower cut-off catches more stroke patients (higher recall). Missing a stroke is far worse than an
      extra check-up.
  - question: What property guarantees that the sum of all SHAP values plus the baseline expected value equals the
      model's exact prediction for a patient?
    options:
      - Efficiency (Additivity) property of Shapley values
      - Bayes theorem
      - The Central Limit Theorem
      - Occam's Razor
    answer: 0
    explanation: A basic rule of Shapley values (efficiency, or additivity) guarantees the feature contributions add up
      exactly to the gap between this prediction and the base value.
  - question: Why is the 0.5 threshold a poor default for the stroke model?
    options:
      - It's too strict on false positives
      - "With ~5% prevalence most stroke patients score below 0.5, so recall is low"
      - Sklearn doesn't allow it
      - It's too slow
    answer: 1
    explanation: "Set the cut-off to match the real costs: a missed stroke is much worse than an extra check."
  - question: Lowering the threshold usually…
    options:
      - Increases precision and recall
      - Increases recall and lowers precision
      - Lowers both
      - Changes nothing
    answer: 1
    explanation: More patients get flagged, so you catch more real cases (true positives) but also raise more false alarms (false positives).
  - question: Where should the decision threshold be chosen?
    options:
      - On the test set
      - On the training set
      - On a validation set (then confirmed on test)
      - In production by trial and error
    answer: 2
    explanation: On the validation set. Choosing it using the test set lets test information leak in, so the final score is too optimistic.
  - question: SHAP values for one patient sum to…
    options:
      - 1
      - The model's prediction minus the base value
      - The number of features
      - Zero
    answer: 1
    explanation: Base value + all the contributions = this patient's prediction.
  - question: "'+12 points from hypertension' in a SHAP plot means…"
    options:
      - Hypertension causes 12% more strokes
      - The model's prediction for this patient rose by 12 points due to that feature
      - 12% of patients have hypertension
      - The model is biased
    answer: 1
    explanation: The model's prediction went up by 12 points because of hypertension. It explains the model, not what causes strokes.
  - question: How do you get global feature importance from SHAP?
    options:
      - Use one patient
      - Average the absolute SHAP values across many patients
      - Sum the base values
      - You can't
    answer: 1
    explanation: Average the size (ignoring the sign) of each feature's SHAP values across many patients, then rank the features.
fact:
  title: Uganda MOH 2025 Integrated Non-Communicable Disease Guidelines
  body: In Sub-Saharan Africa, cerebrovascular accidents occur at younger median ages (often under 55) due to
    undiagnosed hypertension. Integrating predictive MLOps pipelines with explainable SHAP dashboards in
    regional referral hospitals allows early preventative intervention before catastrophic acute events.
lab:
  title: Clinical Stroke Risk, Threshold Calibration & SHAP Feature Attribution Simulator
  variations:
    - title: Decision Threshold Calibration for Clinical Recall
      question: At the default 0.50 probability threshold, the classifier flags 30 out of 50 stroke cases (60%
        recall). Calibrating the decision threshold down to <b>0.22</b> enables the model to detect <b>46 out
        of 50 stroke cases</b>. What is the new clinical Recall in <b>percent</b>?
      answer: 92
      tolerance: 0.5
      hint: Compute (46 / 50) × 100%.
      explanation: (46 / 50) × 100% = 92.0% Recall. Lowering the threshold prioritizes catching life-threatening
        stroke events at the expense of a minor increase in false alerts.
    - title: SHAP Additive Log-Odds Attribution Sum
      question: "A stroke risk model has baseline log-odds <b>φ_0 = −2.80</b>. For an admitted patient, SHAP local
        attributions are: Age: <b>+0.95</b>, Glucose: <b>+0.65</b>, Hypertension: <b>+0.40</b>, BMI:
        <b>−0.20</b>. According to the SHAP efficiency property <code>f(x) = φ_0 + Σ φ_i</code>, what is the
        final model log-odds output?"
      answer: -1
      tolerance: 0.05
      hint: Add −2.80 + 0.95 + 0.65 + 0.40 − 0.20.
      explanation: −2.80 + (0.95 + 0.65 + 0.40 − 0.20) = −2.80 + 1.80 = −1.00. The doctor can clearly see how each
        biomarker pushed the risk score upward.
    - title: Hospital Stroke Bed Triage Allocation
      question: A regional hospital has <b>24 high-dependency beds</b>. An alert threshold is chosen so that <b>120
        suspected stroke patients</b> are flagged each month with a <b>20% Positive Predictive Value
        (Precision)</b>. Exactly how many true stroke cases will be admitted?
      answer: 24
      tolerance: 0
      hint: Multiply 120 by 0.20.
      explanation: 120 × 0.20 = 24 confirmed stroke patients admitted, matching the hospital's high-dependency unit
        bed capacity.
notes:
  - heading: The end-to-end system
    body: |
      **The idea:** every earlier module was one part of a car. The capstone is building the whole car and driving it in a real hospital.

      The capstone joins every module into one service for a busy Ugandan Regional Referral Hospital:

      1. **Data:** the stroke data, prepared without leakage in an sklearn Pipeline (module 1).
      2. **Saved model:** the whole pipeline saved with joblib, with a version number and checksum (module 2).
      3. **API:** FastAPI + Pydantic `/predict`, with the model loaded once per worker (module 3).
      4. **Machines:** ordinary CPU machines in a nearby region, with cheap Spot machines only for retraining (module 4).
      5. **Container:** a small, multi-stage Docker image running as a non-root user (module 5).
      6. **Releases:** canary releases with automatic rollback (module 6).
      7. **Speed:** ONNX / INT8 if predictions need to be faster (module 7).
      8. **Monitoring:** PSI drift checks, and evaluation when the real outcomes arrive (module 8).

      What the capstone adds: choosing the **decision threshold** for clinical use, and **explaining** each prediction to the doctor.
  - heading: The threshold is a clinical decision
    body: |
      **The idea:** a metal detector at an airport is set to be very sensitive. It beeps for belt buckles too, because missing a weapon is far worse than an extra check. A stroke model should be set the same way.

      A classifier gives a probability; the **threshold** turns it into an action (refer the patient to the chronic care clinic, or not). The default of 0.5 is arbitrary, and terrible when only about 5% of patients have strokes, because most stroke patients get predicted probabilities well below 0.5.

      Lowering the threshold catches more stroke patients (higher **recall**) but also flags more healthy ones (lower **precision**):

      | Threshold | Recall | Strokes missed per 1,000 patients | Referrals per month |
      |---|---|---|---|
      | 0.50 | ~65% | ~18 | ~64 |
      | 0.22 | ~88% | ~6 | ~187 |
      | 0.15 | ~92% | ~4 | ~264 |

      The right threshold balances the cost of a missed stroke against the clinic's **capacity** to see everyone referred. Choose it using the **validation** set (never the test set), write down why, and revisit it when the share of stroke patients or the clinic's capacity changes. Under the Ministry of Health guidelines (June 2025), high-risk patients at triage are enrolled in the chronic care clinic, so the threshold directly sets the clinic's workload.
  - heading: Why black boxes are not acceptable
    body: |
      **The idea:** you wouldn't trust a doctor who said "take this medicine" and refused to say why. Doctors feel the same about a model.

      "This patient's stroke risk is 42%" isn't enough for a referral doctor. They need to know **why**, so they can:

      - check the model against their own judgement;
      - catch data errors (an age typed as 670 instead of 67);
      - explain the decision to the patient;
      - decide what to treat.

      Explanations also support **accountability** and **fairness**: you can check whether the model relies on features it shouldn't, and justify decisions to patients and regulators. In hospitals, an unexplained score is often simply ignored.
  - heading: SHAP — local, additive explanations
    body: |
      **The idea:** after a team wins a match, how much of the win was each player's doing? SHAP answers the same question for a prediction: how much did each of the patient's details contribute?

      **SHAP** (SHapley Additive exPlanations) gives each feature a share of *this* prediction, using Shapley values from cooperative game theory (the maths of sharing a reward fairly among players). The shares are **additive**: they add up exactly.

      **prediction = base value + the sum of all the feature contributions**

      The **base value** is the model's average prediction (about the hospital's base rate). For one patient: "base risk 5% → this patient 42%: +18 points from age 68, +12 from high blood pressure, +7 from glucose of 220 mg/dL". Check: 5 + 18 + 12 + 7 = 42.

      Key points for exams:

      - **Local:** it explains one patient's prediction. Averaging the size of each feature's SHAP values across many patients gives *global* importance (which features matter most overall).
      - **Additive and consistent:** the contributions add up exactly to the prediction, in the model's own output units (for logistic regression and XGBoost that's log-odds, which are then turned into a probability).
      - **TreeSHAP** computes exact values quickly for tree models like XGBoost.
      - SHAP explains the **model**, not what causes strokes. "+12 from high blood pressure" means the model's prediction went up by 12 points because of it, not that high blood pressure causes exactly 12 points of risk for this person.
examples:
  - title: Choosing a threshold under capacity
    problem: The clinic can take at most 200 new referrals a month from ~1,000 screened patients (5% prevalence).
      Using the table, which threshold would you pick and what do you trade off?
    steps:
      - 0.50 → 64 referrals, but ~18 strokes missed per month.
      - 0.22 → 187 referrals (within 200), recall ~88%, ~6 missed.
      - 0.15 → 264 referrals — over capacity.
      - "Choose **≈0.22**: the lowest threshold that fits capacity, maximising strokes caught."
    answer: About 0.22.
    takeaway: The threshold is set by clinical costs and capacity, not by the model.
  - title: Reading a SHAP explanation
    problem: "Base value (log-odds) = −2.95 (≈5%). A patient's contributions: age +0.94, glucose +1.54, BMI +0.32,
      hypertension +0.85, heart disease +0.65. What is the predicted probability, and which feature matters
      most?"
    steps:
      - Sum = −2.95 + 0.94 + 1.54 + 0.32 + 0.85 + 0.65 = **1.35** (log-odds).
      - Probability = 1 / (1 + e^−1.35) ≈ **0.79** (79%).
      - "Largest contribution: glucose (+1.54), then age and hypertension."
    answer: About 79%, driven most by high glucose.
    takeaway: Additivity lets a physician see exactly how each factor moved the risk from the base rate.
