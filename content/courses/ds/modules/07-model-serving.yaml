id: model-serving
title: "From Model to Data Product: FastAPI & Docker"
subtitle: Turning a trained model into a reliable web service other programs can use (Lab 9 Part 2 / Lab 10)
recap: |
  A model becomes a useful product when other programs can send it a request over the web (an HTTP API) and get a
  prediction back. Save the model together with notes about it (its version, which input columns it expects, how
  well it scored). Load it once when the service starts, not for every request. Check every incoming request
  against strict rules with Pydantic, which rejects bad input with an HTTP 422 error. Use the exact same feature
  code for training and for serving, or predictions go quietly wrong (training-serving skew). Package it all,
  with fixed library versions, in a Docker container.
traps:
  - "Loading model.joblib inside the /predict function, so the model is re-read from disk for every single request."
  - "Re-writing the feature calculations inside the API. Any small difference makes predictions quietly wrong
    (training-serving skew)."
  - "Not fixing (pinning) library versions, so the container runs different code from the one used in training."
lesson:
  checkpointStep: 3
  steps:
    - "A trained scikit-learn model sitting in a Jupyter notebook isn't a product. Other programs need a reliable web
      address (an HTTP API) that accepts a request in JSON format, checks it, and returns a prediction in
      milliseconds."
    - "In Lab 9 Part 2 (Assignment 04), we saved our RandomForestRegressor model to models/model.joblib, alongside
      models/model_metadata.json, which records the model_version, the feature_columns it expects, and its training
      scores."
    - "Our FastAPI service loads the model once when it starts, NOT inside POST /predict. Reading a 50 MB model from
      disk for every request turns a 2 ms prediction into a 300 ms wait."
    - "Checkpoint: what is training-serving skew, how did we see it in Step 8 of our lab, and what design prevents it
      for good?"
    - "Training-serving skew happens when the features are calculated differently in the live service than in
      training. In Step 8, changing is_rainy from rainfall_mm > 5.0 to > 10.0, for rainfall_mm = 8.2, quietly moved
      the beans prediction from 2,927.25 to 2,889.58 UGX, with no error at all!"
    - "We prevent skew by putting make_features() and FEATURE_COLUMNS in one shared file (src/common/features.py)
      that both src/ml/train.py and src/api/main.py import, by checking inputs strictly with Pydantic, and by packaging
      the exact software setup in Docker."
checkpoint:
  question: What is training-serving skew in ML systems? Explain how a subtle threshold mismatch causes silent
    prediction errors, and how shared feature modules, Pydantic schemas, and Docker work together to make a
    model service reproducible.
  hint: "Think about the shared file src/common/features.py (make_features). Why is a wrong answer with no error worse
    than an HTTP 422 or 500 error? And why load model.joblib once at startup, inside a Docker container with fixed
    library versions?"
  keywords:
    - training-serving skew
    - skew
    - feature
    - shared
    - make_features
    - silent
    - pydantic
    - validation
    - "422"
    - startup
    - docker
    - container
    - pinned
    - reproducible
  idealAnswer: "Training-serving skew is when the feature calculations used for live predictions differ from those used
    when the model was trained. The model still receives a list of numbers of the right size, so there's no HTTP or
    program error: it just silently gives wrong predictions (as when the is_rainy threshold changed from 5.0 mm to
    10.0 mm in our lab). We prevent it by defining make_features() and FEATURE_COLUMNS in one shared module
    (src/common/features.py) imported by both train.py and main.py; checking incoming requests with Pydantic
    validation, which returns HTTP 422 for bad input; loading model.joblib once at startup; and fixing (pinning)
    the operating system and Python library versions in a Docker container, so the service is reproducible."
terms:
  - term: API (HTTP endpoint)
    definition: A web address other programs can send requests to, e.g. POST /predict, and get answers from.
  - term: JSON
    definition: "A common text format for sending data, like {\"market\": \"Owino\", \"rainfall_mm\": 8.2}."
  - term: Training-serving skew
    definition: When features are calculated (or data looks) differently in the live service than during training.
  - term: Pydantic schema validation
    definition: Rules written in code (types, allowed values, ranges like Field(ge=0, le=500)) that reject bad requests
      with HTTP 422.
  - term: HTTP 422
    definition: The error code meaning "your request was understood but its contents are invalid".
  - term: Startup model loading
    definition: Reading model.joblib into memory once, when the service starts, instead of on every request.
  - term: Model metadata
    definition: "A file (model_metadata.json) recording the model_version, training date, feature_columns and test scores
      (e.g. r2)."
  - term: Docker container
    definition: A sealed package containing the code, the model, and exact versions of Python and every library, so it
      runs the same everywhere.
  - term: Docker layer caching
    definition: Docker reuses steps that haven't changed. Installing requirements before copying the code means a code
      change rebuilds in seconds.
quiz:
  - question: In a Dockerfile, why should `COPY requirements.txt .` and `RUN pip install -r requirements.txt` come
      BEFORE `COPY src/ ./src/`?
    options:
      - Docker requires alphabetical order
      - So editing Python code in src/ reuses the cached pip install layer instead of reinstalling packages
        every build
      - It makes the model more accurate
      - FastAPI won't start otherwise
    answer: 1
    explanation: Docker caches layers top-down; placing rarely-changing `requirements.txt` before
      frequently-edited `src/` saves minutes on every rebuild.
  - question: Loading `model.joblib` from disk takes 180 ms and `model.predict()` takes 4 ms. For 100 sequential
      requests, how much total time is saved by loading the model ONCE at startup instead of on every request?
    options:
      - 1.78 seconds
      - 17.82 seconds
      - 18.00 seconds
      - 0.40 seconds
    answer: 1
    explanation: "Per-request load: 100 × (180 + 4) = 18,400 ms. Startup load once: 180 + 100 × 4 = 580 ms. Saved
      = 18,400 − 580 = 17,820 ms = 17.82 seconds!"
  - question: Where should make_features() live?
    options:
      - Copied into both train.py and the API
      - In one shared module imported by both
      - Only in the notebook
      - In the Dockerfile
    answer: 1
    explanation: If training and serving import the same function, they can never calculate features differently.
  - question: An API receives rainfall_mm = -4. With a Pydantic Field(ge=0), what happens?
    options:
      - The model predicts anyway
      - HTTP 500
      - HTTP 422 with the field error
      - The value is set to 0
    answer: 2
    explanation: Pydantic rejects it before it reaches the model, with an HTTP 422 error saying exactly which field is wrong.
  - question: Why store model_version in model_metadata.json and return it from the API?
    options:
      - It's required by joblib
      - So every prediction can be traced to the model that made it
      - To make the file smaller
      - For Docker caching
    answer: 1
    explanation: Then every prediction can be traced to the exact model that made it, which you need for fixing problems and for audits.
  - question: Training-serving skew usually shows up as…
    options:
      - A stack trace
      - HTTP 500 errors
      - Valid responses with silently wrong predictions
      - Slow startup
    answer: 2
    explanation: "The service keeps answering normally with wrong numbers. That is what makes it dangerous: nothing looks broken."
  - question: Which Dockerfile order keeps rebuilds fast?
    options:
      - COPY . then pip install
      - pip install then COPY requirements
      - COPY requirements.txt → pip install → COPY code
      - It makes no difference
    answer: 2
    explanation: Libraries change rarely, so Docker can reuse that installed step; only the quick code-copy step reruns.
  - question: Why pin scikit-learn in requirements.txt?
    options:
      - It's faster
      - A model saved with one version may not load or behave the same in another
      - Docker requires it
      - To reduce image size
    answer: 1
    explanation: A saved model can fail to load, or behave differently, with a different scikit-learn version.
fact:
  title: Hidden Technical Debt in Machine Learning Systems
  body: Google's famous NeurIPS paper ('Hidden Technical Debt in ML Systems', Sculley et al.) showed that the ML
    model code itself is often less than 5% of a production ML system — the other 95% is data verification,
    feature extraction, serving infrastructure, and monitoring.
lab:
  title: FastAPI Model Serving & Training-Serving Skew Lab
  variations:
    - title: Startup Model Load vs Per-Request Load Latency
      question: Loading `model.joblib` from disk takes <b>150 ms</b> and `model.predict()` takes <b>5 ms</b>. For
        <b>200</b> requests, how many <b>seconds</b> are saved by loading the model once at FastAPI startup
        instead of inside `/predict`?
      answer: 29.85
      tolerance: 0.05
      hint: Per-request load = 200 × 155 ms = 31,000 ms. Startup load = 150 + 200 × 5 = 1,150 ms. Subtract and
        convert to seconds.
      explanation: "Per-request: 200 × (150 + 5) = 31,000 ms. Startup once: 150 + 200 × 5 = 1,150 ms. Saved = 29,850
        ms = 29.85 seconds."
    - title: Training-Serving Skew Prediction Drift (Step 8)
      question: In Lab 9 Part 2 Step 8, for `Ownio · Beans · rainfall_mm = 8.2`, the true model (`is_rainy =
        rainfall > 5.0`) predicts <b>2,927.25 UGX</b>, while the skewed API (`rainfall > 10.0`) predicts
        <b>2,889.58 UGX</b>. What is the absolute prediction error (in UGX, to 2 decimals) caused purely by
        training-serving skew?
      answer: 37.67
      tolerance: 0.02
      hint: Compute 2927.25 − 2889.58.
      explanation: 2,927.25 − 2,889.58 = 37.67 UGX of silent error with HTTP 200 OK.
    - title: One-Hot Feature Vector Dimensionality
      question: Our shared `make_features()` extracts <b>3 numeric features</b> (`rainfall_mm`, `is_rainy`, `month`,
        `day_of_week` = <b>4</b> numeric features total) plus one-hot encodings for <b>4 markets</b> and <b>4
        commodities</b> (without dropping first). How many total columns are in `FEATURE_COLUMNS`?
      answer: 12
      tolerance: 0
      hint: Add 4 numeric/temporal features + 4 market indicators + 4 commodity indicators.
      explanation: 4 numeric/calendar features (`rainfall_mm`, `is_rainy`, `month`, `day_of_week`) + 4 market
        columns + 4 commodity columns = 12 features.
notes:
  - heading: What makes a model a data product
    body: |
      **The idea:** a recipe in your notebook only feeds you. A restaurant feeds anyone who orders, the same way every day. A data product is the restaurant.

      A model in a notebook answers questions only for the person running it. A **data product** answers other programs, reliably: a web address (an **HTTP endpoint**) that accepts a request in **JSON** (a common text format for data), checks it, returns a prediction in milliseconds, records what happened, and behaves the same tomorrow as today.

      The pieces from Lab 9 Part 2 / Assignment 04:

      - `models/model.joblib`: the saved model.
      - `models/model_metadata.json`: notes about it: `model_version`, `feature_columns`, training date, scores. The API reports the version, so every prediction can be traced back to the exact model.
      - `src/common/features.py`: the *one* place features are calculated.
      - `src/api/main.py`: the FastAPI app, with a Pydantic request schema and a `/predict` endpoint.
      - A `Dockerfile` with fixed (pinned) library versions in `requirements.txt`, so the software is identical everywhere.
  - heading: Load once, at startup
    body: |
      **The idea:** a shop opens its doors once in the morning, not once per customer.

      Reading a model from disk takes time: tens to hundreds of milliseconds for a medium-sized model. Making one prediction takes a few milliseconds. If `/predict` calls `joblib.load()` every time, almost all of each request is spent re-reading the same file.

      Load it **once** when the app starts (when the module is imported, or in FastAPI's `lifespan`) and keep it in memory:

      ```python
      @asynccontextmanager
      async def lifespan(app):
          app.state.model = joblib.load("models/model.joblib")   # runs once, at startup
          yield
      ```

      **Tiny example:** loading takes 150 ms, a prediction takes 5 ms, and 200 requests come in.

      - Loading every time: 200 × (150 + 5) = **31,000 ms = 31 s**.
      - Loading once: 150 + 200 × 5 = **1,150 ms ≈ 1.15 s**.
  - heading: Training-serving skew
    body: |
      **The idea:** if you learn to drive in kilometres per hour and someone switches the speedometer to miles per hour without telling you, nothing breaks, but you drive at the wrong speed.

      **Training-serving skew** is when the features the model sees in the live service are calculated differently from the ones it learned from. Nothing crashes: the API returns HTTP 200 (success) with a perfectly normal-looking number. But the number is wrong.

      In Lab 9.2 Step 8, training defined `is_rainy = rainfall_mm > 5.0`, but a copy of that logic inside the API used `> 10.0`. For `rainfall_mm = 8.2`, training says "rainy" and the API says "not rainy", and the beans prediction silently moves from **2,927.25 to 2,889.58 UGX**.

      **The fix is a design, not "be more careful":** put `make_features()` and `FEATURE_COLUMNS` in **one shared module** that both `train.py` and the API import. Save the feature list in the model's metadata, and check at startup that the request schema produces exactly those columns, in that order.
  - heading: Validation with Pydantic and packaging with Docker
    body: |
      **The idea:** a bouncer checks IDs at the door, so problems never get inside. Pydantic is the bouncer; Docker is the sealed container the whole service ships in.

      A **Pydantic** model turns the API's input rules into code:

      ```python
      class PriceRequest(BaseModel):
          market: Literal["Owino", "Nakasero", "Kalerwe", "Gulu"]     # only these markets allowed
          commodity: Literal["Beans", "Maize", "Matooke", "Rice"]
          rainfall_mm: float = Field(ge=0, le=500)                     # between 0 and 500
          date: datetime.date
      ```

      A bad request (negative rainfall, an unknown market, a missing field) gets an automatic **HTTP 422** error saying exactly which field is wrong, before any model code runs.

      **Docker** then freezes everything else: the Python version, the exact library versions (`scikit-learn==1.5.2`, not "whatever pip installs today"; a saved model can stop working with a different version), the code and the model file.

      **Build speed tip:** in the Dockerfile, copy `requirements.txt` and run `pip install` *before* copying the code. Docker reuses (caches) steps that haven't changed, so editing your code doesn't re-install every library, and a rebuild takes seconds.
examples:
  - title: Is my API skewed?
    problem: Training used is_rainy = rainfall_mm > 5.0; the API uses > 10.0. Requests arrive with rainfall 2.0,
      7.5, 9.9 and 14.0 mm. Which get a wrong prediction?
    steps:
      - "2.0 mm: training 0, API 0 → agree."
      - "7.5 mm: training 1, API 0 → **skewed**."
      - "9.9 mm: training 1, API 0 → **skewed**."
      - "14.0 mm: training 1, API 1 → agree."
    answer: The 7.5 mm and 9.9 mm requests.
    takeaway: Skew hides in a band of inputs — tests that only use typical values miss it.
  - title: Startup loading pays for itself
    problem: Model load = 220 ms, predict = 6 ms. How many seconds does loading at startup save over 500 requests,
      and what's the speed-up?
    steps:
      - "Per-request loading: 500 × (220 + 6) = 113,000 ms = **113 s**."
      - "Startup loading: 220 + 500 × 6 = 3,220 ms = **3.22 s**."
      - Saved = 109.78 s; speed-up ≈ 113 / 3.22 ≈ **35×**.
    answer: About 109.8 s saved, ~35× faster.
    takeaway: The more requests you serve, the more per-request loading costs.
