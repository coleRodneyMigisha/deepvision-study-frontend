id: drift-psi
title: Observability, Covariate Drift & Population Stability Index (PSI)
subtitle: Noticing when real-world data stops looking like the training data, before the model lets patients down
recap: |
  ML models fail silently: the service keeps answering normally (HTTP 200), but the answers get worse. Data drift
  means the kind of inputs changes (P(X), e.g. older patients); concept drift means what the inputs mean for the
  outcome changes (P(Y|X), e.g. a new treatment lowers stroke risk). PSI (Population Stability Index) splits a
  feature into bins and adds up (A − E)·ln(A/E) over the bins, comparing the share of live data (A) with the share
  of training data (E) in each. Below 0.1: stable; 0.1–0.25: keep an eye on it; 0.25 or more: retrain and
  recalibrate. Watch inputs and outputs all the time, not just whether the service is up.
traps:
  - "Using log base 10 in PSI. It uses the natural log (ln)."
  - "Treating a PSI of 0.18 as \"retrain now\". That's the keep-an-eye-on-it band (0.1–0.25)."
  - "Mixing up data drift (the inputs change) with concept drift (what the inputs mean changes)."
lesson:
  checkpointStep: 3
  steps:
    - "Normal software fails loudly, with error messages and crash logs. ML models fail silently: the API keeps
      answering HTTP 200 with tidy JSON, but the predictions quietly stop matching the real world."
    - "We separate data drift (also called covariate shift: the kind of inputs changes over time, P(X)) from concept
      drift (the link between the inputs and the outcome changes, P(Y given X))."
    - "For example, if our Uganda hospital opens a children's or elderly ward, the patients' ages and BMIs become very
      different from the training patients."
    - "Checkpoint: how does the Population Stability Index (PSI) measure data drift, and what threshold should trigger
      automatic retraining?"
    - "PSI splits a number column into bins using the training data (usually 10 bins with 10% of patients each), then
      compares the training share E with the live share A in each bin: add up (A minus E) times ln(A over E)."
    - "A PSI below 0.1 means stable. Between 0.1 and 0.25 means a moderate change worth watching. 0.25 or more means a
      big change that should trigger automatic retraining and recalibration."
checkpoint:
  question: Define Data Drift versus Concept Drift with clinical examples, and explain how the Population
    Stability Index (PSI) is calculated and interpreted.
  hint: "Data drift: the kind of patients changes, P(X). Concept drift: what the same patient details mean for stroke
    risk changes, P(Y|X). Then give the PSI formula, the sum of (Actual − Expected) × ln(Actual / Expected), and its
    thresholds (below 0.1, 0.1–0.25, 0.25 and above)."
  keywords:
    - data drift
    - concept drift
    - psi
    - population stability index
    - actual
    - expected
    - threshold
    - retraining
    - covariate shift
  idealAnswer: "Data Drift (covariate shift) occurs when the input feature distribution $P(X)$ changes over time
    while the true relationship remains the same—e.g., if hospital outreach causes the proportion of elderly
    patients (age > 65) to double from training baseline. Concept Drift occurs when the underlying statistical
    relationship between features and target $P(Y|X)$ changes—e.g., if a new preventative hypertension
    medication decouples high blood pressure from subsequent stroke incidence. The Population Stability Index
    (PSI) quantifies covariate shift by partitioning features into reference bins (quantiles) and calculating:
    $\\text{PSI} = \\sum_{i=1}^k (A_i - E_i) \\times \\ln(A_i / E_i)$, where $E_i$ is expected baseline
    frequency and $A_i$ is actual production frequency. Standard industry interpretation: PSI < 0.1 means no
    significant change; 0.1 ≤ PSI < 0.25 indicates moderate drift; and PSI ≥ 0.25 indicates severe drift,
    automatically alerting engineering and triggering retraining pipelines."
terms:
  - term: Observability / monitoring
    definition: Continuously measuring how a live system behaves, including its inputs and predictions, not just
      whether it's running.
  - term: Data drift (covariate shift)
    definition: The live inputs start to look different from the training inputs, P(X) changes (e.g. older patients).
  - term: Concept drift
    definition: The link between the inputs and the outcome changes, P(Y|X) (e.g. a new treatment changes who has
      strokes).
  - term: Ground-truth labels
    definition: The real outcomes (did the patient actually have a stroke?), which often arrive weeks later.
  - term: Population Stability Index (PSI)
    definition: A number measuring how much a feature's live distribution has shifted from its training
      distribution. 0 means no change; 0.25 or more means a big change.
  - term: Bins / quantiles
    definition: Ranges a number column is split into. Quantile bins are chosen so each holds the same share of the
      training data.
  - term: Kolmogorov–Smirnov (KS) test
    definition: A statistical test that compares two sets of numbers to check whether they come from the same
      distribution.
  - term: Automated retraining trigger
    definition: A scheduled check (e.g. in Airflow) that starts retraining automatically when drift or performance
      limits are broken.
quiz:
  - question: In a production monitoring dashboard, the PSI for patient glucose distribution over the last 30 days
      is measured at 0.32. What action should be taken?
    options:
      - Do nothing because 0.32 is negligible
      - PSI >= 0.25 indicates significant drift; alert the team, inspect demographic shifts, and trigger model
        retraining
      - Delete the model file
      - Scale up container replicas
    answer: 1
    explanation: A PSI of 0.25 or more means the live data has shifted a lot from the training data. Find out why, and
      retrain.
  - question: During COVID-19, patient symptoms and travel patterns changed radically, altering how ML models
      predicted respiratory risk. What type of drift is this?
    options:
      - Concept drift and covariate data drift simultaneously
      - Hardware drift
      - RAM drift
      - Compiler drift
    answer: 0
    explanation: A big sudden change can alter both the kind of patients arriving (data drift) and how the disease
      behaves (concept drift).
  - question: Data drift (covariate shift) is a change in…
    options:
      - P(Y | X)
      - P(X)
      - The model weights
      - The API latency
    answer: 1
    explanation: The inputs start to look different from the training data, while their meaning may stay the same.
  - question: What does PSI = 0.18 suggest?
    options:
      - Stable
      - Moderate drift — investigate and monitor
      - Retrain immediately
      - The PSI is invalid
    answer: 1
    explanation: "0.10–0.25 is the \"keep an eye on it\" band: investigate, but no automatic retraining yet."
  - question: Which log is used in PSI?
    options:
      - Base 10
      - Base 2
      - Natural log
      - No log
    answer: 2
    explanation: "The natural log (ln): PSI = Σ (A − E) × ln(A / E)."
  - question: Why do ML models 'fail silently'?
    options:
      - They log nothing
      - They keep returning valid responses while accuracy degrades
      - They crash quietly
      - They stop accepting requests
    answer: 1
    explanation: The service still answers quickly and without errors, so nothing looks broken, even when the predictions are wrong.
  - question: Detecting concept drift requires…
    options:
      - Only input features
      - Ground-truth labels (often delayed)
      - The Docker image
      - A GPU
    answer: 1
    explanation: The real outcomes (labels). You can only see that the link between inputs and outcomes changed once you know the outcomes.
  - question: E = 0.10, A = 0.10 in a bin. Its PSI contribution is…
    options:
      - "0"
      - "0.1"
      - "1"
      - Undefined
    answer: 0
    explanation: The share didn't change, so A − E = 0 and the term is 0.
fact:
  title: Evidently AI & Prometheus in Production
  body: Modern MLOps stacks export statistical drift metrics (PSI, Wasserstein distance, KS p-values) from
    Evidently AI directly into Prometheus and Grafana dashboards, firing automated Slack/PagerDuty alerts
    before degraded model predictions affect patients.
lab:
  title: Population Stability Index (PSI) & Covariate Drift Detector
  variations:
    - title: Population Stability Index (PSI) Bin Contribution
      question: "In baseline training data, age bin [60–70] contained <b>20%</b> of patients (E = 0.20). In recent
        production traffic, this bin jumped to <b>32%</b> (A = 0.32). What is the PSI contribution of this
        single bin: <code>(A − E) × ln(A / E)</code>? (3 decimals)"
      answer: 0.056
      tolerance: 0.004
      hint: Calculate (0.32 − 0.20) × ln(0.32 / 0.20) = 0.12 × ln(1.6).
      explanation: Δ = 0.12. ln(1.6) = 0.47000. PSI_bin = 0.12 × 0.47000 = 0.0564 ≈ 0.056. Summing across all bins
        yields the total feature PSI.
    - title: Critical Covariate Drift Feature Count
      question: "An MLOps drift monitor evaluates 8 clinical features. Their calculated PSI values are: <b>[0.04,
        0.08, 0.28, 0.06, 0.12, 0.03, 0.26, 0.05]</b>. Using the standard threshold where <code>PSI ≥
        0.25</code> indicates critical drift requiring automated retraining, how many features are in critical
        drift?"
      answer: 2
      tolerance: 0
      hint: Count how many values in the list are greater than or equal to 0.25.
      explanation: Features with PSI = 0.28 and 0.26 exceed the 0.25 threshold (2 features). This automatically
        alerts on-call ML engineers.
    - title: Concept Drift F1 Degradation Percentage
      question: At deployment, the stroke triage model achieved an <b>F1 score of 0.80</b>. Due to seasonal disease
        distribution changes over 9 months without retraining, F1 dropped to <b>0.68</b>. What is the
        percentage decrease in F1 score? (1 decimal)
      answer: 15
      tolerance: 0.2
      hint: Compute ((0.80 − 0.68) / 0.80) × 100%.
      explanation: (0.12 / 0.80) × 100% = 15.0% performance degradation, demonstrating why automated drift
        monitoring is essential.
notes:
  - heading: Models fail silently
    body: |
      **The idea:** a broken watch that has stopped is obvious. A watch that runs ten minutes slow looks perfectly fine, and that's the dangerous one. ML models fail like the slow watch.

      Ordinary software fails loudly: error messages, crash logs, 500 errors. ML models usually fail **silently**. The API keeps answering HTTP 200 with neat JSON, it's fast, the dashboards are green, and the predictions are steadily getting worse, because the world has changed since training.

      So ML monitoring has two layers:

      - **Service health:** is it up, how fast is it, how many errors? (The same as for any API.)
      - **Model health:** do the *inputs* still look like the training data? Do the *outputs* behave as expected? And when the real outcomes arrive later (did the patient have a stroke?), is accuracy holding up?
  - heading: Data drift vs concept drift
    body: |
      **The idea:** data drift is a new kind of customer walking into the shop. Concept drift is the same customers wanting different things than before.

      - **Data drift (covariate shift):** the inputs change, **P(X)**. The hospital opens an elderly ward and patient ages shift upwards. The link between the features and stroke may be the same, but the model is now seeing kinds of patients it rarely saw in training.
      - **Concept drift:** the relationship changes, **P(Y | X)**. A new treatment lowers stroke risk for people with high blood pressure, so the same patient details now mean something different.

      Data drift can be spotted straight away from the inputs alone. Concept drift needs the **real outcomes (ground-truth labels)**, which arrive later. Until then, watch stand-ins (the spread of predicted risk, the share of high-risk flags), and evaluate properly when the outcomes come in.
  - heading: Population Stability Index (PSI)
    body: |
      **The idea:** sort the training patients into age groups and note what share falls in each. Do the same for this week's patients. If the shares have moved a lot, the population has changed.

      PSI compares a feature's live distribution with its training (reference) distribution:

      1. Split the training data into bins, usually **10 quantile bins**, so each holds **E = 10%** of the training patients.
      2. Work out the share **A** of live patients that falls in each of those same bins.
      3. **PSI = Σ (A − E) · ln(A / E)**, added up over all bins, using the natural log (ln).

      Every term is zero or positive, and it grows when a bin gains or loses share, so PSI is 0 when the two distributions match.

      **Tiny example** with just 2 bins: training shares E = 0.5 and 0.5; live shares A = 0.7 and 0.3.

      - Bin 1: (0.7 − 0.5) × ln(0.7 / 0.5) = 0.2 × 0.336 = 0.067
      - Bin 2: (0.3 − 0.5) × ln(0.3 / 0.5) = −0.2 × −0.511 = 0.102
      - PSI = 0.067 + 0.102 = **0.17**: a moderate shift, so watch it.

      | PSI | Meaning | Action |
      |---|---|---|
      | below 0.10 | stable | none |
      | 0.10 – 0.25 | moderate shift | investigate, watch closely |
      | 0.25 or more | big shift | retrain and recalibrate |

      Practical details: use a tiny minimum share (e.g. 0.0001) so an empty bin doesn't give ln(0); and work out PSI per feature over a time window large enough to give stable numbers.
  - heading: From detection to retraining
    body: |
      **The idea:** a smoke detector is only useful if someone acts when it beeps. Monitoring needs a plan for what happens next.

      A monitoring plan for the stroke model:

      1. **Log** every request's inputs and prediction (with privacy protections).
      2. Every day, work out the **PSI for each feature** compared with the training data, plus the spread of predicted risk. The **KS test** is a common alternative for number columns.
      3. **Alert** people when PSI is in the 0.10–0.25 band. **Trigger retraining** at 0.25 or more, or when checks on newly labelled cases show recall dropping.
      4. Retrain on recent data, **check it again** (recall at the clinical threshold, calibration), and release it through a **canary**. Never send a retrained model straight to 100% of users automatically.

      PSI tells you *that* something changed, not *whether it matters*. A big shift in an unimportant feature may not hurt at all; a small shift in the most important one might. Combine drift numbers with how important each feature is, and, once the outcomes arrive, with real performance.
examples:
  - title: PSI for one bin
    problem: In the age bin 60–70, the training share is E = 0.10 and this month's share is A = 0.22. What does
      this bin contribute to PSI?
    steps:
      - A − E = 0.22 − 0.10 = **0.12**.
      - A / E = 2.2 → ln(2.2) ≈ **0.7885**.
      - Contribution = 0.12 × 0.7885 ≈ **0.0946**.
    answer: About 0.095.
    takeaway: One bin doubling its share already contributes almost the whole 'monitor' threshold.
  - title: A full PSI calculation
    problem: With 4 bins (E = 0.25 each), production shares are 0.20, 0.25, 0.25, 0.30. Compute PSI and decide.
    steps:
      - "Bin 1: (0.20 − 0.25) × ln(0.8) = −0.05 × −0.2231 = 0.0112."
      - "Bins 2 and 3: A = E → 0."
      - "Bin 4: (0.30 − 0.25) × ln(1.2) = 0.05 × 0.1823 = 0.0091."
      - PSI = 0.0112 + 0.0091 ≈ **0.020** → stable (< 0.10).
    answer: PSI ≈ 0.02 — no action.
    takeaway: Both losing and gaining share add positive amounts to PSI.
questions:
  - question: Distinguish data drift from concept drift with a hospital example of each.
    kind: short
    marks: 5
    keywords:
      - data drift
      - covariate shift
      - P(X)
      - geriatric wing
      - age distribution
      - concept drift
      - P(Y|X)
      - relationship
      - new treatment
      - labels
    idealAnswer: "Data drift is a change in the input distribution P(X): e.g. a new geriatric wing shifts patient
      ages upward. Concept drift is a change in the relationship P(Y|X): e.g. a new hypertension treatment
      lowers stroke risk for the same inputs. Data drift can be seen from inputs alone; concept drift needs
      ground-truth outcomes, which arrive later."
  - question: Explain how PSI is calculated and the thresholds used to act on it.
    kind: short
    marks: 6
    keywords:
      - reference
      - bins
      - quantiles
      - expected
      - actual
      - proportion
      - sum
      - (A - E) ln(A/E)
      - natural log
      - "0.1"
      - "0.25"
      - retrain
    idealAnswer: Split the training (reference) feature into bins, typically 10 quantiles so each has expected
      share E = 0.10; compute the actual share A of production data in each bin; PSI = Σ (A − E)·ln(A/E) using
      the natural log. PSI < 0.10 is stable, 0.10–0.25 is moderate drift to investigate and monitor, and ≥
      0.25 is significant drift that should trigger retraining and recalibration.
  - question: Design the monitoring and retraining system for the stroke model in production. Cover what is
      logged, which metrics are computed and how often, alert and retraining thresholds, how delayed labels
      are used, and how a retrained model reaches production safely.
    kind: long
    marks: 12
    keywords:
      - log features
      - predictions
      - privacy
      - daily
      - psi per feature
      - ks test
      - prediction distribution
      - "0.1"
      - "0.25"
      - alert
      - labels
      - recall
      - calibration
      - retrain
      - validate
      - model registry
      - canary
      - rollback
    idealAnswer: Log each request's features, prediction and model version (pseudonymised, access-controlled).
      Daily, compute PSI per feature against the training reference (or a KS test for continuous features),
      plus the distribution of predicted risk and the share of high-risk flags; also track latency and error
      rates. Alert when any important feature's PSI enters 0.10–0.25 and trigger the retraining pipeline at ≥
      0.25. As outcomes arrive (weeks later), join them to predictions to measure recall at the triage
      threshold, precision and calibration — a drop triggers retraining even without input drift (concept
      drift). Retrain on recent data, validate against the current model on a held-out recent set, register
      the new version, and release it via shadow and canary with automatic rollback, keeping the previous
      model as a fallback.
coding:
  - id: psi
    title: Population Stability Index
    language: python
    level: exam
    files:
      - stroke_sample.csv
    prompt: |
      Write `psi(expected, actual, bins=10)`:

      1. Bin edges are the **quantiles of `expected`** (deciles for bins=10), with the outer edges widened to
         ±infinity so every production value lands in a bin.
      2. E and A are the shares of `expected` and `actual` in each bin. Floor both at `1e-4` to avoid `ln(0)`.
      3. Return Σ (A − E) · ln(A / E).

      Then classify drift for the scenarios below with `drift_level(value)` → `"stable"` (< 0.1),
      `"monitor"` (0.1–0.25) or `"retrain"` (≥ 0.25).
    setup: |
      import numpy as np
      import pandas as pd
      train_age = pd.read_csv("stroke_sample.csv")["age"].to_numpy(dtype=float)
      rng = np.random.default_rng(1)
      same_ward = rng.choice(train_age, 500)
      geriatric_wing = rng.choice(train_age, 500) + 12
    starter: |
      import numpy as np

      def psi(expected, actual, bins=10):
          ...

      def drift_level(value):
          ...

      for name, prod in [("same ward", same_ward), ("geriatric wing", geriatric_wing)]:
          v = psi(train_age, prod)
          print(name, v, drift_level(v))
    solution: |
      import numpy as np

      def psi(expected, actual, bins=10):
          expected, actual = np.asarray(expected, float), np.asarray(actual, float)
          edges = np.quantile(expected, np.linspace(0, 1, bins + 1))
          edges[0], edges[-1] = -np.inf, np.inf
          e = np.histogram(expected, edges)[0] / len(expected)
          a = np.histogram(actual, edges)[0] / len(actual)
          e, a = np.maximum(e, 1e-4), np.maximum(a, 1e-4)
          return float(np.sum((a - e) * np.log(a / e)))

      def drift_level(value):
          return "stable" if value < 0.1 else "monitor" if value < 0.25 else "retrain"

      for name, prod in [("same ward", same_ward), ("geriatric wing", geriatric_wing)]:
          v = psi(train_age, prod)
          print(name, round(v, 3), drift_level(v))
    tests:
      - name: Identical distributions give ~0
        code: |
          assert abs(psi(train_age, train_age)) < 1e-9
      - name: A resample of the same population is stable
        code: |
          v = psi(train_age, same_ward)
          assert v < 0.1, f"PSI {v:.3f} — resampling the same ward shouldn't look like drift"
      - name: The geriatric wing triggers retraining
        code: |
          v = psi(train_age, geriatric_wing)
          assert v >= 0.25, f"a +12 year shift should give PSI ≥ 0.25, got {v:.3f}"
      - name: Values beyond the training range are still counted
        code: |
          import numpy as np
          v = psi(train_age, np.full(100, 150.0))
          assert v > 1, "production ages above every training age must land in the top bin"
      - name: drift_level thresholds
        code: |
          assert [drift_level(x) for x in (0.05, 0.1, 0.2, 0.25, 0.4)] == ["stable", "monitor", "monitor", "retrain", "retrain"]
    hints:
      - "`np.quantile(expected, np.linspace(0, 1, bins + 1))` gives the bin edges."
      - Set the first and last edge to ±np.inf, then use `np.histogram(values, edges)`.
