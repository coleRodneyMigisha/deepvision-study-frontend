      - litres
      - group by
      - centre_key
      - date_key
      - daily
      - capacity_litres
      - join
      - count
      - row level
      - zero
    idealAnswer: WITH daily AS (SELECT centre_key, date_key, SUM(litres) AS daily_litres FROM fact_delivery GROUP
      BY 1, 2) SELECT c.centre_name, COUNT(*) AS days_over_capacity FROM daily d JOIN dim_centre c USING
      (centre_key) WHERE d.daily_litres > c.capacity_litres GROUP BY 1. capacity_litres is a daily limit;
      comparing individual deliveries (max 46.8 L) to it always returns zero, so you must aggregate to the
      centre-day grain first.
  - question: For test_02, design the star schema (tables, grains, keys), then answer how you would (i) handle
      unregistered farmers, (ii) compute days over capacity, (iii) rank the top 3 farmers per centre, (iv)
      speed up April 2026 queries, and (v) handle a farmer who changes centre in July.
    kind: long
