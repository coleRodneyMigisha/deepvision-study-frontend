id: inference-optimization
title: "Inference Performance: ONNX, Pruning & INT8 Quantization"
subtitle: Making each prediction faster and the model smaller, so the service is quick and cheap to run
recap: |
  Inference means making predictions for real requests, and what matters is how long one prediction takes
  (latency). ONNX Runtime runs the model as fast compiled C++ code, without Python's overhead. INT8 quantisation
  stores each weight in 1 byte instead of 4, making the model 75% smaller, and modern processors can work on four
  times as many 8-bit numbers at once. Together with pruning (removing weights that barely matter), you get big
  speed-ups for a tiny loss of accuracy. But always measure the accuracy (AUC) again afterwards.
traps:
  - "Saying INT8 saves 25%. It saves 75%: 4 bytes → 1 byte is 4× smaller."
  - "Quantising without re-checking the clinical results (ROC-AUC, recall)."
  - "Speeding up training when the real problem is how long each live prediction takes."
lesson:
  checkpointStep: 3
  steps:
    - "Training is about getting through millions of examples in big batches over days. Serving is different: it's
      about answering one patient's prediction in under 15 milliseconds (low latency)."
    - "Python is flexible but slow at running each little step. Tools like ONNX (Open Neural Network Exchange) turn
      the model's calculations into a graph that a highly optimised C++ engine can run directly."
    - "Model weights are normally stored as 32-bit decimal numbers (FP32). Post-training quantisation converts them
      into 8-bit whole numbers (INT8)."
    - "Checkpoint: how does 8-bit quantisation make the model 4× smaller, and why does INT8 make the processor's
      calculations faster?"
    - "INT8 uses 1 byte per weight instead of FP32's 4 bytes, so the model shrinks by 75% straight away. And modern
      processors' SIMD instructions (AVX-512, VNNI), which do the same operation on many numbers at once, handle four
      times as many 8-bit numbers per step."
    - "Combined with pruning (removing near-zero weights or useless tree branches), quantisation gives big speed-ups
      with less than a 0.5% drop in clinical ROC-AUC."
checkpoint:
  question: Explain the mathematical principle of post-training quantization from FP32 to INT8. Why does it
    shrink memory by 4x, and what hardware acceleration does INT8 leverage?
  hint: "32 bits = 4 bytes, 8 bits = 1 byte. Think about how a range of decimal numbers is squeezed onto the whole
    numbers 0–255 (a scale and a zero point: q = round(r/S) + Z), how much data has to travel from memory, and what
    SIMD instructions do."
  keywords:
    - quantization
    - fp32
    - int8
    - memory
    - 4x
    - scale
    - zero point
    - simd
    - latency
    - bandwidth
  idealAnswer: "Post-training quantization maps 32-bit decimal numbers (FP32) onto 8-bit whole numbers (INT8) with a
    straight-line (affine) formula: $q = \\text{round}(r / S) + Z$, where $S$ is the scale (the step size) and $Z$ is
    the zero point (the integer that stands for 0.0). FP32 needs 4 bytes per weight and INT8 only 1, so the model's
    memory on disk and in RAM shrinks by exactly 4× (a 75% saving). In live serving, memory bandwidth (how fast data
    moves from RAM to the processor) is often the real bottleneck, so moving 4× fewer bytes makes predictions
    noticeably faster. On top of that, modern processors have SIMD instructions (Intel AVX-512 VNNI, ARM NEON) that do
    many INT8 multiply-and-add operations in a single step, often cutting latency by 2–4× with very little loss of
    accuracy."
terms:
  - term: Inference
    definition: Using a trained model to make predictions for new inputs.
  - term: Latency vs throughput
    definition: Latency is how long one prediction takes; throughput is how many predictions per second.
  - term: FP32
    definition: A 32-bit (4-byte) decimal number format, the normal default for training models.
  - term: INT8 quantisation
    definition: Storing weights as 8-bit (1-byte) whole numbers instead of 32-bit decimals, to save memory and speed up
      calculations.
  - term: Scale and zero point
    definition: "The two numbers that map decimals to integers: q = round(x / scale) + zero_point."
  - term: ONNX / ONNX Runtime
    definition: ONNX is a standard file format for a model's calculations; ONNX Runtime is a fast C++ engine that runs
      it.
  - term: Weight pruning
    definition: Removing weights, or whole neurons, trees or branches, that contribute almost nothing.
  - term: SIMD / VNNI
    definition: "Single Instruction, Multiple Data: processor instructions that do the same calculation on many numbers
      at once. VNNI is Intel's version built for neural-network maths."
quiz:
  - question: A deep learning ensemble model has a serialized file size of 240 MB in standard FP32. What will its
      approximate size be after INT8 quantization?
    options:
      - 120 MB
      - 60 MB
      - 24 MB
      - 480 MB
    answer: 1
    explanation: "INT8 uses 1 byte per weight compared to 4 bytes for FP32: 240 MB / 4 = 60 MB (a 75% reduction in size)."
  - question: What is the primary benefit of exporting a scikit-learn or PyTorch model to ONNX format?
    options:
      - It makes the model run in web browsers and optimized C++ runtimes independent of Python
      - It automatically gathers more training data
      - It eliminates the need for unit testing
      - It prevents model drift
    answer: 0
    explanation: ONNX is a standard file format that a fast C++ engine (ONNX Runtime) can run directly, without Python's
      overhead, and from many programming languages.
  - question: How many bytes does an INT8 weight use?
    options:
      - "1"
      - "2"
      - "4"
      - "8"
    answer: 0
    explanation: 8 bits make 1 byte, so an INT8 weight takes 1 byte.
  - question: FP32 → INT8 reduces weight memory by…
    options:
      - 25%
      - 50%
      - 75%
      - 90%
    answer: 2
    explanation: Going from 4 bytes to 1 byte per weight is 4× smaller, a 75% saving.
  - question: What does ONNX Runtime mainly remove from the inference hot path?
    options:
      - The model weights
      - Python interpreter overhead
      - The input validation
      - The GPU
    answer: 1
    explanation: Python's overhead. It runs the model as a ready-made graph with fast C++ code.
  - question: Why does INT8 run faster on modern CPUs?
    options:
      - It's more accurate
      - SIMD/VNNI instructions process 4× more 8-bit values per instruction and less memory is moved
      - It uses the GPU
      - It skips layers
    answer: 1
    explanation: There is less data to move from memory, and the processor can work on more 8-bit numbers in each step.
  - question: After quantising the stroke model, what must you do before deploying?
    options:
      - Nothing
      - Re-evaluate ROC-AUC and recall at the clinical threshold
      - Retrain from scratch
      - Delete the FP32 model
    answer: 1
    explanation: Re-check the clinical results (ROC-AUC, recall at the threshold). Optimisations can change the model's behaviour.
  - question: Why do outlier weights hurt INT8 accuracy?
    options:
      - They are deleted
      - They stretch the [min, max] range, making each quantisation step larger
      - They overflow to NaN
      - They don't
    answer: 1
    explanation: Outliers stretch the range, which makes the step size s bigger, and the rounding error (up to s/2) bigger for every weight.
fact:
  title: Inference is Memory-Bound, Not Compute-Bound
  body: For small-batch or single-instance model inference, modern CPUs spend over 70% of time waiting for
    weights to be fetched from DRAM into CPU cache. Shrinking weights with INT8 quantization directly cuts
    DRAM bus traffic by 4×, creating massive real-world speedups even on budget cloud VMs.
lab:
  title: ONNX & INT8 Quantization Speedup Simulator
  variations:
    - title: INT8 Model Weight Compression
      question: An FP32 deep neural network contains <b>24 million parameters</b> (4 bytes each = 96 MB). Quantized
        to INT8 (1 byte per parameter), what is the new weight size in <b>MB</b>?
      answer: 24
      tolerance: 0
      hint: Multiply 24 million parameters by 1 byte, or divide 96 MB by 4.
      explanation: 96 MB / 4 = 24 MB. INT8 quantization cuts memory footprint by 75% with typically < 0.5% drop in
        F1 score.
    - title: ONNX Runtime Graph Fusion Speedup Factor
      question: Baseline PyTorch Python runtime executes patient inference in <b>28.5 ms</b>. Exporting to ONNX
        Runtime with operator fusion and ConstantFolding drops latency to <b>9.5 ms</b>. What is the speedup
        factor (<code>Latency_base / Latency_onnx</code>)?
      answer: 3
      tolerance: 0.1
      hint: Divide 28.5 ms by 9.5 ms.
      explanation: 28.5 / 9.5 = 3.0× speedup. Graph fusion combines BatchNorm and Conv layers into a single fused
        kernel, eliminating memory bandwidth hops.
    - title: Quantized DRAM Bus Bandwidth Savings
      question: At batch size 1, an FP32 model reads <b>80 MB</b> of weights from RAM per inference. Quantized to
        INT8, it reads only <b>20 MB</b>. Across a batch of <b>50 sequential inferences</b>, how many total
        <b>MB</b> are transferred across the memory bus for the INT8 model?
      answer: 1000
      tolerance: 0
      hint: Multiply 20 MB by 50 requests.
      explanation: 20 MB × 50 = 1,000 MB (1.0 GB) compared to 4,000 MB for FP32, reducing memory controller
        saturation by 3 GB.
notes:
  - heading: Latency is a different goal from training throughput
    body: |
      **The idea:** a bus moves lots of people efficiently but slowly; a motorbike taxi gets one person there fast. Training is the bus (throughput); serving a patient is the motorbike (latency).

      Training is about **throughput**: get through millions of examples per hour in big batches; it's fine if one step takes a second. Serving a patient is about **latency**: one prediction, right now. Typically the model gets about 10–15 ms inside a request that should finish in about 100 ms overall.

      Where the time goes when making a prediction:

      - **Python overhead:** Python interpreting each small step and creating objects.
      - **Memory traffic:** moving the weights from RAM to the processor's fast caches. Often this is the real bottleneck.
      - **Arithmetic:** the multiplications and additions themselves.

      Each optimisation attacks one of these: compiled runtimes remove the Python overhead, smaller number formats cut the memory traffic, and SIMD instructions do more arithmetic per step.
  - heading: ONNX and ONNX Runtime
    body: |
      **The idea:** instead of a translator reading your recipe aloud step by step (Python), hand the kitchen a pre-printed, optimised instruction card (ONNX) that it can follow at full speed.

      **ONNX** (Open Neural Network Exchange) is a standard file format describing a model's calculations as a graph. You can export from scikit-learn (with `skl2onnx`), XGBoost, PyTorch or TensorFlow into one `.onnx` file.

      **ONNX Runtime** runs that graph with optimised C++ code: it merges steps together, plans memory in advance and uses the processor's special instructions, with no Python running in the busy inner loop. Typical result: the same model and the same outputs, but noticeably faster. Bonus: the `.onnx` file can be served from C#, Java or JavaScript, not just Python.

      ```python
      sess = onnxruntime.InferenceSession("stroke.onnx")                  # load once
      probs = sess.run(None, {"input": X.astype(np.float32)})[1]          # predict
      ```
  - heading: Quantisation — FP32 to INT8
    body: |
      **The idea:** instead of writing every price as 2,347.861529, round it to a whole number on a fixed scale. You lose a tiny bit of precision, and save a lot of space.

      Weights are normally 32-bit decimal numbers (**FP32**, 4 bytes each). **Quantisation** stores them with fewer bits:

      | Format | Bytes per weight | Size of a 100-million-weight model |
      |---|---|---|
      | FP32 | 4 | 400 MB |
      | FP16 / BF16 | 2 | 200 MB |
      | INT8 | 1 | 100 MB |

      INT8 is **4× smaller (a 75% saving)**. It's faster too: less data to move from memory, more of the model fits in the processor's cache, and the processor's vector units (AVX-512 **VNNI**) handle four times as many 8-bit numbers per instruction as 32-bit ones.

      **How the mapping works (affine quantisation):** squeeze the range [min, max] of the weights onto the integers 0–255.

      - Step size (scale): s = (max − min) / 255
      - The integer that stands for 0.0 (zero point): z = round(−min / s)
      - Store each weight as q = round(x / s) + z, and turn it back with x̂ = (q − z) · s

      **Tiny example:** weights from −1.0 to 1.55 give s = 2.55 / 255 = 0.01 and z = 100, so the weight 0.50 is stored as 50 + 100 = **150**.

      The rounding error is at most s / 2. A few extreme weights (outliers) stretch the range, which makes s bigger and every weight less precise; that's why outliers hurt accuracy.
  - heading: Pruning — and always re-validating
    body: |
      **The idea:** trim the branches of a tree that bear no fruit. The tree is lighter and works just as well, but check the harvest afterwards to be sure.

      **Pruning** removes weights (or whole neurons, trees or branches) that contribute very little, e.g. weights close to zero. The model can become smaller and faster, especially with *structured* pruning, which removes whole channels or layers that the runtime can then skip entirely.

      Every optimisation can change the model's behaviour, so the rule is: **run the full evaluation again on the optimised model** (ROC-AUC, recall at the clinical threshold, calibration) and compare it with the original.

      In the course example, INT8 + pruning cost less than 0.5% ROC-AUC: an excellent trade for a model that's 4× smaller and several times faster. But if recall at the triage threshold had dropped noticeably, you'd ship the original FP32 model instead.
examples:
  - title: Memory saved by INT8
    problem: A 64 M-parameter model is stored in FP32. How many MB does INT8 quantisation save?
    steps:
      - "FP32: 64 M × 4 bytes = **256 MB**."
      - "INT8: 64 M × 1 byte = **64 MB**."
      - Saved = 256 − 64 = **192 MB** (75%).
    answer: 192 MB.
    takeaway: INT8 always saves 75% of weight memory vs FP32.
  - title: Quantise one weight by hand
    problem: A tensor's values span [−1.0, 1.0]. Quantise x = 0.42 to INT8 with affine quantisation and compute
      the error.
    steps:
      - Scale s = (1.0 − (−1.0)) / 255 = 2/255 ≈ **0.007843**.
      - Zero-point z = round(1.0 / 0.007843) = round(127.5) = **128**.
      - q = round(0.42 / 0.007843) + 128 = round(53.55) + 128 = 54 + 128 = **182**.
      - x̂ = (182 − 128) × 0.007843 = 54 × 0.007843 ≈ **0.4235**; error ≈ 0.0035 (≤ s/2 ≈ 0.0039).
    answer: q = 182, recovered 0.4235, error ≈ 0.0035.
    takeaway: The error is bounded by half a step — a wider range means bigger steps.
