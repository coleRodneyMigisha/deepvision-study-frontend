id: cnns
title: Convolutional Neural Networks
subtitle: How a network learns to spot patterns in pictures with small sliding filters
recap: |
  A convolutional neural network (CNN) looks at a picture through many small filters, tiny grids of learned
  numbers that slide across the whole image looking for one pattern each (an edge, a stripe, an eye). Because
  each filter is small and reused everywhere, a CNN needs far fewer numbers than connecting every pixel to
  every neuron, and it finds a pattern wherever it appears. Pooling shrinks the result by keeping only the
  biggest value in each small window; it has nothing to learn. Two formulas to know: output size =
  floor((W − K + 2P) / S) + 1, and a layer's parameters = (K·K·C_in + 1)·C_out.
traps:
  - "Saying pooling has learnable weights. It has none: it just keeps the largest (or average) value."
  - "Mixing up equivariance (move the input and the output moves with it) and invariance (move the input and the
    output stays the same)."
  - "Forgetting the bias (+1 per filter) or the input channels when counting a layer's parameters:
    (K·K·C_in + 1)·C_out."
lesson:
  checkpointStep: 3
  steps:
    - "Why not connect every pixel to every neuron? A 224 × 224 colour picture has 150,528 numbers. Connecting
      them to just 1,000 neurons needs 150 million weights: slow, and the network memorises instead of learning."
    - "CNNs make two sensible assumptions (inductive biases). Local connectivity: each neuron only looks at a small
      patch, because nearby pixels belong together. Parameter sharing: the same small filter slides over the
      whole picture, because an edge is an edge anywhere."
    - "Reusing the same filter everywhere gives translation equivariance: if the cat moves 10 pixels right, the
      filter's response (the feature map) moves 10 pixels right too. The detector works anywhere."
    - "Checkpoint: does max pooling have anything to learn? And what's the difference between equivariance and
      invariance?"
    - "Max pooling keeps the largest number in each small window, for example 2 × 2 windows, jumping 2 pixels.
      That halves the height and width, has nothing to learn, and makes the network care a little less about
      small shifts."
    - "Stack layers and the patterns build up: early layers find edges and colours, middle layers textures and
      shapes, deep layers parts of objects like eyes and wheels."
    - "Learn the output-size rule: output = floor((W − K + 2P) / S) + 1. For a 32-pixel input, 3 × 3 filter,
      1 ring of padding and step 1, you get 32: the size stays the same."
checkpoint:
  question: Does max pooling have any learnable parameters? And what is the difference between translation
    equivariance and translation invariance?
  hint: "Pooling follows a fixed rule (take the maximum). For the second part: does the output move WITH the
    input (equivariance), or stay the SAME (invariance)?"
  keywords:
    - zero
    - no parameters
    - fixed
    - maximum
    - equivariant
    - equivariance
    - invariant
    - invariance
    - shift
    - convolution
    - pooling
  idealAnswer: "Max pooling has zero learnable parameters: it's a fixed rule that outputs the largest value in
    each window, used to shrink the feature map and save computation. Convolution is translation equivariant:
    shift the input picture and the feature map shifts by the same amount. Pooling adds a little translation
    invariance: small shifts inside a window don't change the output. The trade-off is losing exact position
    information, which hurts tasks that need it pixel by pixel, like segmentation."
terms:
  - term: Convolution
    definition: Sliding a small grid of weights (a filter) over the picture; at each spot, multiply the overlapping
      numbers and add them up to get one output number.
  - term: Filter / kernel
    definition: The small grid of learned weights, e.g. 3 × 3, that looks for one pattern.
  - term: Feature map
    definition: "The grid of results from one filter across the whole picture. It answers: where is this pattern?"
  - term: Receptive field
    definition: The part of the original picture that affects one output number. It grows as layers stack up.
  - term: Stride
    definition: How many pixels the filter jumps each step. Stride 2 roughly halves the output size.
  - term: Padding
    definition: Rings of zeros added around the picture's edge so the filter can be centred on edge pixels and the
      size can stay the same.
  - term: Channels (C_in, C_out)
    definition: How many grids are stacked at a layer's input (3 for a colour photo) and how many filters it has
      (one output grid each).
  - term: Parameters per conv layer
    definition: (K·K·C_in + 1)·C_out. Each of the C_out filters has K × K × C_in weights plus 1 bias.
  - term: Pooling
    definition: Shrinking a feature map by keeping the maximum (max pooling) or average of each small window. Nothing
      to learn.
  - term: Equivariance vs invariance
    definition: Equivariant means the output moves with the input; invariant means the output doesn't change when the
      input moves.
quiz:
  - question: "A conv layer has a 3×3 filter, 64 input channels and 128 output channels (filters), with a bias.
      How many learnable numbers (parameters)?"
    options:
      - 1,152
      - 73,856
      - 8,192
      - 589,824
    answer: 1
    explanation: Each filter has 3 × 3 × 64 = 576 weights + 1 bias = 577. With 128 filters, 577 × 128 = 73,856.
  - question: A 64×64 input, a 5×5 filter, no padding, stride 1. How wide is the output?
    options:
      - "64"
      - "62"
      - "60"
      - "59"
    answer: 2
    explanation: (64 − 5 + 0) / 1 + 1 = 60. Without padding, a 5-wide filter can't be centred on the outer 2 pixels
      on each side.
  - question: W = 128, K = 5, P = 2, S = 2. How wide is the output?
    options:
      - "62"
      - "63"
      - "64"
      - "128"
    answer: 2
    explanation: ⌊(128 − 5 + 4) / 2⌋ + 1 = ⌊127 / 2⌋ + 1 = 63 + 1 = 64. Stride 2 halves the size.
  - question: How many parameters in a 3×3 conv layer going from 16 to 32 channels (with bias)?
    options:
      - 4,608
      - 4,640
      - 9,248
      - "512"
    answer: 1
    explanation: (9 × 16 + 1) × 32 = 145 × 32 = 4,640.
  - question: How many learnable parameters does max pooling have?
    options:
      - One per window
      - One per channel
      - Zero
      - Same as a 2×2 conv
    answer: 2
    explanation: It just keeps the biggest number in each window. There's nothing to learn.
  - question: If you move the input picture, a convolution's output moves the same way. So convolution is translation-…
    options:
      - invariant
      - equivariant
      - independent
      - dependent on padding only
    answer: 1
    explanation: Equivariant means "moves with the input". Invariant would mean "doesn't change at all".
  - question: Two 3×3 conv layers stacked on top of each other see the same area of the picture as one…
    options:
      - 3×3
      - 5×5
      - 7×7
      - 9×9
    answer: 1
    explanation: "Each 3×3 layer widens the view by 2 pixels: 3 → 5."
  - question: Which part of a CNN's cost grows when you use bigger pictures?
    options:
      - Number of parameters
      - Number of multiply-adds (the calculations)
      - Number of filters
      - Filter size
    answer: 1
    explanation: The filters are reused everywhere, so the parameter count stays the same. But a bigger picture means
      more positions to slide over, so more calculations.
fact:
  title: "CNNs fought back: ConvNeXt"
  body: In 2022, Meta's ConvNeXt took a plain ResNet CNN and updated it with tricks from transformers (bigger
    7×7 filters, LayerNorm, GELU) and matched the Swin Transformer on ImageNet without any attention at all.
    ConvNeXt V2 (2023) added masked-autoencoder pre-training.
lab:
  title: Convolution arithmetic
  variations:
    - title: ResNet Stem Spatial Output
      question: "ResNet's first layer: input <b>224×224</b>, kernel <b>7×7</b>, padding <b>3</b>, stride <b>2</b>.
        What is the output spatial width?"
      answer: 112
      tolerance: 0
      hint: "Use the output-size rule: O = floor((W − K + 2P) / S) + 1, with W = 224, K = 7, P = 3, S = 2."
      explanation: ⌊(224 − 7 + 2·3) / 2⌋ + 1 = ⌊223/2⌋ + 1 = 111 + 1 = 112.
    - title: Conv Layer Parameter Count
      question: A <code>Conv2d</code> layer has <b>C_in = 32</b>, <b>C_out = 64</b>, kernel <b>3×3</b>, with bias
        enabled. How many total learnable parameters does it have?
      answer: 18496
      tolerance: 0
      hint: Each of the 64 filters has 3 × 3 × 32 weights plus 1 bias.
      explanation: Parameters = (3 · 3 · 32 + 1) × 64 = 289 × 64 = 18,496.
    - title: ConvNeXt 7×7 Depthwise-Style Output
      question: An input feature map (a grid of filter outputs) is <b>56×56</b>. We apply a <b>7×7</b> filter with
        padding <b>2</b> (2 rings of zeros around the edge) and stride <b>2</b> (jump 2 pixels each step). What is the
        output height?
      answer: 27
      tolerance: 0
      hint: Compute floor((56 − 7 + 4) / 2) + 1.
      explanation: ⌊(56 − 7 + 2·2) / 2⌋ + 1 = ⌊53 / 2⌋ + 1 = 26 + 1 = 27.
notes:
  - heading: Why not connect every pixel to every neuron?
    body: |
      The simplest neural network connects every input number to every neuron (a **fully connected** or **dense** layer). For pictures, that goes badly:

      - A 224 × 224 colour photo has **150,528** numbers. Connecting them to 1,000 neurons needs **150 million** weights. That's slow, uses lots of memory, and the network tends to memorise its training photos (overfitting).
      - It treats each pixel as unrelated to its neighbours, and it would have to learn "cat ear" separately for every possible position.

      A **convolutional neural network (CNN)** builds in two common-sense assumptions about pictures (these are called **inductive biases**):

      - **Local connectivity:** each neuron only looks at a small patch (its *receptive field*), because nearby pixels usually belong to the same thing.
      - **Parameter sharing:** the same small filter slides over the whole picture, because a useful pattern (an edge, an eye) is useful everywhere.
  - heading: What a convolution actually does
    body: |
      **The idea in one line:** slide a small grid of numbers over a bigger grid; at each spot, multiply the overlapping numbers and add them up.

      3Blue1Brown's video "But what is a convolution?" starts with plain lists, which makes it easy to see. Take the lists [1, 2, 3] and [4, 5, 6]. Flip the second one around, slide it along the first, and at each overlap multiply and add:

      | Overlap | Sum | Result |
      |---|---|---|
      | 1 with 4 | 1·4 | **4** |
      | 1, 2 with 5, 4 | 1·5 + 2·4 | **13** |
      | 1, 2, 3 with 6, 5, 4 | 1·6 + 2·5 + 3·4 | **28** |
      | 2, 3 with 6, 5 | 2·6 + 3·5 | **27** |
      | 3 with 6 | 3·6 | **18** |

      So [1, 2, 3] ∗ [4, 5, 6] = **[4, 13, 28, 27, 18]**. (His video shows it's the same arithmetic as multiplying polynomials.)

      **On a picture** it's the same thing in 2-D: a 3 × 3 filter slides over the image. If the filter's numbers are all 1/9, each output is the average of 9 pixels: a **blur**. If they're the Sobel numbers (−1, 0, +1 across), each output is "right side minus left side": an **edge detector**. 3Blue1Brown shows both.

      **The big difference in a CNN:** nobody chooses the filter's numbers. The network **learns** them from examples, and each layer has many filters, each learning its own pattern.

      (A small technicality: textbook convolution flips the filter first, as in the list example. Deep-learning libraries skip the flip, which strictly is called *cross-correlation*. Since the numbers are learned, it makes no difference.)
  - heading: Working out sizes and parameter counts
    body: |
      **How big is the output?** For an input W pixels wide, a filter K wide, P rings of padding (zeros around the edge) and a stride (step) of S:

      $$O = \left\lfloor \frac{W - K + 2P}{S} \right\rfloor + 1$$

      (⌊ ⌋ means round down.) Three cases to know:

      - **Same size:** K = 3, P = 1, S = 1 keeps the size (32 → 32).
      - **No padding** shrinks it by K − 1 (32 → 30 with K = 3), because the filter can't be centred on the edge pixels.
      - **Stride 2** roughly halves it (224 → 112 with K = 3, P = 1).

      **How many learnable numbers (parameters)?** Each of the C_out filters has K × K × C_in weights (it covers all input channels) plus one bias:

      $$\text{params} = (K \cdot K \cdot C_{in} + 1) \cdot C_{out}$$

      Example: a 3 × 3 layer from 64 to 128 channels has (9 × 64 + 1) × 128 = **73,856** parameters. That's the same whatever the picture size, because the filters are reused everywhere.

      **How much calculation?** O × O × K × K × C_in × C_out multiply-adds. This one *does* grow with picture size, which is why higher resolution makes a model slower.
  - heading: Equivariance, invariance and pooling
    body: |
      Two similar-sounding words that examiners love:

      - **Equivariance:** move the input and the output moves the same way. Convolution is translation-*equivariant*: if the cat moves 10 pixels right, the "cat ear" response in the feature map also moves 10 pixels right.
      - **Invariance:** move the input and the output **doesn't change**. The final "is this a cat?" score should be (roughly) *invariant*: a cat is a cat wherever it sits.

      **Max pooling** (e.g. 2 × 2 windows, stride 2) keeps the largest number in each window:

      ```
      [1 3 | 2 0]
      [4 2 | 1 5]   →   [4  5]
      [-----+----]       [7  6]
      [0 7 | 6 1]
      [2 1 | 3 2]
      ```

      It halves the height and width, has **zero learnable parameters**, and makes the network care a little less about tiny shifts. Stacking convolution and pooling, and finishing with **global average pooling** (average each whole feature map to one number), takes the network from "where is each pattern?" (equivariant) to "what is in the picture?" (invariant).
  - heading: Building up from edges to objects
    body: |
      Each layer looks at the previous layer's output, so it effectively sees a **larger area of the original picture**. This is its receptive field. Two stacked 3 × 3 layers see 5 × 5 pixels; three see 7 × 7, with fewer parameters than one 7 × 7 filter.

      So the patterns build up layer by layer:

      - **early layers:** edges, colours, simple textures;
      - **middle layers:** patterns, corners, shapes;
      - **deep layers:** object parts (eyes, wheels) and whole objects.

      That's why early layers can be reused for other tasks (module 4), and why looking at feature maps is a good way to debug. Modern CNNs like **ResNet** add **skip connections** (each block adds its result to its input) so very deep networks still train, and **batch normalisation** to keep the numbers a sensible size.
  - heading: Watch next
    body: |
      - **3Blue1Brown, "But what is a convolution?"**: the clearest picture of sliding, multiplying and adding, from lists of numbers to blurring and edge-detecting images. [Watch on YouTube](https://www.youtube.com/watch?v=KuXjwB4LzSA)
examples:
  - title: Convolve two short lists by hand
    problem: Compute [1, 2, 3] ∗ [4, 5, 6], the way 3Blue1Brown's convolution video does it.
    steps:
      - "Flip the second list to [6, 5, 4] and slide it along the first, one position at a time."
      - "First overlap: 1·4 = **4**. Second: 1·5 + 2·4 = **13**. Third (full overlap): 1·6 + 2·5 + 3·4 = **28**."
      - "Fourth: 2·6 + 3·5 = **27**. Fifth: 3·6 = **18**."
    answer: "[4, 13, 28, 27, 18]"
    takeaway: Convolution is just "slide, multiply, add". On images the same idea runs in 2-D with a small filter.
  - title: Shapes through a small network
    problem: A 64 × 64 colour picture (64 × 64 × 3) goes through a 3×3 conv with 32 filters (padding 1, stride 1),
      then 2×2 max pooling, then a 3×3 conv with 64 filters (padding 0, stride 1). What shape comes out of each step,
      and how many parameters do the two conv layers have?
    steps:
      - "Conv 1: ⌊(64 − 3 + 2) / 1⌋ + 1 = **64**, so 64 × 64 × 32 (one grid per filter). Parameters: (9 × 3 + 1) × 32 = **896**."
      - "Pooling halves height and width: **32** × 32 × 32. Parameters: **0**."
      - "Conv 2: ⌊(32 − 3 + 0) / 1⌋ + 1 = **30**, so 30 × 30 × 64. Parameters: (9 × 32 + 1) × 64 = **18,496**."
    answer: 64×64×32 → 32×32×32 → 30×30×64; 896 and 18,496 parameters.
    takeaway: Pooling changes the shape but has nothing to learn. A conv layer's parameter count doesn't depend on the
      picture size.
  - title: Dense layer vs conv layer
    problem: Compare the parameters of a dense layer from a flattened 32 × 32 × 3 picture to 64 neurons with a 3×3
      conv layer going from 3 to 64 channels.
    steps:
      - "Dense: every one of the 32 × 32 × 3 = 3,072 inputs connects to each of 64 neurons, plus 64 biases: 3,072 × 64 + 64 = **196,672**."
      - "Conv: each of 64 filters has 3 × 3 × 3 = 27 weights + 1 bias: 28 × 64 = **1,792**."
      - The conv layer has about 110× fewer parameters, and it works at every position.
    answer: 196,672 vs 1,792 parameters.
    takeaway: Reusing small filters everywhere (parameter sharing) is what makes CNNs practical for pictures.
questions:
  - question: Explain the two inductive biases (built-in assumptions) of CNNs and why they suit images.
    kind: short
    marks: 5
    keywords:
      - local connectivity
      - receptive field
      - nearby pixels
      - parameter sharing
      - same kernel
      - fewer parameters
      - translation equivariance
    idealAnswer: "Local connectivity: each neuron connects only to a small patch of the picture (its receptive field),
      because nearby pixels are closely related. Parameter sharing: the same small filter (kernel) is used at every
      position, because a pattern that's useful in one place is useful everywhere. Together they need far fewer
      parameters than dense layers and give translation equivariance, so the network spots a pattern wherever it
      appears."
  - question: Does max pooling have learnable parameters? Explain the difference between equivariance and invariance.
    kind: short
    marks: 5
    keywords:
      - no parameters
      - zero
      - maximum
      - downsample
      - equivariance
      - shift output
      - invariance
      - unchanged
      - small shifts
    idealAnswer: "No. Max pooling just takes the maximum in each window, so it has zero learnable parameters; it
      shrinks (downsamples) the feature map and adds a little invariance to small shifts. Equivariance means
      shifting the input shifts the output the same way (as convolution feature maps do). Invariance means the
      output stays unchanged when the input shifts (what we want for the final class score)."
  - question: Design a small CNN for 32 × 32 colour pictures with 10 classes. Give each layer's output shape and
      parameter count, the total, and explain how the design goes from "where is each pattern" (equivariant) to
      "what is in the picture" (invariant).
    kind: long
    marks: 12
    keywords:
      - conv
      - 3x3
      - padding
      - relu
      - max pool
      - output size
      - parameters
      - global average pooling
      - linear
      - softmax
      - equivariant
      - invariant
      - receptive field
    idealAnswer: "Example: conv 3×3 (3→32, padding 1) gives 32×32×32 with (27+1)·32 = 896 parameters; ReLU; max pool
      2×2 gives 16×16×32 with 0 parameters; conv 3×3 (32→64, padding 1) gives 16×16×64 with (288+1)·64 = 18,496;
      max pool gives 8×8×64; conv 3×3 (64→128, padding 1) gives 8×8×128 with (576+1)·128 = 73,856; global average
      pooling gives 128 numbers with 0 parameters; a linear layer 128→10 has 1,290. Total ≈ 94.5 thousand
      parameters. Convolutions are translation-equivariant, so the feature maps move with the object; pooling
      widens each neuron's receptive field and adds local shift invariance; global average pooling removes
      position completely, so the final softmax over the 10 classes is roughly translation-invariant."
videos:
  - youtubeId: KuXjwB4LzSA
    title: "But what is a convolution? (3Blue1Brown)"
    note: Slide, multiply, add, shown visually, from lists to image blurs and edge detectors.
coding:
  - id: conv-arithmetic
    title: Shapes and parameter counts
    language: python
    level: warm-up
    prompt: |
      Write `conv_out(w, k, p=0, s=1)` → output width `⌊(w − k + 2p) / s⌋ + 1`, and
      `conv_params(k, c_in, c_out, bias=True)` → `(k·k·c_in + 1)·c_out` (no `+1` without bias).
      Then use them to print the shapes and parameters of: 64×64×3 → conv3×3(32, p=1) → maxpool 2×2 →
      conv3×3(64, p=0).
    starter: |
      def conv_out(w, k, p=0, s=1):
          ...

      def conv_params(k, c_in, c_out, bias=True):
          ...
    solution: |
      def conv_out(w, k, p=0, s=1):
          return (w - k + 2 * p) // s + 1

      def conv_params(k, c_in, c_out, bias=True):
          return (k * k * c_in + (1 if bias else 0)) * c_out

      w1 = conv_out(64, 3, p=1); w2 = w1 // 2; w3 = conv_out(w2, 3)
      print(w1, w2, w3, conv_params(3, 3, 32), conv_params(3, 32, 64))
    tests:
      - name: Same, valid and strided convolutions
        code: |
          assert conv_out(32, 3, 1, 1) == 32
          assert conv_out(32, 5) == 28
          assert conv_out(224, 3, 1, 2) == 112
          assert conv_out(128, 5, 2, 2) == 64
      - name: Parameter counts
        code: |
          assert conv_params(3, 3, 32) == 896
          assert conv_params(3, 64, 128) == 73856
          assert conv_params(1, 256, 64, bias=False) == 16384
  - id: conv2d
    title: Implement a 2-D convolution
    language: python
    level: core
    setup: |
      import numpy as np
      img = np.zeros((8, 8))
      img[:, 4:] = 1.0                      # a vertical edge between columns 3 and 4
      SOBEL_X = np.array([[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]], dtype=float)
    prompt: |
      Write `conv2d(x, k, stride=1, padding=0)`: slide a small grid of weights (the kernel) over a grayscale
      image, and at each spot multiply the overlapping numbers and add them up. First add `padding` rings of zeros
      around the image, and move `stride` pixels each step. (Deep-learning libraries slide the kernel as it is;
      strictly that's called cross-correlation, so **don't** flip the kernel.)

      Apply it to `img` with `SOBEL_X` and see where the edge lights up.
    starter: |
      import numpy as np

      def conv2d(x, k, stride=1, padding=0):
          ...

      print(conv2d(img, SOBEL_X))
    solution: |
      import numpy as np

      def conv2d(x, k, stride=1, padding=0):
          x = np.pad(x, padding)
          kh, kw = k.shape
          oh = (x.shape[0] - kh) // stride + 1
          ow = (x.shape[1] - kw) // stride + 1
          out = np.zeros((oh, ow))
          for i in range(oh):
              for j in range(ow):
                  patch = x[i * stride:i * stride + kh, j * stride:j * stride + kw]
                  out[i, j] = np.sum(patch * k)
          return out

      print(conv2d(img, SOBEL_X))
    tests:
      - name: Output shape follows the formula
        code: |
          assert conv2d(img, SOBEL_X).shape == (6, 6)
          assert conv2d(img, SOBEL_X, padding=1).shape == (8, 8)
          assert conv2d(img, SOBEL_X, stride=2, padding=1).shape == (4, 4)
      - name: Sobel-x responds only at the vertical edge
        code: |
          out = conv2d(img, SOBEL_X)
          assert np.allclose(out[:, 2:4], 4) and np.allclose(out[:, [0, 1, 4, 5]], 0), f"got\n{out}"
      - name: Cross-correlation, not flipped convolution
        code: |
          x = np.arange(9, dtype=float).reshape(3, 3)
          k = np.array([[1, 0, 0], [0, 0, 0], [0, 0, 0]], dtype=float)
          assert conv2d(x, k)[0, 0] == 0.0, "the kernel's top-left weight should multiply the patch's top-left pixel"
    hints:
      - "`np.pad(x, padding)` adds zeros on all sides."
      - "out[i, j] = sum(x[i*s : i*s+kh, j*s : j*s+kw] * k)"
