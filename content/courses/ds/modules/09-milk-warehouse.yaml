      price_ugx, revenue_ugx); dim_date (date_key, date, month, …), dim_centre (centre_key, centre_name,
      capacity_litres), dim_farmer (farmer_key, farmer_id, farmer_name, …) with surrogate keys. (i) Unknown
      member farmer_key 0 + LEFT JOIN + COALESCE keeps all 20,000 rows with no NULL keys. (ii) CTE summing
      litres per (centre_key, date_key), then count days where daily_litres > capacity_litres (Kiruhura 41).
      (iii) SUM(litres) per (centre, farmer) excluding farmer_key 0, RANK() OVER (PARTITION BY centre ORDER BY
      SUM(litres) DESC) <= 3. (iv) Partition fact_delivery by month so WHERE month = '2026-04' prunes to one
      of six partitions (3,201 rows), verified with EXPLAIN ANALYZE. (v) Make dim_farmer SCD Type 2 with
      valid_from/valid_to (or record centre on the fact) so deliveries link to the farmer version valid on
      their date, and July onwards counts for the new centre."
coding:
  - id: unknown-member
    title: dim_farmer with an Unknown member
    language: sql
    level: exam
    files:
      - milk_clean.csv
      - farmers.csv
      - centres.csv
    compare: none
    setup: |
      CREATE TABLE milk AS SELECT * FROM read_csv_auto('milk_clean.csv');
      CREATE TABLE farmers AS SELECT * FROM read_csv_auto('farmers.csv');
      CREATE TABLE centres AS SELECT * FROM read_csv_auto('centres.csv');
    prompt: |
      Some deliveries in `milk` come from farmers missing from `farmers`. Build:

      - `dim_farmer(farmer_key, farmer_id, farmer_name)` with an **Unknown** row
        (`farmer_key = 0, farmer_id = 'UNKNOWN', farmer_name = 'Unknown'`) plus one row per registered farmer
        (keys 1, 2, … by `farmer_id`);
      - `fact_delivery(delivery_id, date, centre, farmer_key, litres, price_ugx)` that keeps **every** delivery,
        with no NULL `farmer_key`.

      End with: `SELECT farmer_key = 0 AS unknown, COUNT(*) FROM fact_delivery GROUP BY 1 ORDER BY 1;`
    starter: |
      CREATE TABLE dim_farmer AS
      SELECT ...;

      CREATE TABLE fact_delivery AS
      SELECT ...
      FROM milk m JOIN dim_farmer f USING (farmer_id);   -- careful!

      SELECT farmer_key = 0 AS unknown, COUNT(*) FROM fact_delivery GROUP BY 1 ORDER BY 1;
    solution: |
      CREATE TABLE dim_farmer AS
      SELECT 0 AS farmer_key, 'UNKNOWN' AS farmer_id, 'Unknown' AS farmer_name
      UNION ALL
      SELECT ROW_NUMBER() OVER (ORDER BY farmer_id), farmer_id, farmer_name FROM farmers;

      CREATE TABLE fact_delivery AS
      SELECT m.delivery_id, m.date, m.centre, COALESCE(f.farmer_key, 0) AS farmer_key, m.litres, m.price_ugx
      FROM milk m
      LEFT JOIN dim_farmer f USING (farmer_id);

      SELECT farmer_key = 0 AS unknown, COUNT(*) FROM fact_delivery GROUP BY 1 ORDER BY 1;
    tests:
      - name: Every delivery is kept
        code: |
          a = con.execute("SELECT COUNT(*) FROM fact_delivery").fetchone()[0]
          b = con.execute("SELECT COUNT(*) FROM milk").fetchone()[0]
          assert a == b, f"fact_delivery has {a} rows but milk has {b} — an inner join drops unregistered farmers"
      - name: No NULL farmer keys
        code: |
          assert con.execute("SELECT COUNT(*) FROM fact_delivery WHERE farmer_key IS NULL").fetchone()[0] == 0
      - name: Unregistered deliveries map to the Unknown member
        code: |
          unreg = con.execute("SELECT COUNT(*) FROM milk WHERE farmer_id NOT IN (SELECT farmer_id FROM farmers)").fetchone()[0]
          got = con.execute("SELECT COUNT(*) FROM fact_delivery WHERE farmer_key = 0").fetchone()[0]
          assert unreg > 0 and got == unreg, f"expected {unreg} deliveries on key 0, got {got}"
          name = con.execute("SELECT farmer_name FROM dim_farmer WHERE farmer_key = 0").fetchone()
          assert name and name[0] == "Unknown"
      - name: Registered farmers have unique keys starting at 1
        code: |
          n, d, lo = con.execute("SELECT COUNT(*), COUNT(DISTINCT farmer_key), MIN(farmer_key) FROM dim_farmer WHERE farmer_key > 0").fetchone()
          assert n == d == con.execute("SELECT COUNT(*) FROM farmers").fetchone()[0] and lo == 1
    hints:
      - UNION ALL a literal Unknown row onto the registered farmers.
      - LEFT JOIN keeps unmatched deliveries; COALESCE(f.farmer_key, 0) replaces the NULL.
  - id: days-over-capacity
    title: days_over_capacity (two-stage aggregation)
    language: sql
    level: exam
    files:
      - milk_clean.csv
      - centres.csv
    compare: ordered
    setup: |
      CREATE TABLE milk AS SELECT * FROM read_csv_auto('milk_clean.csv');
      CREATE TABLE centres AS SELECT * FROM read_csv_auto('centres.csv');
    prompt: |
      `centres.capacity_litres` is a **daily** limit. Return `centre` and `days_over_capacity` — the number of
      dates on which the centre's **total** litres exceeded its capacity — for centres that were over at
      least once, ordered by `days_over_capacity` descending, then `centre`.
    starter: |
      SELECT m.centre, COUNT(*) AS days_over_capacity
      FROM milk m JOIN centres c USING (centre)
      WHERE m.litres > c.capacity_litres          -- compares single deliveries… is that right?
      GROUP BY m.centre
      ORDER BY days_over_capacity DESC, m.centre;
    solution: |
      WITH daily AS (
        SELECT centre, date, SUM(litres) AS daily_litres
        FROM milk
        GROUP BY centre, date
      )
      SELECT d.centre, COUNT(*) AS days_over_capacity
      FROM daily d JOIN centres c USING (centre)
      WHERE d.daily_litres > c.capacity_litres
      GROUP BY d.centre
      ORDER BY days_over_capacity DESC, d.centre;
    hints:
      - First SUM(litres) per (centre, date) in a CTE, then compare each day's total with the capacity.
  - id: top-farmers
    title: Top 2 farmers per centre
    language: sql
    level: core
    files:
      - milk_clean.csv
      - farmers.csv
    compare: ordered
    setup: |
      CREATE TABLE milk AS SELECT * FROM read_csv_auto('milk_clean.csv');
      CREATE TABLE farmers AS SELECT * FROM read_csv_auto('farmers.csv');
    prompt: |
      For each centre, find the **2 registered farmers** who delivered the most litres **at that centre**.
      Return `centre`, `farmer_name`, `total_litres` (rounded to 1 dp) and `rnk` (using `RANK()`),
      ordered by `centre`, `rnk`, `farmer_name`. Unregistered farmers must not appear.
    starter: |
      SELECT m.centre, f.farmer_name, SUM(m.litres) AS total_litres
      FROM milk m JOIN farmers f USING (farmer_id)
      GROUP BY ALL
      ORDER BY total_litres DESC
      LIMIT 2;
    solution: |
      SELECT centre, farmer_name, total_litres, rnk
      FROM (
        SELECT m.centre, f.farmer_name, ROUND(SUM(m.litres), 1) AS total_litres,
               RANK() OVER (PARTITION BY m.centre ORDER BY SUM(m.litres) DESC) AS rnk
        FROM milk m JOIN farmers f USING (farmer_id)
        GROUP BY m.centre, f.farmer_name
      )
      WHERE rnk <= 2
      ORDER BY centre, rnk, farmer_name;
    hints:
      - LIMIT applies to the whole result — you need a window function partitioned by centre.
      - Filter on the rank in an outer query (you can't use a window function in WHERE).
