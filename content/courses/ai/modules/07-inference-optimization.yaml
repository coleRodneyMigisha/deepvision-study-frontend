  - question: The stroke API must answer in under 15 ms on a CPU-only server, but the current FP32 Python model
      takes 40 ms. Describe a step-by-step optimisation plan, how you would measure each step, and the
      acceptance criteria before deployment.
    kind: long
    marks: 12
    keywords:
      - profile
      - baseline
      - p50
      - p99
      - onnx
