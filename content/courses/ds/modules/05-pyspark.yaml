id: pyspark
title: Distributed Batch Processing with PySpark
subtitle: Splitting big jobs across many computers, and knowing when not to (Lab 6 / Lab 8)
recap: |
  When data is too big for one computer, Spark splits a table into chunks (partitions) and has many workers
  (executors) process them at the same time. One chunk is one task, and tasks run in rounds (waves) of as many
  as there are processor cores. Spark is lazy: it only plans your steps until you ask for a result (an action).
  Some steps work inside each chunk (narrow); others, like grouping or joining, must move data between computers
  (wide, a shuffle), which is slow. On small data, Spark's setup costs outweigh the benefit, so a single-computer
  tool like DuckDB can be much faster, and caching can even slow things down.
traps:
  - "Expecting a step like filter() to run straight away. Nothing runs until an action such as count() or write()."
  - "Caching a table that's only used once. Caching costs extra time up front and only pays off with reuse."
  - "Choosing Spark for data that fits easily on one computer. The setup overhead makes it slower."
lesson:
  checkpointStep: 3
  steps:
    - "When a dataset is too big for one computer's memory, Apache Spark spreads it across a group of computers (a
      cluster) as a table split into chunks (partitions). A Driver program plans the work, and Executors process
      the chunks in parallel."
    - "Rule of thumb: 1 chunk (partition) = 1 task. If your table has 8 partitions and there are 8 processor cores,
      all 8 are processed at the same time."
    - "Spark's transformations (filter, withColumn, groupBy) are lazy: they only add steps to a plan. Nothing runs
      until an action (count, collect, write) asks for a result. Then the Catalyst optimiser turns the plan into the
      fastest version it can."
    - "Checkpoint: what's the difference between a narrow and a wide transformation in Spark, and why can .cache()
      sometimes make a job slower?"
    - "Narrow transformations (filter, select, map) work inside each chunk, with no data sent between computers. Wide
      transformations (groupBy, join, orderBy) need a shuffle (shown as Exchange): rows are sorted by key, written to
      disk, and sent across the network."
    - "In Lab 8 we measured DuckDB at 1.39 s vs Spark at 11.21 s on 10,000 rows, and .cache() took 8.85 s vs 3.04 s
      without it! On small data, Spark's start-up, shuffling and caching costs are bigger than the benefit of
      splitting the work."
checkpoint:
  question: Explain the difference between narrow and wide transformations in PySpark. Why did DuckDB beat
    PySpark on our 10,000-row market dataset, and when does `.cache()` actually pay off?
  hint: "Narrow: each chunk can be done on its own. Wide: rows with the same key must be gathered together across the
    network (a shuffle). Then think about Spark's fixed start-up costs on tiny data, and what .cache() costs the first
    time it runs."
  keywords:
    - narrow
    - wide
    - shuffle
    - exchange
    - partition
    - network
    - lazy
    - action
    - cache
    - materialise
    - overhead
    - jvm
    - duckdb
  idealAnswer: "Narrow transformations (filter, select, withColumn) work out each output partition (chunk) from a single
    input partition in memory, without moving data. Wide transformations (groupBy, join, distinct) need a shuffle,
    shown as Exchange in the plan: rows are redistributed across partitions using disk and network. Spark is lazy,
    so nothing runs until an action. On a 10,000-row dataset, DuckDB (about 1.4 s) beats PySpark (about 11.2 s)
    because Spark pays a big fixed overhead: starting the JVM (the Java engine it runs on), planning with Catalyst,
    scheduling tasks and preparing shuffles. Likewise, .cache() has an up-front cost to materialise (build) the
    cached copy, so it only pays off when a large, expensive table is reused by several later actions."
terms:
  - term: Cluster, driver and executors
    definition: A cluster is a group of computers working together. The driver plans the work; executors do it.
  - term: Partition
    definition: One chunk of a table's rows. Each partition is processed as one task on one core.
  - term: Wave
    definition: One round of tasks. With 8 cores, 20 partitions need ⌈20 / 8⌉ = 3 waves.
  - term: Lazy evaluation
    definition: Steps only build a plan; the work starts when an action (count, collect, write) is called.
  - term: Narrow transformation
    definition: A step that works inside each partition on its own (filter, select). No data moves between computers.
  - term: Wide transformation / shuffle
    definition: A step that needs rows with the same key gathered together (groupBy, join), so data is sent across the
      network. Shown as Exchange in the plan.
  - term: Catalyst and Tungsten
    definition: Spark's query optimiser (it reorders and trims your plan) and its engine that generates fast code.
  - term: Partial aggregation
    definition: Each partition adds up its own groups first, so far fewer rows need to be shuffled.
  - term: Cache
    definition: Keeping a computed table in memory so later actions don't recompute it. Costs extra the first time.
quiz:
  - question: In `df.filter(...).withColumn(...).groupBy('market').agg(avg('price')).collect()`, which call is the
      Action that triggers execution?
    options:
      - filter()
      - withColumn()
      - groupBy()
      - collect()
    answer: 3
    explanation: filter, withColumn, and groupBy/agg are lazy transformations; collect() is the Action that
      triggers the Spark job.
  - question: You have 1,000,000 rows across 4 partitions and 5 distinct markets. With partial aggregation
      (`HashAggregate` before `Exchange`), at most how many intermediate rows are sent across the shuffle
      network?
    options:
      - 1,000,000
      - "20"
      - 4,000
      - "5"
    answer: 1
    explanation: Each of the 4 partitions pre-aggregates its local rows into at most 5 market groups → 4 × 5 = 20
      rows shuffled across the network!
  - question: Which operation triggers execution in Spark?
    options:
      - filter
      - withColumn
      - groupBy
      - count
    answer: 3
    explanation: count() asks for a result, so it is an action and starts the work. The others only add steps to the plan.
  - question: Which transformation causes a shuffle?
    options:
      - filter
      - select
      - groupBy
      - withColumn
    answer: 2
    explanation: groupBy needs all rows with the same key in one place, so rows are sent between partitions (a shuffle).
  - question: What does 'Exchange' in df.explain() indicate?
    options:
      - A cached table
      - A shuffle
      - A pushed-down filter
      - A broadcast variable
    answer: 1
    explanation: Exchange is the step where Spark shuffles data between partitions.
  - question: 40 partitions, 16 cores, 2 s per task. Stage time?
    options:
      - 4 s
      - 5 s
      - 6 s
      - 80 s
    answer: 2
    explanation: 16 cores take 16 tasks per round, so 40 tasks need ⌈40/16⌉ = 3 rounds (waves). 3 × 2 s = 6 s.
  - question: Why can DuckDB beat Spark on 10,000 rows?
    options:
      - DuckDB is distributed
      - "Spark's fixed overheads (JVM, planning, scheduling, shuffles) dominate small jobs"
      - Spark can't read Parquet
      - DuckDB caches everything
    answer: 1
    explanation: On small data, Spark's fixed start-up and planning costs are bigger than the actual work.
  - question: What does partial aggregation reduce?
    options:
      - The number of columns
      - The number of rows shuffled
      - The number of executors
      - Memory used by the driver
    answer: 1
    explanation: Each partition adds up its own groups first, so at most partitions × keys rows are sent across the network.
fact:
  title: "Single-node first: most 'Big Data' fits in laptop RAM"
  body: A 2023 study of production cloud analytics jobs found that over 90% of queries scanned less than 10 GB
    of data. Modern engineers use DuckDB or Polars for <50 GB and reserve Spark for true
    multi-hundred-gigabyte distributed workloads.
lab:
  title: PySpark Partition Waves, Shuffle & Cache Break-Even
  variations:
    - title: Executor Core Waves Calculation
      question: A PySpark stage has <b>20 partitions</b> (each taking <b>4 seconds</b>) running on a cluster with
        <b>8 executor cores</b>. Assuming uniform partition sizes, how many seconds does the stage take to
        complete?
      answer: 12
      tolerance: 0
      hint: 20 partitions across 8 cores require ceil(20 / 8) = 3 waves of 4 seconds each.
      explanation: Wave 1 runs 8 partitions (4s), Wave 2 runs 8 partitions (4s), Wave 3 runs the remaining 4
        partitions (4s) → 3 waves × 4s = 12 seconds.
    - title: Map-Side Partial HashAggregate Shuffle Reduction
      question: A DataFrame of <b>500,000 rows</b> across <b>10 partitions</b> is grouped by `market` (<b>6 distinct
        markets</b>). With map-side `HashAggregate` partial aggregation before the `Exchange` shuffle, what is
        the maximum number of intermediate records sent across the network?
      answer: 60
      tolerance: 0
      hint: Each of the 10 partitions outputs at most 6 partial `(market, sum, count)` records.
      explanation: 10 partitions × 6 distinct markets = at most 60 partial aggregate rows shuffled (down from
        500,000 raw rows!).
    - title: Spark `.cache()` Break-Even Action Count
      question: Reading & computing a DataFrame from disk costs <b>3.0s</b> per action. Materialising `.cache()`
        adds <b>4.5s</b> on the first action, after which cached reads take only <b>0.5s</b> per action. What
        is the minimum number of actions <b>N</b> where caching is strictly faster than not caching?
      answer: 3
      tolerance: 0
      hint: Compare Uncached(N) = 3.0·N vs Cached(N) = (3.0 + 4.5) + 0.5·(N − 1) = 7.0 + 0.5·N.
      explanation: "For N=2: Uncached = 6.0s, Cached = 7.5 + 0.5 = 8.0s (slower, just like Lab 8!). For N=3:
        Uncached = 9.0s, Cached = 7.5 + 1.0 = 8.5s (faster!). So N = 3 actions is the break-even point."
notes:
  - heading: Driver, executors and partitions
    body: |
      **The idea:** one person counting a million coins takes ages. Ten people each counting a pile finish ten times faster, as long as splitting the coins up doesn't take longer than counting them.

      Spark spreads a table across a cluster as **partitions**: chunks of rows. A **driver** program plans the work; **executors** do it. Each executor has some **cores** (processors), and each core handles one partition at a time, as a **task**.

      The basic arithmetic:

      - 1 partition → 1 task.
      - Tasks run in **waves** (rounds) of as many tasks as there are cores: waves = ⌈partitions ÷ cores⌉ (⌈ ⌉ means round up).
      - Stage time ≈ waves × time per task.

      **Tiny example:** 20 partitions on 8 cores need ⌈20 / 8⌉ = 3 waves, and in the last wave only 4 cores are busy while 4 sit idle. Too few partitions leaves cores idle; far too many adds scheduling overhead. A common rule of thumb is 2–4 partitions per core.
  - heading: Lazy evaluation, actions and Catalyst
    body: |
      **The idea:** Spark writes your whole shopping list before going to the shop, so it can plan the quickest route. It only goes when you ask for the result.

      Transformations (`filter`, `select`, `withColumn`, `groupBy`, `join`) don't run. They add steps to a **plan**. Only an **action** (`count`, `collect`, `show`, `write`) starts the work.

      Being lazy lets Spark's **Catalyst optimiser** improve the whole plan before running it: apply filters as early as possible (even inside the data source), drop columns nobody uses, reorder joins. Then the **Tungsten** engine generates efficient code. `df.explain()` shows the final plan: look for `Exchange` (a shuffle) and `PushedFilters`.

      **The catch:** every action runs the plan again from the start unless you cache. Two `count()`s on the same table read the data twice.
  - heading: Narrow vs wide — the shuffle
    body: |
      **The idea:** some jobs each worker can do alone (narrow). Others need everyone to swap items so all of one kind end up together (wide), and that swapping is the slow part.

      - **Narrow** transformations (`filter`, `select`, `withColumn`, `map`) work inside each partition. No data moves between computers.
      - **Wide** transformations (`groupBy`, `join`, `orderBy`, `distinct`) need all rows with the same key in the same place. Spark **shuffles**: it works out which partition each row's key belongs to, writes the rows to disk, and sends them across the network. That's the `Exchange` in the plan, and usually the most expensive part of a job.

      **Partial aggregation saves a lot.** Before shuffling, each partition first adds up its own rows per key. So at most *partitions × distinct keys* rows get shuffled, instead of every row. For example, 1,000,000 rows in 4 partitions with 5 markets: each partition sends at most 5 partial results, so only 4 × 5 = **20 rows** cross the network.
  - heading: When Spark is the wrong tool
    body: |
      **The idea:** hiring a removal lorry to move one box is slower than carrying it yourself.

      Spark has fixed costs every time it runs: starting the JVM (the Java engine it runs on), planning, packaging tasks, scheduling, shuffling. These take seconds, not milliseconds, and on small data they dominate. In Lab 8, on 10,000 rows, **DuckDB took 1.39 s and Spark took 11.21 s**.

      **`.cache()` isn't free either.** The first action has to build (*materialise*) the cached copy in memory. That only pays off if enough later actions reuse it. In our test, caching a table used by just two actions made the script slower (8.85 s vs 3.04 s).

      **Rule of thumb:** if the data fits comfortably on one computer, use a single-computer tool (DuckDB, Polars, pandas). Reach for Spark only when the data or the work really is too big for one machine.
examples:
  - title: Waves and idle cores
    problem: A stage has 26 partitions (chunks), each task takes 5 s, and the cluster has 3 executors with 4 cores each.
      How long does the stage take, and how many cores sit idle in the last round (wave)?
    steps:
      - Total cores = 3 × 4 = **12**.
      - Waves = ⌈26 / 12⌉ = **3**; stage time = 3 × 5 = **15 s**.
      - Slots in 3 waves = 36; tasks = 26 → **10 idle slots**, all in the last wave (only 2 tasks run in it).
      - With 24 partitions the stage would take 2 waves = 10 s.
    answer: 15 s, with 10 idle core-slots.
    takeaway: Partition counts that are multiples of the core count avoid a nearly empty last wave.
  - title: Cache break-even
    problem: Without caching, each action on a table takes 3 s. With caching, the first action costs an extra 4.5 s to
      build the cache, and every later action takes only 0.5 s. From how many actions does caching become worth it?
    steps:
      - "Uncached: N × 3."
      - "Cached: (3 + 4.5) + (N − 1) × 0.5 = 7 + 0.5N."
      - Caching wins when 7 + 0.5N < 3N → 7 < 2.5N → N > 2.8, so **N = 3**.
      - "Check: N = 2 → 6 s vs 8 s (cache loses); N = 3 → 9 s vs 8.5 s (cache wins)."
    answer: From 3 actions.
    takeaway: Cache only DataFrames that are reused several times.
questions:
  - question: Explain lazy evaluation in Spark and why it enables optimisation.
    kind: short
    marks: 5
    keywords:
      - lazy
      - transformations
      - logical plan
      - action
      - catalyst
      - optimiser
      - predicate pushdown
      - column pruning
      - physical plan
    idealAnswer: Transformations only build a logical plan; nothing runs until an action such as count or write.
      Because Spark sees the whole plan first, the Catalyst optimiser can rewrite it — pushing filters down to
      the data source, pruning unused columns, reordering joins — before Tungsten executes an efficient
      physical plan.
  - question: Contrast narrow and wide transformations and explain why shuffles are expensive.
    kind: short
    marks: 6
    keywords:
      - narrow
      - within partition
      - filter
      - wide
      - groupBy
      - join
      - shuffle
      - exchange
      - hash
      - disk
      - network
      - partial aggregation
    idealAnswer: "Narrow transformations like filter or withColumn operate within each partition with no data
      movement. Wide transformations like groupBy, join and orderBy require rows with the same key on the same
      partition, so Spark shuffles: it hashes keys, writes shuffle files to disk and sends them over the
      network — the Exchange operator. That costs disk I/O, serialisation and network time, which is why
      partial aggregation and avoiding unnecessary wide operations matter."
  - question: Your team runs a PySpark job on 10,000 rows of market data that takes 11 s, uses .cache() on a
      DataFrame used by two actions, and shuffles twice. A teammate's DuckDB script does the same in 1.4 s.
      Explain every reason for the difference, when Spark would be the right choice, and how you would tune
      the Spark job if the data grew to 500 million rows.
    kind: long
    marks: 12
    keywords:
      - jvm
      - startup
      - catalyst
      - planning
      - scheduling
      - shuffle
      - cache
      - materialise
      - reuse
      - single node
      - duckdb
      - distributed
      - partitions
      - cores
      - waves
      - partial aggregation
      - broadcast join
      - explain
    idealAnswer: "On 10,000 rows the actual computation is trivial; Spark's fixed costs dominate — JVM start-up,
      Catalyst planning, task serialisation and scheduling, and two shuffles writing to disk and moving data.
      Caching made it worse because materialising the cache cost more than re-reading a small file for only
      two actions. DuckDB is a single-process vectorised engine with almost no overhead. Spark is right when
      data or compute exceeds one machine — hundreds of GB, many joins, or cluster-scale parallelism. At 500 M
      rows: size partitions to ~2–4 per core so waves are full, filter and select columns early so Catalyst
      pushes them down, rely on partial aggregation and broadcast small dimension tables to avoid shuffle
      joins, cache only DataFrames reused by several actions, and use explain() and the Spark UI to find
      expensive Exchanges and skewed partitions."
coding:
  - id: partial-aggregation
    title: Partial aggregation, by hand
    language: python
    level: core
    setup: |
      import pandas as pd
      full = pd.read_csv("market_clean.csv")
      # 4 "partitions", like a DataFrame split across executors
      partitions = [full.iloc[i::4].reset_index(drop=True) for i in range(4)]
    files:
      - market_clean.csv
    prompt: |
      Spark computes `groupBy("commodity").avg("price_ugx")` in two steps so it shuffles little data.
      `partitions` is a list of 4 DataFrames.

      1. `partial(part)` → for **one** partition, a DataFrame with columns `commodity`, `total`, `n`
         (sum and count of `price_ugx` per commodity) — this is what each executor sends in the shuffle.
      2. `combine(partials)` → final DataFrame with `commodity`, `avg_price`, sorted by commodity.
      3. Print how many rows were shuffled (the total length of all partials) vs rows in `full`.
    starter: |
      import pandas as pd

      def partial(part):
          ...

      def combine(partials):
          ...

      partials = [partial(p) for p in partitions]
      print(combine(partials))
    solution: |
      import pandas as pd

      def partial(part):
          g = part.groupby("commodity")["price_ugx"].agg(["sum", "count"]).reset_index()
          return g.rename(columns={"sum": "total", "count": "n"})

      def combine(partials):
          allp = pd.concat(partials, ignore_index=True)
          g = allp.groupby("commodity")[["total", "n"]].sum().reset_index()
          g["avg_price"] = g["total"] / g["n"]
          return g[["commodity", "avg_price"]].sort_values("commodity").reset_index(drop=True)

      partials = [partial(p) for p in partitions]
      print(combine(partials))
      print("shuffled", sum(len(p) for p in partials), "of", len(full))
    tests:
      - name: Each partial has commodity, total and n
        code: |
          p = partial(partitions[0])
          assert {"commodity", "total", "n"} <= set(p.columns)
          assert len(p) == partitions[0]["commodity"].nunique()
      - name: Combined averages equal a direct groupBy
        code: |
          got = combine([partial(p) for p in partitions])
          exp = full.groupby("commodity")["price_ugx"].mean().reset_index()
          assert list(got["commodity"]) == sorted(exp["commodity"])
          for c, v in zip(exp["commodity"], exp["price_ugx"]):
              assert abs(float(got.loc[got.commodity == c, "avg_price"].iloc[0]) - v) < 1e-6, f"wrong average for {c}"
      - name: Shuffled rows are bounded by partitions × keys
        code: |
          shuffled = sum(len(partial(p)) for p in partitions)
          assert shuffled <= 4 * full["commodity"].nunique() < len(full)
    hints:
      - You can't average averages — carry the sum and the count, and divide at the end.
  - id: spark-job
    title: Write the PySpark job
    language: review
    level: core
    prompt: |
      Write a PySpark job that reads `data/processed/market_prices/` (Parquet), keeps 2025 rows for the
      Central region, computes the average price per (market, commodity, month), and writes the result as
      Parquet partitioned by month — overwriting just the months it produces.

      In comments, mark each transformation as **narrow** or **wide**, say where the shuffle happens, and
      say whether you would `.cache()` anything and why.
    starter: |
      from pyspark.sql import SparkSession, functions as F

      spark = SparkSession.builder.appName("monthly-prices").getOrCreate()
    solution: |
      from pyspark.sql import SparkSession, functions as F

      spark = (SparkSession.builder.appName("monthly-prices")
               .config("spark.sql.sources.partitionOverwriteMode", "dynamic")  # overwrite only produced months
               .getOrCreate())

      df = spark.read.parquet("data/processed/market_prices/")                 # lazy: nothing runs yet
      central = (df.filter((F.year("date") == 2025) & (F.col("region") == "Central"))  # narrow (pushed down)
                   .withColumn("month", F.date_format("date", "yyyy-MM")))       # narrow
      monthly = (central.groupBy("market", "commodity", "month")                 # WIDE → shuffle (Exchange),
                        .agg(F.avg("price_ugx").alias("avg_price")))             #   with partial aggregation first
      # No .cache(): the DataFrame is used by a single action, so caching would only add cost.
      monthly.write.mode("overwrite").partitionBy("month").parquet("data/marts/monthly_prices/")  # action
    rubric:
      - Filters early (year and region) so Catalyst can push predicates down
      - Correctly labels filter/withColumn as narrow and groupBy/agg as wide with a shuffle
      - Derives a month column and groups by market, commodity and month
      - Writes Parquet partitioned by month with dynamic partition overwrite (idempotent)
      - Justifies not caching (single action) or caching only for reuse
