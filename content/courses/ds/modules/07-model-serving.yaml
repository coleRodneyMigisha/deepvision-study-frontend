    idealAnswer: Training-serving skew is a mismatch between how features are computed in training and in
      production. In Step 8 training used is_rainy = rainfall_mm > 5.0 while the API used > 10.0; for 8.2 mm
      the API computed is_rainy = 0, shifting the beans prediction from 2,927.25 to 2,889.58 UGX with no
      error. The fix is to define make_features() and FEATURE_COLUMNS once in a shared module
      (src/common/features.py) imported by both training and the API, and record the feature list in model
