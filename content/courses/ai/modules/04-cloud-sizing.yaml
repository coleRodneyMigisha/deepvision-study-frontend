id: cloud-sizing
title: Cloud Computing Concepts, Service Models & Hardware Sizing
subtitle: Renting computers over the internet, choosing how much to manage yourself, and keeping costs down
recap: |
  The cloud lets you rent computing power over the internet, as much as you need, when you need it. Learn NIST's
  five defining features, and the service models, from most to least work for you: IaaS (rent a bare virtual
  computer), PaaS (a managed platform like Render runs your app), SaaS (a finished app) and MLaaS (ready-made ML
  platforms like SageMaker). Simple table-data models run cheaply on ordinary processors (CPUs); big neural
  networks need graphics processors (GPUs), which should switch off when idle. Spot machines are 70–90% cheaper
  but can be taken back at short notice, so use them for training that saves its progress, and for batch jobs.
traps:
  - "Serving a small XGBoost model on an always-on GPU. A cheap CPU is fast enough, and the GPU bills every hour."
  - "Running a live service that must always answer on Spot machines with no backup. They can disappear with two
    minutes' warning."
  - "Mixing up PaaS and IaaS. Ask: who looks after the operating system?"
lesson:
  checkpointStep: 3
  steps:
    - "Running a model on a personal laptop or one server in the building means suffering power cuts, network drops
      and fixed limits. Cloud computing rents you computers over the internet that can grow or shrink on demand."
    - "The US standards body NIST defines five essential features of cloud computing: on-demand self-service, broad
      network access, resource pooling, rapid elasticity and measured service."
    - "We group services into IaaS (renting bare virtual machines, like EC2 or Compute Engine), PaaS (managed
      platforms like App Engine or Render), SaaS (finished apps for end users) and MLaaS (ready-made AI platforms
      like SageMaker and Vertex AI)."
    - "Checkpoint: how do CPUs and GPUs differ in cost and speed for making predictions, and how do Spot
      (preemptible) machines save up to 80% on training?"
    - "Table-data models like random forests and XGBoost run fast and cheaply on ordinary processors (CPUs): about 20
      ms per prediction, for pennies a month. Huge neural networks need graphics processors (GPUs), which cost a lot
      per hour, so they should scale down to zero when nobody is using them."
    - "Spot machines are spare data-centre capacity sold at 70–90% off. The provider can take them back with a
      2-minute warning, so they suit training that saves checkpoints and batch jobs that can be restarted."
checkpoint:
  question: Differentiate IaaS, PaaS, and MLaaS in the context of deploying an ML model, and explain how Spot
    instances reduce cloud costs while managing termination risk.
  hint: "For each model, ask who looks after the operating system and software versus the model itself. For Spot:
    what do you gain (a big discount) and what do you risk (being shut down at short notice)? How can a job survive
    that?"
  keywords:
    - iaas
    - paas
    - mlaas
    - spot
    - preemptible
    - cost
    - cloud
    - elasticity
    - checkpoint
    - gpu
  idealAnswer: "IaaS (Infrastructure as a Service) gives you bare virtual machines in the cloud: you look after the
    operating system, GPU drivers (CUDA), Docker and networking. PaaS (Platform as a Service, e.g. Render) hides
    the machine: you provide the code or Docker container, and the platform keeps it running and handles security
    certificates. MLaaS (Machine Learning as a Service, e.g. AWS SageMaker) provides managed prediction endpoints,
    automatic scaling (elasticity), model registries and monitoring for data drift. Spot (preemptible) machines are
    spare cloud capacity at a 70–90% discount, which cuts cost a lot, for GPU training too. Because they can be
    shut down at short notice, the work must either keep no important state on the machine or save a checkpoint of
    the model often to durable storage (S3/GCS), so the job can resume automatically on a new machine."
terms:
  - term: Cloud computing
    definition: Renting computers, storage and networks over the internet, paying for what you use.
  - term: NIST's five cloud characteristics
    definition: "On-demand self-service (set it up yourself), broad network access (reach it over the internet),
      resource pooling (shared hardware), rapid elasticity (grow or shrink quickly) and measured service (pay by use)."
  - term: Virtual machine (VM)
    definition: A computer simulated in software on a provider's real hardware; you rent it by the hour.
  - term: IaaS
    definition: "Infrastructure as a Service: rent bare virtual machines, storage and networks; you manage the software."
  - term: PaaS
    definition: "Platform as a Service: hand over your app or container and the platform runs it; you don't manage the
      operating system."
  - term: MLaaS
    definition: "Machine Learning as a Service: complete cloud platforms for training, storing and serving models."
  - term: CPU vs GPU
    definition: A CPU is a general-purpose processor; a GPU does huge numbers of simple calculations at once, ideal
      for big neural networks.
  - term: Spot / preemptible VM
    definition: A heavily discounted virtual machine that the provider can take back at short notice when it needs the
      capacity.
  - term: Checkpoint
    definition: A saved copy of training progress, so a job can carry on from there instead of starting again.
quiz:
  - question: Which cloud service model requires you to configure the Linux kernel, install Nvidia GPU drivers,
      and manage Docker security updates yourself?
    options:
      - SaaS
      - PaaS
      - IaaS
      - MLaaS
    answer: 2
    explanation: In IaaS (Infrastructure as a Service), you are responsible for managing the operating system,
      drivers, security patches, and runtime environments.
  - question: If an on-demand GPU VM costs $2.40/hour and a spot instance offers a 75% discount, what is the cost
      of running a 10-hour training job on Spot?
    options:
      - $24.00
      - $6.00
      - $18.00
      - $1.80
    answer: 1
    explanation: "Spot price = $2.40 × (1 − 0.75) = $0.60/hour. For 10 hours: 10 × $0.60 = $6.00."
  - question: Which is NOT one of NIST's five essential characteristics?
    options:
      - Rapid elasticity
      - Measured service
      - Guaranteed zero downtime
      - Resource pooling
    answer: 2
    explanation: The five are on-demand self-service, broad network access, resource pooling, rapid elasticity and measured service.
  - question: Render running your Docker container is an example of…
    options:
      - IaaS
      - PaaS
      - SaaS
      - On-prem
    answer: 1
    explanation: PaaS. You manage the app; the platform looks after the operating system, software and scaling.
  - question: Why are Spot VMs unsuitable for a 24/7 triage API?
    options:
      - They are slower
      - They can be reclaimed with ~2 minutes' notice
      - They have no GPUs
      - They can't run Docker
    answer: 1
    explanation: They can be taken back at short notice. That's fine for training that saves checkpoints, not for a live hospital service.
  - question: The best hardware for serving an XGBoost stroke model is usually…
    options:
      - An A100 GPU
      - A small CPU instance
      - A TPU pod
      - A Spot GPU
    answer: 1
    explanation: Models for table data do little arithmetic, so an ordinary CPU is fast and cheap.
  - question: On-demand $1.50/h, 80% Spot discount, 10 h job. Spot cost?
    options:
      - $1.20
      - $3.00
      - $12.00
      - $15.00
    answer: 1
    explanation: 1.50 × 0.20 × 10 = $3.00.
  - question: What should a GPU serving service do when there's no traffic?
    options:
      - Keep running at full size
      - Scale to zero
      - Switch to Spot
      - Reboot
    answer: 1
    explanation: An idle GPU still costs money every hour, so scale it down to zero when there's no traffic.
fact:
  title: Latency Realities in East Africa
  body: A client in Kampala making API calls to an EU-West (Ireland) data center incurs a minimum physical
    speed-of-light round-trip latency of ~130ms. Deploying on African edge locations (af-south-1 in Cape Town
    or local CDNs) drops network latency to under 35ms.
lab:
  title: Cloud ML Sizing, Spot Cost & Latency Architecture Simulator
  variations:
    - title: Multi-Stage Docker Image Footprint Reduction
      question: A single-stage Docker image containing build tools, GCC, and pip cache measures <b>1,280 MB</b>.
        Rebuilding with multi-stage compilation and <code>python:3.11-slim</code> produces a production image
        of <b>190 MB</b>. How many <b>MB</b> are trimmed from the image?
      answer: 1090
      tolerance: 0
      hint: Subtract 190 MB from 1,280 MB.
      explanation: 1,280 − 190 = 1,090 MB saved (an 85% reduction), drastically lowering network transfer times and
        attack surface.
    - title: Container Cold-Start Pull Duration
      question: On a hospital edge gateway with a <b>100 Mbps (12.5 MB/s)</b> network link, pulling an unoptimized
        <b>1,250 MB</b> container image took 100 seconds. How many seconds does it take to pull the optimized
        <b>150 MB</b> multi-stage container?
      answer: 12
      tolerance: 0.5
      hint: Divide 150 MB by 12.5 MB/s.
      explanation: 150 / 12.5 = 12 seconds. In auto-scaling and failover scenarios, 12 seconds vs 100 seconds is the
        difference between seamless scaling and service degradation.
    - title: Docker Container Memory Ceiling Headroom
      question: A container is allocated <b>512 MB</b> memory. Base OS and Python runtime consume <b>116 MB</b>. If
        each concurrent batch inference thread uses <b>22 MB</b>, how many concurrent threads can run before
        risking an OOM (Out Of Memory) kill?
      answer: 18
      tolerance: 0
      hint: Subtract 116 from 512, then take the integer floor of dividing by 22.
      explanation: Available memory = 512 − 116 = 396 MB. Threads = ⌊396 / 22⌋ = 18 concurrent requests.
notes:
  - heading: Why the cloud for ML
    body: |
      **The idea:** instead of buying a generator for your house, you plug into the national grid and pay for what you use. The cloud is the same idea for computers.

      A model served from a laptop, or one server in the building, inherits all its weaknesses: power cuts, a shaky internet connection, no room to grow, and months of waiting to buy new hardware. **Cloud computing** rents computing power, storage and networking whenever you need them, and bills you by use.

      The **NIST definition** (from the US standards body) lists five essential features. Learn them by name:

      1. **On-demand self-service:** you set up machines yourself, without phoning anyone.
      2. **Broad network access:** you reach them over the internet from ordinary devices.
      3. **Resource pooling:** the provider serves many customers from shared hardware.
      4. **Rapid elasticity:** you can scale up and down quickly, even automatically.
      5. **Measured service:** usage is metered, and you pay for what you use.
  - heading: Service models — who manages what
    body: |
      **The idea:** think of food. IaaS is renting a kitchen (you cook everything). PaaS is a restaurant kitchen with staff, and you just bring your recipe. SaaS is ordering a ready meal.

      | Model | You manage | The provider manages | ML example |
      |---|---|---|---|
      | **IaaS** | operating system, software, app, data | the hardware and virtual machines | an EC2 / Compute Engine machine you install Python on |
      | **PaaS** | your app and data | operating system, software, scaling | Render, App Engine or Cloud Run running your FastAPI container |
      | **SaaS** | just how you use it | everything | a hosted analytics tool |
      | **MLaaS** | your data and model choices | the training and serving machinery | SageMaker, Vertex AI |

      Going down the table, you give up control in exchange for convenience. Our StudyRoom backend is a PaaS deployment (Render). A hospital might choose IaaS in a nearby region so patient data stays in the country or region (data residency).
  - heading: CPU, GPU and right-sizing
    body: |
      **The idea:** don't hire a lorry to deliver a letter. Match the machine to the job.

      - **Table-data models** (logistic regression, random forest, XGBoost) do little arithmetic per prediction. A small, ordinary processor (**CPU**) serves them in about 10–25 ms, for pennies.
      - **Large neural networks** (vision transformers, large language models) do billions of multiplications per prediction. Graphics processors (**GPUs**) do these all at once and are worth their price, but only while busy. An idle GPU still bills by the hour, so GPU services should **scale down to zero** when nobody is using them.

      **Delay (latency) has two parts:** the **computing time** (how long the model takes) and the **network time** (how far away the users are). For a hospital in Uganda, a server in Johannesburg adds about 40 ms per round trip; one in Ireland, about 135 ms. The region you pick often matters more than the size of the machine.
  - heading: Spot and preemptible instances
    body: |
      **The idea:** a standby airline ticket is much cheaper, but you can be bumped off the flight. Fine for a flexible trip; not for getting to your own wedding.

      Cloud providers sell their spare capacity as **Spot** machines (AWS) or **Preemptible/Spot** machines (Google) at **70–90% off**. The catch: they can be taken back with about **two minutes' notice**.

      - **Great for training and batch scoring:** save checkpoints regularly, and if the machine disappears, carry on from the last checkpoint on a new one.
      - **Wrong for live hospital serving:** if the machine is taken back, triage stops answering. Serve on normal on-demand (or reserved) machines, and only *add* Spot machines behind a load balancer for extra busy periods.

      **Cost arithmetic:** Spot price per hour = normal price × (1 − discount); job cost = price per hour × hours.

      **Tiny example:** a normal price of 2.40 per hour with a 75% discount gives 2.40 × 0.25 = **0.60 per hour**. A 10-hour job then costs **6.00** instead of 24.00.
examples:
  - title: Spot retraining bill
    problem: Nightly retraining runs 3 hours on a GPU that costs $2.80/h on-demand, with a 72% Spot discount. What
      is the monthly cost (30 nights) on Spot vs on-demand?
    steps:
      - "On-demand: 2.80 × 3 × 30 = **$252/month**."
      - Spot rate = 2.80 × 0.28 = $0.784/h → 0.784 × 3 × 30 = **$70.56/month**.
      - Saving ≈ $181/month — as long as the job checkpoints and can resume.
    answer: About $70.56 on Spot vs $252 on-demand.
    takeaway: Spot is ideal for interruptible, checkpointed work.
  - title: Region or instance?
    problem: A 2-vCPU instance serves in 24 ms; an 8-vCPU instance in 9 ms. The Johannesburg region adds 42 ms of
      network latency, an on-prem Kampala server 8 ms. Which gives the lowest total latency for hospital
      users?
    steps:
      - "2-vCPU in Johannesburg: 24 + 42 = 66 ms. 8-vCPU in Johannesburg: 9 + 42 = 51 ms."
      - "2-vCPU on-prem Kampala: 24 + 8 = **32 ms**."
      - The small machine close to users beats the big machine far away.
    answer: The small instance in Kampala (32 ms).
    takeaway: For latency, distance often matters more than horsepower.
questions:
  - question: List NIST's five essential characteristics of cloud computing and explain rapid elasticity with an
      ML example.
    kind: short
    marks: 5
    keywords:
      - on-demand self-service
      - broad network access
      - resource pooling
      - rapid elasticity
      - measured service
      - scale out
      - scale in
      - traffic
      - replicas
    idealAnswer: "On-demand self-service, broad network access, resource pooling, rapid elasticity and measured
      service. Rapid elasticity means capacity can grow and shrink quickly, often automatically: the stroke
      API can scale from 2 to 10 replicas during the morning clinic surge and back down at night, paying only
      for what is used."
  - question: Explain when you would use a CPU vs a GPU for inference, and when Spot instances are appropriate.
    kind: short
    marks: 6
    keywords:
      - tabular
      - cpu
      - cheap
      - latency
      - neural network
      - gpu
      - parallel
      - idle
      - scale to zero
      - spot
      - discount
      - reclaimed
      - checkpoint
      - training
      - serving
    idealAnswer: Tabular models (XGBoost, RandomForest) run quickly and cheaply on CPUs, so a GPU adds cost
      without meaningful benefit. Large neural networks need GPUs' parallel arithmetic, but GPUs should scale
      to zero when idle. Spot instances give 70–90% discounts but can be reclaimed with ~2 minutes' notice, so
      they suit checkpointed training and batch scoring, not real-time clinical serving.
  - question: Propose a cloud architecture and monthly budget for the stroke-risk system — a 24/7 prediction API
      used by a Ugandan hospital and a nightly retraining job. Justify the service model, region, instance
      types and pricing options, and explain how you handle a Spot interruption.
    kind: long
    marks: 12
    keywords:
      - paas
      - iaas
      - region
      - latency
      - data residency
      - cpu
      - on-demand
      - replicas
      - load balancer
      - autoscaling
      - gpu
      - spot
      - checkpoint
      - resume
      - cost
      - monthly
    idealAnswer: "Serving: a PaaS/container service (or IaaS VMs) in the closest region with acceptable
      data-residency terms (e.g. Johannesburg, or on-prem in Kampala for lowest latency), running the CPU-only
      XGBoost API on small on-demand instances — at least two replicas behind a load balancer with autoscaling
      on CPU/latency. Budget example: 2 × $0.04/h × 730 h ≈ $58/month. Retraining: a nightly batch job on a
      Spot GPU or large CPU instance (e.g. 3 h × $0.78/h × 30 ≈ $70/month), writing checkpoints to object
      storage every few minutes; on a 2-minute reclaim notice it saves state, and the scheduler restarts the
      job on a new instance from the last checkpoint. The new model is validated, versioned in the registry
      and rolled out via canary, so an interruption delays retraining but never affects the live API."
coding:
  - id: cheapest-safe-instance
    title: Pick the cheapest safe instance
    language: python
    level: core
    prompt: |
      Write two functions:

      - `monthly_cost(hourly, hours, spot_discount=0.0)` → cost in USD, rounded to 2 dp.
      - `choose(options, max_latency_ms, workload)` → the **name** of the cheapest option whose
        `compute_ms + network_ms ≤ max_latency_ms`. For `workload == "serving"` ignore Spot options entirely
        (they can be reclaimed); for `"training"` Spot is allowed. Serving runs 730 h/month, training 120 h.
        Return `None` if nothing qualifies.
    setup: |
      OPTIONS = [
          {"name": "cpu2-jnb", "hourly": 0.04, "compute_ms": 24, "network_ms": 42, "spot": False},
          {"name": "cpu2-kla", "hourly": 0.05, "compute_ms": 24, "network_ms": 8, "spot": False},
          {"name": "cpu8-jnb", "hourly": 0.16, "compute_ms": 9, "network_ms": 42, "spot": False},
          {"name": "cpu2-jnb-spot", "hourly": 0.0112, "compute_ms": 24, "network_ms": 42, "spot": True},
          {"name": "t4-jnb-spot", "hourly": 0.168, "compute_ms": 3.2, "network_ms": 42, "spot": True},
      ]
    starter: |
      def monthly_cost(hourly, hours, spot_discount=0.0):
          ...

      def choose(options, max_latency_ms, workload):
          ...

      print(choose(OPTIONS, 60, "serving"))
    solution: |
      def monthly_cost(hourly, hours, spot_discount=0.0):
          return round(hourly * (1 - spot_discount) * hours, 2)

      def choose(options, max_latency_ms, workload):
          hours = 730 if workload == "serving" else 120
          ok = [o for o in options
                if o["compute_ms"] + o["network_ms"] <= max_latency_ms and not (workload == "serving" and o["spot"])]
          if not ok:
              return None
          return min(ok, key=lambda o: monthly_cost(o["hourly"], hours))["name"]

      print(choose(OPTIONS, 60, "serving"))
    tests:
      - name: monthly_cost with and without a Spot discount
        code: |
          assert monthly_cost(0.04, 730) == 29.2
          assert monthly_cost(2.4, 20, spot_discount=0.75) == 12.0
      - name: Serving never uses Spot, and respects latency
        code: |
          assert choose(OPTIONS, 60, "serving") == "cpu2-kla", "cpu2-jnb is 66 ms; Spot isn't allowed for serving"
      - name: Training may use Spot
        code: |
          assert choose(OPTIONS, 100, "training") == "cpu2-jnb-spot"
      - name: Impossible budgets return None
        code: |
          assert choose(OPTIONS, 20, "serving") is None
