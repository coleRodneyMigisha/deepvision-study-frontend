id: object-detection
title: Object Detection
subtitle: Finding what is in a picture, and drawing a box around each thing
recap: |
  Classification says what is in a picture. Detection says what AND where: for every object it gives a
  category, a confidence score, and a box (a bounding box) around it. Two-stage detectors (Faster R-CNN) first
  suggest likely areas, then check each one carefully; one-stage detectors (YOLO) do everything in one quick
  look, fast enough for live video. IoU measures how much two boxes overlap. NMS cleans up the many duplicate
  boxes a detector draws on the same object. mAP is the overall score for a detector.
traps:
  - "Working out IoU as overlap ÷ (area A + area B). You must subtract the overlap once: union = A + B − overlap."
  - "Running NMS across different categories. Do it per category, or a car box could delete a person box."
  - "Setting the NMS IoU threshold so low that two real objects standing close together get merged into one."
lesson:
  checkpointStep: 3
  steps:
    - "Classification asks \"what is in this picture?\". Detection asks \"what, and where?\". For every object it
      gives a category, a confidence score, and a bounding box: a rectangle described by its position and size
      (x, y, width, height)."
    - "Two-stage detectors like Faster R-CNN first suggest likely areas with a Region Proposal Network, then
      classify and adjust each one. Accurate, but slower."
    - "One-stage detectors like YOLO (\"You Only Look Once\") predict boxes and categories in a single pass over a
      grid of cells. Very fast: the usual choice for live video."
    - "Checkpoint: explain Non-Maximum Suppression step by step, and say what IoU means."
    - "IoU (intersection over union) is the overlapping area of two boxes divided by the total area they cover
      together. 1 means the boxes are identical, 0 means they don't touch. IoU of 0.5 or more usually counts as a
      correct detection."
    - "Detectors draw many overlapping boxes on the same object. NMS sorts them by confidence, keeps the best,
      deletes any other box that overlaps it too much, and repeats."
    - "Detectors are scored with mean Average Precision (mAP). And one-stage detectors check thousands of spots
      that are mostly empty background, so focal loss makes training pay more attention to the hard cases."
checkpoint:
  question: Walk me through how Non-Maximum Suppression (NMS) works, and explain why it is necessary in object
    detection.
  hint: "Why would one car end up with several boxes? Then: sort the boxes by confidence, keep the top one, measure
    how much each other box overlaps it (IoU), remove the big overlaps, repeat."
  keywords:
    - duplicate
    - overlap
    - confidence
    - sort
    - highest
    - iou
    - intersection over union
    - threshold
    - suppress
    - remove
    - repeat
    - greedy
  idealAnswer: "A detector outputs many overlapping boxes for the same object, so NMS removes the duplicates. First
    drop boxes below a confidence threshold. Sort the rest by confidence, keep the highest, and compute its IoU
    (overlap area ÷ union area) with every remaining box of the same category. Remove (suppress) any box above a
    threshold like 0.5. Repeat with the next highest remaining box until none are left. It's greedy: it always
    keeps the most confident box first. Trade-off: too low a threshold deletes real objects in crowds; too high
    leaves duplicates."
terms:
  - term: Bounding box
    definition: The rectangle around an object, written as (x, y, w, h) or as two corners (x1, y1, x2, y2).
  - term: Confidence score
    definition: How sure the detector is that the box contains that object, from 0 to 1.
  - term: IoU (intersection over union)
    definition: The overlapping area of two boxes ÷ the total area they cover together. From 0 (no overlap) to 1
      (identical).
  - term: NMS (non-maximum suppression)
    definition: Cleaning up duplicate boxes by keeping the most confident one and removing boxes that overlap it too
      much.
  - term: Anchor box
    definition: A ready-made box shape placed all over the picture, which the detector stretches and shifts to fit
      real objects.
  - term: Two-stage vs one-stage detector
    definition: Two-stage first suggests areas and then checks each one (accurate, slower); one-stage predicts
      everything in one pass (fast).
  - term: mAP (mean Average Precision)
    definition: The usual overall score for a detector. Average precision per category (area under its
      precision–recall curve), then averaged over categories.
  - term: Focal loss
    definition: A loss that counts easy examples (obvious background) less, so training focuses on the hard ones.
quiz:
  - question: Boxes A and B are both 10×10 and overlap in a 5×10 strip. What is their IoU?
    options:
      - "0.5"
      - "0.25"
      - "0.33"
      - "0.67"
    answer: 2
    explanation: Overlap = 5 × 10 = 50. Total area covered = 100 + 100 − 50 = 150. IoU = 50 / 150 ≈ 0.33.
  - question: Raising the NMS IoU threshold from 0.3 to 0.8 will…
    options:
      - Remove more boxes
      - Keep more (possibly duplicate) boxes
      - Change the categories
      - Have no effect
    answer: 1
    explanation: A box is only removed if it overlaps the kept box by more than the threshold. A higher threshold
      removes fewer boxes.
  - question: A predicted box overlaps the real (ground-truth) box with IoU = 0.62. With the usual threshold, does it
      count as correct?
    options:
      - "Yes"
      - "No"
      - Only if confidence > 0.9
      - IoU doesn't matter
    answer: 0
    explanation: The common rule is IoU ≥ 0.5, and 0.62 passes.
  - question: What does the Region Proposal Network do in Faster R-CNN?
    options:
      - Classifies the whole picture
      - Suggests areas that might contain objects
      - Runs NMS
      - Computes mAP
    answer: 1
    explanation: It's the first of the two stages; the second stage checks and adjusts each suggested area.
  - question: Why was focal loss invented?
    options:
      - To speed up NMS
      - To handle one-stage detectors seeing far more background than objects
      - To compute IoU
      - To resize pictures
    answer: 1
    explanation: Most of the spots a one-stage detector checks are empty background. Focal loss counts those easy
      cases less.
  - question: Lowering the NMS IoU threshold from 0.7 to 0.3 tends to…
    options:
      - Keep more duplicate boxes
      - "Suppress more boxes, including nearby distinct objects"
      - Change confidence scores
      - Have no effect
    answer: 1
    explanation: With a low threshold, even a small overlap gets a box removed, so two real objects side by side can
      lose one box.
  - question: How does mAP@[.5:.95] differ from mAP@0.5?
    options:
      - It uses more categories
      - "Averaging over stricter IoU thresholds, rewarding precise boxes"
      - It ignores confidence
      - It counts only large objects
    answer: 1
    explanation: It averages the score at IoU 0.5, 0.55, … up to 0.95, so sloppy boxes lose marks. This is the COCO
      benchmark's main score.
  - question: For live video on a small camera computer, which detector family is the usual choice?
    options:
      - Two-stage Faster R-CNN
      - One-stage YOLO-style
      - A sliding window with a CNN
      - None
    answer: 1
    explanation: One-stage detectors do everything in one pass, so they're fast enough for real time.
fact:
  title: Detectors that skip NMS
  body: DETR (2020) predicted the whole set of boxes at once and matched them to real objects one-to-one, so it
    needed no NMS. YOLOv10 (2024) brought NMS-free training to YOLO, and Ultralytics' YOLO26 continues that
    design for faster, more predictable use on small devices.
lab:
  title: IoU & NMS simulator
  variations:
    - title: Horizontal Strip Overlap IoU
      question: Box A = <code>(0, 0, 10, 10)</code> and Box B = <code>(5, 0, 15, 10)</code> in <code>(x1, y1, x2,
        y2)</code> form. What is their <b>IoU</b>? (2 decimals)
      answer: 0.33
      tolerance: 0.01
      hint: Intersection width = 10 − 5 = 5, height = 10. Union = Area(A) + Area(B) − Intersection.
      explanation: Intersection = 5 × 10 = 50. Union = 100 + 100 − 50 = 150. IoU = 50 / 150 = 0.333 ≈ 0.33.
    - title: 2D Corner Overlap IoU
      question: Box A = <code>(0, 0, 20, 20)</code> and Box B = <code>(10, 10, 30, 30)</code>. Compute their exact
        <b>IoU</b> (to 2 decimals).
      answer: 0.14
      tolerance: 0.01
      hint: Overlap is from (10,10) to (20,20) → 10×10 = 100. Each box has area 400.
      explanation: Intersection = 10 × 10 = 100. Union = 400 + 400 − 100 = 700. IoU = 100 / 700 = 0.1428 ≈ 0.14.
    - title: NMS Surviving Box Count
      question: Four 'car' boxes have confidences <b>0.92, 0.85, 0.70, 0.25</b>. Confidence threshold is
        <b>0.30</b>, NMS IoU threshold is <b>0.50</b>. The top box (0.92) has IoU <b>0.68</b> with the 0.85
        box and IoU <b>0.15</b> with the 0.70 box. How many boxes survive NMS?
      answer: 2
      tolerance: 0
      hint: "First throw away boxes under 0.30 confidence. Keep the most confident box (0.92). Then remove any other box that overlaps it by more than IoU 0.50."
      explanation: 0.25 is dropped (<0.30). 0.92 is kept. 0.85 is suppressed (IoU 0.68 > 0.50). 0.70 survives (IoU
        0.15 ≤ 0.50). Total surviving = 2.
notes:
  - heading: From "what" to "what and where"
    body: |
      **The idea:** classification is like saying "there's a cat in this photo". Detection is like drawing a box around every cat, dog and car, and labelling each box.

      A classifier gives one label per picture. An **object detector** gives a list, and for each object:

      - a **category** ("car", "person"),
      - a **confidence score** from 0 to 1 (how sure it is),
      - a **bounding box**: a rectangle given as two corners (x1, y1, x2, y2) or as a position and size (x, y, w, h).

      A detector learns two things at once, so it's trained with two losses: a **classification loss** (is the category right?) and a **regression loss** (are the box's numbers right?). Many detectors start from **anchor boxes**, ready-made rectangles of several shapes and sizes spread across the picture, and learn how to stretch and shift them to fit the real objects.
  - heading: Two-stage vs one-stage detectors
    body: |
      **The idea:** a two-stage detector is like scanning a crowd for interesting faces, then studying each one closely. A one-stage detector takes one quick look at everything at once.

      | | Two-stage (Faster R-CNN) | One-stage (YOLO, SSD, RetinaNet) |
      |---|---|---|
      | How it works | 1) a Region Proposal Network suggests a few hundred likely areas; 2) each one is classified and its box adjusted | predicts categories and boxes for every grid cell (or anchor) in one pass |
      | Speed | slower | fast, works on live video |
      | Accuracy | traditionally higher, especially for small objects | close or equal in modern versions |

      **A one-stage problem:** it checks tens of thousands of spots, and almost all of them are empty background. Training gets swamped by these easy "nothing here" cases. **Focal loss** (from RetinaNet) fixes this by counting easy, already-correct examples much less:

      $$\text{FL} = -(1 - p)^{\gamma} \log p$$

      Here *p* is the probability given to the right answer. If the model is already 95% sure (p = 0.95) and γ = 2, the factor (1 − 0.95)² = 0.0025 shrinks that example's loss to almost nothing, so the hard cases dominate.
  - heading: IoU and Non-Maximum Suppression
    body: |
      **IoU (intersection over union)** measures how much two boxes overlap:

      $$\text{IoU} = \frac{\text{area of overlap}}{\text{area covered by either box}} = \frac{|A \cap B|}{|A| + |B| - |A \cap B|}$$

      We subtract the overlap once in the bottom line, because adding both areas counts it twice. IoU is **1** for identical boxes and **0** if they don't touch. A prediction usually counts as correct if its IoU with the real box is **0.5 or more**.

      **Tiny example:** two 10 × 10 boxes overlap in a 5 × 10 strip. Overlap = 50, union = 100 + 100 − 50 = 150, IoU = 50 / 150 ≈ **0.33**.

      **Why NMS is needed.** A detector often draws several slightly different boxes on the same car. **Non-Maximum Suppression (NMS)** cleans up, separately for each category:

      1. Throw away boxes below a confidence threshold.
      2. Sort the rest from most to least confident.
      3. Keep the top box. Remove every other box whose IoU with it is above the NMS threshold (e.g. 0.5): those are duplicates.
      4. Repeat with the next most confident box that's left.

      **Choosing the threshold:** a low NMS threshold removes boxes aggressively and may delete a real object standing right next to another one in a crowd; a high one leaves duplicates.
  - heading: Scoring a detector with mAP
    body: |
      **The idea:** a good detector finds most objects (high recall) without too many false alarms (high precision), at every confidence level. mAP rolls that into one number.

      **Mean Average Precision (mAP):**

      1. For one category, sort all the predicted boxes by confidence. Go down the list and mark each as a **true positive** (it matches a real object, not already matched, with IoU above the threshold) or a **false positive**.
      2. Plotting precision against recall as you go gives a **precision–recall curve**. **AP** (average precision) is the area under it.
      3. **mAP** is the average AP across all categories.

      Always say which IoU threshold you used. **mAP@0.5** (the PASCAL VOC style) is lenient. **mAP@[.5:.95]** (the COCO style) averages over IoU thresholds from 0.5 to 0.95, so it rewards precise boxes. A detector can score well on mAP@0.5 but badly on COCO mAP if its boxes are sloppy.
examples:
  - title: IoU of two boxes
    problem: Box A has corners (10, 10) and (50, 50); box B has corners (30, 20) and (70, 60). What is their IoU?
    steps:
      - "Overlap width: from x = max(10, 30) = 30 to x = min(50, 70) = 50, so 20. Overlap height: from y = max(10, 20) = 20 to min(50, 60) = 50, so 30. Overlap area = 20 × 30 = **600**."
      - "Area A = 40 × 40 = 1,600. Area B = 40 × 40 = 1,600."
      - "Union = 1,600 + 1,600 − 600 = **2,600**."
      - "IoU = 600 / 2,600 ≈ **0.23**."
    answer: About 0.23.
    takeaway: Always subtract the overlap once when working out the union.
  - title: NMS by hand
    problem: "Three 'car' boxes: A (confidence 0.95), B (0.80, IoU with A = 0.72), C (0.60, IoU with A = 0.10, IoU with
      B = 0.15). The NMS threshold is 0.5. Which boxes survive?"
    steps:
      - "Sort by confidence: A, B, C. Keep **A**."
      - "B overlaps A with IoU 0.72, which is more than 0.5, so B is a duplicate: **remove B**."
      - "C overlaps A with IoU only 0.10, so it stays in the list."
      - "The next most confident box left is C: **keep C**."
    answer: A and C survive.
    takeaway: NMS removes duplicates of the same object but keeps separate objects.
questions:
  - question: Define IoU and explain Non-Maximum Suppression step by step.
    kind: short
    marks: 6
    keywords:
      - intersection
      - union
      - overlap
      - area
      - confidence threshold
      - sort
      - keep highest
      - suppress
      - iou threshold
      - per class
      - repeat
    idealAnswer: "IoU = area of intersection (overlap) ÷ area of union of two boxes, where union = area A + area B −
      intersection; 1 means identical boxes, 0 means no overlap. NMS, done per class (category): discard boxes below
      the confidence threshold, sort the rest by confidence, keep the highest, remove (suppress) every remaining box
      whose IoU with it exceeds the NMS threshold, then repeat with the next highest remaining box until none are
      left."
  - question: Compare two-stage and one-stage object detectors.
    kind: short
    marks: 5
    keywords:
      - two-stage
      - faster r-cnn
      - region proposal network
      - refine
      - accurate
      - slower
      - one-stage
      - yolo
      - single pass
      - grid
      - anchors
      - real-time
      - imbalance
      - focal loss
    idealAnswer: "Two-stage detectors like Faster R-CNN first suggest candidate areas with a Region Proposal Network,
      then classify and refine each box. They're traditionally more accurate, especially for small objects, but
      slower. One-stage detectors like YOLO predict categories and boxes for every grid cell or anchor in a single
      pass, fast enough for real-time video. But almost everything they check is background, a huge imbalance,
      which techniques like focal loss deal with."
  - question: You need to count vehicles at a busy Kampala junction from a roadside camera, in real time. Choose a
      detector, explain how you'd train and tune it (including the NMS and confidence thresholds), and how you'd
      evaluate it, noting the problems crowded scenes cause.
    kind: long
    marks: 12
    keywords:
      - one-stage
      - yolo
      - real-time
      - pretrained
      - coco
      - fine-tune
      - annotations
      - augmentation
      - confidence threshold
      - nms threshold
      - occlusion
      - crowded
      - small objects
      - map@0.5
      - map@[.5:.95]
      - precision
      - recall
      - count error
    idealAnswer: "Use a one-stage YOLO-family detector, because it's fast enough for real time. Start from a model
      pretrained on COCO (which already includes cars, buses and motorcycles) and fine-tune it on labelled frames
      (annotations) from this junction, covering different times of day, weather and crowding, with augmentation
      (scale, brightness, blur). Tune the confidence threshold on validation data to balance missed vehicles
      against false alarms. Tune the NMS IoU threshold carefully: too low removes vehicles packed side by side,
      like boda bodas; too high leaves duplicate boxes. Class-specific NMS or soft-NMS can help in crowds, where
      vehicles hide each other (occlusion) and many are small. Evaluate with per-class AP, mAP@0.5 and
      mAP@[.5:.95], recall on small and partly hidden vehicles, and the real goal: the counting error per minute
      compared with manual counts, while checking the frames per second on the actual camera hardware."
coding:
  - id: iou
    title: Intersection over Union
    language: python
    level: warm-up
    prompt: |
      Write `iou(a, b)` for boxes given as `(x1, y1, x2, y2)` with `x2 > x1` and `y2 > y1`.
      Return 0.0 when boxes don't overlap.
    starter: |
      def iou(a, b):
          ...
    solution: |
      def iou(a, b):
          ix = max(0.0, min(a[2], b[2]) - max(a[0], b[0]))
          iy = max(0.0, min(a[3], b[3]) - max(a[1], b[1]))
          inter = ix * iy
          union = (a[2] - a[0]) * (a[3] - a[1]) + (b[2] - b[0]) * (b[3] - b[1]) - inter
          return inter / union if union else 0.0
    tests:
      - name: Identical, disjoint and touching boxes
        code: |
          assert iou((0, 0, 10, 10), (0, 0, 10, 10)) == 1.0
          assert iou((0, 0, 10, 10), (20, 20, 30, 30)) == 0.0
          assert iou((0, 0, 10, 10), (10, 0, 20, 10)) == 0.0
      - name: Partial overlap
        code: |
          assert abs(iou((0, 0, 10, 10), (5, 0, 15, 10)) - 1 / 3) < 1e-9
          assert abs(iou((10, 10, 50, 50), (30, 20, 70, 60)) - 600 / 2600) < 1e-9
      - name: One box inside another
        code: |
          assert abs(iou((0, 0, 10, 10), (2, 2, 4, 4)) - 0.04) < 1e-9
  - id: nms
    title: Non-Maximum Suppression
    language: python
    level: exam
    setup: |
      def iou(a, b):
          ix = max(0.0, min(a[2], b[2]) - max(a[0], b[0])); iy = max(0.0, min(a[3], b[3]) - max(a[1], b[1]))
          inter = ix * iy
          return inter / ((a[2]-a[0])*(a[3]-a[1]) + (b[2]-b[0])*(b[3]-b[1]) - inter)

      DETECTIONS = [  # (box, score, class)
          ((60, 70, 210, 220), 0.95, "car"), ((80, 85, 230, 230), 0.82, "car"), ((45, 60, 190, 200), 0.64, "car"),
          ((260, 50, 330, 250), 0.91, "person"), ((270, 70, 345, 260), 0.55, "person"), ((350, 180, 420, 260), 0.22, "dog"),
      ]
    prompt: |
      Write `nms(detections, iou_threshold=0.5, score_threshold=0.3)` → list of **indices** of kept
      detections, ordered by descending score. Drop boxes below `score_threshold`; suppress only boxes of
      the **same class** whose IoU with a kept box is **greater than** `iou_threshold`. `iou` is provided.
    starter: |
      def nms(detections, iou_threshold=0.5, score_threshold=0.3):
          return list(range(len(detections)))
    solution: |
      def nms(detections, iou_threshold=0.5, score_threshold=0.3):
          order = sorted((i for i, d in enumerate(detections) if d[1] >= score_threshold),
                         key=lambda i: detections[i][1], reverse=True)
          keep = []
          while order:
              best = order.pop(0)
              keep.append(best)
              box, _, cls = detections[best]
              order = [i for i in order
                       if detections[i][2] != cls or iou(box, detections[i][0]) <= iou_threshold]
          return keep
    tests:
      - name: Keeps one car and one person, drops the low-score dog
        code: |
          assert nms(DETECTIONS) == [0, 3], f"got {nms(DETECTIONS)}"
      - name: A high IoU threshold keeps duplicates
        code: |
          assert nms(DETECTIONS, iou_threshold=0.9) == [0, 3, 1, 2, 4]
      - name: Different classes never suppress each other
        code: |
          dets = [((0, 0, 10, 10), 0.9, "car"), ((0, 0, 10, 10), 0.8, "person")]
          assert nms(dets) == [0, 1]
      - name: Score threshold applies before suppression
        code: |
          assert 5 in nms(DETECTIONS, score_threshold=0.2)
    hints:
      - Sort the surviving indices by score, take the first, filter the rest, repeat.
