coding:
  - id: to-tensor-normalize
    title: ToTensor + Normalize in NumPy
    language: python
    level: core
    setup: |
      import numpy as np
      rng = np.random.default_rng(0)
      img = rng.integers(0, 256, size=(4, 6, 3), dtype=np.uint8)   # H × W × C, like PIL/OpenCV
      MEAN = np.array([0.485, 0.456, 0.406])
      STD = np.array([0.229, 0.224, 0.225])
    prompt: |
      Re-implement what `transforms.ToTensor()` + `transforms.Normalize(MEAN, STD)` do:

      `preprocess(img)` takes an `H × W × 3` `uint8` array and returns a `3 × H × W` `float32` array:
      scale to [0, 1], move channels first (CHW), then normalise each channel with `MEAN`/`STD`.
      Also write `bgr_to_rgb(img)` — OpenCV loads images in BGR order.
    starter: |
      import numpy as np

      def preprocess(img):
          ...

      def bgr_to_rgb(img):
          ...
    solution: |
      import numpy as np

      def preprocess(img):
          x = img.astype(np.float32) / 255.0          # [0, 255] → [0, 1]
          x = np.transpose(x, (2, 0, 1))              # HWC → CHW
          return ((x - MEAN[:, None, None]) / STD[:, None, None]).astype(np.float32)

      def bgr_to_rgb(img):
          return img[..., ::-1]
    tests:
      - name: Shape is CHW and dtype float32
        code: |
          out = preprocess(img)
          assert out.shape == (3, 4, 6), f"expected (3, 4, 6), got {out.shape}"
          assert out.dtype == np.float32
      - name: Values match the formula per channel
        code: |
          out = preprocess(img)
          r, c, ch = 2, 3, 1
          exp = (img[r, c, ch] / 255 - MEAN[ch]) / STD[ch]
          assert abs(out[ch, r, c] - exp) < 1e-5, f"channel {ch} at ({r},{c}) should be {exp:.4f}"
      - name: A white red pixel becomes ≈ 2.25
        code: |
          w = np.full((1, 1, 3), 255, dtype=np.uint8)
          assert abs(preprocess(w)[0, 0, 0] - 2.2489) < 1e-3
      - name: bgr_to_rgb reverses the channel order
        code: |
          px = np.array([[[10, 20, 30]]], dtype=np.uint8)
          assert bgr_to_rgb(px).tolist() == [[[30, 20, 10]]]
    hints:
      - "`np.transpose(x, (2, 0, 1))` moves the last axis first."
      - Reshape MEAN to (3, 1, 1) — `MEAN[:, None, None]` — so it broadcasts over H and W.
  - id: grayscale
    title: Luminance grayscale
    language: python
    level: warm-up
    setup: |
      import numpy as np
      img = np.array([[[255, 0, 0], [0, 255, 0], [0, 0, 255], [255, 255, 255]]], dtype=np.uint8)
    prompt: |
      Write `to_gray(img)` converting an `H × W × 3` RGB `uint8` image to `H × W` `uint8` using
      **Y = 0.299 R + 0.587 G + 0.114 B**, rounded to the nearest integer. Why is green weighted most?
      Answer in a comment.
    starter: |
      import numpy as np

      def to_gray(img):
          return img.mean(axis=2).astype(np.uint8)   # ✗ equal weights
    solution: |
      import numpy as np

      # Human vision is most sensitive to green, so green contributes most to perceived brightness.
      def to_gray(img):
          y = img.astype(np.float64) @ np.array([0.299, 0.587, 0.114])
          return np.clip(np.round(y), 0, 255).astype(np.uint8)
    tests:
      - name: Uses the luminance weights
        code: |
          assert to_gray(img).tolist() == [[76, 150, 29, 255]], f"got {to_gray(img).tolist()}"
      - name: Output is H × W uint8
        code: |
          g = to_gray(img)
          assert g.shape == (1, 4) and g.dtype == np.uint8
