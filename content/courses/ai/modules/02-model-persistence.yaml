id: model-persistence
title: "Model Persistence: Pickle vs Joblib & Pipeline Packaging"
subtitle: Saving a trained model to a file, and loading it back safely in the live service
recap: |
  A trained model only exists in the computer's memory until the program ends. Serialisation saves it as a file
  so it can be loaded later, somewhere else. For models full of number arrays (like scikit-learn models), joblib
  is faster and smaller than Python's built-in pickle. Always save the whole Pipeline (the preparation steps plus
  the model); otherwise the live service receives raw, unprepared inputs and gives wrong answers. And because
  loading a pickle or joblib file can run hidden code, only load files you made yourself and can verify.
traps:
  - "Saving only the classifier, then rewriting the preparation steps inside the API. Any difference gives wrong
    predictions."
  - "Loading a .pkl model file from an unknown website or email. Loading it can run an attacker's code."
  - "Saving with one library version and loading with another. Pin (fix) the versions."
lesson:
  checkpointStep: 3
  steps:
    - "Once a model is trained, it lives in the computer's memory, and disappears when the Python program ends.
      Serialisation turns the live model into bytes that can be saved to disk or sent over a network."
    - "Python comes with pickle for this. But for models containing big arrays of numbers (like random forests or
      SVMs), joblib is much faster and makes smaller files."
    - "Joblib can read big arrays straight from disk without copying them (memory-mapping) and compress them well.
      But saving just the classifier on its own is a serious mistake in practice."
    - "Checkpoint: why must the scalers and encoders be saved together with the model, and what security danger comes
      with loading (unpickling) files you don't trust?"
    - "If you only save the XGBoost classifier, the raw request a hospital app sends hasn't been scaled or one-hot
      encoded, so you get nonsense predictions, or an instant crash because the input has the wrong shape."
    - "Worse, loading a pickle or joblib file can run code hidden inside it (via the __reduce__ method). Never load
      model files from unknown websites without checking a checksum (a fingerprint) or using a trusted model
      registry."
checkpoint:
  question: Explain why saving an isolated model estimator without its preprocessing pipeline breaks production
    deployments, and describe the security vulnerability inherent in Python pickle deserialization.
  hint: "The model learned from prepared (scaled, encoded) data. What does it receive in the live service if the
    preparation steps weren't saved? Then: what can a booby-trapped pickle file make your server do when it's loaded
    (think about __reduce__)?"
  keywords:
    - pipeline
    - train-serve skew
    - preprocessor
    - scaler
    - encoder
    - pickle
    - joblib
    - security
    - arbitrary code
    - reduce
    - vulnerability
  idealAnswer: "The model was trained on prepared data, so saving it without its preprocessing pipeline causes
    train-serve skew: raw requests can't be used directly. Number columns must be rescaled with the exact scaler
    learned in training, and text categories turned into columns with the exact same one-hot encoder. Bundling the
    preprocessor and model into one end-to-end Pipeline object guarantees identical preparation. On security,
    pickle (and joblib, which uses it) isn't safe: loading a file can call any function the file asks for, through
    __reduce__. That vulnerability means an attacker can run arbitrary code, such as commands on your server, just
    by getting it to call pickle.load() on a booby-trapped file."
terms:
  - term: Serialisation
    definition: Turning a live object in memory (like a trained model) into bytes in a file; deserialisation turns it
      back.
  - term: pickle
    definition: Python's built-in way of saving almost any object to a file.
  - term: joblib
    definition: A library built on pickle that's faster and smaller for objects full of number arrays, like
      scikit-learn models.
  - term: Memory-mapping
    definition: Reading a big array straight from the file on disk when needed, instead of copying it all into
      memory.
  - term: Train-serve skew
    definition: When features are prepared differently in the live service than in training, giving wrong predictions.
  - term: End-to-end pipeline
    definition: One object holding every step (gap-filling → scaling → one-hot encoding → classifier), saved and loaded
      together.
  - term: Arbitrary code execution
    definition: A security hole where loading a file lets an attacker run any commands they like on your computer.
  - term: Checksum (SHA-256)
    definition: A fingerprint of a file. If even one byte changes, the fingerprint changes, so you can verify a file
      wasn't tampered with.
quiz:
  - question: Why is joblib preferred over standard pickle for saving large Random Forest classifiers?
    options:
      - Joblib encrypts the weights
      - Joblib is optimized for NumPy arrays and supports efficient multi-threading and disk compression
      - Pickle cannot save trees
      - Joblib converts Python code to C++
    answer: 1
    explanation: A random forest is mostly big arrays of numbers. Joblib saves those efficiently, with fewer copies in
      memory and optional compression.
  - question: What should you do to prevent malicious remote code execution when loading saved ML models?
    options:
      - Only load model files from authenticated, signed registries and verify SHA-256 hashes
      - Rename .pkl files to .txt
      - Use Python 2 instead of Python 3
      - Disable garbage collection
    answer: 0
    explanation: Loading a pickle file can run any code hidden inside it, so only load model files from your own trusted
      storage, and check their SHA-256 fingerprint first.
  - question: Why is joblib preferred over pickle for scikit-learn models?
    options:
      - It's more secure
      - "It handles large NumPy arrays efficiently (compression, memory-mapping)"
      - It works with Java
      - It doesn't need Python
    answer: 1
    explanation: "scikit-learn models are mostly arrays of numbers, which joblib handles efficiently. Note: it is NOT safer than pickle."
  - question: Which artifact should the stroke API load?
    options:
      - The XGBClassifier only
      - The full fitted Pipeline with preprocessing
      - The training CSV
      - The notebook
    answer: 1
    explanation: The whole pipeline (preparation + model) guarantees the inputs are prepared exactly as in training.
  - question: What risk does pickle.load() carry?
    options:
      - Slow loading
      - It can execute arbitrary code from the file
      - It deletes the file
      - It changes predictions randomly
    answer: 1
    explanation: Loading the file can call any function it names (through __reduce__), so it can run an attacker's code.
  - question: A model saved with scikit-learn 1.3 is loaded in 1.5. What can happen?
    options:
      - Nothing
      - "Warnings, errors or changed behaviour"
      - It automatically upgrades
      - It becomes faster
    answer: 1
    explanation: It may fail to load or behave differently. Pin (fix) the versions so the live service matches training.
  - question: What belongs in model metadata?
    options:
      - Patient names
      - "Version, training date, library versions, feature names, metrics"
      - The API key
      - Nothing
    answer: 1
    explanation: Notes like the version, training date and feature names let you trace every prediction to the exact model and rebuild it.
  - question: How should you verify a model file before loading it in production?
    options:
      - Check its size
      - Compare its SHA-256 checksum with the registry
      - Open it in a text editor
      - Rename it
    answer: 1
    explanation: A checksum (fingerprint) or signature proves it is exactly the file you produced and hasn't been tampered with.
fact:
  title: Pickle Security in Production
  body: Major AI platforms like Hugging Face and PyTorch now recommend SafeTensors and ONNX over raw pickles
    because hundreds of public CVEs have demonstrated arbitrary remote code execution via poisoned pickle
    files.
lab:
  title: "Model Serialization Benchmark: Pickle vs Joblib & Pipeline Packaging"
  variations:
    - title: "NumPy Array Serialization: Pickle vs Joblib"
      question: A feature matrix of <b>1,000,000 float64 elements</b> occupies <b>8.0 MB</b> in raw pickle.
        Serialized with <code>joblib.dump(..., compress=3)</code>, it achieves a <b>62% size reduction</b>.
        What is the compressed file size in <b>MB</b>? (2 decimals)
      answer: 3.04
      tolerance: 0.05
      hint: Multiply 8.0 MB by (1 − 0.62) = 0.38.
      explanation: Compressed size = 8.0 × (1 − 0.62) = 8.0 × 0.38 = 3.04 MB. Joblib's native compression
        significantly reduces storage and cloud deployment bundle sizes.
    - title: Cold-Start Deserialization Latency Reduction
      question: Deserializing an uncompressed pickle model takes <b>45.0 ms</b> on serverless cold starts. Switching
        to memory-mapped Joblib (<code>mmap_mode='r'</code>) cuts model load time to <b>1.5 ms</b>. How many
        <b>milliseconds</b> are saved per cold start?
      answer: 43.5
      tolerance: 0.1
      hint: Subtract 1.5 ms from 45.0 ms.
      explanation: 45.0 − 1.5 = 43.5 ms saved. Memory mapping avoids reading the entire weight matrix into Python
        heap memory at startup.
    - title: Pipeline Preprocessor Feature Alignment
      question: A production <code>ColumnTransformer</code> takes raw patient dictionaries, imputes 2 missing
        fields, one-hot encodes 3 categorical features (generating <b>8 binary columns</b>), and passes <b>3
        numerical columns</b> unchanged. How many total columns enter the classifier?
      answer: 11
      tolerance: 0
      hint: Add 8 encoded columns + 3 numerical columns.
      explanation: 8 one-hot columns + 3 scaled numerical columns = 11 final feature columns fed into the estimator.
notes:
  - heading: What serialisation is for
    body: |
      **The idea:** a trained model is like a cake you just baked. Serialisation is the freezer: it keeps the cake so you can serve it later, somewhere else, without baking it again.

      A trained model lives in the computer's memory (RAM); when the Python program ends, it's gone. **Serialisation** converts the live object (its learned weights, its tree structures, the averages a scaler learned) into bytes that can be saved to disk or sent over a network. **Deserialisation** rebuilds it later, in another program or on another computer.

      That's what lets you **train once** (on a laptop or a GPU machine) and **serve many times** (in a container on Render, or on a hospital server).
  - heading: pickle vs joblib
    body: |
      **The idea:** both save Python objects. joblib is the specialist for objects packed with big arrays of numbers, which is exactly what scikit-learn models are.

      Python's built-in **pickle** handles almost any object. **joblib** builds on it but is tuned for objects that contain large NumPy arrays, like scikit-learn models (a random forest is mostly arrays of thresholds and leaf values):

      | | pickle | joblib |
      |---|---|---|
      | Large number arrays | copied byte by byte | stored efficiently; can be read straight from disk (memory-mapped) |
      | Compression | you do it yourself | built in: `compress=3` |
      | Several workers loading it | each loads a full copy | memory-mapped arrays can be shared |
      | Typical use | general Python objects | scikit-learn models and pipelines |

      ```python
      joblib.dump(pipeline, "models/stroke_pipeline.joblib", compress=3)   # save
      pipeline = joblib.load("models/stroke_pipeline.joblib")              # load
      ```

      For deep-learning models, or serving from other programming languages, you'd use those frameworks' own formats instead (PyTorch's `state_dict`, ONNX).
  - heading: Save the pipeline, not just the classifier
    body: |
      **The idea:** the model only understands prepared ingredients. If you freeze the cake but throw away the recipe for the icing, whatever you serve later won't be right.

      The model was trained on *prepared* features: BMI gaps filled in, age and glucose rescaled, text categories turned into 0/1 columns. If you save only the `XGBClassifier`, the API receives raw input like `{"age": 67, "work_type": "Private"}` and either:

      - crashes (`could not convert string to float: 'Private'`), or, worse,
      - gets number-only rows that were never rescaled, and returns **confident nonsense**.

      That's train-serve skew. Saving the **whole fitted Pipeline** (preparation + model) means one object takes the raw input and does everything exactly as in training. Save a metadata file next to it too: model version, training date, library versions, feature names and validation scores.
  - heading: Unpickling is code execution
    body: |
      **The idea:** opening a pickle file isn't like opening a photo. It's like running a program, written by whoever made the file.

      pickle (and so joblib) rebuilds objects by **calling functions** that the file names, through the `__reduce__` mechanism. A booby-trapped file can tell the loader to run `os.system("…")`, i.e. any command on your server. Loading a model file is like running a program written by its creator.

      Rules for real services:

      - Only load model files **you** (or your automated build system) produced.
      - Check a **checksum** (a SHA-256 fingerprint) or a signature before loading, and keep models in a controlled **model registry** (MLflow, or a private storage bucket).
      - Never load a `.pkl` from an email attachment, a public website or a user upload.
      - **Pin library versions:** a model saved with scikit-learn 1.3 may fail to load, or behave differently, with 1.5.
examples:
  - title: Compressed artifact size
    problem: A 400-tree RandomForest has ~0.35 MB of arrays per tree. Saved with joblib at a 3.5× compression
      ratio, how large is the file?
    steps:
      - Uncompressed ≈ 400 × 0.35 = **140 MB**.
      - Compressed ≈ 140 ÷ 3.5 = **40 MB**.
      - "Trade-off: higher compression levels shrink the file but take longer to save and load."
    answer: About 40 MB.
    takeaway: Compression is a size-vs-speed dial, not free.
  - title: Diagnosing a broken API
    problem: "After deployment, /predict returns 500 with 'ValueError: could not convert string to float:
      Private'. Training accuracy was fine. What happened?"
    steps:
      - "'Private' is a work_type category — it reached the model as a raw string."
      - "So the deployed artifact has no OneHotEncoder in front of the model: only the classifier was saved."
      - "Fix: retrain/save the full Pipeline (ColumnTransformer + model) and load that in the API."
    answer: Only the classifier was serialised; save the whole preprocessing pipeline.
    takeaway: If preprocessing isn't inside the artifact, production won't do it.
questions:
  - question: Compare pickle and joblib for persisting machine-learning models.
    kind: short
    marks: 5
    keywords:
      - serialisation
      - numpy
      - arrays
      - compression
      - memory-mapping
      - mmap
      - workers
      - scikit-learn
      - both execute code
    idealAnswer: "Both serialise Python objects to bytes. joblib is optimised for objects containing large NumPy
      arrays — like scikit-learn models — storing them efficiently with built-in compression and
      memory-mapping so workers can share arrays, making it faster and smaller than plain pickle. Neither is
      safe for untrusted files: both can execute code on load."
  - question: Why must preprocessing be saved together with the model? Give the failure you would see if it isn't.
    kind: short
    marks: 5
    keywords:
      - preprocessing
      - scaler
      - encoder
      - imputer
      - pipeline
      - raw input
      - string
      - crash
      - unscaled
      - garbage
      - skew
    idealAnswer: "The model expects imputed, scaled and encoded features. If only the classifier is saved, the API
      feeds it raw input: categorical strings like 'Private' crash it with a ValueError, and unscaled numbers
      produce confident but wrong probabilities — training-serving skew. Saving the whole fitted Pipeline
      makes production apply exactly the training transformations."
  - question: Describe a safe, reproducible process for packaging and deploying the stroke model artifact, from
      training to loading in the API, including security controls.
    kind: long
    marks: 10
    keywords:
      - pipeline
      - joblib
      - compress
      - metadata
      - version
      - pinned
      - requirements
      - checksum
      - sha-256
      - registry
      - ci
      - trusted
      - load at startup
      - never untrusted
    idealAnswer: "Fit the full Pipeline (preprocessing + model) on training data and save it with joblib (e.g.
      compress=3), plus metadata: model version, date, feature names, metrics and exact library versions.
      Record its SHA-256 checksum and store both in a controlled model registry or private bucket, produced by
      CI rather than a laptop. The serving image pins the same library versions; at startup the API downloads
      the artifact, verifies the checksum, loads it once and reports the model version in responses. Never
      load pickles from untrusted sources (uploads, public URLs), because deserialisation can execute
      arbitrary code."
coding:
  - id: checksummed-artifacts
    title: Save and load with a checksum
    language: python
    level: core
    prompt: |
      Write two functions:

      - `save_model(obj, path)` — save with `joblib.dump(obj, path, compress=3)` and return the file's
        **SHA-256** hex digest.
      - `load_model(path, expected_sha256)` — compute the file's SHA-256 **before** loading; if it doesn't
        match, raise `ValueError` without unpickling. Otherwise return `joblib.load(path)`.

      This is the minimum safety net, because unpickling a file can run arbitrary code.
    starter: |
      import hashlib
      import joblib

      def save_model(obj, path):
          joblib.dump(obj, path)

      def load_model(path, expected_sha256):
          return joblib.load(path)   # ✗ loads anything
    solution: |
      import hashlib
      import joblib

      def _sha256(path):
          h = hashlib.sha256()
          with open(path, "rb") as f:
              for block in iter(lambda: f.read(1 << 20), b""):
                  h.update(block)
          return h.hexdigest()

      def save_model(obj, path):
          joblib.dump(obj, path, compress=3)
          return _sha256(path)

      def load_model(path, expected_sha256):
          if _sha256(path) != expected_sha256:
              raise ValueError(f"checksum mismatch for {path}: refusing to load")
          return joblib.load(path)
    tests:
      - name: Round-trip works and returns a SHA-256 digest
        code: |
          from sklearn.linear_model import LogisticRegression
          m = LogisticRegression().fit([[0], [1], [2], [3]], [0, 0, 1, 1])
          digest = save_model(m, "m.joblib")
          assert isinstance(digest, str) and len(digest) == 64, "return the hex SHA-256 digest"
          assert load_model("m.joblib", digest).predict([[3]])[0] == 1
      - name: A tampered file is refused before unpickling
        code: |
          digest = save_model({"w": [1, 2, 3]}, "w.joblib")
          with open("w.joblib", "ab") as f:
              f.write(b"tamper")
          try:
              load_model("w.joblib", digest)
              raise AssertionError("a file whose checksum changed must be rejected")
          except ValueError:
              pass
