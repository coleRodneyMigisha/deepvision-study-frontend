id: data-cleaning
title: Data Profiling, Validation & Cleaning
subtitle: Turning messy spreadsheets from the field into data you can trust (Lab 2)
recap: |
  Data collected in the real world is messy: missing prices, typos, the same row sent twice. Never edit the
  original (raw) file; keep it untouched in data/raw/ and write your cleaned version to data/processed/, so you
  can always start again. Work in three steps: profile (measure what's wrong without changing anything),
  validate (check the data follows agreed rules), then clean (fix it in a repeatable way). Fill missing prices
  with the median price of the same commodity, because prices differ a lot between commodities and a few huge
  typos would drag an average way off.
traps:
  - "Filling missing prices with the overall average (global mean). Different commodities and a few extreme typos
    make it wrong for everything."
  - "Overwriting the original CSV. If your cleaning code has a bug, the original data is gone for good."
  - "Removing duplicates by comparing every column. Use the columns that identify one observation (the business
    key: date, market, commodity)."
lesson:
  checkpointStep: 3
  steps:
    - "Every real data system starts with data you can't fully trust. In our Uganda market-price project, field
      workers (enumerators) send daily CSV files (spreadsheet-like text files) with missing prices, negative
      quantities, and the same market-commodity-date row sent twice."
    - "Rule number one of data engineering: never change the raw data. Don't overwrite
      data/raw/market_prices_dirty.csv. Instead, first measure it (profile), then check its rules (validate), and
      save the cleaned version separately in data/processed/."
    - "Profiling measures the data before you touch any value: its size, the type of each column, how many values
      are missing, how many different values there are, and its spread. Validation then checks firm rules:
      required columns exist, dates are real dates, and prices aren't negative."
    - "Checkpoint: why fill missing prices with the median price of the same commodity rather than the average of
      the whole dataset, and why must the raw data never be changed?"
    - "Market prices are lopsided (a few very high values) and differ hugely by commodity: beans at about 3,800
      UGX/kg, maize at about 1,800 UGX/kg. One overall average fits neither and gets pulled up by extreme typos.
      The middle value (median) of each commodity is much more reliable."
    - "While cleaning, we tidy text (spaces, capital letters), drop rows missing their identifying columns (date,
      market, commodity), remove duplicates of those columns, and deal with impossible values such as negative
      rainfall or prices."
checkpoint:
  question: Why should missing market prices be imputed using the per-commodity median rather than the overall
    dataset mean, and why is raw data kept strictly immutable?
  hint: "Think about how different bean and maize prices are, and what one huge typo does to an average. Then: what
    happens if you find a bug in your cleaning script two weeks later, and you've overwritten the original file?"
  keywords:
    - median
    - skew
    - outlier
    - robust
    - commodity
    - group
    - raw
    - immutable
    - reproducible
    - re-run
    - bug
    - audit
  idealAnswer: "Market prices are lopsided (skewed), contain extreme values (outliers), and differ between commodities
    (beans vs maize). An overall mean mixes these different price levels and is dragged by outliers. The median of
    each commodity group is robust (one extreme value can't move it much) and keeps each commodity's typical price.
    Raw data must stay immutable (never changed) so the pipeline is reproducible and auditable: if the cleaning
    logic changes or has a bug, we can re-run everything from the untouched source CSV without losing anything."
terms:
  - term: Raw data
    definition: The original data exactly as it arrived. Kept read-only in data/raw/.
  - term: Data profiling
    definition: Measuring the data before changing it. Row count, column types, how many values are missing, how many
      different values, and the spread.
  - term: Data contract
    definition: The agreed rules data must follow, e.g. these columns must exist, price_ugx > 0, rainfall_mm between 0
      and 500.
  - term: Validation
    definition: Checking the data against its contract, and stopping or rejecting rows that break the rules.
  - term: Imputation
    definition: Filling in a missing value with a best guess, e.g. the median price of the same commodity.
  - term: Mean vs median
    definition: The mean is the ordinary average. The median is the middle value when sorted; one extreme value
      barely moves it.
  - term: Composite business key
    definition: "The set of columns that together identify one observation: (date, market, commodity)."
  - term: Quartiles and IQR
    definition: Q1 is the value a quarter of the way up the sorted data, Q3 three-quarters of the way. IQR = Q3 − Q1,
      the spread of the middle half.
  - term: IQR outlier rule
    definition: Flag values below Q1 − 1.5·IQR or above Q3 + 1.5·IQR (Tukey's fences) as suspicious.
  - term: Immutability of raw data
    definition: Never changing data/raw/; always writing the cleaned results to data/processed/ instead.
quiz:
  - question: A dataset has Q1 = 2,000 UGX and Q3 = 3,200 UGX. Where is the upper Tukey fence (Q3 + 1.5 × IQR)?
    options:
      - 4,400 UGX
      - 5,000 UGX
      - 3,800 UGX
      - 6,200 UGX
    answer: 1
    explanation: The middle-half spread IQR = 3,200 − 2,000 = 1,200. Upper fence = 3,200 + 1.5 × 1,200 = 3,200 + 1,800
      = 5,000 UGX. Prices above it are flagged.
  - question: 10,000 raw rows; 4% are missing their identifying columns, and 5% of the remaining rows are duplicates. How
      many clean rows are left?
    options:
      - 9,100
      - 9,120
      - 9,500
      - 9,000
    answer: 1
    explanation: "Drop the 4% first: 10,000 × 0.96 = 9,600. Then drop 5% of those: 9,600 × 0.95 = 9,120."
  - question: Which step should come first when cleaning data?
    options:
      - Fill in missing prices
      - Profile (measure) the dataset
      - Drop duplicates
      - Write to data/processed/
    answer: 1
    explanation: Profiling tells you what is wrong and how much, without changing anything.
  - question: Three rows say "Owino", "owino " and "OWINO". What happens if you group by market before tidying the text?
    options:
      - They merge automatically
      - Owino is counted as three different markets
      - The query fails
      - Only the first row is kept
    answer: 1
    explanation: To a computer, different spaces or capital letters make different text. Tidy the text first (remove
      spaces, use the same capitals).
  - question: Which columns identify one observation (the business key) in the market-price data?
    options:
      - (date)
      - (market, commodity)
      - (date, market, commodity)
      - (price_ugx)
    answer: 2
    explanation: One observation is one commodity, in one market, on one day. Duplicates are rows that repeat that
      combination.
  - question: Why add a price_imputed column (True/False)?
    options:
      - It makes the file smaller
      - So analysts can tell real prices from filled-in guesses
      - Pandas requires it
      - It speeds up groupby
    answer: 1
    explanation: Filled-in values are estimates. Marking them stops people treating them as real measurements.
  - question: The contract says rainfall_mm must be between 0 and 500. A row says 812. What should validation do?
    options:
      - Quietly change it to 500
      - Flag or reject the row as the contract says
      - Ignore it
      - Replace it with the average
    answer: 1
    explanation: Validation enforces the rules. Any fix, such as capping at 500, is a separate cleaning decision that
      you write down, never a silent change.
  - question: Q1 = 1,600 and Q3 = 2,400. Where is the lower Tukey fence?
    options:
      - "400"
      - "800"
      - 1,200
      - "0"
    answer: 0
    explanation: IQR = 2,400 − 1,600 = 800. Lower fence = 1,600 − 1.5 × 800 = 400.
fact:
  title: Garbage in, garbage out costs billions
  body: The research firm Gartner estimates bad data costs organisations an average of $12.9 million a year. In real
    machine-learning systems, fixing a wrong column type or unit when the data comes in almost always helps more
    than fine-tuning the model.
lab:
  title: Data Profiler, Tukey Outlier Gate & Median Imputer
  variations:
    - title: Tukey 1.5×IQR Upper Outlier Fence
      question: In `market_prices_dirty.csv`, beans prices have <b>Q1 = 2,200 UGX</b> and <b>Q3 = 3,400 UGX</b>.
        What is the exact upper Tukey outlier fence (<code>Q3 + 1.5 × IQR</code>)?
      answer: 5200
      tolerance: 0
      hint: First compute IQR = Q3 − Q1 = 3,400 − 2,200 = 1,200, then add 1.5 × 1,200 to Q3.
      explanation: IQR = 3,400 − 2,200 = 1,200 UGX. Upper fence = 3,400 + 1.5 × 1,200 = 3,400 + 1,800 = 5,200 UGX.
    - title: Multi-Stage Cleaning Retention Count
      question: A raw batch has <b>5,000</b> rows. Validation drops <b>6%</b> for missing primary keys, and
        deduplication removes <b>10%</b> of the remaining rows. How many clean rows are written to
        `data/processed/`?
      answer: 4230
      tolerance: 0
      hint: Remaining after primary key check = 5,000 × 0.94. Then multiply that result by 0.90.
      explanation: "After dropping 6% missing keys: 5,000 × 0.94 = 4,700 rows. After removing 10% duplicates: 4,700
        × 0.90 = 4,230 clean rows."
    - title: Per-Commodity Median Imputation vs Mean Distortion
      question: Five observed maize prices in Owino are <b>[1800, 1900, 2000, 2100, 9700]</b> UGX (where 9700 is a
        data-entry typo). By how many UGX does the <b>mean</b> exceed the <b>median</b>?
      answer: 1500
      tolerance: 0
      hint: The median of the 5 sorted numbers is the 3rd value (2000). Compute the mean of all 5 and subtract 2000.
      explanation: Mean = (1800 + 1900 + 2000 + 2100 + 9700) / 5 = 17,500 / 5 = 3,500 UGX. Median = 2,000 UGX.
        Difference = 3,500 − 2,000 = 1,500 UGX.
notes:
  - heading: Why raw data can't be trusted
    body: |
      **The idea:** data is typed by tired people on phones at busy markets, sent by sensors that drop signal, and merged by hand. Each of those steps causes its own kind of mistake. Before fixing anything, **name the mistake.**

      | Kind of error | Example in the market-price data | What it breaks |
      |---|---|---|
      | Missing values | `price_ugx` is blank | averages, model training |
      | Impossible values | `price_ugx = -1500`, `rainfall_mm = 900` | every total or average that includes them |
      | Inconsistent text | `"owino "`, `"OWINO"`, `"Owino"` | grouping and joining quietly split one market into three |
      | Duplicates | the same (date, market, commodity) row sent twice | totals and counts come out too big |
      | Unreadable values | `date = "bad-date"` | time calculations crash or drop rows |

      Each kind needs a *different* fix. Treating them all as "dirty, delete it" throws away useful information and hides the real problem from whoever collected the data.
  - heading: Profile → validate → clean, in that order
    body: |
      **The idea:** a doctor examines you before treating you. Do the same with data: measure, check, then fix.

      **1. Profiling: measure without changing anything.** Count the rows; check each column's type (number, text, date); count missing values per column; count how many different values each column has (its *cardinality*); find the smallest, largest and middle values (*quantiles*). A profile turns "the data looks messy" into facts like *4.2% of prices are missing and 38 rows are negative*, which you can report and check again next week.

      **2. Validation: check the rules (the data contract).** The required columns exist; `date` is a real date in the standard YYYY-MM-DD format (ISO-8601); `price_ugx > 0`; `rainfall_mm` is between 0 and 500; and no (date, market, commodity) combination appears twice. Validation answers "is this data allowed into the pipeline?" If the contract fails, the pipeline should stop loudly rather than let bad rows slip through.

      **3. Cleaning: apply repeatable, written-down fixes.** Tidy text (`strip().title()` removes extra spaces and fixes capitals), turn date text into real dates, drop rows missing any part of the business key, remove duplicates of that key, cap or reject impossible values, and fill in (impute) the rest.

      **Order matters.** Clean before profiling and you can't say how dirty the data was. Validate before tidying text and `" owino"` fails a check it should pass.
  - heading: Why the per-commodity median
    body: |
      **The idea:** to guess a missing maize price, look at other maize prices, and use the middle one, not the average.

      **Imputation** means filling a missing value with a best guess. Which guess?

      - The **overall average (global mean)** mixes every commodity together. Beans (about 3,800 UGX/kg) and maize (about 1,800 UGX/kg) average to a price that's wrong for *both*.
      - An average is also **pulled by extreme values (outliers)**. One typo of 97,000 instead of 9,700 drags it far from a normal price.
      - The **median** is the middle value once the prices are sorted, so one extreme value can hardly move it. It's *robust*. Working it out **per commodity** (`groupby("commodity")`) keeps each commodity's own price level.

      **Tiny example:** maize prices 1,800, 1,900, 2,000, 2,100 and a typo of 9,700. The mean is 17,500 / 5 = 3,500 (higher than every real price!). The median is the middle value, 2,000.

      ```python
      # for each commodity, fill missing prices with that commodity's median
      df["price_ugx"] = df.groupby("commodity")["price_ugx"].transform(lambda s: s.fillna(s.median()))
      ```

      A filled-in value is still a guess. Good pipelines add a flag column (e.g. `price_imputed = True`) so analysts and models can tell real prices from estimates.
  - heading: Raw data is immutable
    body: |
      **The idea:** keep the original receipt. You can always redo the sums, but you can't get the receipt back once it's thrown away.

      The rule: **never change anything in `data/raw/`**. Read from it; write cleaned results to `data/processed/`.

      Why it matters:

      1. **Reproducibility:** anyone can rerun the pipeline from the same inputs and get the same outputs.
      2. **Recovery:** two weeks later you find the cleaning script dropped good rows. If you overwrote the raw file, that data is gone. If you didn't, you fix the script and run it again.
      3. **Auditability:** you can always show exactly what came in, and what each step did to it.

      **The outlier rule (Tukey's fences).** Sort the values. **Q1** is the value a quarter of the way up, **Q3** three-quarters of the way up, and **IQR = Q3 − Q1** is the spread of the middle half. Values outside **[Q1 − 1.5·IQR, Q3 + 1.5·IQR]** are *flagged* as outliers. Whether you then drop, cap or keep them is a decision you explain; the formula only raises a flag.
examples:
  - title: Tukey fences on beans prices
    problem: In one week, beans prices have Q1 = 3,200 UGX (a quarter of prices are below this) and Q3 = 4,000 UGX
      (three-quarters are below this). One row shows 6,900 UGX. Is it an outlier by the 1.5×IQR rule?
    steps:
      - The spread of the middle half, IQR = Q3 − Q1 = 4,000 − 3,200 = **800 UGX**.
      - Upper fence = Q3 + 1.5 × IQR = 4,000 + 1,200 = **5,200 UGX**. Lower fence = 3,200 − 1,200 = **2,000
        UGX**.
      - 6,900 > 5,200, so the row is **flagged** as an outlier.
      - "Check before deleting: is it a typo (e.g. 690 × 10), a different unit (per sack, not per kg), or a
        genuine price spike? The fence flags; you decide."
    answer: Yes — it is above the 5,200 UGX upper fence.
    takeaway: The fence is a flag for investigation, not an automatic delete.
  - title: Mean vs median imputation
    problem: "Five maize prices in Owino market: 1,800, 1,900, 2,000, 2,100 and a typo of 9,700. A sixth price is
      missing. What would filling it with the mean, or with the median, put in?"
    steps:
      - Mean = (1,800 + 1,900 + 2,000 + 2,100 + 9,700) / 5 = 17,500 / 5 = **3,500 UGX**.
      - Sorted, the middle value is **2,000 UGX** — that's the median.
      - Filling with the mean would invent a price 67% higher than any real maize price (3,500 vs 2,100); the median
        stays at a realistic level.
    answer: Mean fills 3,500 UGX; median fills 2,000 UGX.
    takeaway: One bad value is enough to make the average misleading. That's what "not robust" means.
questions:
  - question: Describe the difference between profiling, validation and cleaning, giving one concrete example of
      each for the market-price data.
    kind: short
    marks: 6
    keywords:
      - profiling
      - measure
      - null rate
      - validation
      - contract
      - rule
      - cleaning
      - fix
      - standardise
      - impute
    idealAnswer: Profiling measures the data without changing it — e.g. computing that 4.2% of price_ugx is
      missing and 38 rows are negative. Validation enforces the data contract and decides whether data may
      enter the pipeline — e.g. date must parse as ISO-8601 and price_ugx must be > 0. Cleaning applies
      deterministic fixes — e.g. strip().title() on market names, dropping rows missing the business key,
      de-duplicating on (date, market, commodity) and imputing missing prices with the per-commodity median.
  - question: A colleague imputed missing prices with the global mean and overwrote data/raw/market_prices.csv.
      Explain the two problems and how you would fix the pipeline.
    kind: short
    marks: 6
    keywords:
      - global mean
      - commodity
      - skew
      - outlier
      - median
      - robust
      - immutable
      - raw
      - re-run
      - reproducible
    idealAnswer: "First, the global mean mixes commodities with very different price levels and is pulled by
      outliers, so it produces unrealistic values for every commodity; the per-commodity median is robust and
      preserves each commodity's level. Second, overwriting raw data destroys the original evidence: the
      change can't be audited or undone. Fix: restore the raw file from source, treat data/raw/ as read-only,
      write outputs to data/processed/, impute with groupby('commodity') median plus an imputed flag, and
      rerun."
  - question: Design a cleaning pipeline for a raw daily market-price CSV. For each stage, state what it does,
      what it outputs, and how you would prove that no rows were lost unexpectedly.
    kind: long
    marks: 12
    keywords:
      - profile
      - validate
      - contract
      - standardise
      - business key
      - deduplicate
      - median
      - impute
      - outlier
      - iqr
      - immutable
      - processed
      - row counts
      - log
    idealAnswer: "1) Profile the raw file (types, null rates, cardinality, quantiles) and save the report. 2)
      Validate the contract: required columns, ISO dates, price_ugx > 0, rainfall in range, uniqueness of
      (date, market, commodity); failures stop the run or are written to a rejects file with reasons. 3)
      Standardise strings (strip/title), parse dates and numeric types. 4) Drop rows missing any part of the
      business key; de-duplicate on the key. 5) Flag outliers with Tukey fences and decide (cap, keep or
      reject) explicitly. 6) Impute remaining missing prices with the per-commodity median and add
      price_imputed. 7) Write atomically to data/processed/ (Parquet). Prove no unexpected loss by logging row
      counts in and out of every stage and asserting rows_in = rows_out + rows_rejected + duplicates_removed,
      while data/raw/ is never modified."
coding:
  - id: profile-and-fence
    title: Profile the batch & compute Tukey fences
    language: python
    level: warm-up
    files:
      - market_prices_dirty.csv
    prompt: |
      Before cleaning anything, **measure** it. `market_prices_dirty.csv` is in your working directory.

      1. `null_rates(df)` → a dict mapping every column name to the **% of missing values**, rounded to 1 dp.
      2. `tukey_fences(values)` → a tuple `(lower, upper)` with `Q1 − 1.5·IQR` and `Q3 + 1.5·IQR`
         (use pandas' default quantiles). It must accept a list or a Series.
    starter: |
      import pandas as pd

      df = pd.read_csv("market_prices_dirty.csv")

      def null_rates(df):
          """{column: % missing, rounded to 1 dp}"""
          ...

      def tukey_fences(values):
          """(Q1 - 1.5*IQR, Q3 + 1.5*IQR)"""
          ...

      print(null_rates(df))
      print(tukey_fences(df["price_ugx"].dropna()))
    solution: |
      import pandas as pd

      df = pd.read_csv("market_prices_dirty.csv")

      def null_rates(df):
          return {c: round(df[c].isna().mean() * 100, 1) for c in df.columns}

      def tukey_fences(values):
          s = pd.Series(values, dtype="float64")
          q1, q3 = s.quantile(0.25), s.quantile(0.75)
          iqr = q3 - q1
          return (q1 - 1.5 * iqr, q3 + 1.5 * iqr)

      print(null_rates(df))
      print(tukey_fences(df["price_ugx"].dropna()))
    tests:
      - name: null_rates covers every column
        code: |
          r = null_rates(df)
          assert isinstance(r, dict), "null_rates must return a dict"
          assert set(r) == set(df.columns), f"expected keys {list(df.columns)}"
      - name: null_rates gives percentages rounded to 1 dp
        code: |
          r = null_rates(df)
          exp = round(df["price_ugx"].isna().mean() * 100, 1)
          assert r["price_ugx"] == exp, f"price_ugx should be {exp}% missing, got {r['price_ugx']}"
          assert r["date"] == 0.0
      - name: tukey_fences on a simple list
        code: |
          lo, hi = tukey_fences([1, 2, 3, 4, 5, 6, 7, 8])
          assert abs(lo - (-2.5)) < 1e-9 and abs(hi - 11.5) < 1e-9, f"expected (-2.5, 11.5), got {(lo, hi)}"
      - name: tukey_fences uses quartiles, not min/max
        code: |
          lo, hi = tukey_fences([10, 11, 12, 13, 14, 1000])
          assert hi < 1000, "an extreme value should fall outside the upper fence"
    hints:
      - "`df[c].isna().mean()` is the fraction missing in column c."
      - "`pd.Series(values).quantile(0.25)` gives Q1."
  - id: clean-prices
    title: Write clean_prices()
    language: python
    level: exam
    files:
      - market_prices_dirty.csv
    prompt: |
      Implement `clean_prices(raw)` that returns a **new** cleaned DataFrame (never modify `raw`):

      1. Strip whitespace and title-case `market` and `commodity` (`" owino"` → `"Owino"`).
      2. Parse `date` with `pd.to_datetime(..., errors="coerce")`.
      3. Drop rows missing any part of the business key `(date, market, commodity)`.
      4. Treat impossible values as missing: `price_ugx <= 0` → NaN, `rainfall_mm` outside `[0, 500]` → NaN.
      5. De-duplicate on the business key, keeping the first row.
      6. Add a boolean column `price_imputed` (True where the price was missing), then fill missing prices
         with the **median price of the same commodity**.
    starter: |
      import pandas as pd

      raw = pd.read_csv("market_prices_dirty.csv")

      def clean_prices(raw):
          df = raw.copy()
          # your steps here
          return df

      clean = clean_prices(raw)
      print(len(raw), "→", len(clean))
      print(clean.head())
    solution: |
      import pandas as pd

      raw = pd.read_csv("market_prices_dirty.csv")
      KEY = ["date", "market", "commodity"]

      def clean_prices(raw):
          df = raw.copy()
          for col in ["market", "commodity"]:
              df[col] = df[col].str.strip().str.title()
              df.loc[df[col] == "", col] = None
          df["date"] = pd.to_datetime(df["date"], errors="coerce")
          df = df.dropna(subset=KEY)
          df.loc[df["price_ugx"] <= 0, "price_ugx"] = float("nan")
          df.loc[~df["rainfall_mm"].between(0, 500), "rainfall_mm"] = float("nan")
          df = df.drop_duplicates(subset=KEY, keep="first").copy()
          df["price_imputed"] = df["price_ugx"].isna()
          df["price_ugx"] = df.groupby("commodity")["price_ugx"].transform(lambda s: s.fillna(s.median()))
          return df.reset_index(drop=True)

      clean = clean_prices(raw)
      print(len(raw), "→", len(clean))
    tests:
      - name: Doesn't modify the raw DataFrame
        code: |
          before = raw.copy()
          clean_prices(raw)
          assert raw.equals(before), "raw data must stay untouched — work on a copy"
      - name: Names are standardised
        code: |
          c = clean_prices(raw)
          assert set(c["market"]) <= {"Owino", "Nakasero", "Kalerwe", "Gulu"}, f"unexpected markets: {set(c['market'])}"
          assert set(c["commodity"]) <= {"Beans", "Maize", "Matooke", "Rice"}, f"unexpected commodities: {set(c['commodity'])}"
      - name: Unparseable dates and missing keys are dropped
        code: |
          c = clean_prices(raw)
          assert pd.api.types.is_datetime64_any_dtype(c["date"]), "date should be parsed to datetime"
          assert c[["date", "market", "commodity"]].notna().all().all()
      - name: No duplicate business keys
        code: |
          c = clean_prices(raw)
          assert not c.duplicated(subset=["date", "market", "commodity"]).any(), "duplicates on (date, market, commodity) remain"
      - name: Impossible values are treated as missing
        code: |
          c = clean_prices(raw)
          assert (c["price_ugx"] > 0).all(), "prices must be positive after cleaning"
          assert not (c["rainfall_mm"] > 500).any(), "rainfall above 500 mm should be NaN"
      - name: Prices are imputed with the per-commodity median
        code: |
          c = clean_prices(raw)
          assert "price_imputed" in c and c["price_imputed"].dtype == bool, "add a boolean price_imputed column"
          assert c["price_imputed"].sum() >= 4, "every missing or invalid price should be flagged"
          assert c["price_ugx"].notna().all(), "no missing prices should remain"
          real = c[~c["price_imputed"]]
          for _, row in c[c["price_imputed"]].iterrows():
              med = real.loc[real["commodity"] == row["commodity"], "price_ugx"].median()
              assert abs(row["price_ugx"] - med) < 1e-6, f"{row['commodity']} should be imputed with its median {med}, got {row['price_ugx']}"
    hints:
      - "`df[col].str.strip().str.title()` standardises text; empty strings should count as missing."
      - Set `price_imputed` BEFORE you fill the NaNs, otherwise you can't tell which were missing.
