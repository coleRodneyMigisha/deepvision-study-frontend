    idealAnswer: "Schema: a Pydantic Patient model with typed, bounded fields (age 0–120, glucose > 0, optional
      BMI range, Literal categories) returning a Prediction model (probability, risk tier, model_version);
      invalid payloads get 422. Load the full joblib pipeline once per worker in the lifespan handler.
      Inference is CPU-bound, so use a def endpoint (threadpool) and scale with multiple Uvicorn workers.
      Capacity: one worker = 50 req/s; at 70% target utilisation 250 req/s needs 250/0.7/50 ≈ 7.1 → 8 workers
      (or replicas behind a load balancer). Errors: return clear 4xx for client issues, catch model errors as
      500 with a request id, never leak stack traces. Monitor request rate, p50/p99 latency, error rates,
      utilisation, input distributions (for drift) and model version, with structured logs per request."
coding:
  - id: patient-schema
    title: The Patient request schema
    language: python
    level: core
    prompt: |
      Define Pydantic models for the stroke API:

      - `Patient`: `age` float 0–120; `avg_glucose_level` float > 0; `bmi` optional float between 10 and 80
        (default `None`); `hypertension` and `heart_disease` bools; `smoking_status` one of
        `"never"`, `"formerly"`, `"smokes"`, `"unknown"`.
      - `Prediction`: `stroke_probability` float 0–1, `risk_tier` one of `"LOW"`, `"HIGH"`, `model_version` str.
    starter: |
      from typing import Literal
      from pydantic import BaseModel, Field

      class Patient(BaseModel):
          age: float
          avg_glucose_level: float
          bmi: float
          hypertension: bool
          heart_disease: bool
          smoking_status: str

      class Prediction(BaseModel):
          stroke_probability: float
          risk_tier: str
          model_version: str
    solution: |
      from typing import Literal
      from pydantic import BaseModel, Field

      class Patient(BaseModel):
          age: float = Field(ge=0, le=120)
          avg_glucose_level: float = Field(gt=0)
          bmi: float | None = Field(default=None, ge=10, le=80)
          hypertension: bool
          heart_disease: bool
          smoking_status: Literal["never", "formerly", "smokes", "unknown"]

      class Prediction(BaseModel):
          stroke_probability: float = Field(ge=0, le=1)
          risk_tier: Literal["LOW", "HIGH"]
          model_version: str
    tests:
      - name: A valid patient parses, BMI may be missing
        code: |
          p = Patient(age=67, avg_glucose_level=228, hypertension=True, heart_disease=False, smoking_status="formerly")
          assert p.bmi is None
      - name: Out-of-range values are rejected
        code: |
          from pydantic import ValidationError
          base = dict(age=67, avg_glucose_level=228, bmi=30, hypertension=True, heart_disease=False, smoking_status="never")
          for bad in [{"age": -12}, {"age": 150}, {"avg_glucose_level": 0}, {"bmi": 5}, {"smoking_status": "sometimes"}]:
              try:
                  Patient(**(base | bad))
                  raise AssertionError(f"{bad} should be rejected with a 422")
              except ValidationError:
                  pass
      - name: Predictions are bounded too
        code: |
          from pydantic import ValidationError
          Prediction(stroke_probability=0.41, risk_tier="HIGH", model_version="2.3.0")
          try:
              Prediction(stroke_probability=1.4, risk_tier="HIGH", model_version="2.3.0")
              raise AssertionError("a probability above 1 must be rejected")
          except ValidationError:
              pass
  - id: predict-endpoint
    title: The /predict service
    language: review
    level: exam
    prompt: |
      Write `app/main.py` for the stroke API using the `Patient` and `Prediction` models: load the joblib
      pipeline **once at startup** (lifespan), expose `GET /health` and `POST /predict`, return the model
      version from metadata, map probability ≥ the calibrated threshold (0.22) to `"HIGH"`, and keep the
      CPU-bound prediction off the event loop. Comment your decisions.
    starter: |
      from contextlib import asynccontextmanager
      from fastapi import FastAPI

      app = FastAPI()
    solution: |
      import json
      from contextlib import asynccontextmanager

      import joblib
      import pandas as pd
      from fastapi import FastAPI

      from app.schemas import Patient, Prediction

      THRESHOLD = 0.22  # calibrated on validation data for recall within clinic capacity

      @asynccontextmanager
      async def lifespan(app: FastAPI):
          # Load ONCE per worker; per-request loading would add disk I/O to every call.
          app.state.model = joblib.load("models/stroke_pipeline.joblib")
          app.state.meta = json.load(open("models/model_metadata.json"))
          yield

      app = FastAPI(title="Stroke risk API", lifespan=lifespan)

      @app.get("/health")
      def health():
          return {"status": "ok", "model_version": app.state.meta["model_version"]}

      @app.post("/predict", response_model=Prediction)
      def predict(patient: Patient) -> Prediction:   # plain def → runs in the threadpool (CPU-bound)
          row = pd.DataFrame([patient.model_dump()])  # Pydantic already rejected invalid input (422)
          p = float(app.state.model.predict_proba(row)[0, 1])
          return Prediction(stroke_probability=p, risk_tier="HIGH" if p >= THRESHOLD else "LOW",
                            model_version=app.state.meta["model_version"])
    rubric:
      - Loads the model once at startup (lifespan or module import), not inside the request handler
      - Uses the Pydantic Patient model as the request body so invalid input gets HTTP 422
      - Keeps CPU-bound inference off the event loop (plain def endpoint/threadpool or workers)
      - Applies the calibrated threshold (0.22) to produce the risk tier
      - Returns the model version (traceability) and provides a health endpoint
