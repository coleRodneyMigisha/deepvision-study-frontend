    idealAnswer: "Pydantic validates every request against a schema before the endpoint runs; invalid input is
      rejected with HTTP 422 and a message naming the field, so model code never sees bad data. Examples: age:
      float = Field(ge=0, le=120); smoking_status: Literal['never', 'formerly', 'smokes', 'unknown'];
      avg_glucose_level: float = Field(gt=0)."
  - question: State Little's Law and use it to explain why latency rises sharply as a service approaches capacity.
    kind: short
    marks: 5
    keywords:
      - L = λW
      - concurrency
      - arrival rate
      - latency
      - utilisation
      - capacity
      - queue
      - 1 - ρ
      - nonlinear
    idealAnswer: "Little's Law: L = λW — average requests in the system equals arrival rate times average time in
      the system. As arrival rate approaches capacity (utilisation ρ → 1), requests queue; queueing models
      give W ≈ S/(1 − ρ), so latency grows nonlinearly — doubling at 50% and 10× at 90% — and requests in
      flight grow with it. Services are therefore sized for ~60–70% utilisation."
  - question: Design the /predict service for the stroke model so it is correct, fast and safe under hospital
      load. Cover the schema, model loading, concurrency model, error handling, capacity planning for 250
      req/s at 20 ms inference, and what you would monitor.
    kind: long
