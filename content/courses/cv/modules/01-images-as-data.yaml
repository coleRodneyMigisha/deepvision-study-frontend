id: images-as-data
title: Images as Data
subtitle: How a computer "sees" a picture, and how we prepare pictures for a model
recap: |
  A computer doesn't see a picture. It sees a big grid of numbers, one number per dot (pixel) per colour,
  from 0 (dark) to 255 (bright). Before we show those numbers to a model, we shrink them to between 0 and 1
  and then "centre" them, using the same averages the model saw when it was first trained, so the new
  pictures look familiar to it. Small number grids called filters can find patterns such as edges. During
  training, we also show the model slightly changed copies of each picture (flipped, cropped, brighter) so it
  learns what matters instead of memorising.
traps:
  - "Using your own photos' averages to centre the numbers when the model was pre-trained on ImageNet. Use
    ImageNet's averages instead (μ ≈ 0.485, 0.456, 0.406 and σ ≈ 0.229, 0.224, 0.225): those are what the
    model is used to."
  - "Skipping the 0–255 → 0–1 step. `Normalize()` expects numbers between 0 and 1, so in PyTorch always run
    `ToTensor()` first."
  - "Changing (augmenting) the test pictures. Random flips and crops are only for training; tests must use the
    real, unchanged pictures or your score means nothing."
  - "Forgetting that OpenCV loads colours in the order Blue, Green, Red (BGR), not Red, Green, Blue (RGB)."
lesson:
  checkpointStep: 3
  steps:
    - "To a computer, a photo is not a picture. It's a grid of numbers. Each tiny dot (a pixel) gets one
      number for red, one for green and one for blue, each from 0 (none of that colour) to 255 (as much as
      possible). So a photo is height × width × 3 numbers: a tensor, which just means a grid of numbers with
      more than two directions."
    - "Red, green and blue tend to move together: a shadow makes all three smaller at once. Another way to
      describe colour, HSV, splits it into which colour (hue), how strong (saturation) and how bright (value),
      so a change in lighting mostly touches just one of them."
    - "Before training we tidy the numbers. First divide by 255 so they sit between 0 and 1. Then, for each
      colour, subtract the average and divide by the spread (standard deviation). Now the numbers sit around
      0, which makes learning much smoother."
    - "Checkpoint: if a model was first trained on the ImageNet photo collection, why do we tidy our pictures
      using ImageNet's averages rather than our own?"
    - "A filter is a tiny grid of numbers (often 3 × 3) that we slide over the picture. The Sobel filter
      subtracts the pixels on the left from the pixels on the right, so it gives a big number wherever
      brightness suddenly changes. That's an edge."
    - "Data augmentation means making new training pictures from old ones: flip, crop, rotate a little, change
      the brightness. A flipped cat is still a cat, so the model learns to ignore things that don't change the
      answer."
    - "Not every camera takes whole pictures. An event camera has pixels that each speak up only when their
      brightness changes, within millionths of a second, so fast motion doesn't blur."
checkpoint:
  question: Why do we normalise image pixels using the ImageNet mean and standard deviation before feeding them
    into a pretrained CNN?
  hint: "Think about what the model is used to. What numbers did it see while it was first trained? What
    happens if we suddenly give it numbers on a different scale?"
  keywords:
    - distribution
    - imagenet
    - mean
    - standard deviation
    - pretrained
    - scale
    - gradient
    - weights
    - match
    - centre
    - center
  idealAnswer: "A pretrained model learned from ImageNet pictures that were tidied (normalised) with ImageNet's
    per-colour mean and standard deviation, so its weights expect numbers in that range. Tidying our pictures
    the same way makes them look the way the model is used to, and its early filters respond as they were
    trained to. Centring and scaling also keeps all the numbers a similar size, so learning (the gradients)
    stays stable. If we skip it, the inputs look unfamiliar: accuracy drops and fine-tuning can become
    unstable."
terms:
  - term: Pixel
    definition: One tiny dot of a picture. In a colour photo, each pixel stores three numbers, one each for red,
      green and blue.
  - term: Tensor (H, W, C)
    definition: A grid of numbers with several directions. A colour photo is height × width × channels. PyTorch
      orders it (C, H, W); NumPy and OpenCV order it (H, W, C). OpenCV also loads colours as BGR.
  - term: Channel
    definition: One layer of the picture holding a single kind of number, e.g. all the red values. Grayscale
      pictures have 1 channel, colour pictures have 3.
  - term: Normalisation
    definition: Tidying the numbers so they sit around 0, using x′ = (x/255 − μ)/σ for each colour. For
      ImageNet models, μ ≈ (0.485, 0.456, 0.406) and σ ≈ (0.229, 0.224, 0.225).
  - term: Mean (μ) and standard deviation (σ)
    definition: The mean is the average. The standard deviation is how spread out the values usually are around
      that average.
  - term: Kernel / filter
    definition: A tiny grid of numbers slid across the picture to find a pattern. Sobel finds edges; a Gaussian
      filter blurs.
  - term: Augmentation
    definition: Making extra training pictures by flipping, cropping or brightening the ones you have. Only
      changes that keep the correct answer the same, and only during training.
  - term: Pretrained model
    definition: A model that has already learned from a huge photo collection (usually ImageNet, about 1.2
      million labelled photos) and that you then adapt to your own task.
quiz:
  - question: A 224 × 224 colour (RGB) photo stores one number per pixel per colour. How many numbers is that?
    options:
      - 50,176
      - 150,528
      - "224"
      - "672"
    answer: 1
    explanation: 224 × 224 pixels, each with 3 colour numbers. 224 × 224 × 3 = 150,528.
  - question: Which training trick is a BAD idea for reading handwritten digits?
    options:
      - Rotating a few degrees
      - Cropping a little
      - Flipping upside down
      - Making it slightly brighter
    answer: 2
    explanation: Flip a 6 upside down and it looks like a 9, so the correct answer changes. Only use changes that
      keep the answer the same.
  - question: In PyTorch, a batch (a group) of colour pictures is stored in which order?
    options:
      - N × H × W × C
      - N × C × H × W
      - H × W × C
      - C × N × H × W
    answer: 1
    explanation: "PyTorch puts the number of pictures (N) first, then the colour channels (C), then height and
      width: NCHW."
  - question: OpenCV's cv2.imread loads the colours in which order?
    options:
      - RGB
      - BGR
      - HSV
      - Grayscale
    answer: 1
    explanation: OpenCV uses Blue, Green, Red. Forgetting to swap it to RGB is a classic bug, and it makes skin
      look blue.
  - question: Why switch from RGB to HSV when you want to pick out "everything red" in a photo?
    options:
      - HSV pictures are smaller
      - Hue keeps "which colour" separate from brightness, so shadows matter less
      - CNNs only accept HSV
      - HSV removes noise
    answer: 1
    explanation: A shadow mostly changes V (brightness), not H (which colour), so "red" stays red in the shade.
  - question: A Sobel-x filter gives its biggest response at…
    options:
      - Flat areas of one colour
      - Vertical edges, where brightness changes from left to right
      - Bright colours
      - Noise only
    answer: 1
    explanation: It subtracts the left neighbours from the right ones. On a flat area that's about 0; across an edge
      it's large.
  - question: Which change could turn a picture's correct answer into a wrong one?
    options:
      - Slightly brighter
      - Flipping a "turn left" road sign left-to-right
      - Cropping a photo of a cat
      - A slight blur
    answer: 1
    explanation: A flipped "turn left" sign now says "turn right". Augmentations must keep the answer true.
  - question: What does ToTensor() do to a normal picture with values 0–255?
    options:
      - Centres it with ImageNet's averages
      - Divides by 255 (to 0–1) and moves the colour channels first (HWC → CHW)
      - Turns it grayscale
      - Flips it
    answer: 1
    explanation: Centring with the averages is a separate step, Normalize(), which comes after.
fact:
  title: Event cameras see in millionths of a second
  body: Event cameras (e.g. Prophesee, Sony IMX636) don't take whole pictures. Each pixel reports on its own,
    only when its brightness changes, within microseconds (millionths of a second), and copes with very
    bright and very dark scenes at once. That's useful for drones and fast robots, where normal cameras blur.
lab:
  title: Pixels & normalisation
  variations:
    - title: Red Channel Max Normalisation
      question: A <b>red</b>-channel pixel has raw value <b>255</b> (μ = 0.485, σ = 0.229). What number does the model receive after
        <code>ToTensor()</code> (divide by 255) and ImageNet <code>Normalize()</code> (subtract μ, divide by σ)? (2 decimals)
      answer: 2.25
      tolerance: 0.015
      hint: First divide 255 by 255 to get 1.0, then subtract 0.485 and divide by 0.229.
      explanation: 255/255 = 1.0 → (1.0 − 0.485) / 0.229 = 0.515 / 0.229 = 2.2489 ≈ 2.25.
    - title: Green Channel Mid-Tone Normalisation
      question: A <b>green</b>-channel pixel has raw value <b>102</b> (μ = 0.456, σ = 0.224). What number does the model
        receive after <code>ToTensor()</code> (divide by 255) and ImageNet <code>Normalize()</code>? (2 decimals)
      answer: -0.25
      tolerance: 0.015
      hint: Compute x = 102 / 255 = 0.40, then (0.40 − 0.456) / 0.224.
      explanation: 102 / 255 = 0.40 → (0.40 − 0.456) / 0.224 = −0.056 / 0.224 = −0.25.
    - title: Luminance Grayscale Conversion
      question: An RGB pixel has values <b>(R=200, G=100, B=50)</b>. Using the standard brightness formula
        <code>Y = 0.299R + 0.587G + 0.114B</code> (green counts most because our eyes are most sensitive to it), what is its grayscale brightness <b>Y</b>? (2 decimals)
      answer: 124.2
      tolerance: 0.05
      hint: Multiply each colour by its weight, then add the three results.
      explanation: Y = 0.299(200) + 0.587(100) + 0.114(50) = 59.8 + 58.7 + 5.7 = 124.20.
notes:
  - heading: A picture is a grid of numbers
    body: |
      Zoom far enough into any photo on your phone and you'll see tiny squares of colour. Each square is a **pixel**.

      A computer stores each pixel as three numbers: how much **red**, how much **green** and how much **blue** to mix. Each number runs from **0** (none) to **255** (as much as possible):

      | Pixel colour | Red | Green | Blue |
      | --- | --- | --- | --- |
      | Black | 0 | 0 | 0 |
      | White | 255 | 255 | 255 |
      | Pure red | 255 | 0 | 0 |
      | Yellow (red + green) | 255 | 255 | 0 |

      So a photo is really a stack of three grids, one per colour. Each grid is called a **channel**. A photo 224 pixels tall and 224 wide holds 224 × 224 × 3 = **150,528** numbers. A grid of numbers with several directions like this is called a **tensor**.

      **Watch out in code:** different tools stack the numbers in different orders.

      - NumPy, OpenCV and PIL use **height × width × channels (HWC)**.
      - PyTorch wants **channels × height × width (CHW)**. A batch of N pictures is **N × C × H × W (NCHW)**.
      - OpenCV loads colours as **Blue, Green, Red (BGR)**. If faces look blue, you forgot to swap to RGB.
      - `transforms.ToTensor()` turns a 0–255 HWC picture into a 0–1 CHW tensor.
  - heading: Other ways to describe colour
    body: |
      Red, green and blue usually change **together**. Walk into a shadow and all three get smaller, so "how bright" is spread across every channel. That makes simple rules like "red > 200 means a red object" fail in the shade.

      Other colour descriptions separate brightness out:

      - **HSV**: **H**ue (which colour: red, green, blue…), **S**aturation (how strong or washed-out), **V**alue (how bright). A shadow mostly changes V, so "find everything with a red hue" still works in the shade.
      - **Grayscale**: one number per pixel, brightness only. It's a weighted mix: Y = 0.299 R + 0.587 G + 0.114 B. Green gets the biggest weight because human eyes are most sensitive to green. You save memory but lose all colour.
      - **LAB**: designed so that the distance between two colours' numbers matches how different they *look* to us.

      Deep learning models usually take plain RGB and work out the colour features they need. Colour spaces still matter for classic (hand-built) vision rules and for augmentation.
  - heading: Tidying the numbers (normalisation)
    body: |
      Models learn best when their inputs are small numbers centred around 0. Raw pixels (0–255) are neither, so we tidy them in two steps.

      **Step 1: shrink to 0–1.** Divide by 255. A pixel of 255 becomes 1.0; a pixel of 102 becomes 0.40.

      **Step 2: centre and scale each colour.** Subtract that colour's **mean** μ (its average) and divide by its **standard deviation** σ (how spread out the values usually are):

      $$x' = \frac{x - \mu}{\sigma}$$

      **Tiny example** (red channel, μ = 0.485, σ = 0.229):

      - A white pixel: 255 → 1.0 → (1.0 − 0.485) / 0.229 ≈ **2.25**
      - A black pixel: 0 → 0.0 → (0 − 0.485) / 0.229 ≈ **−2.12**

      **Which μ and σ?** Most projects start from a **pretrained** model, one that already learned from **ImageNet** (about 1.2 million labelled photos). That model got used to ImageNet-tidied numbers: μ = (0.485, 0.456, 0.406) and σ = (0.229, 0.224, 0.225) for red, green and blue. Use *those* values, not your own photos' averages, so your pictures look familiar to it. Different numbers would be like suddenly handing someone a ruler in inches when they learned in centimetres.

      ```python
      tf = transforms.Compose([transforms.ToTensor(),                      # 0–255 → 0–1, HWC → CHW
                               transforms.Normalize([0.485, 0.456, 0.406],  # ImageNet means
                                                    [0.229, 0.224, 0.225])])  # ImageNet std devs
      ```
  - heading: Filters find patterns
    body: |
      A **filter** (or **kernel**) is a tiny grid of numbers, often 3 × 3. We slide it across the picture. At each spot we multiply the filter's numbers by the pixels underneath, add everything up, and write that one number into a new image. Sliding a filter like this is called **convolution**.

      The **Sobel-x** filter finds edges:

      ```
      -1  0  +1
      -2  0  +2
      -1  0  +1
      ```

      It subtracts the pixels on the left from the pixels on the right. On a flat wall, left and right are the same, so the answer is about **0**. Where a dark area meets a bright one, right minus left is big, so the answer is **large**: an edge.

      **Tiny example:** left column all 10, right column all 50. Sobel-x gives (50 − 10) × (1 + 2 + 1) = **160**, a strong edge. Make every pixel 30 and it gives **0**.

      Other filters: a **blur** averages a pixel with its neighbours; a **sharpen** filter boosts the centre against its neighbours. Convolutional neural networks (CNNs, next module) *learn* their own filters like these from examples.
  - heading: Making more training pictures (augmentation)
    body: |
      Models need lots of examples. **Data augmentation** makes extra training pictures out of the ones you have: flip them, crop them, rotate them a few degrees, make them a bit brighter or blurrier. A flipped photo of a cat is still a cat, so the model learns to ignore things that don't change the answer. It also stops the model memorising exact pictures (overfitting).

      Two rules:

      1. **Only change training pictures.** Validation and test pictures must stay real and unchanged, or your score isn't honest.
      2. **Only use changes that keep the answer true.** Flipping a "turn left" sign makes it a "turn right" sign; turning a 6 upside down makes a 9.
  - heading: Cameras that don't take pictures
    body: |
      A normal camera takes whole pictures (frames) many times a second. An **event camera** works differently: every pixel watches its own brightness and speaks up **only when it changes**, within microseconds (millionths of a second). Nothing changes, nothing is sent.

      The result: no motion blur, and it copes with very bright and very dark areas at the same time. That's handy for drones and fast robots.
  - heading: Watch next
    body: |
      - **3Blue1Brown, "But what is a convolution?"**: a beautifully visual explanation of sliding a small grid over a bigger one, which is exactly what filters do. [Watch on YouTube](https://www.youtube.com/watch?v=KuXjwB4LzSA)
examples:
  - title: Tidy one green pixel
    problem: A pixel's green value is 200. What number does the model receive after ToTensor() and ImageNet
      Normalize? (For green, μ = 0.456 and σ = 0.224.)
    steps:
      - "Shrink to 0–1: 200 / 255 = **0.7843**."
      - "Subtract the green mean: 0.7843 − 0.456 = **0.3283**."
      - "Divide by the green spread: 0.3283 / 0.224 = **1.466**."
    answer: About 1.47.
    takeaway: "After tidying, the number says how far the pixel is from ImageNet's typical green, measured in
      spreads. Here it's about 1.5 spreads brighter than typical."
  - title: How much memory does a batch need?
    problem: A batch of 32 colour pictures, each 224 × 224, is stored as float32 (4 bytes per number). How many
      megabytes (MB) is that?
    steps:
      - "Count the numbers: 32 pictures × 3 colours × 224 × 224 = **4,816,896**."
      - "Each float32 takes 4 bytes: 4,816,896 × 4 = 19,267,584 bytes ≈ **19.3 MB**."
      - "Kept as 0–255 whole numbers (uint8, 1 byte each), it would be only 4.8 MB: float32 is 4× bigger."
    answer: About 19.3 MB.
    takeaway: Sizes multiply fast. Picture count × colours × height × width × bytes per number.
questions:
  - question: Describe how a colour (RGB) image is stored as a tensor, and two common mistakes with that format.
    kind: short
    marks: 5
    keywords:
      - tensor
      - height
      - width
      - channels
      - 0-255
      - uint8
      - hwc
      - chw
      - nchw
      - bgr
      - opencv
    idealAnswer: "A colour image is a 3-D grid of numbers (a tensor): height × width × 3 channels, one number each
      for red, green and blue, usually whole numbers from 0 to 255 (uint8). Mistake 1: tools disagree on the
      order. NumPy and OpenCV use HWC, but PyTorch expects CHW (NCHW for a batch of N pictures). Mistake 2:
      OpenCV loads colours as BGR, so you must swap to RGB before using a model trained on RGB."
  - question: Why do we normalise images with the ImageNet mean and standard deviation when fine-tuning a
      pretrained model?
    kind: short
    marks: 5
    keywords:
      - pretrained
      - distribution
      - imagenet
      - mean
      - std
      - per channel
      - filters
      - batchnorm
      - activations
      - stable
      - gradients
    idealAnswer: "The pretrained model learned from ImageNet pictures tidied with ImageNet's per-colour mean and
      std, so its filters and BatchNorm layers expect numbers in that range (that distribution). Using the same
      tidying makes our pictures look familiar, so the layers' outputs (activations) behave as they did in
      training. Centring and scaling also keeps the numbers a similar size, so the gradients that drive
      learning stay well behaved and training is stable."
  - question: You are building a model that recognises diseases in photos of cassava leaves taken on farmers'
      phones, in very different lighting. Plan how each photo is prepared (loading, colour, resizing, tidying
      the numbers and augmentation) and say why you made each choice.
    kind: long
    marks: 10
    keywords:
      - load
      - rgb
      - bgr
      - resize
      - crop
      - 224
      - totensor
      - normalize
      - imagenet
      - augmentation
      - random crop
      - flip
      - colour jitter
      - brightness
      - train only
      - validation
      - label-preserving
    idealAnswer: "Load each photo and convert it to RGB (OpenCV gives BGR). Resize and crop to the size the
      pretrained model expects, e.g. 224 × 224. Use ToTensor (0–1, channels first) and Normalize with
      ImageNet's mean and std, because we'll fine-tune an ImageNet-pretrained model. Augment the training
      photos only, with changes that keep the disease label true: RandomResizedCrop, horizontal and vertical
      flips (a leaf's direction doesn't change its disease), small rotations, and colour jitter on brightness,
      contrast and saturation to imitate different lighting and phone cameras. Validation and test photos get
      only resizing, cropping and normalising, so the score reflects real photos."
