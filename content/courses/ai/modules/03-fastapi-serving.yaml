id: fastapi-serving
title: API Engineering with FastAPI, Pydantic & Async Workers
subtitle: Building a fast, well-checked web service that answers prediction requests
recap: |
  Put the model behind a FastAPI web service, so other systems can ask it for predictions over the internet
  (HTTP). Pydantic checks every field of every request at the door (age between 0 and 120, glucose above 0,
  categories from an allowed list) and replies with an HTTP 422 error instead of letting bad input crash the
  model. Use async code for work that waits (databases, network calls), and several worker processes for heavy
  number-crunching like making predictions. Little's Law, L = λ·W, links how many requests arrive per second,
  how long each takes, and how many are being handled at once.
traps:
  - "Doing heavy prediction work directly inside an async function. It blocks the event loop, so every other request
    waits."
  - "Checking inputs inside the model code instead of at the API's front door (with Pydantic)."
  - "Forgetting to turn milliseconds into seconds in Little's Law (45 ms = 0.045 s)."
lesson:
  checkpointStep: 3
  steps:
    - "A model saved on disk can't help a single patient by itself. We put it inside a REST API, a web service, so
      websites, the hospital's electronic health record (EHR) system and mobile apps can ask it for predictions over
      HTTP."
    - "FastAPI is the standard tool for serving Python ML models. Built on Starlette and Pydantic, it handles many
      requests at once (asynchronously), converts data to and from JSON automatically, and writes its own
      documentation page."
    - "With Pydantic schemas, every patient detail in a request is strictly checked at the API's front door: age must
      be between 0 and 120, avg_glucose_level must be positive, and text fields must be one of the allowed choices."
    - "Checkpoint: why should prediction services run on asynchronous web frameworks, and how does Pydantic stop the
      model code from crashing?"
    - "Pydantic catches wrong types, missing fields and impossible values before your model code is touched, and
      replies with a clear HTTP 422 (Unprocessable Entity) error instead of the server crashing."
    - "To handle as many requests as possible, separate work that waits (logging to a database, writing audit
      records) from heavy number-crunching (the prediction itself), and use several Uvicorn worker processes or a
      thread pool for the heavy part."
checkpoint:
  question: How does Pydantic schema validation enforce data contracts at the API boundary, and why is this
    critical for maintaining 99.9% uptime in production healthcare ML?
  hint: "What should happen if an app sends the text \"twenty\" instead of a number for BMI, or a negative glucose
    level? Checking at the door gives a clear 422 error; what happens if the bad value reaches the model instead
    (a 500 Internal Server Error)?"
  keywords:
    - pydantic
    - schema
    - validation
    - data contract
    - type enforcement
    - "422"
    - boundary
    - uptime
    - crash
    - sanitization
  idealAnswer: "Pydantic enforces a data contract (the agreed rules for each field) at the boundary of the service,
    before a request ever reaches the model. The schema enforces types (type enforcement: turning number-text like
    \"67\" into a number where that's valid), rejects unknown or malformed fields, and checks the allowed values (e.g.
    Field(..., ge=0, le=120) for age, or a fixed list of smoking statuses). If invalid data arrives, FastAPI replies
    straight away with a structured HTTP 422 response naming the exact field and problem. In a hospital service,
    this validation (input sanitization) stops unhandled Python errors (like a ValueError inside scikit-learn) that
    would crash the request, prevents missing values silently turning into wrong predictions, and keeps the service
    reliable, protecting its 99.9% uptime."
terms:
  - term: API / REST API
    definition: A web service with addresses (like /predict) that other programs send requests to and get answers
      from.
  - term: FastAPI
    definition: A modern, fast Python framework for building APIs, built on Starlette and Pydantic.
  - term: Pydantic BaseModel
    definition: A class where you write the expected fields and their types and limits; Pydantic checks every request
      against it.
  - term: HTTP 422
    definition: "\"Unprocessable Entity\": the request was valid JSON, but its contents broke the rules."
  - term: Uvicorn
    definition: The program (an ASGI web server) that actually runs a FastAPI app and handles the network connections.
  - term: async (asynchronous)
    definition: Code that can pause while waiting (for a database or network) and let other requests run meanwhile.
  - term: CPU-bound vs I/O-bound
    definition: CPU-bound work keeps the processor busy (making predictions); I/O-bound work mostly waits (for disks,
      databases, networks).
  - term: Throughput (QPS)
    definition: Queries per second, i.e. how many requests the service completes each second.
  - term: Latency (and p99)
    definition: How long one request takes. p99 is the time the slowest 1% of requests exceed.
quiz:
  - question: "A hospital client sends {'age': -5, 'bmi': 'obese'} to a FastAPI endpoint requiring float bmi and
      age > 0. What happens?"
    options:
      - The server crashes with 500 Internal Server Error
      - FastAPI automatically catches validation errors and returns 422 Unprocessable Entity
      - The model converts -5 to 0 and predicts anyway
      - The request hangs indefinitely
    answer: 1
    explanation: Pydantic checks the request the moment it arrives, rejects the bad fields (a negative age, text for
      BMI) and replies with a clear 422 error. The model code never runs.
  - question: What is Little's Law relating Concurrency (L), Throughput (λ), and Latency (W)?
    options:
      - L = λ × W
      - L = λ / W
      - L = λ + W
      - W = L × λ²
    answer: 0
    explanation: "The average number of requests being handled at once (L) equals how many arrive per second (λ) times
      how long each takes (W): L = λ × W."
  - question: An invalid field in a FastAPI request body returns…
    options:
      - 200
      - 400
      - 422
      - 500
    answer: 2
    explanation: "When Pydantic rejects a field, FastAPI replies with 422 Unprocessable Entity: valid JSON, invalid contents."
  - question: Why can a CPU-heavy predict() inside async def hurt throughput?
    options:
      - It is not allowed
      - It blocks the event loop so other requests wait
      - It uses more memory
      - It disables validation
    answer: 1
    explanation: While it calculates, it blocks the event loop, so no other request is served. Use plain def (a thread pool) or more workers for heavy work.
  - question: λ = 200 req/s, W = 15 ms. L = ?
    options:
      - "3"
      - "13.3"
      - "30"
      - "0.075"
    answer: 0
    explanation: Turn 15 ms into seconds (0.015 s), then L = 200 × 0.015 = 3 requests in progress.
  - question: What does Literal['never','formerly','smokes'] enforce?
    options:
      - A string of any value
      - Only those exact category values
      - A number
      - Nothing at runtime
    answer: 1
    explanation: The field must be exactly one of those words. Anything else is rejected with 422.
  - question: Utilisation rises from 50% to 90%. Roughly what happens to queueing latency?
    options:
      - Stays the same
      - Doubles
      - About 5× higher
      - Halves
    answer: 2
    explanation: "Using W ≈ S ÷ (1 − ρ), the wait goes from 2S to 10S: about 5× longer."
  - question: Where should the model be loaded in a multi-worker deployment?
    options:
      - Per request
      - Once per worker at startup
      - Once per day by cron
      - In the client
    answer: 1
    explanation: Once per worker, at startup. Each worker process needs its own copy in memory.
fact:
  title: FastAPI + Pydantic v2 Performance
  body: Pydantic v2 was completely rewritten in Rust, delivering 5× to 50× faster JSON parsing and validation.
    This allows a single FastAPI worker to validate thousands of patient payloads per second with
    sub-millisecond CPU overhead.
lab:
  title: FastAPI Model Serving, Pydantic Schema Validation & Latency Simulator
  variations:
    - title: Little's Law API Concurrency Capacity
      question: A stroke screening endpoint handles an arrival rate <b>λ = 250 requests/sec</b> with average model
        inference latency <b>W = 40 ms (0.040s)</b>. According to Little's Law (<code>L = λ × W</code>), how
        many concurrent requests are in flight on the server?
      answer: 10
      tolerance: 0.1
      hint: Multiply 250 req/s by 0.040s.
      explanation: L = 250 × 0.040 = 10 concurrent requests in flight. This dictates the minimum worker pool sizing
        needed to prevent request queuing.
    - title: FastAPI Uvicorn Concurrency Sizing
      question: A Uvicorn worker process handles up to <b>50 concurrent async requests</b>. To support a peak
        concurrent capacity of <b>200 active requests</b> without queuing, how many worker processes must be
        spawned via Gunicorn?
      answer: 4
      tolerance: 0
      hint: Divide 200 by 50.
      explanation: 200 / 50 = 4 workers. Typically, 2 to 4 workers per CPU core maximize asynchronous I/O throughput.
    - title: Edge Pydantic Validation CPU Savings
      question: Pydantic rejects an invalid payload (e.g., negative glucose) at the API boundary in <b>1.2 ms</b>.
        If unvalidated, passing the bad input into scikit-learn causes a crash after <b>18.5 ms</b> of
        pipeline execution. How many <b>ms</b> of CPU execution time are saved per bad request?
      answer: 17.3
      tolerance: 0.1
      hint: Subtract 1.2 ms from 18.5 ms.
      explanation: 18.5 − 1.2 = 17.3 ms saved per rejected request, shielding CPU inference workers from wasted compute.
notes:
  - heading: Why an API
    body: |
      **The idea:** a model file on a disk is like a doctor locked in a room. An API is the reception desk: anyone can hand in a form and get an answer back.

      A model file can't help a nurse doing triage by itself. Wrapping it in a **REST API** (a web service) lets any system (the hospital's electronic health record, a mobile app, a dashboard) send patient details over the internet (HTTP) and get a prediction back as JSON.

      **FastAPI** is the usual choice for serving Python ML models. It's built on Starlette (for handling web requests) and **Pydantic** (for checking data), it writes interactive documentation for you at `/docs`, and it's fast enough that the model, not the framework, decides the speed.
  - heading: Pydantic contracts and HTTP 422
    body: |
      **The idea:** a form with boxes that only accept the right kind of answer. Write "twenty" in the age box and the form is handed straight back, before it ever reaches the doctor.

      ```python
      class Patient(BaseModel):
          age: float = Field(ge=0, le=120)                       # between 0 and 120
          avg_glucose_level: float = Field(gt=0, le=400)         # more than 0, up to 400
          bmi: float | None = Field(default=None, ge=10, le=80)  # optional
          hypertension: bool                                      # true or false
          smoking_status: Literal["never", "formerly", "smokes", "unknown"]   # only these values

      @app.post("/predict")
      def predict(p: Patient) -> Prediction: ...
      ```

      Every request is checked **at the front door**: wrong types, missing required fields, out-of-range values and unknown categories are rejected with **HTTP 422 (Unprocessable Entity)**, plus a JSON message naming the exact field and problem. Your model code never sees invalid input, so it can't crash, or, worse, give a prediction for an impossible patient.

      The schema is also documentation: the same rules appear on the `/docs` page for the people connecting other systems.
  - heading: Async, workers and CPU-bound inference
    body: |
      **The idea:** a waiter can look after many tables while their food cooks (waiting work). But while the waiter is busy cooking (heavy work), nobody else gets served. So hire more cooks.

      `async def` endpoints let one process juggle many requests that are **waiting**: on a database, a log write, another web call. But making a prediction is **CPU-bound** (it keeps the processor busy). While XGBoost is calculating, the event loop (the part that juggles requests) is blocked, and nothing else gets served.

      Options:

      - Write the endpoint with plain `def`: FastAPI then runs it in a **thread pool** (several helper threads).
      - Run several **Uvicorn workers** (separate processes): `uvicorn app.main:app --workers 4`, or Gunicorn with Uvicorn workers. Each worker loads its own copy of the model.
      - Send very heavy jobs to a queue (Celery or RQ) and reply with a job number to check later.

      Load the model **once per worker, at startup**, never per request.
  - heading: Little's Law and latency under load
    body: |
      **The idea:** if 2 customers walk into a shop every minute and each stays 5 minutes, there are about 10 customers inside at any time. Little's Law is exactly that.

      **Little's Law:** L = λ × W. The average number of requests being handled (L) = how many arrive per second (λ, "lambda") × how long each one takes on average (W, in seconds).

      **Tiny example:** 120 requests per second, each taking 25 ms = 0.025 s, gives L = 120 × 0.025 = **3** requests in progress on average.

      **Capacity:** with c workers, each taking S seconds per request, the service can finish c ÷ S requests per second. 4 workers × (1 ÷ 0.020 s) = **200 requests per second**. **Utilisation** ρ ("rho") = arrivals ÷ capacity: how busy the service is.

      **Waiting grows fast as you get busy.** A simple queueing rule of thumb: **W ≈ S ÷ (1 − ρ)**. At 50% busy, each request takes about 2× as long as normal; at 90% busy, about 10× as long; at 100% or more, the queue grows forever. That's why services are sized to run at about 60–70% busy, and why the **p99** latency (the time the slowest 1% of requests exceed) is watched, not just the average.
examples:
  - title: Little's Law
    problem: The stroke API handles 80 requests/s with an average latency of 45 ms. How many requests are in
      flight, on average?
    steps:
      - "Convert to seconds: W = 0.045 s."
      - L = λW = 80 × 0.045 = **3.6** requests.
    answer: 3.6 concurrent requests.
    takeaway: Concurrency, throughput and latency are tied together — fix two and you know the third.
  - title: How many workers?
    problem: Inference takes 20 ms. Peak traffic is 300 req/s and you want utilisation ≤ 70%. How many workers do
      you need?
    steps:
      - One worker serves 1000 / 20 = 50 req/s.
      - Needed capacity = 300 / 0.7 ≈ 429 req/s.
      - Workers = 429 / 50 ≈ 8.6 → **9 workers**.
      - "Check: 9 × 50 = 450 req/s, ρ = 300/450 = 67%; latency ≈ 20 / 0.33 ≈ 60 ms."
    answer: 9 workers.
    takeaway: Size for a target utilisation, not for 100% — queues explode near capacity.
