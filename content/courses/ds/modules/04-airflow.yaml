id: airflow
title: Workflow Orchestration with Apache Airflow
subtitle: Running pipeline steps in the right order, on schedule, and recovering from failures (Lab 5)
recap: |
  Airflow runs a pipeline as a DAG: a set of tasks connected by arrows that say "this must finish before that
  starts", with no loops. If one task fails, every task after it is blocked (marked upstream_failed), so bad data
  never reaches storage. Tasks that talk to the internet (like downloading data) should retry a few times, waiting
  longer each time (exponential backoff), because network hiccups usually pass. Tasks that check rules should fail
  straight away, because retrying won't fix broken data. And because Airflow re-runs tasks, every task must be
  idempotent: safe to run twice.
traps:
  - "Forgetting an arrow (e.g. stored >> report_gen). Then two tasks can run at the same time and the report reads
    data that isn't ready (a race condition)."
  - "Retrying a task that failed a rule check. A broken schema won't fix itself, so retrying just delays the alert."
  - "Passing whole tables (DataFrames) between tasks with XCom. XCom is for small notes like file paths; save the data
    to storage instead."
lesson:
  checkpointStep: 3
  steps:
    - "A cron job just runs a command at a set time. It doesn't know whether the step before it finished: if the
      download takes 10 minutes longer than usual, the cleaning script runs on yesterday's file or quietly crashes."
    - "Apache Airflow describes a workflow as a DAG (Directed Acyclic Graph): tasks joined by one-way arrows, with no
      loops. The arrows decide the order things run in."
    - "In Lab 5 we wired ingest >> validated >> cleaned >> stored >> report_gen. If validated fails, everything after
      it (cleaned, stored, report_gen) is automatically blocked (marked upstream_failed), so bad data never reaches
      the warehouse."
    - "Checkpoint: why should download (ingestion) tasks get more retries than local cleaning tasks, and why must
      every Airflow task be safe to run twice (idempotent)?"
    - "Downloading talks to other computers over the network, which has temporary glitches. Setting retries=3 and
      waiting longer each time (exponential backoff) usually recovers on its own. A failed rule check on local data
      is a real problem, and retrying won't fix it."
    - "Airflow re-runs failed tasks and can re-run past dates (backfills, catchup). Any task that isn't idempotent
      will fill your warehouse with duplicate records every time that happens."
checkpoint:
  question: In an Airflow DAG (`ingest >> validate >> clean >> store >> report`), why should retry counts and
    delays differ by stage, and what happens if `validate` fails?
  hint: "Compare a download failing because the network blipped (it may work next time) with a rule check failing
    because a column is missing (it will fail the same way every time). Then: what happens to the tasks after a
    failed task?"
  keywords:
    - transient
    - network
    - api
    - ingest
    - deterministic
    - schema
    - retry
    - backoff
    - downstream
    - upstream_failed
    - block
    - dag
    - acyclic
  idealAnswer: "Ingestion (downloading) talks to external networks, APIs or remote file servers, which have temporary
    (transient) timeouts, so it benefits from more retries, e.g. 2–3 with backoff (waiting longer each time).
    Validation and cleaning run the same (deterministic) logic on local data: if a schema check fails, retrying
    straight away wastes computing time without fixing the broken data. When validate fails, Airflow marks it
    failed and sets every downstream task (clean, store, report) to upstream_failed, which blocks them, so the
    pipeline stops and bad data never overwrites the production tables. The DAG being acyclic (no loops) is what
    guarantees there's always a clear order to run and block tasks in."
terms:
  - term: Orchestrator
    definition: A tool that runs tasks in the right order, retries failures, sends alerts and keeps logs. Airflow is
      one.
  - term: DAG (Directed Acyclic Graph)
    definition: "Tasks joined by one-way arrows (directed) with no loops (acyclic), so there's always a valid order."
  - term: Task / Operator
    definition: One unit of work in a DAG, created with an operator (e.g. BashOperator) or the @task Python decorator.
  - term: upstream_failed
    definition: The state a task gets when a task before it failed. It doesn't run.
  - term: Transient vs deterministic failure
    definition: Transient failures (network blips) often fix themselves; deterministic ones (a missing column) fail the
      same way every time.
  - term: Exponential backoff
    definition: "Doubling the wait between retries: d, 2d, 4d, … Total wait for R retries = d × (2^R − 1)."
  - term: Critical path
    definition: The longest chain of tasks through the DAG. It decides how long the whole run takes.
  - term: XCom
    definition: Airflow's way of passing small notes between tasks, like a file path or a row count.
  - term: Logical date, backfill and catchup
    definition: The logical date is the period of data a run is responsible for. A backfill runs the DAG for past
      dates; catchup=True does this automatically for missed dates.
quiz:
  - question: In `ingest >> validated >> cleaned >> stored >> report_gen`, if `stored` is NOT wired before
      `report_gen` (`stored >> report_gen` omitted), what bug occurs?
    options:
      - Airflow refuses to parse the file
      - report_gen may run in parallel with stored and query an empty or stale database
      - ingest runs twice
      - cleaned is skipped
    answer: 1
    explanation: Without `stored >> report_gen`, Airflow schedules `report_gen` before `stored` finishes, causing
      a race condition where the report reads stale or missing data (the exact Lab 5 bug!).
  - question: A task has initial retry_delay = 30s and exponential backoff (×2 each retry). If all 3 retries fail,
      what is the total wait time spent in retry delays?
    options:
      - 90s
      - 150s
      - 210s
      - 180s
    answer: 2
    explanation: Retry 1 waits 30s, Retry 2 waits 60s, Retry 3 waits 120s → 30 + 60 + 120 = 210 seconds.
  - question: What does 'acyclic' guarantee in a DAG?
    options:
      - Tasks run in parallel
      - There is always a valid order to run tasks (no loops)
      - Tasks never fail
      - The DAG runs once
    answer: 1
    explanation: With no loops, there is always an order in which every task can run after the tasks it depends on.
  - question: validate fails. What state do clean, store and report get?
    options:
      - skipped
      - failed
      - upstream_failed
      - success
    answer: 2
    explanation: Downstream tasks of a failed task become upstream_failed and don't run.
  - question: Which task should get the most retries?
    options:
      - validate_schema
      - ingest from an external API
      - a pure pandas transform
      - report formatting
    answer: 1
    explanation: Tasks that use the network hit temporary glitches that a retry can fix. Rule checks fail the same way every time, so retrying doesn't help.
  - question: What should be passed through XCom?
    options:
      - A 2 GB DataFrame
      - The path of the file a task wrote
      - The whole Parquet file
      - A database connection
    answer: 1
    explanation: XCom is for small notes like a file path or row count. The data itself belongs in storage.
  - question: With catchup=True and a DAG paused for 5 days, what happens when you unpause it (daily schedule)?
    options:
      - Nothing
      - It runs once for today
      - It creates runs for each missed day (a backfill)
      - It deletes old runs
    answer: 2
    explanation: "With catchup on, Airflow creates a run for every day it missed: 5 runs."
  - question: retries = 3, retry_delay = 20 s, exponential. Total wait if all fail?
    options:
      - 60 s
      - 120 s
      - 140 s
      - 160 s
    answer: 2
    explanation: 20 + 40 + 80 = 140 s = 20 × (2³ − 1).
fact:
  title: Never pass gigabytes through Airflow XComs
  body: Airflow stores XCom values in its metadata database. Passing a 500 MB DataFrame in XCom will choke the
    scheduler DB. Always write data to object storage/Parquet and pass only the URI string and row count in
    XCom!
lab:
  title: Airflow DAG Retry Backoff & Critical Path Simulator
  variations:
    - title: Airflow Exponential Backoff Total Wait
      question: "An `ingest` task is configured with `retries=3`, initial `retry_delay=20` seconds, and
        `retry_exponential_backoff=True` (doubling each retry: 20s, 40s, 80s). If all retries fail, how many
        total seconds were spent waiting in retry delays?"
      answer: 140
      tolerance: 0
      hint: "Add the 3 wait intervals: 20 + 40 + 80."
      explanation: Retry 1 waits 20s, Retry 2 waits 40s, Retry 3 waits 80s → 20 + 40 + 80 = 140 seconds.
    - title: Critical Path End-to-End DAG Latency
      question: "In a DAG, `ingest` (12s) fans out to two parallel tasks: `validate_schema` (8s) and `profile_stats`
        (25s). Both must finish before `clean` (15s) → `store` (10s). What is the critical-path runtime in
        seconds?"
      answer: 62
      tolerance: 0
      hint: Parallel branches take max(8, 25) = 25s. Add 12 + 25 + 15 + 10.
      explanation: Critical path = 12s (ingest) + max(8s, 25s) (parallel branch) + 15s (clean) + 10s (store) = 62 seconds.
    - title: Backfill Task Instance Count
      question: A daily Airflow DAG has <b>5 tasks</b> and is backfilled over a <b>14-day</b> historical window
        (`catchup=True`). How many total task instances does the Airflow scheduler execute?
      answer: 70
      tolerance: 0
      hint: Multiply 5 tasks per DAG run × 14 daily runs.
      explanation: 5 tasks/run × 14 runs = 70 task instances.
notes:
  - heading: Why cron isn't orchestration
    body: |
      **The idea:** an alarm clock rings at 6:00 whether or not you went to bed. An orchestrator is more like a relay race: each runner starts only when the baton arrives.

      `cron` runs a command at a set time. It has no idea whether yesterday's download finished, whether the input file exists, or whether the step before failed. If the download takes 10 minutes longer than usual, the 06:00 cleaning job happily processes *yesterday's* file, or crashes, and nobody is told.

      An **orchestrator** like Apache Airflow manages *dependencies* instead of just times: "run `clean` only after `validate` succeeds". It also gives you retries, alerts, a log for every task, a web page showing every run, and the ability to re-run past dates.
  - heading: DAGs, tasks and states
    body: |
      **The idea:** draw each task as a box and connect them with arrows meaning "must finish first". That drawing is a DAG.

      An Airflow pipeline is a **DAG**, a Directed Acyclic Graph:

      - **Directed:** each arrow points one way. `ingest >> validate` means validate runs after ingest.
      - **Acyclic:** no loops. A task can never (even indirectly) depend on itself, so there's always a valid order to run things in.

      Tasks are created with **operators** or the `@task` decorator. Each run of a task moves through states: `scheduled → queued → running → success` or `failed`. When a task fails, every task after it becomes **`upstream_failed`** and doesn't run. That's the safety guarantee: if `validate` rejects the data, `clean`, `store` and `report` never touch it.

      ```python
      ingest() >> validated() >> cleaned() >> stored() >> report_gen()   # the arrows set the order
      ```

      **Forgetting an arrow is a real bug.** Without `stored >> report_gen`, the report can run at the same time as the load and read old or empty tables. That was the Lab 5 bug.
  - heading: Retries, backoff and the critical path
    body: |
      **The idea:** if a website doesn't answer, try again in a bit. If a form is filled in wrong, trying again won't help.

      Failures come in two kinds:

      - **Transient (temporary):** a network timeout, a busy website, a locked file. Waiting and retrying usually works. Give these tasks `retries=3` with **exponential backoff**: wait d, then 2d, then 4d… Total waiting for R retries = d × (2^R − 1). Example: 20 s, 40 s, 80 s = 140 s.
      - **Deterministic (always the same):** a missing column, broken data, a bug in the code. Retrying gives the same failure, wastes time and delays the alert. Let these **fail fast**.

      **The critical path.** When tasks can run side by side (e.g. `validate_schema` and `profile_stats` both after `ingest`), the run's total time is set by the **critical path**, the longest chain through the DAG. Speeding up a task that isn't on that chain doesn't make the run any faster.
  - heading: Backfills, XCom and idempotent tasks
    body: |
      **The idea:** every run is responsible for one specific day's data, and running it again for that day must give the same result.

      Each DAG run has a **logical date** (`data_interval_start`): the period of data it's responsible for, not the time it actually runs. With `catchup=True`, Airflow creates a run for every missed period: a **backfill**. Tasks should use the logical date (`ds` in templates) to decide which data to process, so re-running "2025-03-04" always processes March 4th.

      **XCom** passes *small* notes between tasks: a file path, a row count, a batch ID. Don't push whole tables (DataFrames) through XCom; save the data to storage and pass its path.

      Because of retries and backfills, **every task must be idempotent**: re-running it for the same logical date must give the same result. Overwrite that date's partition or upsert by key; never blindly append.
examples:
  - title: Exponential backoff budget
    problem: The ingest task has retries = 4, a first retry delay of 15 seconds, and exponential backoff (the wait doubles
      each time). If every attempt fails, how long does Airflow spend waiting between attempts?
    steps:
      - "Waits: 15, 30, 60, 120 seconds."
      - Sum = 225 s, or by formula 15 × (2⁴ − 1) = 15 × 15 = **225 s** (3 min 45 s).
    answer: 225 seconds.
    takeaway: Backoff gives a flaky API more and more time to recover without hammering it.
  - title: Finding the critical path
    problem: ingest (10 s) runs first. Then validate_schema (6 s) and profile_stats (20 s) run side by side. Then clean (15 s),
      then store (5 s). How long does the whole run take, and how much faster would it be if validate_schema took only 2 s?
    steps:
      - Critical path = 10 + max(6, 20) + 15 + 5 = **50 s**.
      - profile_stats (20 s) is the slower branch, so it is on the critical path.
      - "Making validate_schema 2 s changes max(2, 20) = 20 → still **50 s**: no improvement."
    answer: 50 s; speeding up validate_schema saves nothing.
    takeaway: To make the run faster, speed up the tasks on the critical path (the longest chain), not whichever task looks slow.
questions:
  - question: Explain why ingestion tasks should have more retries than validation tasks, and what Airflow does
      downstream when validation fails.
    kind: short
    marks: 6
    keywords:
      - transient
      - network
      - api
      - retries
      - backoff
      - deterministic
      - schema
      - fail fast
      - upstream_failed
      - downstream
    idealAnswer: Ingestion depends on networks and external systems whose failures are usually transient, so
      several retries with exponential backoff often recover without a human. Validation runs deterministic
      checks — a broken schema fails identically every time — so retrying wastes time and delays the alert; it
      should fail fast. When validate fails, Airflow marks every downstream task (clean, store, report)
      upstream_failed and does not run them, so invalid data never reaches the warehouse.
  - question: What is a backfill, and why must Airflow tasks be idempotent?
    kind: short
    marks: 5
    keywords:
      - backfill
      - catchup
      - logical date
      - data_interval_start
      - historical
      - retry
      - rerun
      - idempotent
      - same result
      - duplicate
    idealAnswer: A backfill runs a DAG for past logical dates (data intervals), e.g. after catch-up or to
      reprocess history. Tasks should use the logical date to pick their data. Because tasks may be retried or
      rerun for the same date, they must be idempotent — producing the same final state every time (overwrite
      the partition or upsert) — otherwise each rerun duplicates or corrupts data.
  - question: Design an Airflow DAG for the daily market-price pipeline (ingest, validate, profile, clean, store,
      report). Draw the dependencies, choose retry settings for each task with reasons, identify the critical
      path given ingest 12 s, validate 8 s, profile 25 s, clean 15 s, store 10 s, report 5 s, and explain how
      you make the DAG safe to backfill.
    kind: long
    marks: 12
    keywords:
      - ingest
      - validate
      - profile
      - parallel
      - clean
      - store
      - report
      - retries
      - backoff
      - transient
      - deterministic
      - critical path
      - logical date
      - idempotent
      - partition
      - upsert
    idealAnswer: "Dependencies: ingest >> [validate, profile]; validate >> clean >> store >> report (profile can
      also feed report). Retries: ingest 3 with exponential backoff from ~30 s (transient network failures);
      validate 0 (deterministic — fail fast and alert); profile 1; clean 1; store 2 with short backoff
      (database locks); report 1. Critical path: ingest 12 + max(validate 8 → clean 15 → store 10 → report 5 =
      38, profile 25 then report) → 12 + 8 + 15 + 10 + 5 = 50 s; profile runs in parallel and is not on the
      critical path. Backfill safety: every task reads and writes using the logical date (ds), outputs
      overwrite that date's partition or upsert on (date, market, commodity), XCom carries only paths/counts,
      and catchup is enabled deliberately so history can be rebuilt."
coding:
  - id: retries-and-critical-path
    title: Retry budgets and the critical path
    language: python
    level: core
    prompt: |
      Two calculations you'll do in every Airflow design question:

      1. `backoff_schedule(delay, retries, exponential=True)` → list of waits in seconds before each retry
         (`[20, 40, 80]` for delay 20, 3 retries; `[20, 20, 20]` without exponential backoff).
      2. `critical_path(durations, upstream)` → the run time of the whole DAG, i.e. the longest path.
         `durations` maps task → seconds; `upstream` maps task → list of tasks it depends on.
    starter: |
      def backoff_schedule(delay, retries, exponential=True):
          ...

      def critical_path(durations, upstream):
          ...

      print(backoff_schedule(20, 3))
      print(critical_path(
          {"ingest": 12, "validate": 8, "profile": 25, "clean": 15, "store": 10},
          {"validate": ["ingest"], "profile": ["ingest"], "clean": ["validate"], "store": ["clean", "profile"]},
      ))
    solution: |
      from functools import lru_cache

      def backoff_schedule(delay, retries, exponential=True):
          return [delay * (2 ** i if exponential else 1) for i in range(retries)]

      def critical_path(durations, upstream):
          @lru_cache(maxsize=None)
          def finish(task):
              return durations[task] + max((finish(u) for u in upstream.get(task, [])), default=0)
          return max(finish(t) for t in durations)

      print(backoff_schedule(20, 3))
    tests:
      - name: Exponential backoff schedule
        code: |
          assert backoff_schedule(20, 3) == [20, 40, 80]
          assert sum(backoff_schedule(15, 4)) == 225
      - name: Fixed delay without backoff
        code: |
          assert backoff_schedule(30, 2, exponential=False) == [30, 30]
      - name: Critical path follows the slowest chain
        code: |
          d = {"ingest": 12, "validate": 8, "profile": 25, "clean": 15, "store": 10}
          up = {"validate": ["ingest"], "profile": ["ingest"], "clean": ["validate"], "store": ["clean", "profile"]}
          assert critical_path(d, up) == 47, f"expected 47 (ingest → profile → store), got {critical_path(d, up)}"
      - name: A longer parallel branch changes the answer
        code: |
          d = {"ingest": 10, "a": 30, "b": 5, "report": 5}
          up = {"a": ["ingest"], "b": ["ingest"], "report": ["a", "b"]}
          assert critical_path(d, up) == 45
    hints:
      - The finish time of a task = its duration + the latest finish time of its upstream tasks.
      - Memoise finish times (lru_cache) so each task is computed once.
  - id: write-the-dag
    title: Write the market-price DAG
    language: review
    level: exam
    prompt: |
      Write an Airflow DAG (TaskFlow API) for the daily market-price pipeline:
      `ingest` → (`validate` ∥ `profile`) → `clean` → `store` → `report`, where `report` also needs `profile`.

      Requirements: daily schedule, `catchup=True` for backfills, retries suited to each task (network-facing
      ingest vs deterministic validation), tasks that use the logical date, only small metadata in XCom,
      and idempotent outputs. Add comments justifying your settings.
    starter: |
      from datetime import datetime, timedelta
      from airflow.decorators import dag, task

      @dag(schedule="@daily", start_date=datetime(2025, 3, 1), catchup=True)
      def market_prices():
          ...

      market_prices()
    solution: |
      from datetime import datetime, timedelta
      from airflow.decorators import dag, task

      @dag(schedule="@daily", start_date=datetime(2025, 3, 1), catchup=True, max_active_runs=1)
      def market_prices():
          # Network-facing: transient failures → retries with exponential backoff
          @task(retries=3, retry_delay=timedelta(seconds=30), retry_exponential_backoff=True)
          def ingest(ds=None) -> str:
              path = f"data/raw/market_prices_{ds}.csv"
              download_day(ds, path)            # uses the LOGICAL date, so backfills fetch the right day
              return path                       # XCom carries only the path

          # Deterministic checks: retrying won't fix a broken schema → fail fast
          @task(retries=0)
          def validate(path: str) -> str:
              check_contract(path)
              return path

          @task(retries=1)
          def profile(path: str) -> str:
              return write_profile(path)

          @task(retries=1)
          def clean(path: str, ds=None) -> str:
              return clean_to_partition(path, ds)   # overwrites data/processed/date=<ds>/ → idempotent

          @task(retries=2, retry_delay=timedelta(seconds=10))
          def store(path: str, ds=None) -> int:
              return upsert_day(path, ds)           # INSERT OR REPLACE on (date, market, commodity)

          @task(retries=1)
          def report(rows: int, profile_path: str, ds=None):
              build_report(ds, rows, profile_path)

          raw = ingest()
          prof = profile(raw)
          report(store(clean(validate(raw))), prof)

      market_prices()
    rubric:
      - Correct dependencies, including validate and profile running in parallel after ingest and report
        waiting for store and profile
      - Ingest has several retries with exponential backoff; validation fails fast with few or no retries
      - Tasks use the logical date (ds / data_interval_start) so backfills process the right day
      - Only small metadata (paths, counts) is passed between tasks
      - Outputs are idempotent (partition overwrite or upsert), so retries and backfills don't duplicate data
      - Comments justify the retry settings
