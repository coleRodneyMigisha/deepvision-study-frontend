id: video-tracking
title: Video + Tracking
subtitle: Following each object from frame to frame, and keeping track of who is who
recap: |
  A video is just many pictures (frames) in a row. To follow objects, most trackers first detect objects in
  every frame, then link the detections over time into tracks, each with its own ID number. SORT guesses where
  each tracked object will be next (a Kalman filter, assuming it keeps moving at the same speed), scores how
  well each guess matches each new detection (cost = 1 − IoU), and finds the best overall pairing (the
  Hungarian algorithm). DeepSORT also compares how objects look, so IDs survive when people cross or hide
  behind something.
traps:
  - "Matching greedily (always grabbing the best-looking pair first) instead of finding the best overall pairing with
    the Hungarian algorithm."
  - "Expecting overlap (IoU) alone to keep IDs right when objects are hidden for a while. You need appearance too."
  - "Mixing up optical flow (how every single pixel moves) with tracking boxes."
lesson:
  checkpointStep: 3
  steps:
    - "Video adds time: a clip is a stack of frames, with shape frames × height × width × colour channels.
      Neighbouring frames look almost the same, which a model can take advantage of."
    - "Most multi-object trackers use tracking-by-detection: run a detector on every frame, then link the detections
      over time into tracks, each with a fixed ID number."
    - "SORT uses a Kalman filter to guess where each tracked object will be in the next frame, assuming it keeps
      moving at about the same speed, then corrects the guess using the new detection."
    - "Checkpoint: what does the Hungarian algorithm do in SORT, and why did DeepSORT add a network that recognises
      appearance?"
    - "The Hungarian algorithm solves the pairing problem: given a table of costs (for example 1 − IoU between each
      guess and each detection), it finds the one-to-one pairing with the lowest total cost."
    - "Using only motion and overlap, SORT swaps IDs when people cross or are hidden. DeepSORT adds an appearance
      embedding from a re-identification network, so it can recognise the same person afterwards."
    - "Without any boxes, optical flow works out a movement arrow for every pixel between two frames. RAFT is a
      well-known deep-learning model for it."
checkpoint:
  question: Explain the roles of the Kalman filter and the Hungarian algorithm in SORT. Why was DeepSORT developed?
  hint: "Kalman filter: guess where each object moves next, then correct the guess. Hungarian algorithm: pair the
    guesses with the new detections in the best way overall. DeepSORT: what extra clue helps when people cross or
    get hidden?"
  keywords:
    - kalman
    - predict
    - velocity
    - motion
    - hungarian
    - assignment
    - matching
    - cost
    - iou
    - deepsort
    - appearance
    - re-id
    - re-identification
    - occlusion
    - id switch
  idealAnswer: "In SORT, a Kalman filter keeps a motion state for each track (position, box size and speed or
    velocity). It predicts where the object will be in the next frame, then updates that estimate with the matched
    detection. The Hungarian algorithm finds the best one-to-one assignment (matching) between the predicted tracks
    and the new detections, using a cost based on IoU (1 − IoU). SORT relies only on motion and overlap, so when
    objects are hidden (occlusion) or cross paths, IDs get swapped (ID switches). DeepSORT adds a deep appearance
    embedding from a re-identification (re-ID) network to the matching cost, so identities survive occlusion."
terms:
  - term: Frame
    definition: One picture in a video. 30 frames per second means 30 pictures every second.
  - term: Track
    definition: The chain of detections that belong to the same object over time, with one ID number.
  - term: Tracking-by-detection
    definition: Detect objects in every frame first, then link the detections into tracks.
  - term: Kalman filter
    definition: "A predict-then-correct loop: guess the next position from the current position and speed, then
      blend in the new measurement, trusting whichever is less uncertain."
  - term: Cost matrix
    definition: A table of how bad each possible pairing is, e.g. rows = tracks, columns = detections, values = 1 − IoU.
  - term: Hungarian algorithm
    definition: A method that finds the one-to-one pairing with the lowest total cost in a cost matrix (in time that
      grows like n³).
  - term: ID switch
    definition: When a tracker swaps two objects' IDs, or gives a returning object a new ID. A key tracking error.
  - term: Re-identification (re-ID)
    definition: Recognising the same object (usually a person) again from how it looks, using an appearance
      embedding.
  - term: Optical flow
    definition: An arrow for every pixel showing how it moved between two frames.
quiz:
  - question: In SORT, what goes into the Hungarian algorithm's cost table?
    options:
      - Class probabilities
      - 1 − IoU between predicted and detected boxes
      - Pixel colours
      - Optical flow
    answer: 1
    explanation: Each cell is 1 − IoU between a track's predicted box and a new detection. Big overlap means low cost.
  - question: Two people cross paths and SORT swaps their IDs. How does DeepSORT fix this?
    options:
      - A higher frame rate
      - Appearance (re-ID) embeddings
      - A larger NMS threshold
      - Grayscale input
    answer: 1
    explanation: Comparing how the two people look lets the tracker tell them apart after they overlap.
  - question: What does the Kalman filter's predict step assume in SORT?
    options:
      - Random motion
      - Roughly constant velocity
      - The object is standing still
      - Appearance stays the same
    answer: 1
    explanation: It assumes the object keeps moving at about the same speed and direction.
  - question: The Hungarian algorithm finds…
    options:
      - The best detector
      - The one-to-one pairing with the lowest total cost
      - Optical flow
      - The IoU of two boxes
    answer: 1
    explanation: It solves the pairing (assignment) problem exactly, looking at all pairings together.
  - question: What happens to a detection that doesn't match any track in SORT?
    options:
      - It's ignored forever
      - It starts a new track with a new ID
      - It's merged into the nearest track
      - It's deleted
    answer: 1
    explanation: It might be a new object arriving, or a lost one coming back. Either way it gets a new track.
  - question: Why did DeepSORT add a re-identification (re-ID) network?
    options:
      - To detect more objects
      - To use appearance to keep identities through hiding and crossings
      - To speed up the Kalman filter
      - To compute optical flow
    answer: 1
    explanation: When motion alone is confusing, how someone looks tells them apart.
  - question: Optical flow gives you…
    options:
      - A box per object
      - A movement arrow per pixel
      - An ID per object
      - A class per frame
    answer: 1
    explanation: It describes motion everywhere in the frame, not per object.
  - question: An object is at x = 50 px, moving 6 px per frame. Where is it predicted after 5 frames?
    options:
      - "56"
      - "80"
      - "300"
      - "55"
    answer: 1
    explanation: 50 + 6 × 5 = 80.
fact:
  title: RAFT changed optical flow
  body: RAFT (best paper at ECCV 2020) compares every pixel in one frame with every pixel in the next, then
    improves its estimate of the motion step by step. That step-by-step refinement inspired later trackers and
    point-tracking models like CoTracker.
lab:
  title: Kalman prediction & matching
  variations:
    - title: Constant-Velocity Kalman Step
      question: A tracked pedestrian is at <b>x = 100 px</b> moving at a constant velocity of <b>12 px/frame</b>.
        Where does the Kalman filter predict the box after <b>3</b> frames?
      answer: 136
      tolerance: 0
      hint: "New position = old position + speed × number of frames: x_pred = x + vx · Δt."
      explanation: x̂ = 100 + 12 × 3 = 136 px.
    - title: Optimal Hungarian Assignment Cost
      question: Two tracks (T1, T2) and two detections (D1, D2) have cost matrix <code>[[0.15, 0.80], [0.25,
        0.40]]</code>. What is the minimum total assignment cost found by the Hungarian algorithm? (2
        decimals)
      answer: 0.55
      tolerance: 0.01
      hint: "There are only two ways to pair them up: T1→D1 with T2→D2, or T1→D2 with T2→D1. Add up each and pick the smaller."
      explanation: "Diagonal: 0.15 + 0.40 = 0.55. Off-diagonal: 0.80 + 0.25 = 1.05. Minimum total cost = 0.55."
    - title: DeepSORT Combined Matching Cost
      question: For a track–detection pair, the motion cost (1 − IoU, how badly the boxes overlap) is <b>0.40</b> and
        the appearance distance (how different they look) is <b>0.10</b>. Mixing them half and half (<b>λ = 0.5</b>),
        what is the combined cost? (2 decimals)
      answer: 0.25
      tolerance: 0.01
      hint: Cost = λ(0.40) + (1 − λ)(0.10).
      explanation: 0.5 × 0.40 + 0.5 × 0.10 = 0.20 + 0.05 = 0.25.
notes:
  - heading: Video adds time
    body: |
      **The idea:** a video is a flip-book: many pictures (frames) shown quickly one after another.

      A video clip is a stack of frames with shape **T × H × W × C** (frames × height × width × colour channels). At 30 frames per second, one minute is 1,800 frames. Neighbouring frames are almost identical. That's a burden (lots of repeated data) and a gift (things move smoothly, so you can predict where they'll be next).

      Common video tasks:

      - **Action recognition:** what is happening? ("running", "falling"), often using 3-D convolutions or video transformers over short clips.
      - **Optical flow:** how does every pixel move between frames?
      - **Multi-object tracking (MOT):** follow each object and keep the same ID number on it from frame to frame.
  - heading: Tracking-by-detection and the Kalman filter
    body: |
      **The idea:** spot everyone in each frame, then join the dots over time.

      Most trackers use **tracking-by-detection**: run a detector on every frame, then link the detections into **tracks**, each with a fixed ID.

      **SORT** (Simple Online and Realtime Tracking) links them using two tools. The first is a **Kalman filter** for each track. It remembers the object's position, box size and speed, and runs a two-step loop:

      - **Predict:** move the box forward assuming the speed stays about the same: x̂ = x + v·Δt. (A car at 100 px moving 12 px per frame is predicted at 136 px three frames later.)
      - **Update:** when a matching detection arrives, blend the prediction and the measurement, trusting whichever is less uncertain.

      Predicting lets a track keep moving for a few frames even if its detection goes missing, e.g. when someone walks briefly behind a pillar or the detector misses them once.
  - heading: Pairing guesses with detections (the Hungarian algorithm)
    body: |
      **The idea:** each frame you have several guesses (where tracks should be) and several new detections. Pair them up so the overall fit is best, not just the first pair you look at.

      Each frame, SORT builds a **cost table** (cost matrix): one row per track's predicted box, one column per new detection, and each cell is usually **1 − IoU** (small when the boxes overlap a lot). The **Hungarian algorithm** finds the **one-to-one pairing with the lowest total cost**. It looks at all pairings together, instead of greedily grabbing the best-looking pair first, which can force a terrible match for whoever's left.

      After pairing:

      - matched pairs update their tracks;
      - pairs that fit too badly (IoU below a minimum, the "gate") are rejected;
      - **unmatched detections** start new tracks with new IDs;
      - **unmatched tracks** keep moving on their predictions for a while, and are deleted after a maximum number of frames (the "max age").
  - heading: ID switches, DeepSORT and optical flow
    body: |
      **The problem:** with motion and overlap alone, SORT gets confused when people **cross paths** or are **hidden** (occluded) for a while. The predictions drift, nothing overlaps when the person reappears, and they get a **new ID**. That's an **ID switch**, the main mistake tracking scores count (along with misses and false alarms; see the MOTA and IDF1 scores).

      **DeepSORT's fix: look at appearance too.** A **re-identification (re-ID)** network turns each person's crop into an **appearance embedding**, a list of numbers trained so that crops of the same person are close together. The matching cost combines motion and appearance, so a lost track can be recognised again after being hidden. Like recognising a friend by their red jacket after they walk behind a bus.

      **Optical flow** is different: it estimates a movement arrow for **every pixel** between two frames, with no boxes at all. Deep models such as **RAFT** do it accurately. Flow is used to analyse motion, to steady shaky video, and as an extra input for action recognition.
examples:
  - title: A Kalman prediction
    problem: A tracked person was at x = 180 px, moving 14 px per frame. Their detection goes missing for 3 frames.
      Where does the tracker predict them, and what happens if they reappear at x = 214?
    steps:
      - "Prediction after 3 frames: 180 + 14 × 3 = **222 px**."
      - "The new detection at 214 is only 8 px away. With a box about 36 px wide, the overlap (IoU) is still high, so
        it's matched to the same track."
      - "The update step pulls the estimate towards 214 and lowers the speed: the person slowed down."
    answer: Predicted 222 px; the reappearing detection is matched and the estimate corrected.
    takeaway: Predicting bridges short gaps; updating corrects the drift.
  - title: Best overall pairing vs greedy pairing
    problem: "Costs (1 − IoU) for tracks T1, T2 and detections D1, D2: T1→D1 0.2, T1→D2 0.3, T2→D1 0.25, T2→D2 0.9.
      Compare greedy pairing with the Hungarian algorithm."
    steps:
      - "Greedy grabs the cheapest pair first: T1→D1 (0.2). T2 is left with D2 (0.9). Total = **1.1**."
      - "Hungarian checks every pairing: T1→D2 (0.3) + T2→D1 (0.25) = **0.55**."
      - Hungarian picks the 0.55 pairing.
    answer: Hungarian's total cost is 0.55; greedy's is 1.1.
    takeaway: The best-looking single pair can force a terrible match somewhere else.
questions:
  - question: What does the Hungarian algorithm do in SORT, and why is it better than greedy matching?
    kind: short
    marks: 5
    keywords:
      - cost matrix
      - 1 - iou
      - tracks
      - detections
      - assignment
      - one-to-one
      - optimal
      - minimise total cost
      - greedy
      - suboptimal
    idealAnswer: "SORT builds a cost matrix between the Kalman-predicted track boxes and the new detections, usually
      1 − IoU. The Hungarian algorithm finds the one-to-one assignment that minimises the total cost, so it's
      optimal. Greedy matching takes the cheapest pair first and can force bad matches on the remaining tracks, so
      it's suboptimal; Hungarian considers the whole table at once."
  - question: Explain why SORT suffers ID switches and how DeepSORT reduces them.
    kind: short
    marks: 5
    keywords:
      - motion
      - iou only
      - occlusion
      - crossing
      - prediction drift
      - no overlap
      - new id
      - id switch
      - appearance
      - embedding
      - re-identification
      - cost
    idealAnswer: "SORT matches using only motion and overlap (IoU only). When objects cross or are hidden (occlusion)
      for several frames, the constant-speed predictions drift (prediction drift), so when an object reappears its
      detection either matches the wrong track or has no overlap with any track and starts a new ID: an ID switch.
      DeepSORT adds an appearance embedding from a re-identification network to the matching cost, so a person can
      be recognised by how they look and keep their original ID after being hidden."
  - question: Design a system that counts customers entering a supermarket from a ceiling camera, without counting
      anyone twice. Describe detection, tracking, the counting rule, how you handle people hiding each other and
      crowds, and how you'd evaluate it.
    kind: long
    marks: 12
    keywords:
      - detector
      - person
      - tracking-by-detection
      - kalman
      - hungarian
      - deepsort
      - re-id
      - line crossing
      - direction
      - unique id
      - occlusion
      - max age
      - crowded
      - id switch
      - mota
      - idf1
      - manual count
    idealAnswer: "Detect people in each frame with a fast one-stage person detector, fine-tuned on top-down views.
      Track them with tracking-by-detection: Kalman prediction, Hungarian matching with a cost that combines IoU and a
      re-ID appearance embedding (as in DeepSORT), a gate that rejects bad matches, and a max age so tracks survive
      people being briefly hidden (occlusion). Count a customer when a track's path crosses a virtual line in the
      entering direction, counting each unique track ID at most once. In crowded scenes, people hiding each other
      cause ID switches and broken tracks that would double count, so use appearance features, tune the max age,
      require a minimum track length, and ignore rapid back-and-forth crossings. Evaluate tracking with MOTA, IDF1 and
      the number of ID switches on labelled video, and the real goal: the counting error compared with manual counts
      over several hours, including busy periods."
coding:
  - id: sort-matching
    title: SORT's predict-and-match step
    language: python
    level: exam
    setup: |
      import numpy as np
      def iou(a, b):
          ix = max(0.0, min(a[2], b[2]) - max(a[0], b[0])); iy = max(0.0, min(a[3], b[3]) - max(a[1], b[1]))
          inter = ix * iy
          return inter / ((a[2]-a[0])*(a[3]-a[1]) + (b[2]-b[0])*(b[3]-b[1]) - inter)

      # tracks: id → (box, velocity (vx, vy)); boxes are (x1, y1, x2, y2)
      TRACKS = {1: ((100, 50, 136, 120), (9, 0)), 2: ((300, 60, 336, 130), (-9, 0))}
      DETECTIONS = [(291, 61, 327, 131), (109, 50, 145, 120), (500, 40, 530, 100)]
    prompt: |
      Write:

      - `predict(box, velocity, steps=1)` → the box moved by `velocity × steps` (constant-velocity Kalman prediction).
      - `match(tracks, detections, min_iou=0.3)` → `(matches, unmatched_tracks, unmatched_dets)` where
        `matches` is a list of `(track_id, det_index)`. Predict each track one step, build the cost matrix
        `1 − IoU`, solve it optimally with `scipy.optimize.linear_sum_assignment` (the Hungarian algorithm),
        and reject pairs with IoU below `min_iou`.
    starter: |
      import numpy as np
      from scipy.optimize import linear_sum_assignment

      def predict(box, velocity, steps=1):
          ...

      def match(tracks, detections, min_iou=0.3):
          ...
    solution: |
      import numpy as np
      from scipy.optimize import linear_sum_assignment

      def predict(box, velocity, steps=1):
          dx, dy = velocity[0] * steps, velocity[1] * steps
          return (box[0] + dx, box[1] + dy, box[2] + dx, box[3] + dy)

      def match(tracks, detections, min_iou=0.3):
          ids = list(tracks)
          preds = [predict(*tracks[t]) for t in ids]
          cost = np.array([[1 - iou(p, d) for d in detections] for p in preds]) if ids and detections else np.zeros((len(ids), len(detections)))
          rows, cols = linear_sum_assignment(cost) if cost.size else ([], [])
          matches = [(ids[r], int(c)) for r, c in zip(rows, cols) if 1 - cost[r, c] >= min_iou]
          matched_t = {t for t, _ in matches}; matched_d = {d for _, d in matches}
          return (matches, [t for t in ids if t not in matched_t], [i for i in range(len(detections)) if i not in matched_d])
    tests:
      - name: Constant-velocity prediction
        code: |
          assert predict((100, 50, 136, 120), (9, 0)) == (109, 50, 145, 120)
          assert predict((0, 0, 10, 10), (2, -1), steps=3) == (6, -3, 16, 7)
      - name: Each track matches its own detection
        code: |
          m, ut, ud = match(TRACKS, DETECTIONS)
          assert sorted(m) == [(1, 1), (2, 0)], f"got {m}"
      - name: A far-away detection starts a new track
        code: |
          m, ut, ud = match(TRACKS, DETECTIONS)
          assert ut == [] and ud == [2]
      - name: Low-overlap pairs are rejected by the gate
        code: |
          m, ut, ud = match({7: ((0, 0, 10, 10), (0, 0))}, [(9, 9, 19, 19)])
          assert m == [] and ut == [7] and ud == [0]
    hints:
      - "`linear_sum_assignment(cost)` returns row and column indices of the optimal assignment."
      - Apply the IoU gate AFTER the assignment.
