id: segmentation
title: Segmentation
subtitle: Labelling every single pixel, not just drawing boxes
recap: |
  Segmentation gives every pixel of a picture a label, like colouring in a picture by number. Semantic
  segmentation says which category each pixel is (all sheep are just "sheep"); instance segmentation also
  tells individual objects apart (sheep 1, sheep 2); panoptic segmentation does both. The popular U-Net first
  shrinks the picture to understand WHAT is in it, then grows it back to full size to say exactly WHERE, using
  skip connections that carry the fine detail straight across. Score it with IoU per category (averaged as
  mIoU) or with Dice = 2 × overlap ÷ (size of both masks).
traps:
  - "Treating Dice and IoU as the same number. Dice = 2·IoU / (1 + IoU), so Dice is always at least as big."
  - "Removing U-Net's skip connections and expecting sharp edges. Without them, masks come out blurry."
  - "Reporting pixel accuracy when most of the picture is background. Predicting \"background\" everywhere can score
    99% and find nothing."
lesson:
  checkpointStep: 3
  steps:
    - "Segmentation is dense prediction: instead of one label per picture, or one box per object, the model gives a
      category to every single pixel. Like a colouring-in book where every area gets a colour."
    - "Semantic segmentation labels categories: all sheep are \"sheep\". Instance segmentation tells individuals
      apart: sheep 1, sheep 2. Mask R-CNN does this by adding a mask-drawing part to the Faster R-CNN detector."
    - "Panoptic segmentation does both: countable things like people and cars get their own ID each, while shapeless
      stuff like sky and road just gets a category."
    - "Checkpoint: why are skip connections essential in U-Net, and what happens if you remove them?"
    - "U-Net's first half (the encoder) repeatedly filters and shrinks the picture. The features get smarter about
      WHAT is there, but the picture gets so small that it loses exactly WHERE."
    - "The second half (the decoder) grows it back to full size. Skip connections copy the sharp, full-size features
      from the first half straight across and join them on, which brings back crisp edges."
    - "Score it with IoU per category (averaged over categories as mean IoU), or with the Dice score: 2 × the overlap,
      divided by the size of both masks added together. Dice is popular in medical imaging."
checkpoint:
  question: Why are skip connections indispensable in U-Net? What happens to the output mask if you remove them?
  hint: "Shrinking the picture (pooling) throws away fine detail about where things are. Where else could the second
    half of the network get that detail back from?"
  keywords:
    - skip
    - pooling
    - downsampling
    - spatial
    - resolution
    - detail
    - boundary
    - boundaries
    - localisation
    - localization
    - encoder
    - decoder
    - concatenate
    - blurry
  idealAnswer: "U-Net's encoder shrinks the picture (downsampling with pooling) to understand what's in it, but that
    throws away fine spatial detail. Skip connections pass the high-resolution feature maps from each encoder
    level straight across to the matching decoder level, where they are joined on (concatenated) to the enlarged
    features. That gives the decoder both 'what' from the deep layers and 'where' from the shallow ones. Without
    them, the decoder must rebuild the detail from a tiny, coarse version, so the masks come out blurry with
    inaccurate boundaries."
terms:
  - term: Mask
    definition: A grid the same size as the picture that says, for each pixel, which category (or object) it belongs
      to.
  - term: Semantic segmentation
    definition: One category per pixel; separate objects of the same category are not told apart.
  - term: Instance segmentation
    definition: A separate mask for each individual object (e.g. Mask R-CNN).
  - term: Panoptic segmentation
    definition: Both at once. Countable "things" get individual IDs; shapeless "stuff" (sky, road) gets a category.
  - term: Encoder / decoder
    definition: The encoder shrinks the picture into compact, meaningful features; the decoder grows them back into a
      full-size mask.
  - term: Skip connection
    definition: A shortcut that copies detailed features from the encoder directly to the decoder.
  - term: Dice score
    definition: 2|A∩B| / (|A|+|B|), i.e. twice the overlap ÷ the two mask sizes added. Equals 2·IoU / (1 + IoU).
  - term: Transposed convolution
    definition: A learnable way to make a feature map bigger, used in decoders (another option is simple resizing
      followed by a normal convolution).
quiz:
  - question: To count the individual cars in a car park, you need…
    options:
      - Semantic segmentation
      - Instance segmentation
      - Image classification
      - Edge detection
    answer: 1
    explanation: Semantic segmentation merges all cars into one "car" area. Instance segmentation keeps each car
      separate, so you can count them.
  - question: A mask has IoU = 0.5 with the correct mask. What is its Dice score?
    options:
      - "0.5"
      - "0.25"
      - "0.67"
      - "1.0"
    answer: 2
    explanation: Dice = 2·IoU / (1 + IoU) = 1 / 1.5 ≈ 0.67. Dice is always at least as big as IoU.
  - question: Labelling "sheep 1" and "sheep 2" separately is…
    options:
      - Semantic segmentation
      - Instance segmentation
      - Image classification
      - Edge detection
    answer: 1
    explanation: Instance segmentation tells individual objects apart.
  - question: In panoptic segmentation, "sky" and "road" are…
    options:
      - Things with their own IDs
      - Stuff with category labels
      - Ignored
      - Bounding boxes
    answer: 1
    explanation: Shapeless areas you can't count are called "stuff"; they just get a category.
  - question: What do U-Net's skip connections give the decoder?
    options:
      - More parameters only
      - High-resolution detail from the encoder
      - The class labels
      - Dropout
    answer: 1
    explanation: They bring back the "where" information that shrinking the picture threw away.
  - question: IoU = 0.5. Dice = ?
    options:
      - "0.5"
      - "0.667"
      - "0.75"
      - "1.0"
    answer: 1
    explanation: 2 × 0.5 / 1.5 = 0.667.
  - question: Why is Dice loss popular for small structures in medical scans?
    options:
      - It's faster
      - It focuses on the overlap and isn't swamped by background pixels
      - It needs no labels
      - It predicts boxes
    answer: 1
    explanation: With ordinary per-pixel cross-entropy, the huge number of easy background pixels drowns out the small
      structure you care about.
  - question: When you randomly crop a training picture, what must happen to its mask?
    options:
      - Nothing
      - Exactly the same crop
      - A different random crop
      - It is recomputed by the model
    answer: 1
    explanation: The picture and its mask must stay lined up pixel for pixel.
fact:
  title: Segment Anything, now with words
  body: SAM (2023) could cut out any object from a single click. SAM 2 (2024) added video, following the object from
    frame to frame. SAM 3 (late 2025) understands words too. Type "yellow school bus" and it finds and cuts out every
    one.
lab:
  title: "Paint a mask: IoU vs Dice"
  variations:
    - title: IoU to Dice Conversion
      question: A predicted segmentation mask has <b>IoU = 0.50</b> with the ground truth. What is its <b>Dice
        coefficient</b>? (2 decimals)
      answer: 0.67
      tolerance: 0.01
      hint: Use Dice = 2 · IoU / (1 + IoU).
      explanation: Dice = 2(0.5) / (1 + 0.5) = 1.0 / 1.5 = 0.6667 ≈ 0.67.
    - title: Pixel Count Dice Score
      question: A predicted lesion mask has <b>120</b> pixels, the ground-truth mask has <b>180</b> pixels, and they
        overlap on <b>90</b> pixels (TP = 90). What is the <b>Dice score</b>? (2 decimals)
      answer: 0.6
      tolerance: 0.01
      hint: Dice = 2 × |P ∩ G| / (|P| + |G|).
      explanation: Dice = 2 × 90 / (120 + 180) = 180 / 300 = 0.60.
    - title: Dice to IoU Inverse
      question: A medical segmentation paper reports a <b>Dice score of 0.80</b>. What is the corresponding
        <b>IoU</b> (Jaccard index)? (2 decimals)
      answer: 0.67
      tolerance: 0.01
      hint: "Turn the rule Dice = 2·IoU/(1+IoU) around: IoU = Dice / (2 − Dice)."
      explanation: IoU = 0.80 / (2 − 0.80) = 0.80 / 1.20 = 0.6667 ≈ 0.67.
notes:
  - heading: Labelling every pixel
    body: |
      **The idea:** detection draws a rough box around each object. Segmentation colours in the exact shape, pixel by pixel, like a colouring-in book.

      The output is a **mask**: a grid the same height and width as the picture, saying for every pixel what it belongs to. There are three kinds:

      - **Semantic segmentation:** one category per pixel. All sheep are just "sheep", in one big sheep-coloured area.
      - **Instance segmentation:** tells individual objects apart: sheep 1, sheep 2. **Mask R-CNN** does this by adding a small part to the Faster R-CNN detector that draws a mask inside each detected box.
      - **Panoptic segmentation:** both at once. Countable **things** (people, cars) each get an ID; shapeless **stuff** (sky, road, grass) just gets a category.

      Uses range from medicine (the exact edge of a tumour), to farming (mapping fields and crops), to self-driving cars (where the road is).
  - heading: Shrink to understand, grow back to locate (U-Net)
    body: |
      **The idea:** to recognise a cow you need to see the big picture; to colour its outline you need fine detail. A segmentation network needs both.

      - The **encoder** (first half) repeatedly filters and shrinks the picture. It gets better at knowing *what* is there, but loses *exactly where*: a 256 × 256 picture might be just 16 × 16 at the bottom (the **bottleneck**).
      - The **decoder** (second half) grows it back to full size, with **transposed convolutions** (learnable enlarging) or simple resizing plus a convolution.

      **U-Net's big idea is the skip connection.** At each size level, it copies the encoder's sharp, full-detail feature maps straight across and **joins them on** (concatenates them) to the decoder's enlarged maps. So the decoder gets "what" from the deep layers and "where" from the shallow ones. Take the skips away and masks come out blurry, with fuzzy edges.

      The name comes from the diagram: the shrinking path goes down one side, the growing path up the other, making a U, with the skip connections across the middle.
  - heading: Scoring masks with IoU and Dice
    body: |
      Compare the predicted mask P with the correct mask G, as sets of pixels. Count TP (pixels both say are the object), FP (predicted but wrong) and FN (missed).

      - **IoU (also called Jaccard)** = |P ∩ G| / |P ∪ G| = TP / (TP + FP + FN): the overlap ÷ everything either mask covers.
      - **Dice (the same as F1)** = 2|P ∩ G| / (|P| + |G|) = 2TP / (2TP + FP + FN).

      They're linked: **Dice = 2·IoU / (1 + IoU)**, so Dice is always at least as big. IoU 0.5 ↔ Dice 0.667. Both punish painting outside the object (FP) and missing parts of it (FN). Always say which one you report.

      Report **IoU per category**, and their average, **mean IoU (mIoU)**. **Pixel accuracy** (the share of pixels labelled correctly) is misleading when background dominates: a model that says "background" everywhere can score 95% on scans where the lesion is tiny.
  - heading: Training losses when the object is tiny
    body: |
      The usual loss is **cross-entropy for every pixel**. But when the thing you care about is tiny (a lesion covering 2% of a scan), the loss is dominated by the 98% of easy background pixels, and the model can do well just by ignoring the lesion.

      Fixes:

      - **Dice loss** (1 − Dice) rewards overlap directly and doesn't care how much background there is. Popular in medical imaging.
      - **Combined loss:** cross-entropy + Dice, for smooth training plus good overlap.
      - **Class weights** or **focal loss** to make rare categories count more.

      **Augmentation rule:** whatever you do to the picture (crop, flip, rotate), do **exactly the same** to its mask. Otherwise the labels no longer line up with the pixels.
examples:
  - title: IoU and Dice from pixel counts
    problem: A predicted lesion mask gets TP = 1,800 pixels right, paints FP = 400 pixels it shouldn't, and misses
      FN = 600. Work out IoU and Dice, and check the link between them.
    steps:
      - "IoU = TP / (TP + FP + FN) = 1,800 / (1,800 + 400 + 600) = 1,800 / 2,800 ≈ **0.643**."
      - "Dice = 2TP / (2TP + FP + FN) = 3,600 / (3,600 + 400 + 600) = 3,600 / 4,600 ≈ **0.783**."
      - "Check: 2 × 0.643 / (1 + 0.643) ≈ 0.783 ✓."
    answer: IoU ≈ 0.64, Dice ≈ 0.78.
    takeaway: For the same mask Dice is always the higher number, so say which one you report.
  - title: Why pixel accuracy lies
    problem: In a 512 × 512 scan, the lesion covers 1% of the pixels. A lazy model labels every pixel "background".
      What are its pixel accuracy and its lesion IoU?
    steps:
      - "Pixel accuracy = 99%, because every background pixel is right."
      - "It found no lesion pixels (TP = 0), so lesion IoU = 0 / (0 + 0 + FN) = **0**."
      - "Mean IoU over the two categories (background ≈ 0.99, lesion 0) ≈ 0.5, which shows the failure."
    answer: 99% pixel accuracy, 0 lesion IoU.
    takeaway: For small structures, use per-category IoU or Dice, not pixel accuracy.
questions:
  - question: Explain why skip connections are essential in U-Net, and what happens without them.
    kind: short
    marks: 5
    keywords:
      - encoder
      - downsample
      - semantic
      - what
      - where
      - lost
      - decoder
      - upsample
      - skip connections
      - concatenate
      - high-resolution
      - blurry
      - boundaries
    idealAnswer: "The encoder shrinks the picture (downsamples) to build meaningful, semantic features about what is
      present, but loses the spatial detail about where. The decoder enlarges (upsamples) back to full size, and the
      skip connections join (concatenate) the encoder's high-resolution feature maps onto the decoder's at each
      level, bringing back precise locations. Without them, the decoder must rebuild the detail from the tiny
      bottleneck, producing blurry masks with poor boundaries."
  - question: Define IoU and Dice for segmentation masks, and explain why pixel accuracy can be misleading.
    kind: short
    marks: 5
    keywords:
      - iou
      - intersection
      - union
      - dice
      - 2·overlap
      - tp
      - fp
      - fn
      - dice = 2iou/(1+iou)
      - background
      - imbalance
      - pixel accuracy
    idealAnswer: "IoU = |P∩G| / |P∪G| = TP / (TP + FP + FN), the intersection over the union. Dice = 2|P∩G| / (|P| + |G|)
      = 2TP / (2TP + FP + FN), twice the overlap over both sizes, and Dice = 2·IoU / (1 + IoU), so Dice ≥ IoU. Pixel
      accuracy counts all correctly labelled pixels, so when background dominates (an imbalance, e.g. a lesion
      covering 1%), a model predicting only background scores 99% while finding nothing. Per-category IoU or Dice
      shows the failure."
  - question: Design a system that maps cassava fields from satellite images for district planning. Choose the type of
      segmentation and the model, describe training (loss, augmentation, imbalance) and evaluation, and explain how
      you'd turn the masks into field areas.
    kind: long
    marks: 12
    keywords:
      - semantic segmentation
      - u-net
      - encoder
      - pretrained
      - skip connections
      - multispectral
      - cross-entropy
      - dice loss
      - class weights
      - augmentation
      - same transform
      - mask
      - miou
      - per-class iou
      - boundaries
      - pixel area
      - hectares
    idealAnswer: "Use semantic segmentation (categories: cassava, other crops, background), or instance segmentation if
      individual fields must be counted, with a U-Net whose encoder is pretrained and adapted to the satellite's
      colour bands (multispectral, e.g. red, green, blue plus near-infrared); its skip connections keep field
      boundaries sharp. Train with cross-entropy + Dice loss and class weights, because cassava may cover only a small
      share of pixels. Augment with flips, rotations, small scale changes and brightness, applying the same transform
      to the image and its mask, and cut large images into overlapping tiles. Evaluate with per-class IoU, mIoU and
      Dice on held-out regions (split by geography to avoid leakage) and check boundaries by eye. Turn masks into
      areas by counting each category's pixels and multiplying by the ground area per pixel (e.g. 10 m × 10 m = 0.01
      hectares), optionally converting masks to field outlines and adding them up per district."
coding:
  - id: mask-metrics
    title: IoU, Dice and mean IoU for masks
    language: python
    level: core
    setup: |
      import numpy as np
      gt = np.zeros((6, 6), dtype=int); gt[1:4, 1:4] = 1; gt[4:, 4:] = 2      # classes 0 (background), 1, 2
      pred = np.zeros((6, 6), dtype=int); pred[1:4, 2:5] = 1; pred[5, 5] = 2
    prompt: |
      Write:

      - `iou(pred, gt)` and `dice(pred, gt)` for **binary** masks (booleans or 0/1). If both masks are
        empty, return 1.0.
      - `mean_iou(pred, gt, num_classes)` for **multi-class** label maps: average the per-class IoU over the
        classes that appear in `gt` or `pred`.

      Verify `dice == 2·iou / (1 + iou)` on any example.
    starter: |
      import numpy as np

      def iou(pred, gt):
          ...

      def dice(pred, gt):
          ...

      def mean_iou(pred, gt, num_classes):
          ...
    solution: |
      import numpy as np

      def iou(pred, gt):
          p, g = np.asarray(pred).astype(bool), np.asarray(gt).astype(bool)
          union = (p | g).sum()
          return float((p & g).sum() / union) if union else 1.0

      def dice(pred, gt):
          p, g = np.asarray(pred).astype(bool), np.asarray(gt).astype(bool)
          total = p.sum() + g.sum()
          return float(2 * (p & g).sum() / total) if total else 1.0

      def mean_iou(pred, gt, num_classes):
          scores = [iou(pred == c, gt == c) for c in range(num_classes) if (gt == c).any() or (pred == c).any()]
          return float(np.mean(scores))
    tests:
      - name: Binary IoU and Dice
        code: |
          a, b = gt == 1, pred == 1
          assert abs(iou(a, b) - 6 / 12) < 1e-9 and abs(dice(a, b) - 12 / 18) < 1e-9
      - name: Dice = 2·IoU / (1 + IoU)
        code: |
          i, d = iou(pred == 1, gt == 1), dice(pred == 1, gt == 1)
          assert abs(d - 2 * i / (1 + i)) < 1e-9
      - name: Empty masks agree perfectly
        code: |
          z = np.zeros((3, 3), dtype=bool)
          assert iou(z, z) == 1.0 and dice(z, z) == 1.0
      - name: Mean IoU over the classes present
        code: |
          per = [iou(pred == c, gt == c) for c in range(3)]
          assert abs(mean_iou(pred, gt, 3) - sum(per) / 3) < 1e-9
          assert mean_iou(pred, gt, 3) < (pred == gt).mean(), "pixel accuracy flatters this prediction; mIoU shouldn't"
